<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>운전면허 모의시험</title>
<meta name="theme-color" content="#1f4fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="면허 모의시험">
<link rel="manifest" href="license-test.webmanifest">
<link rel="apple-touch-icon" href="icons/license-192.png">
<link rel="icon" href="icons/license-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --card:#ffffff; --ink:#18202f; --sub:#5b667a; --line:#dbe2ee; --soft:#f4f7fc;
  --brand:#1f4fa8; --brand-ink:#ffffff; --brand-soft:#e3ecfb;
  --good:#138a4a; --good-soft:#dcf5e7; --bad:#c62828; --bad-soft:#fde3e3; --warn:#f2b705;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --card:#18202f; --ink:#e8edf6; --sub:#9aa6bb; --line:#2a3447; --soft:#1e2738;
    --brand:#5b8ef0; --brand-ink:#0b1220; --brand-soft:#1d2a45;
    --good:#4ccb83; --good-soft:#163526; --bad:#ff7a7a; --bad-soft:#3d1c1f; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#18202f; --ink:#e8edf6; --sub:#9aa6bb; --line:#2a3447; --soft:#1e2738;
  --brand:#5b8ef0; --brand-ink:#0b1220; --brand-soft:#1d2a45;
  --good:#4ccb83; --good-soft:#163526; --bad:#ff7a7a; --bad-soft:#3d1c1f; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100dvh;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.page{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sub{color:var(--sub);font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* 홈 */
.hero{display:flex;gap:16px;align-items:center;margin:8px 0 20px}
.hero svg{flex:none;width:64px;height:64px}
.hero h1{font-size:26px;font-weight:800}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.menu button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.menu button b{display:block;font-size:18px;margin-bottom:2px}
.menu button.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.menu button.main .sub{color:inherit;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:14px}
.facts div{background:var(--soft);border-radius:12px;padding:10px 4px}
.facts b{display:block;font-size:20px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist li:first-child{border-top:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.pass{background:var(--good-soft);color:var(--good)}
.tag.fail{background:var(--bad-soft);color:var(--bad)}

/* 시험 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qno{font-weight:800;font-size:18px}
.pill{font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand);padding:3px 9px;border-radius:99px}
.pill.two{background:#fff2c2;color:#7a5600}
:root[data-theme="dark"] .pill.two{background:#3a3010;color:#ffd666}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.two{background:#3a3010;color:#ffd666}}
.qtext{font-size:19px;font-weight:600;margin:0 0 14px}
.sign{display:flex;justify-content:center;margin:4px 0 16px}
.sign svg{width:150px;height:auto}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:16px;min-height:52px}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sub);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[aria-pressed="true"] .n{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .n{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:inherit}
.navrow{display:flex;gap:10px;margin-top:16px}
.navrow .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font-size:13px;font-weight:600;min-height:36px}
.grid button.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.grid button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@media (max-width:420px){.grid{grid-template-columns:repeat(8,1fr)}}
.explain{margin-top:14px;padding:14px;border-radius:12px;background:var(--soft);border-left:4px solid var(--brand);font-size:15px}
.explain b{display:block;margin-bottom:4px}
.explain.ok{border-left-color:var(--good)}
.explain.no{border-left-color:var(--bad)}

/* 결과 */
.score{text-align:center;padding:28px 20px}
.score .big{font-size:56px;font-weight:800;line-height:1}
.score .verdict{font-size:22px;font-weight:800;margin-top:10px}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.cat .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--brand)}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.review{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.review:first-child{border-top:0;margin-top:0;padding-top:0}
.review .ans{font-size:14px;margin-top:6px}
.review .ans .r{color:var(--good);font-weight:700}
.review .ans .w{color:var(--bad);font-weight:700}

/* 연습 메뉴 */
.catlist{display:grid;gap:10px}
.catlist button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.catlist button b{font-size:17px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:min(420px,calc(100% - 32px));padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="page">

<!-- 홈 -->
<section id="home">
  <div class="hero">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1f4fa8"/><circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="5"/><circle cx="32" cy="32" r="4" fill="#fff"/><path d="M32 13v15M14 38l14-5M50 38l-14-5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
    <div>
      <h1>운전면허 모의시험</h1>
      <div class="sub">학과시험 대비 · 40문항 · 40분</div>
    </div>
  </div>

  <div class="card stack">
    <div class="row">
      <span class="grow" style="font-weight:600">응시 종류</span>
      <div class="seg" id="licSeg">
        <button data-lic="1" aria-pressed="false">1종 보통</button>
        <button data-lic="2" aria-pressed="true">2종 보통</button>
      </div>
    </div>
    <div class="sub" id="licNote"></div>
    <div class="facts">
      <div><b id="fCount">0</b><span class="sub">문제 은행</span></div>
      <div><b id="fBest">-</b><span class="sub">최고 점수</span></div>
      <div><b id="fWrong">0</b><span class="sub">오답노트</span></div>
    </div>
  </div>

  <div class="menu">
    <button class="main" id="goExam"><b>모의시험 시작</b><span class="sub">실전처럼 40문항을 40분 안에</span></button>
    <button id="goResume" hidden><b>이어서 풀기</b><span class="sub" id="resumeNote"></span></button>
    <button id="goPractice"><b>분야별 연습</b><span class="sub">풀자마자 정답과 해설 확인</span></button>
    <button id="goNotes"><b>오답노트</b><span class="sub">틀린 문제만 모아 다시 풀기</span></button>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="font-size:17px;margin-bottom:6px">최근 기록</h3>
    <ul class="hist" id="histList"></ul>
  </div>
  <p class="sub" style="margin-top:16px">문제는 도로교통법 등 관련 규정을 바탕으로 학습용으로 새로 만든 것으로, 실제 시험 문항과 다를 수 있습니다. 법령은 개정될 수 있으니 시험 전 도로교통공단 안내를 함께 확인하세요.</p>
</section>

<!-- 시험 / 연습 공용 문제 화면 -->
<section id="quiz" hidden>
  <div class="bar">
    <button class="btn ghost" id="quizBack" aria-label="그만하기">✕</button>
    <div class="progress"><i id="prog"></i></div>
    <span class="timer" id="timer" hidden>40:00</span>
    <span class="sub" id="practiceScore" hidden></span>
  </div>
  <div class="card">
    <div class="qhead">
      <span class="qno" id="qNo"></span>
      <span class="pill" id="qCat"></span>
      <span class="pill two" id="qTwo" hidden>정답 2개</span>
    </div>
    <p class="qtext" id="qText"></p>
    <div class="sign" id="qSign" hidden></div>
    <div class="opts" id="qOpts"></div>
    <div class="explain" id="qExplain" hidden></div>
    <div class="navrow" id="examNav">
      <button class="btn" id="prevBtn">이전</button>
      <button class="btn primary" id="nextBtn">다음</button>
    </div>
    <div class="navrow" id="practiceNav" hidden>
      <button class="btn primary" id="pNextBtn" disabled>다음 문제</button>
    </div>
  </div>
  <div class="card" id="gridCard" style="margin-top:14px">
    <div class="row"><span class="grow" style="font-weight:600">답안 표기 현황</span><span class="sub" id="answeredCount"></span></div>
    <div class="grid" id="qGrid"></div>
    <button class="btn primary" id="submitBtn" style="width:100%;margin-top:14px">답안 제출</button>
  </div>
</section>

<!-- 결과 -->
<section id="result" hidden>
  <div class="card score">
    <div class="sub" id="rLic"></div>
    <div class="big" id="rScore">0</div>
    <div class="sub" id="rDetail"></div>
    <div class="verdict" id="rVerdict"></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3 style="font-size:17px;margin-bottom:12px">분야별 정답률</h3>
    <div class="cats" id="rCats"></div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn grow" id="rHome">처음으로</button>
    <button class="btn primary grow" id="rRetryWrong">틀린 문제 다시 풀기</button>
  </div>
  <div class="card" style="margin-top:14px">
    <h3 style="font-size:17px;margin-bottom:12px" id="rReviewTitle">틀린 문제 해설</h3>
    <div id="rReview"></div>
  </div>
</section>

<!-- 연습 메뉴 -->
<section id="practiceMenu" hidden>
  <div class="bar"><button class="btn ghost" data-home>← 처음으로</button></div>
  <h2 style="margin:4px 0 14px">분야별 연습</h2>
  <div class="catlist" id="catList"></div>
</section>

<!-- 오답노트 -->
<section id="notes" hidden>
  <div class="bar"><button class="btn ghost" data-home>← 처음으로</button></div>
  <div class="row" style="margin:4px 0 14px">
    <h2 class="grow">오답노트</h2>
    <button class="btn primary" id="notesPractice">모두 다시 풀기</button>
  </div>
  <p class="sub" style="margin-top:-6px">연습에서 맞히면 오답노트에서 빠집니다.</p>
  <div class="card" id="notesList"></div>
</section>

</div>

<dialog id="dlg">
  <p id="dlgText" style="margin:0 0 18px;font-size:16px"></p>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="dlgNo">취소</button>
    <button class="btn primary" id="dlgYes">확인</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ───────── 표지판 그림 ───────── */
const RED = '#d9001b', YEL = '#ffd400', BLU = '#1d5fbf', BLK = '#111';
const svg = (inner, vb = '0 0 120 120') => `<svg viewBox="${vb}" role="img" aria-label="교통안전표지">${inner}</svg>`;
const warnSign = inner => svg(`<path d="M60 8 L114 104 L6 104 Z" fill="${YEL}" stroke="${RED}" stroke-width="9" stroke-linejoin="round"/>${inner}`, '0 0 120 112');
const banSign = (inner, slash) => svg(`<circle cx="60" cy="60" r="52" fill="#fff" stroke="${RED}" stroke-width="11"/>${inner}${slash ? `<path d="M24 24 L96 96" stroke="${RED}" stroke-width="10"/>` : ''}`);
const blueSign = inner => svg(`<circle cx="60" cy="60" r="55" fill="${BLU}" stroke="#fff" stroke-width="3"/>${inner}`);
const person = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${BLK}" stroke="${BLK}" stroke-linecap="round" stroke-width="5"><circle cx="0" cy="-22" r="6" stroke="none"/><path d="M0 -14 L0 4 M0 4 L-8 22 M0 4 L8 22 M-10 -6 L10 -6" fill="none"/></g>`;
const SIGNS = {
  cross: warnSign(`<path d="M60 44 V96 M36 72 H84" stroke="${BLK}" stroke-width="10"/>`),
  tee: warnSign(`<path d="M34 54 H86 M60 54 V96" stroke="${BLK}" stroke-width="10"/>`),
  curveR: warnSign(`<path d="M50 98 V74 Q50 56 70 56" fill="none" stroke="${BLK}" stroke-width="10"/><path d="M68 42 L88 56 L68 70 Z" fill="${BLK}"/>`),
  light: warnSign(`<rect x="48" y="40" width="24" height="58" rx="5" fill="${BLK}"/><circle cx="60" cy="52" r="7" fill="#ff3b30"/><circle cx="60" cy="69" r="7" fill="#ffcc00"/><circle cx="60" cy="86" r="7" fill="#34c759"/>`),
  rail: warnSign(`<rect x="32" y="66" width="48" height="20" fill="${BLK}"/><rect x="38" y="54" width="8" height="12" fill="${BLK}"/><rect x="66" y="52" width="20" height="34" fill="${BLK}"/><circle cx="42" cy="90" r="6" fill="${BLK}"/><circle cx="58" cy="90" r="6" fill="${BLK}"/><circle cx="76" cy="90" r="6" fill="${BLK}"/>`),
  kids: warnSign(`${person(50, 80, .95)}${person(72, 84, .75)}<path d="M40 101 H86" stroke="${BLK}" stroke-width="4"/>`),
  walk: warnSign(`${person(60, 78, 1)}<path d="M34 100 H44 M50 100 H60 M66 100 H76 M82 100 H88" stroke="${BLK}" stroke-width="5"/>`),
  slope: warnSign(`<path d="M30 98 L90 98 L90 66 Z" fill="${BLK}"/><text x="50" y="80" font-size="16" font-weight="800" text-anchor="middle" fill="${BLK}" font-family="sans-serif">10%</text>`),
  round: warnSign(`<circle cx="60" cy="74" r="17" fill="none" stroke="${BLK}" stroke-width="7"/><path d="M71 52 L82 62 L68 66 Z M44 88 L36 76 L50 74 Z" fill="${BLK}"/>`),
  speed60: banSign(`<text x="60" y="76" font-size="46" font-weight="800" text-anchor="middle" fill="${BLK}" font-family="sans-serif">60</text>`),
  noU: banSign(`<path d="M72 92 V54 Q72 36 56 36 Q42 36 42 54 V62" fill="none" stroke="${BLK}" stroke-width="9"/><path d="M30 60 L42 80 L54 60 Z" fill="${BLK}"/>`, true),
  noLeft: banSign(`<path d="M70 94 V60 Q70 50 60 50 H46" fill="none" stroke="${BLK}" stroke-width="9"/><path d="M48 36 L28 50 L48 64 Z" fill="${BLK}"/>`, true),
  noPark: banSign(`<text x="60" y="80" font-size="56" font-weight="800" text-anchor="middle" fill="${BLU}" font-family="sans-serif">P</text>`, true),
  stop: svg(`<path d="M38 6 H82 L114 38 V82 L82 114 H38 L6 82 V38 Z" fill="${RED}" stroke="#fff" stroke-width="4"/><text x="60" y="62" font-size="30" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">정 지</text><text x="60" y="88" font-size="17" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">STOP</text>`),
  yield: svg(`<path d="M8 12 H112 L60 106 Z" fill="#fff" stroke="${RED}" stroke-width="10" stroke-linejoin="round"/><text x="60" y="52" font-size="24" font-weight="800" text-anchor="middle" fill="${BLK}" font-family="sans-serif">양 보</text>`),
  minSpeed: blueSign(`<text x="60" y="72" font-size="44" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">30</text><path d="M34 86 H86" stroke="#fff" stroke-width="6"/>`),
  straight: blueSign(`<path d="M60 96 V46" stroke="#fff" stroke-width="12"/><path d="M38 54 L60 24 L82 54 Z" fill="#fff"/>`),
  roundabout: blueSign(`<circle cx="60" cy="60" r="24" fill="none" stroke="#fff" stroke-width="9"/><path d="M74 28 L90 42 L70 46 Z M28 52 L36 34 L46 52 Z M62 96 L44 92 L58 78 Z" fill="#fff"/>`),
  oneway: svg(`<rect x="4" y="22" width="112" height="76" rx="8" fill="${BLU}" stroke="#fff" stroke-width="3"/><path d="M16 70 H82" stroke="#fff" stroke-width="12"/><path d="M78 52 L104 70 L78 88 Z" fill="#fff"/><text x="58" y="50" font-size="20" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">일방통행</text>`),
  bike: blueSign(`<g fill="none" stroke="#fff" stroke-width="5"><circle cx="38" cy="72" r="15"/><circle cx="82" cy="72" r="15"/><path d="M38 72 L52 48 L74 48 L82 72 M52 48 L62 72 L74 48 M48 42 H58 M74 48 L72 38 H80"/></g>`),

{c:'law',q:'어린이나 영유아를 태우고 있다는 표시를 하고 도로를 통행하는 어린이통학버스에 대한 설명으로 옳은 것은?',o:['앞지르기를 할 수 있다','앞지르기를 할 수 없다','고속도로에서만 앞지를 수 있다','경음기를 울린 뒤 앞지를 수 있다'],a:[1],e:'어린이나 영유아를 태우고 있다는 표시를 하고 도로를 통행하는 어린이통학버스는 앞지를 수 없습니다.'},
{c:'law',q:'회전교차로의 통행 방법으로 옳은 것은?',o:['시계방향으로 회전한다','반시계방향으로 회전하고, 진입할 때는 이미 회전 중인 차에 양보한다','진입하는 차가 회전 중인 차보다 우선한다','회전 중에는 정지할 수 없으므로 경음기를 울린다'],a:[1],e:'회전교차로에서는 반시계방향으로 통행하며, 진입하려는 차는 서행하거나 일시정지하여 이미 진행하고 있는 차에 진로를 양보해야 합니다.'},
{c:'law',q:'신호기가 없는 철길 건널목을 통과하는 방법으로 옳은 것은?',o:['서행하며 통과한다','건널목 앞에서 일시정지하여 안전을 확인한 후 통과한다','경음기를 울리며 빠르게 통과한다','차단기가 없으면 그대로 통과한다'],a:[1],e:'철길 건널목 앞에서는 일시정지하여 안전을 확인한 후 통과해야 합니다. 신호기 등이 표시하는 신호에 따르는 경우에는 정지하지 않고 통과할 수 있습니다.'},
{c:'law',q:'비보호좌회전 표지가 있는 교차로에서 좌회전하는 방법으로 옳은 것은?',o:['적색 신호일 때 좌회전한다','녹색 신호일 때 반대 방향 교통에 방해되지 않도록 좌회전한다','황색 신호일 때만 좌회전한다','신호와 관계없이 언제든 좌회전한다'],a:[1],e:'비보호좌회전은 녹색 등화에서 반대 방향 교통에 방해가 되지 않도록 주의하며 좌회전할 수 있습니다.'},
{c:'law',q:'우회전 신호등이 없는 교차로에서 차량 신호가 적색일 때 우회전하는 방법으로 옳은 것은?',o:['우회전할 수 없다','서행하며 그대로 우회전한다','정지선·횡단보도 직전에 일시정지한 후 신호에 따라 진행하는 다른 교통을 방해하지 않고 우회전한다','경음기를 울려 보행자에게 알린 뒤 우회전한다'],a:[2],e:'차량 신호가 적색일 때는 정지선(횡단보도) 직전에 일시정지한 후, 신호에 따라 진행하는 다른 차와 보행자를 방해하지 않고 우회전할 수 있습니다. 우회전 신호등이 있으면 그 신호에 따릅니다.'},
{c:'law',q:'우회전하려는데 횡단보도에 보행자가 건너려고 서 있다. 올바른 방법은?',o:['보행자가 기다리고 있으므로 먼저 통과한다','경음기를 울린다','횡단보도 앞에서 일시정지한다','속도를 높여 빠르게 지나간다'],a:[2],e:'보행자가 횡단보도를 통행하고 있거나 통행하려고 하는 때에는 횡단보도 앞(정지선)에서 일시정지해야 합니다.'},
{c:'law',q:'운전 중 휴대용 전화를 사용할 수 있는 경우 2가지를 고르시오.',o:['자동차가 정지하고 있는 경우','긴급자동차를 운전하는 경우','시속 20km 이하로 서행하는 경우','고속도로에서 내비게이션을 조작하는 경우'],a:[0,1],e:'자동차가 정지하고 있는 경우, 긴급자동차 운전 중, 각종 범죄·재해 신고 등 긴급한 경우, 손으로 잡지 않는 장치(핸즈프리)를 이용하는 경우에 한해 사용할 수 있습니다.'},
{c:'law',q:'좌석 안전띠 착용 의무에 대한 설명으로 옳은 것은?',o:['운전석만 착용하면 된다','앞좌석만 착용하면 된다','고속도로에서만 모든 좌석이 착용한다','일반도로·고속도로 모두 모든 좌석에서 착용해야 한다'],a:[3],e:'도로의 종류와 관계없이 운전자와 모든 좌석의 동승자는 좌석 안전띠를 착용해야 합니다.'},
{c:'law',q:'유아보호용 장구(카시트)를 반드시 착용시켜야 하는 유아의 나이 기준은?',o:['3세 미만','6세 미만','10세 미만','13세 미만'],a:[1],e:'6세 미만인 유아는 유아보호용 장구를 착용시킨 후 좌석 안전띠를 매도록 해야 합니다.'},
{c:'law',q:'교통정리를 하고 있지 않은 교차로에 두 차가 동시에 들어가려 할 때 우선순위로 옳은 것은? (도로 폭이 같은 경우)',o:['왼쪽 도로에서 오는 차가 우선','오른쪽 도로에서 오는 차가 우선','속도가 빠른 차가 우선','큰 차가 우선'],a:[1],e:'교통정리를 하고 있지 않은 교차로에 동시에 들어가려는 경우 우측 도로의 차에 진로를 양보해야 합니다. 이미 교차로에 들어가 있는 차가 있으면 그 차에 양보합니다.'},
{c:'law',q:'교통정리를 하고 있지 않은 교차로에서 좌회전하려는 차의 운전자는?',o:['직진하거나 우회전하려는 다른 차에 진로를 양보한다','먼저 진입하여 좌회전한다','경음기를 울리고 좌회전한다','속도를 높여 신속히 좌회전한다'],a:[0],e:'교통정리를 하고 있지 않은 교차로에서 좌회전하려는 차는 그 교차로에서 직진하거나 우회전하려는 다른 차에 진로를 양보해야 합니다.'},
{c:'law',q:'교차로에서 좌회전하는 방법으로 옳은 것은?',o:['미리 도로의 중앙선을 따라 서행하면서 교차로의 중심 안쪽을 이용한다','교차로 중심 바깥쪽으로 크게 돈다','가장 오른쪽 차로에서 좌회전한다','신속하게 교차로를 가로질러 좌회전한다'],a:[0],e:'좌회전할 때는 미리 도로의 중앙선을 따라 서행하면서 교차로의 중심 안쪽을 이용해야 합니다.'},
{c:'law',q:'교차로에서 우회전하는 방법으로 옳은 것은?',o:['미리 도로의 우측 가장자리를 서행하면서 우회전한다','2차로 이상 떨어진 차로에서 크게 돌아 우회전한다','중앙선 쪽 차로에서 우회전한다','속도를 유지하며 우회전한다'],a:[0],e:'우회전할 때는 미리 도로의 우측 가장자리를 서행하면서 우회전해야 하며, 보행자나 자전거에 주의해야 합니다.'},
{c:'law',q:'고속도로의 갓길 통행에 대한 설명으로 옳은 것은?',o:['차량이 정체되면 갓길로 통행할 수 있다','원칙적으로 금지되며 긴급자동차나 고장 등 부득이한 경우에만 허용된다','출구가 가까우면 갓길로 진행할 수 있다','소형차는 언제든 통행할 수 있다'],a:[1],e:'고속도로의 갓길(길 가장자리 구역)은 긴급자동차, 고장 등 부득이한 사정이 있는 경우를 제외하고 통행할 수 없습니다. 단, 갓길 차로제로 지정된 경우는 따릅니다.'},
{c:'law',q:'편도 3차로 고속도로에서 1차로의 용도로 옳은 것은?',o:['대형 화물자동차의 주행 차로','앞지르기를 하려는 차의 통행 차로','버스 전용 주행 차로','저속 차량의 주행 차로'],a:[1],e:'고속도로 1차로는 앞지르기를 하려는 승용·경형·소형·중형 승합자동차가 통행하는 차로입니다. 다만 정체 등으로 시속 80km 미만으로 통행할 수밖에 없는 경우에는 앞지르기가 아니라도 통행할 수 있습니다.'},
{c:'law',q:'고속도로 버스전용차로를 통행할 수 있는 차는?',o:['5인승 승용차에 4명이 탄 경우','9인승 승합차에 6명 이상이 탄 경우','적재중량 1톤 화물차','9인승 승합차에 운전자 혼자 탄 경우'],a:[1],e:'고속도로 버스전용차로는 9인승 이상 승용·승합자동차가 통행할 수 있으며, 승용자동차 또는 12인승 이하 승합자동차는 6명 이상 승차한 경우에 한합니다.'},
{c:'law',q:'도로 외의 곳(주차장 등)으로 출입하기 위해 보도를 횡단할 때 올바른 방법은?',o:['경음기를 울리며 서행한다','보도를 횡단하기 직전에 일시정지하여 좌우를 살핀 후 보행자 통행을 방해하지 않도록 횡단한다','보행자가 없으면 빠르게 지나간다','비상점멸등을 켜고 그대로 진행한다'],a:[1],e:'보도를 횡단하기 직전에 일시정지하여 좌측과 우측을 살핀 후 보행자의 통행을 방해하지 않도록 횡단해야 합니다.'},
{c:'law',q:'교통사고처리 특례법상 피해자와 합의하거나 보험에 가입되어 있어도 공소가 제기될 수 있는 중대 위반 2가지를 고르시오.',o:['신호위반','중앙선 침범','진로변경 시 방향지시등 미점등','정차 금지 장소 위반'],a:[0,1],e:'신호위반, 중앙선 침범, 제한속도 20km/h 초과, 앞지르기 방법 위반, 철길건널목 통과방법 위반, 횡단보도 보행자 보호의무 위반, 무면허, 음주운전, 보도 침범, 승객추락방지의무 위반, 어린이보호구역 안전운전의무 위반, 화물 고정조치 위반 등은 처벌 특례가 적용되지 않습니다.'},
{c:'law',q:'어린이보호구역에서 신호위반·속도위반 등을 했을 때 범칙금과 벌점은 일반 도로와 비교해 어떻게 되는가?',o:['일반 도로와 같다','일반 도로의 2배가 부과된다','범칙금만 2배가 된다','벌점만 2배가 된다'],a:[1],e:'어린이보호구역에서 일정 시간대에 신호위반·속도위반 등을 하면 범칙금과 벌점이 일반 도로의 2배로 부과됩니다.'},
{c:'law',q:'개인형 이동장치(전동킥보드 등)에 대한 설명으로 옳은 것 2가지를 고르시오.',o:['원동기장치자전거면허 이상의 운전면허가 필요하다','승차정원을 초과하여 탑승할 수 없으며 인명보호장구를 착용해야 한다','면허 없이 누구나 운전할 수 있다','보도로 통행하는 것이 원칙이다'],a:[0,1],e:'개인형 이동장치는 원동기장치자전거면허 이상이 필요하고, 승차정원을 지켜야 하며 안전모 등 인명보호장구를 착용해야 합니다. 원칙적으로 자전거도로나 차도 우측 가장자리로 통행합니다.'},
{c:'law',q:'보행자 신호등의 녹색 등화가 점멸할 때 보행자의 올바른 행동은?',o:['빠르게 횡단을 시작한다','횡단을 시작해서는 안 되며, 횡단 중인 보행자는 신속히 횡단을 마치거나 되돌아와야 한다','차가 멈추어 있으면 횡단을 시작해도 된다','점멸이 끝날 때까지 횡단보도 중앙에서 기다린다'],a:[1],e:'녹색 등화의 점멸은 횡단을 시작하지 말고, 이미 횡단 중이면 신속히 마치거나 보도로 되돌아오라는 뜻입니다.'},
{c:'law',q:'차량 신호등이 녹색 화살표 등화일 때의 의미는?',o:['화살표 방향으로 진행할 수 있다','화살표 반대 방향으로만 진행할 수 있다','일시정지 후 진행해야 한다','직진만 할 수 있다'],a:[0],e:'녹색 화살표 등화에서는 화살표 방향으로 진행할 수 있습니다.'},
{c:'law',q:'밤에 도로를 통행할 때 마주 보고 진행하는 차가 있으면 등화를 어떻게 조작해야 하는가?',o:['전조등을 상향으로 켠다','전조등의 밝기를 줄이거나 불빛의 방향을 아래로 향하게 한다','전조등을 깜빡여 신호를 보낸다','비상점멸등을 켠다'],a:[1],e:'밤에 차가 서로 마주 보고 진행할 때는 전조등의 밝기를 줄이거나 불빛의 방향을 아래로 향하게 하거나 잠시 꺼서 상대 운전자의 눈부심을 막아야 합니다.'},
{c:'law',q:'운전 중 영상표시장치(DMB, 영상 등) 시청에 대한 설명으로 옳은 것은?',o:['저속 주행 중에는 시청할 수 있다','자동차가 정지하고 있거나 지리안내·운전 보조 영상 등을 표시하는 경우를 제외하고 시청하거나 조작해서는 안 된다','동승자가 있으면 시청할 수 있다','고속도로에서만 금지된다'],a:[1],e:'운전 중에는 정지 상태이거나 내비게이션 등 지리안내·운전 보조 영상이 아니면 영상을 표시하거나 시청·조작해서는 안 됩니다.'},
{c:'law',q:'어린이가 보호자 없이 도로를 횡단하는 것을 발견했을 때 운전자의 올바른 행동은?',o:['경음기를 울려 어린이를 멈추게 한다','일시정지하여 어린이가 안전하게 건너도록 한다','어린이 뒤쪽으로 서행하며 지나간다','속도를 유지하며 피해 간다'],a:[1],e:'어린이가 보호자 없이 도로를 횡단하거나 놀고 있는 경우에는 일시정지해야 합니다.'},
// ── 안전운전
{c:'drive',q:'빗길 고속 주행 시 타이어와 노면 사이에 물막이 생겨 조향·제동이 되지 않는 현상은?',o:['베이퍼록 현상','수막현상','스탠딩웨이브 현상','페이드 현상'],a:[1],e:'수막현상(하이드로플레이닝)은 빗길에서 타이어가 물 위에 떠 노면과 접촉하지 못하는 현상입니다. 감속하고 마모된 타이어를 교체하며 공기압을 적정보다 조금 높이면 예방에 도움이 됩니다.'},
{c:'drive',q:'긴 내리막길에서 풋브레이크를 계속 사용하면 마찰열로 브레이크액에 기포가 생겨 제동이 잘 되지 않는 현상은?',o:['수막현상','베이퍼록 현상','스탠딩웨이브 현상','모닝록 현상'],a:[1],e:'베이퍼록은 브레이크 회로 안에 기포가 생겨 페달을 밟아도 제동력이 전달되지 않는 현상입니다. 내리막에서는 저단 기어로 엔진브레이크를 함께 사용해야 합니다.'},
{c:'drive',q:'브레이크를 반복해서 사용하여 마찰재가 과열되면서 제동력이 떨어지는 현상은?',o:['페이드 현상','수막현상','증발현상','현혹현상'],a:[0],e:'페이드 현상은 브레이크 마찰재가 과열되어 마찰계수가 떨어지면서 제동력이 약해지는 현상입니다.'},
{c:'drive',q:'공기압이 낮은 타이어로 고속 주행할 때 타이어가 물결 모양으로 변형되어 파손될 수 있는 현상은?',o:['베이퍼록 현상','스탠딩웨이브 현상','수막현상','페이드 현상'],a:[1],e:'스탠딩웨이브 현상은 고속 주행 시 타이어 접지부가 물결처럼 변형되는 현상으로, 타이어 공기압을 적정하게(조금 높게) 유지하고 과속을 피해 예방합니다.'},
{c:'drive',q:'정지거리에 대한 설명으로 옳은 것은?',o:['제동거리만을 말한다','공주거리와 제동거리를 합한 거리이다','공주거리에서 제동거리를 뺀 거리이다','브레이크를 밟은 뒤 바퀴가 멈출 때까지의 시간이다'],a:[1],e:'정지거리 = 공주거리(위험 인지 후 브레이크가 듣기 시작할 때까지 진행한 거리) + 제동거리(브레이크가 듣기 시작해 멈출 때까지의 거리)입니다.'},
{c:'drive',q:'"공주거리"의 뜻으로 옳은 것은?',o:['브레이크가 작동하기 시작해 차가 완전히 정지할 때까지의 거리','운전자가 위험을 발견하고 브레이크를 밟아 브레이크가 듣기 시작할 때까지 차가 진행한 거리','앞차와의 거리','차가 미끄러진 거리'],a:[1],e:'공주거리는 위험을 인지하고 브레이크 페달을 밟아 브레이크가 실제로 작동하기 시작할 때까지 진행한 거리입니다. 피로·음주 시 길어집니다.'},
{c:'drive',q:'야간에 마주 오는 두 차의 전조등 불빛이 겹치는 곳에서 보행자가 순간적으로 보이지 않는 현상은?',o:['현혹현상','증발현상','수막현상','착시현상'],a:[1],e:'증발현상은 마주 오는 차의 전조등과 내 차의 전조등 불빛이 겹치는 부분에서 보행자가 순간적으로 보이지 않는 현상입니다.'},
{c:'drive',q:'야간에 마주 오는 차의 전조등 불빛에 눈이 부실 때 올바른 대처는?',o:['전조등을 상향으로 켜서 맞선다','시선을 약간 오른쪽 도로 가장자리로 돌린다','눈을 감고 지나간다','속도를 높여 빨리 지나간다'],a:[1],e:'눈부심(현혹)을 피하려면 시선을 약간 오른쪽 가장자리로 돌리고 속도를 줄여야 합니다.'},
{c:'drive',q:'겨울철 도로가 얼기 쉬운 곳(블랙아이스 주의 구간) 2가지를 고르시오.',o:['다리 위','터널 출입구나 그늘진 곳','햇볕이 잘 드는 평지 도로','지하주차장 안쪽'],a:[0,1],e:'다리 위, 고가도로, 터널 출입구, 그늘진 곳은 노면이 얼기 쉽습니다. 미리 감속하고 급제동·급핸들을 피해야 합니다.'},
{c:'drive',q:'긴 내리막길을 내려갈 때 가장 안전한 운전 방법은?',o:['기어를 중립(N)에 두고 내려간다','풋브레이크만 계속 밟으며 내려간다','저단 기어로 엔진브레이크를 사용하며 풋브레이크를 함께 사용한다','시동을 끄고 내려간다'],a:[2],e:'내리막에서는 저단 기어로 엔진브레이크를 활용하고 풋브레이크를 보조로 사용해 베이퍼록·페이드 현상을 예방해야 합니다.'},
{c:'drive',q:'경사진 도로에 주차할 때 올바른 방법 2가지를 고르시오.',o:['주차제동장치를 작동시키고 바퀴에 고임목 등을 설치한다','조향장치를 도로의 가장자리 방향으로 돌려 놓는다','기어를 중립(N)에 둔다','바퀴를 도로 중앙 방향으로 돌려 놓는다'],a:[0,1],e:'경사진 곳에 주차할 때는 주차제동장치를 작동하고 고임목을 설치하며, 조향장치를 도로 가장자리(자동차에서 가까운 쪽) 방향으로 돌려 놓아야 합니다.'},
{c:'drive',q:'장거리 운전 중 졸음이 올 때 가장 올바른 대처는?',o:['창문을 열고 계속 운전한다','음악 소리를 크게 한다','가까운 휴게소나 졸음쉼터에서 충분히 쉰다','속도를 높여 빨리 목적지에 도착한다'],a:[2],e:'졸음운전은 매우 위험하므로 휴게소나 졸음쉼터에서 쉬어야 합니다. 장거리 운전 시 2시간마다 휴식하는 것이 좋습니다.'},
{c:'drive',q:'터널 안을 주행하다 화재가 발생했을 때 올바른 행동은?',o:['차를 버리고 키를 가지고 대피한다','차 안에서 창문을 닫고 구조를 기다린다','차를 갓길에 세우고 엔진을 끈 뒤 키를 꽂아 둔 채 비상구 등으로 대피한다','후진하여 터널 입구로 빠져나간다'],a:[2],e:'터널 화재 시에는 차를 갓길에 정차하고 시동을 끈 뒤 키를 꽂아 둔 채(긴급 이동을 위해) 비상구나 터널 밖으로 대피해야 합니다.'},
{c:'drive',q:'주행 중 타이어가 갑자기 펑크 났을 때 올바른 대처는?',o:['즉시 급제동한다','핸들을 꽉 잡고 직진을 유지하며 서서히 속도를 줄여 안전한 곳에 정차한다','핸들을 빠르게 반대쪽으로 꺾는다','가속하여 차체를 안정시킨다'],a:[1],e:'펑크 시 급제동이나 급핸들은 차를 전복·회전시킬 수 있습니다. 핸들을 꽉 잡고 직진을 유지하며 서서히 감속해 안전한 곳에 세웁니다.'},
{c:'drive',q:'빗길이나 눈길에서 차가 미끄러지기 시작할 때 핸들 조작 방법으로 옳은 것은?',o:['미끄러지는 방향으로 핸들을 돌린다','미끄러지는 반대 방향으로 핸들을 크게 꺾는다','핸들을 놓는다','브레이크를 세게 밟고 핸들을 고정한다'],a:[0],e:'뒷부분이 미끄러질 때는 미끄러지는 방향으로 핸들을 돌려 차체 균형을 회복해야 합니다. 급제동은 피합니다.'},
{c:'drive',q:'빗길 주행 방법으로 옳은 것은?',o:['평소와 같은 차간거리를 유지한다','평소보다 감속하고 차간거리를 충분히 늘린다','물웅덩이를 빠르게 통과한다','수막현상을 막기 위해 가속한다'],a:[1],e:'빗길은 제동거리가 길어지므로 감속하고 평소보다 차간거리를 충분히 늘려야 합니다.'},
{c:'drive',q:'안개가 짙게 낀 도로에서의 운전 방법으로 옳은 것은?',o:['전조등을 상향으로 켜서 멀리 비춘다','전조등(하향)과 안개등을 켜고 차선·가드레일을 기준으로 서행한다','앞차를 바짝 따라간다','비상점멸등만 켜고 평소 속도로 주행한다'],a:[1],e:'안개 시 상향등은 빛이 산란되어 시야를 오히려 방해합니다. 하향 전조등과 안개등을 켜고 감속하며 충분한 거리를 유지합니다.'},
{c:'drive',q:'고속도로 본선에 진입할 때 올바른 방법은?',o:['가속차로에서 충분히 속도를 높인 후 본선 차량의 통행을 방해하지 않도록 진입한다','가속차로 끝에서 일시정지 후 진입한다','본선 차량이 양보하도록 경음기를 울린다','저속으로 천천히 진입한다'],a:[0],e:'고속도로에 진입할 때는 가속차로에서 본선 속도에 맞게 가속한 뒤 본선 차량의 통행을 방해하지 않도록 진입해야 합니다.'},
{c:'drive',q:'고속도로에서 빠져나가야 할 출구를 지나쳤을 때 올바른 행동은?',o:['갓길에 세운 후 후진하여 출구로 나간다','비상점멸등을 켜고 역주행한다','다음 출구까지 진행하여 빠져나간다','중앙분리대 틈으로 유턴한다'],a:[2],e:'고속도로에서는 후진·유턴·횡단이 금지되어 있으므로 다음 출구를 이용해야 합니다.'},
{c:'drive',q:'주차 후 차 문을 열 때 뒤에서 오는 자전거·이륜차와의 충돌을 막는 방법으로 옳은 것은?',o:['빠르게 문을 활짝 연다','문에서 먼 쪽 손으로 문을 열어 몸을 돌려 뒤를 확인한 후 천천히 연다','사이드미러는 보지 않아도 된다','비상점멸등을 켜면 확인하지 않아도 된다'],a:[1],e:'운전석에서는 오른손(문에서 먼 손)으로 문을 열면 자연스럽게 몸이 돌아가 뒤쪽을 확인할 수 있습니다(더치 리치). 미러와 직접 확인 후 천천히 엽니다.'},
{c:'drive',q:'대형차가 우회전할 때 뒷바퀴가 앞바퀴보다 더 안쪽으로 지나가는 현상과 관련해 옳은 것은?',o:['대형차 오른쪽 옆에 바짝 붙어 있으면 안전하다','내륜차 때문에 우회전하는 대형차의 오른쪽 옆에 있으면 위험하다','대형차는 앞바퀴만 확인하면 된다','이 현상은 승용차에서만 발생한다'],a:[1],e:'회전 시 뒷바퀴가 앞바퀴보다 안쪽을 지나는 거리 차이를 내륜차라고 하며, 대형차일수록 큽니다. 우회전하는 대형차 옆에 붙어 있으면 위험합니다.'},
{c:'drive',q:'경제운전(친환경 운전) 방법으로 옳지 않은 것은?',o:['급출발·급가속을 하지 않는다','불필요한 공회전을 줄인다','타이어 공기압을 적정하게 유지한다','트렁크에 짐을 가득 실어 차체를 안정시킨다'],a:[3],e:'불필요한 짐은 연비를 나쁘게 합니다. 급출발·급가속 자제, 공회전 줄이기, 적정 공기압 유지가 경제운전입니다.'},
{c:'drive',q:'주행 중 냉각수 온도계가 H(높음) 쪽을 가리킬 때 올바른 대처는?',o:['그대로 계속 주행한다','즉시 라디에이터 캡을 열어 확인한다','안전한 곳에 정차한 후 엔진이 충분히 식은 다음 냉각수를 점검한다','찬물을 엔진에 바로 붓는다'],a:[2],e:'엔진 과열 시 뜨거운 상태에서 라디에이터 캡을 열면 화상 위험이 있습니다. 안전한 곳에 정차하고 충분히 식힌 뒤 점검합니다.'},
{c:'drive',q:'자전거 옆을 지나갈 때 올바른 운전 방법은?',o:['경음기를 계속 울려 비키게 한다','자전거와 충분한 옆 간격을 두고 서행한다','자전거 바로 옆으로 빠르게 지나간다','자전거 뒤에 바짝 붙어 따라간다'],a:[1],e:'자전거 옆을 지날 때는 충분한 옆 간격을 두고 서행해야 합니다. 경음기는 오히려 자전거 운전자를 놀라게 할 수 있습니다.'},
{c:'drive',q:'차로를 변경할 때 사각지대 확인 방법으로 옳은 것은?',o:['룸미러만 확인한다','사이드미러만 확인한다','룸미러·사이드미러로 확인하고 고개를 돌려 사각지대를 직접 확인한다','방향지시등만 켜면 확인하지 않아도 된다'],a:[2],e:'거울만으로는 보이지 않는 사각지대가 있으므로 고개를 돌려 직접 확인한 후 차로를 변경해야 합니다.'},
{c:'drive',q:'눈길에서 출발할 때 바퀴가 헛돌지 않게 하는 방법으로 옳은 것은?',o:['가속 페달을 세게 밟아 한 번에 출발한다','가속 페달을 부드럽게 조작하여 천천히 출발한다','핸들을 좌우로 흔들며 출발한다','주차브레이크를 채운 채 출발한다'],a:[1],e:'눈길에서는 구동력이 크면 바퀴가 헛돕니다. 가속 페달을 부드럽게 조작하고, 수동변속기라면 2단으로 출발하는 것이 도움이 됩니다.'},
{c:'drive',q:'주택가 이면도로에서 주차된 차 사이로 공이 굴러 나왔을 때 운전자의 올바른 판단은?',o:['공만 피해 지나간다','어린이가 뒤따라 뛰어나올 수 있으므로 즉시 감속하고 정지할 준비를 한다','경음기를 울리고 진행한다','속도를 높여 빨리 지나간다'],a:[1],e:'공이 굴러 나오면 어린이가 뒤따라 뛰어나올 가능성이 높습니다. 즉시 감속하고 정지할 준비를 해야 합니다.'},

BANK.forEach(q => { q.id = hash(q.q + '|' + q.o.join('|')); });
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const BY_ID = Object.fromEntries(BANK.map(q => [q.id, q]));

/* ───────── 저장 ───────── */
const KEY = 'license-test-v1';
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
store.wrong ||= {}; store.history ||= []; store.lic ||= '2';
Object.keys(store.wrong).forEach(id => { if (!BY_ID[id]) delete store.wrong[id]; });
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} }

/* ───────── 설정 ───────── */
const EXAM_N = 40, EXAM_SEC = 40 * 60, PER = 100 / EXAM_N;
const PASS = { '1': 70, '2': 60 };
const LIC_NAME = { '1': '1종 보통', '2': '2종 보통' };

/* ───────── 유틸 ───────── */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
function show(id) { ['home', 'quiz', 'result', 'practiceMenu', 'notes'].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function confirmBox(text, yes = '확인') {
  return new Promise(res => {
    const d = $('dlg'); $('dlgText').textContent = text; $('dlgYes').textContent = yes;
    const done = v => { d.close(); $('dlgYes').onclick = $('dlgNo').onclick = null; res(v); };
    $('dlgYes').onclick = () => done(true); $('dlgNo').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
  });
}
// 문항을 보기 순서까지 섞어 한 회차용 문제로 만든다
function makeItem(q) {
  let order = shuffle(q.o.map((_, i) => i));
  // 숫자 보기(속도·거리·나이 등)는 섞지 않고 작은 수부터 늘어놓는다
  const nums = q.o.map(o => parseFloat((o.match(/\d+(\.\d+)?/) || [])[0]));
  if (nums.every(n => !isNaN(n)) && new Set(nums).size === nums.length) order.sort((x, y) => nums[x] - nums[y]);
  return { id: q.id, order, pick: [] };
}
const correctPicks = it => BY_ID[it.id].a.map(a => it.order.indexOf(a));
const isRight = it => sameSet(it.pick, correctPicks(it));

/* ───────── 홈 ───────── */
function renderHome() {
  document.querySelectorAll('#licSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lic === store.lic));
  $('licNote').textContent = `${LIC_NAME[store.lic]} 합격 기준: 100점 만점에 ${PASS[store.lic]}점 이상 (문항당 ${PER}점)`;
  $('fCount').textContent = BANK.length;
  const best = store.history.length ? Math.max(...store.history.map(h => h.score)) : null;
  $('fBest').textContent = best == null ? '-' : best;
  $('fWrong').textContent = Object.keys(store.wrong).length;
  const ex = store.exam;
  $('goResume').hidden = !ex;
  if (ex) {
    const left = Math.max(0, Math.round((ex.deadline - Date.now()) / 1000));
    $('resumeNote').textContent = `${LIC_NAME[ex.lic]} · ${ex.items.filter(i => i.pick.length).length}/${EXAM_N} 표기 · ${fmt(left)} 남음`;
  }
  $('histList').innerHTML = store.history.length
    ? store.history.slice(0, 8).map(h => `<li><span>${new Date(h.at).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' })} · ${LIC_NAME[h.lic]}</span><span><b>${h.score}점</b> <span class="tag ${h.pass ? 'pass' : 'fail'}">${h.pass ? '합격' : '불합격'}</span></span></li>`).join('')
    : '<li class="sub">아직 응시 기록이 없습니다. 모의시험을 시작해 보세요.</li>';
  show('home');
}
$('licSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; store.lic = b.dataset.lic; save(); renderHome(); });

/* ───────── 문제 화면 (시험·연습 공용) ───────── */
let mode = null;   // 'exam' | 'practice'
let session = null; // { items, cur, ... }
let tick = null;

function fmt(sec) { return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; }

function startExam() {
  // 표지 문항을 일정 비율 섞되 나머지는 전 분야에서 고르게 뽑는다
  const signs = shuffle(BANK.filter(q => q.c === 'sign')).slice(0, 10);
  const rest = shuffle(BANK.filter(q => q.c !== 'sign')).slice(0, EXAM_N - signs.length);
  const items = shuffle([...rest, ...signs]).map(makeItem);
  store.exam = { lic: store.lic, items, cur: 0, deadline: Date.now() + EXAM_SEC * 1000 };
  save();
  openExam();
}
function openExam() {
  mode = 'exam'; session = store.exam;
  $('timer').hidden = false; $('practiceScore').hidden = true;
  $('examNav').hidden = false; $('practiceNav').hidden = true; $('gridCard').hidden = false;
  clearInterval(tick); tick = setInterval(updateTimer, 500); updateTimer();
  show('quiz'); renderQ();
}
function updateTimer() {
  if (mode !== 'exam' || !session) return;
  const left = Math.max(0, Math.round((session.deadline - Date.now()) / 1000));
  $('timer').textContent = fmt(left);
  $('timer').classList.toggle('low', left <= 300);
  if (left <= 0) { clearInterval(tick); toast('시험 시간이 끝나 자동 제출되었습니다'); finishExam(); }
}
function startPractice(qs, label) {
  if (!qs.length) { toast('풀 문제가 없습니다'); return; }
  mode = 'practice';
  session = { items: shuffle(qs).map(makeItem), cur: 0, checked: false, right: 0, done: 0, label };
  clearInterval(tick);
  $('timer').hidden = true; $('practiceScore').hidden = false;
  $('examNav').hidden = true; $('practiceNav').hidden = false; $('gridCard').hidden = true;
  show('quiz'); renderQ();
}

function renderQ() {
  const it = session.items[session.cur], q = BY_ID[it.id], n = session.items.length;
  $('prog').style.width = `${((session.cur + 1) / n) * 100}%`;
  $('qNo').textContent = `${session.cur + 1} / ${n}`;
  $('qCat').textContent = CATS[q.c];
  $('qTwo').hidden = q.a.length < 2;
  $('qText').textContent = q.q;
  $('qSign').hidden = !q.s; $('qSign').innerHTML = q.s ? SIGNS[q.s] : '';
  const locked = mode === 'practice' && session.checked;
  const right = locked ? correctPicks(it) : [];
  $('qOpts').innerHTML = it.order.map((oi, k) => {
    let cls = '';
    if (locked) cls = right.includes(k) ? 'right' : it.pick.includes(k) ? 'wrong' : '';
    return `<button class="opt ${cls}" data-k="${k}" aria-pressed="${!locked && it.pick.includes(k)}" ${locked ? 'disabled' : ''}><span class="n">${k + 1}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join('');
  const ex = $('qExplain');
  if (locked) {
    const ok = isRight(it);
    ex.hidden = false; ex.className = 'explain ' + (ok ? 'ok' : 'no');
    ex.innerHTML = `<b>${ok ? '정답입니다' : `오답 · 정답은 ${right.map(k => k + 1).join(', ')}번`}</b>${esc(q.e)}`;
  } else ex.hidden = true;

  if (mode === 'exam') {
    $('prevBtn').disabled = session.cur === 0;
    $('nextBtn').textContent = session.cur === n - 1 ? '답안 제출' : '다음';
    const answered = session.items.filter(i => i.pick.length).length;
    $('answeredCount').textContent = `${answered} / ${n} 표기`;
    $('qGrid').innerHTML = session.items.map((x, i) => `<button data-i="${i}" class="${x.pick.length ? 'done' : ''} ${i === session.cur ? 'cur' : ''}">${i + 1}</button>`).join('');
  } else {
    $('practiceScore').textContent = `${session.right}/${session.done} 정답`;
    $('pNextBtn').disabled = !session.checked;
    $('pNextBtn').textContent = session.cur === n - 1 ? '결과 보기' : '다음 문제';
  }
}

$('qOpts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b || b.disabled) return;
  const it = session.items[session.cur], need = BY_ID[it.id].a.length, k = +b.dataset.k;
  if (it.pick.includes(k)) it.pick = it.pick.filter(x => x !== k);
  else { it.pick.push(k); if (it.pick.length > need) it.pick.shift(); }
  if (mode === 'exam') { save(); renderQ(); return; }
  if (it.pick.length === need) checkPractice(); else renderQ();
});
function checkPractice() {
  const it = session.items[session.cur], ok = isRight(it);
  session.checked = true; session.done++;
  if (ok) { session.right++; delete store.wrong[it.id]; }
  else store.wrong[it.id] = (store.wrong[it.id] || 0) + 1;
  save(); renderQ();
}
$('pNextBtn').onclick = () => {
  if (session.cur < session.items.length - 1) { session.cur++; session.checked = false; renderQ(); window.scrollTo(0, 0); return; }
  const { right, done } = session;
  toast(`${done}문제 중 ${right}문제 정답`);
  renderHome();
};
$('prevBtn').onclick = () => { if (session.cur > 0) { session.cur--; save(); renderQ(); } };
$('nextBtn').onclick = () => {
  if (session.cur < session.items.length - 1) { session.cur++; save(); renderQ(); window.scrollTo(0, 0); }
  else submitExam();
};
$('qGrid').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; session.cur = +b.dataset.i; save(); renderQ(); window.scrollTo(0, 0); });
$('submitBtn').onclick = submitExam;
async function submitExam() {
  const blank = session.items.filter(i => i.pick.length < BY_ID[i.id].a.length).length;
  const msg = blank ? `아직 답을 다 고르지 않은 문항이 ${blank}개 있습니다. 그래도 제출할까요?` : '답안을 제출할까요?';
  if (await confirmBox(msg, '제출')) finishExam();
}
$('quizBack').onclick = async () => {
  if (mode === 'exam') {
    if (await confirmBox('시험을 잠시 멈추고 나갈까요? 시간은 계속 흐르며, 처음 화면의 "이어서 풀기"로 돌아올 수 있습니다.', '나가기')) { clearInterval(tick); renderHome(); }
  } else renderHome();
};

/* ───────── 채점·결과 ───────── */
let lastWrong = [];
function finishExam() {
  clearInterval(tick);
  const ex = store.exam; if (!ex) return;
  const results = ex.items.map(it => ({ it, ok: isRight(it) }));
  const correct = results.filter(r => r.ok).length;
  const score = Math.round(correct * PER * 10) / 10;
  const pass = score >= PASS[ex.lic];
  results.forEach(({ it, ok }) => { if (!ok) store.wrong[it.id] = (store.wrong[it.id] || 0) + 1; });
  store.history.unshift({ at: Date.now(), lic: ex.lic, score, pass, correct });
  store.history = store.history.slice(0, 50);
  delete store.exam; save();
  mode = null;

  $('rLic').textContent = `${LIC_NAME[ex.lic]} 모의시험 · 합격 기준 ${PASS[ex.lic]}점`;
  $('rScore').textContent = score;
  $('rDetail').textContent = `${EXAM_N}문항 중 ${correct}문항 정답`;
  $('rVerdict').textContent = pass ? '합격' : '불합격';
  $('rVerdict').className = 'verdict ' + (pass ? 'pass' : 'fail');

  const byCat = {};
  results.forEach(({ it, ok }) => { const c = BY_ID[it.id].c; (byCat[c] ||= [0, 0]); byCat[c][1]++; if (ok) byCat[c][0]++; });
  $('rCats').innerHTML = Object.keys(CATS).filter(c => byCat[c]).map(c => {
    const [r, t] = byCat[c];
    return `<div class="cat"><span>${CATS[c]}</span><div class="track"><i style="width:${(r / t) * 100}%"></i></div><span>${r}/${t}</span></div>`;
  }).join('');

  const wrong = results.filter(r => !r.ok);
  lastWrong = wrong.map(r => BY_ID[r.it.id]);
  $('rRetryWrong').hidden = !wrong.length;
  $('rReviewTitle').textContent = wrong.length ? `틀린 문제 해설 (${wrong.length})` : '모두 맞혔습니다!';
  $('rReview').innerHTML = wrong.map(({ it }) => {
    const q = BY_ID[it.id], txt = k => esc(q.o[it.order[k]]);
    const mine = it.pick.length ? it.pick.map(txt).join(', ') : '선택 안 함';
    const ans = correctPicks(it).map(txt).join(', ');
    return `<div class="review"><div style="font-weight:600">${esc(q.q)}</div>${q.s ? `<div class="sign" style="margin:8px 0">${SIGNS[q.s]}</div>` : ''}
      <div class="ans">내 답: <span class="w">${mine}</span></div><div class="ans">정답: <span class="r">${ans}</span></div>
      <div class="explain" style="margin-top:8px">${esc(q.e)}</div></div>`;
  }).join('');
  show('result');
}
$('rHome').onclick = renderHome;
$('rRetryWrong').onclick = () => startPractice(lastWrong, '틀린 문제');

/* ───────── 연습 메뉴 ───────── */
function renderPracticeMenu() {
  const entries = [['all', '전체 문제', BANK.length], ...Object.entries(CATS).map(([c, n]) => [c, n, BANK.filter(q => q.c === c).length])];
  $('catList').innerHTML = entries.map(([c, n, cnt]) => `<button data-c="${c}"><b>${n}</b><span class="sub">${cnt}문제 ›</span></button>`).join('');
  show('practiceMenu');
}
$('catList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = b.dataset.c;
  startPractice(c === 'all' ? BANK : BANK.filter(q => q.c === c), c === 'all' ? '전체' : CATS[c]);
});

/* ───────── 오답노트 ───────── */
function renderNotes() {
  const ids = Object.keys(store.wrong).sort((a, b) => store.wrong[b] - store.wrong[a]);
  $('notesPractice').disabled = !ids.length;
  $('notesList').innerHTML = ids.length ? ids.map(id => {
    const q = BY_ID[id];
    return `<div class="review"><div class="row"><span class="pill">${CATS[q.c]}</span><span class="sub">${store.wrong[id]}번 틀림</span></div>
      <div style="font-weight:600;margin-top:6px">${esc(q.q)}</div>${q.s ? `<div class="sign" style="margin:8px 0">${SIGNS[q.s]}</div>` : ''}
      <div class="ans">정답: <span class="r">${q.a.map(i => esc(q.o[i])).join(', ')}</span></div>
      <div class="explain" style="margin-top:8px">${esc(q.e)}</div></div>`;
  }).join('') : '<p class="sub" style="margin:0">오답노트가 비어 있습니다. 모의시험이나 연습에서 틀린 문제가 여기에 모입니다.</p>';
  show('notes');
}
$('notesPractice').onclick = () => startPractice(Object.keys(store.wrong).map(id => BY_ID[id]), '오답노트');

/* ───────── 이동 ───────── */
$('goExam').onclick = async () => {
  if (store.exam && !(await confirmBox('진행 중인 시험이 있습니다. 새로 시작하면 지금까지 푼 내용은 사라집니다.', '새로 시작'))) return;
  startExam();
};
$('goResume').onclick = () => { if (store.exam.deadline <= Date.now()) { finishExam(); return; } openExam(); };
$('goPractice').onclick = renderPracticeMenu;
$('goNotes').onclick = renderNotes;
document.querySelectorAll('[data-home]').forEach(b => b.onclick = renderHome);

renderHome();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
