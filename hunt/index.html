<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 숨은그림 찾기</title>
<meta name="theme-color" content="#ffd84d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숨은그림 찾기">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/hunt-192.png">
<link rel="icon" href="icons/hunt-192.png">
<style>
@font-face{font-family:"Jua";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/jua.woff2") format("woff2")}
:root{
  --bg1:#ffe88a; --bg2:#ffd0e0; --ink:#25303a; --card:#ffffff; --soft:#f4f1e8; --line:rgba(0,0,0,.1);
  --accent:#ff5a4e; --good:#22c55e; --gold:#ffc61a; --shadow:0 6px 0 rgba(0,0,0,.14); --lock:#d9d4c6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#2b2440; --bg2:#1c2f3a; --ink:#f1f0f6; --card:#353047; --soft:#2a2638; --line:rgba(255,255,255,.14); --lock:#4a4560; }
}
:root[data-theme="dark"]{ --bg1:#2b2440; --bg2:#1c2f3a; --ink:#f1f0f6; --card:#353047; --soft:#2a2638; --line:rgba(255,255,255,.14); --lock:#4a4560; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);background-image:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{font-weight:normal;margin:0}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.big-btn{font-size:24px;padding:12px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;box-shadow:var(--shadow);min-height:60px}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.small{font-size:19px;padding:8px 16px;min-height:48px}
.big-btn:disabled{opacity:.45}
.big-btn:active:not(:disabled),.icon-btn:active,.st:active:not(.lock){transform:translateY(3px)}
.icon-btn{font-size:24px;width:52px;height:52px;border:none;border-radius:16px;background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.14);flex:none;display:grid;place-items:center;position:relative}
.icon-btn .n{position:absolute;right:-4px;top:-4px;background:var(--accent);color:#fff;border-radius:999px;font-size:14px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
.icon-btn:disabled{opacity:.4}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 14px;font-size:20px;min-height:44px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px}
.sp{flex:1}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ---------- 처음 화면 ---------- */
.home{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.logo{font-size:clamp(40px,8vw,74px);line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.08)}
.logo b{font-weight:normal;color:var(--accent)}
.lens{font-size:clamp(70px,16vmin,130px);animation:bob 1.8s ease-in-out infinite}
.menu{display:grid;gap:12px;width:min(440px,100%)}
.menu .big-btn{font-size:28px;min-height:76px}
.menu .big-btn.go{animation:pulse 1.3s ease-in-out infinite}
.note{font-size:16px;line-height:1.55;opacity:.75;max-width:560px;margin:4px auto}
.banner{background:#fff3c4;color:#5b4500;border-radius:18px;padding:12px 16px;max-width:560px;font-size:18px;line-height:1.5}

/* ---------- 스테이지 지도 ---------- */
.maplist{flex:1;overflow-y:auto;padding:6px 2px 20px}
.world{background:var(--card);border-radius:22px;padding:12px;margin:0 auto 14px;max-width:760px;box-shadow:var(--shadow)}
.world h3{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.world h3 i{font-style:normal;display:inline-block;width:28px;height:28px;border-radius:9px;background:var(--c)}
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{border:none;border-radius:16px;background:var(--c);color:#fff;min-height:70px;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.25);padding:4px 0}
.st small{font-size:14px;letter-spacing:1px;text-shadow:none;color:#ffe066;min-height:16px}
.st.lock{background:var(--lock);color:rgba(0,0,0,.35);text-shadow:none;box-shadow:none}
.st.cur{outline:4px solid var(--accent);outline-offset:2px}

/* ---------- 놀이 화면 ---------- */
#play{padding-bottom:max(8px,env(safe-area-inset-bottom));gap:8px}
#play .bar{flex-wrap:nowrap}
.ttl{font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl small{display:block;font-size:14px;opacity:.65}
#stage{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12);background:#222;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:8px}
.zoom .icon-btn{width:46px;height:46px;font-size:24px;opacity:.92}
.tray{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;flex:none;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tc{flex:none;width:84px;background:var(--card);border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.14);padding:4px 4px 6px;text-align:center;font-size:14px;position:relative;border:none}
.tc img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto;pointer-events:none}
.tc span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.ok{background:#c9f7d6;color:#1f5130}
.tc.ok img{opacity:.55}
.tc.ok::after{content:"✔";position:absolute;right:4px;top:0;font-size:30px;color:#16a34a;animation:pop .3s}
.tc.ball{background:var(--soft)}
@media (max-width:480px){
  #play .pill{font-size:16px;padding:2px 9px;min-height:40px}
  #play .icon-btn{width:44px;height:44px;font-size:20px}
  .ttl{font-size:17px}
}
@media (orientation:landscape) and (max-height:560px){
  #play{flex-direction:row;flex-wrap:wrap}
  #play>.bar{width:100%}
  #stage{flex:1;height:calc(100% - 60px)}
  .tray{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:calc(100% - 60px);width:92px}
  .tc{width:84px}
}

/* ---------- 겹쳐 뜨는 창 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
.box{background:var(--card);border-radius:26px;padding:20px;max-width:620px;width:100%;max-height:100%;overflow-y:auto;text-align:center;animation:pop .25s ease-out;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.box h2{font-size:30px;margin-bottom:8px}
.box h3{font-size:21px;margin:16px 0 8px}
.box p{font-size:18px;line-height:1.5;margin:6px 0}
.intro .story{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:18px;line-height:1.6;text-align:left}
.intro .story b{font-weight:normal;color:var(--accent)}
.findrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 14px}
.findrow div{width:86px;font-size:15px}
.findrow img{width:76px;height:76px;object-fit:contain;background:var(--soft);border-radius:50%;padding:4px;display:block;margin:0 auto 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:3px solid transparent;border-radius:14px;background:var(--soft);padding:8px 14px;font-size:18px;min-height:48px}
.chips button.on{border-color:var(--accent);background:#ffe1dc;color:#7a1d14}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;text-align:left}
.pk{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:18px;border:3px solid transparent}
.pk.on{border-color:var(--accent)}
.pk small{display:block;font-size:13px;opacity:.65}
.pk input{width:22px;height:22px;accent-color:var(--accent)}
.prog{height:16px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
.stars{font-size:54px;letter-spacing:6px;margin:4px 0}
.stars span{display:inline-block;animation:pop .4s backwards}
.stars .off{filter:grayscale(1);opacity:.3}
.stat{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:18px;margin:8px 0 14px}
.stat span{background:var(--soft);border-radius:12px;padding:6px 12px}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(20,20,30,.85);color:#fff;padding:12px 20px;border-radius:16px;font-size:22px;z-index:50;pointer-events:none;animation:pop .2s;text-align:center}
.confetti{position:fixed;top:-30px;font-size:30px;z-index:40;pointer-events:none;animation:fall linear forwards}
</style>
</head>
<body>

<!-- 처음 화면 -->
<section id="home" class="scr">
  <div class="bar"><span class="sp"></span><button class="icon-btn" id="btnSet" aria-label="설정">⚙️</button></div>
  <div class="home">
    <div class="lens">🔍</div>
    <h1 class="logo">포켓몬<br><b>숨은그림 찾기</b></h1>
    <div id="homeMsg" class="note"></div>
    <div class="menu" id="homeMenu"></div>
  </div>
</section>

<!-- 스테이지 지도 -->
<section id="map" class="scr" hidden>
  <div class="bar" style="margin-bottom:8px"><button class="icon-btn" data-home aria-label="처음으로">🏠</button><h2 class="sp" style="text-align:center;font-size:26px">스테이지 고르기</h2><span class="pill" id="starSum">⭐ 0</span></div>
  <div class="maplist" id="mapList"></div>
</section>

<!-- 놀이 -->
<section id="play" class="scr" hidden>
  <div class="bar">
    <button class="icon-btn" id="btnQuit" aria-label="스테이지 목록">◀</button>
    <div class="ttl sp" id="ttl"></div>
    <span class="pill" id="timer">⏱ 0:00</span>
    <span class="pill" id="count">🔍 0/0</span>
    <button class="icon-btn" id="btnHint" aria-label="힌트">💡<span class="n" id="hintN">3</span></button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="zoom">
      <button class="icon-btn" id="zIn" aria-label="크게 보기">＋</button>
      <button class="icon-btn" id="zOut" aria-label="작게 보기">－</button>
      <button class="icon-btn" id="zFit" aria-label="전체 보기">⤢</button>
    </div>
  </div>
  <div class="tray" id="tray"></div>
</section>

<div id="sheet" class="sheet" hidden><div class="box" id="box"></div></div>

<script>
'use strict';
/* ======================================================================
   포켓몬 숨은그림 찾기
   · 포켓몬 그림은 앱에 들어 있지 않음: 처음에 PokeAPI 공개 저장소의 공식 일러스트를
     지역별로 골라 받아 이 기기(IndexedDB)에 저장 → 그다음부터는 인터넷 없이 놀 수 있음
   · 배경 10가지는 코드로 그림 (정원 · 들판 · 바닷가 · 얼음 바다 · 숲 기찻길 · 화산 · 사막 · 밤 축제 · 수정 동굴 · 하늘섬)
   · 50 스테이지: 찾을 포켓몬 수 · 포켓몬 수(모두 서로 다른 포켓몬) · 크기 · 비슷한 색 · 가려짐이 조금씩 늘어남

/* ---------- 그림 저장소 (IndexedDB) ---------- */
const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open('pokehunt',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img',mode), r=fn(t.objectStore('img'));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return {
    put:(k,v)=>tx('readwrite',o=>o.put(v,k)),
    del:k=>tx('readwrite',o=>o.delete(k)),
    all:async()=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img'), out=[], c=t.objectStore('img').openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } };
      t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); },
  };
})();

const ART=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
// 받은 그림의 빈 테두리를 잘라 내고 160px로 줄여 저장, 평균 색도 같이 기억 (비슷한 색 헷갈리기 용)
async function prep(blob){
  const bm=await createImageBitmap(blob);
  const c=document.createElement('canvas'); c.width=bm.width; c.height=bm.height;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(bm,0,0);
  const d=x.getImageData(0,0,c.width,c.height).data;
  let x0=c.width,y0=c.height,x1=-1,y1=-1,r=0,g=0,b=0,n=0;
  for(let y=0;y<c.height;y++) for(let i=0;i<c.width;i++){ const k=(y*c.width+i)*4, a=d[k+3];
    if(a>16){ if(i<x0)x0=i; if(i>x1)x1=i; if(y<y0)y0=y; if(y>y1)y1=y; }
    if(a>200&&((i+y)&3)===0){ r+=d[k]; g+=d[k+1]; b+=d[k+2]; n++; } }
  if(x1<0){ x0=y0=0; x1=c.width-1; y1=c.height-1; }
  const w=x1-x0+1, h=y1-y0+1, Z=160, k=Z/Math.max(w,h);
  const o=document.createElement('canvas'); o.width=Math.max(1,Math.round(w*k)); o.height=Math.max(1,Math.round(h*k));
  o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,o.width,o.height);
  bm.close&&bm.close();
  const out=await new Promise((res,rej)=>o.toBlob(v=>v?res(v):rej(new Error('toBlob')),'image/png'));
  return {b:out,c:n?[r/n|0,g/n|0,b/n|0]:[128,128,128]};
}
let dlBusy=false;
async function download(ids,progress){
  const jobs=ids.filter(id=>!PICS.has(id)), total=jobs.length; let done=0, fail=0;
  const worker=async()=>{ while(jobs.length){ const id=jobs.shift();
    try{ const r=await fetch(ART(id)); if(!r.ok) throw new Error(r.status); const v=await prep(await r.blob()); await idb.put(id,v); PICS.set(id,v); }
    catch(e){ fail++; }
    progress(++done,total); } };
  await Promise.all(Array.from({length:6},worker));
  return {total,fail};
}

let koV=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));
  const sc=v=>(/premium|고품질/i.test(v.name)?6:0)+(/enhanced|향상/i.test(v.name)?4:0)+(/siri/i.test(v.name)?3:0)+(/natural|neural|online/i.test(v.name)?3:0)+(/google/i.test(v.name)?1:0);
  koV=vs.sort((a,b)=>sc(b)-sc(a))[0]||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(t){ if(!S.set.sound||!S.set.voice||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; if(koV) u.voice=koV; u.rate=.95; speechSynthesis.speak(u); }catch(e){} }
let AC=null;
function tone(f,d=.12,type='sine',vol=.14,when=0){
  if(!S.set.sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(e){} }

const W=1600, H=1000;
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rnd=Math.random;
const R=(a,b)=>a+rnd()*(b-a);
const pick=a=>a[Math.floor(rnd()*a.length)];
function lin(c,x0,y0,x1,y1,stops){ const g=c.createLinearGradient(x0,y0,x1,y1); stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s)); return g; }
function sky(c,h,cols){ c.fillStyle=lin(c,0,0,0,h,cols); c.fillRect(0,0,W,h); }
function blob(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
function ell(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2); c.fill(); }
function cloud(c,x,y,s,col='rgba(255,255,255,.95)'){ c.fillStyle=col; [[0,0,1],[-.95,.25,.7],[.95,.25,.72],[-.45,-.4,.7],[.5,-.35,.62]].forEach(([dx,dy,k])=>blob(c,x+dx*s,y+dy*s,k*s)); }
function ridge(c,base,amp,col,seed,freq=1){ c.fillStyle=col; c.beginPath(); c.moveTo(0,H+5);
  for(let x=0;x<=W+20;x+=20){ const t=x/W*Math.PI*2*freq; c.lineTo(x,base+Math.sin(t+seed)*amp+Math.sin(t*2.7+seed*2)*amp*.4); }
  c.lineTo(W,H+5); c.closePath(); c.fill(); }
function tree(c,x,y,s,kind='round',snow=false){
  if(kind==='pine'){ c.fillStyle='#6b4a2b'; c.fillRect(x-s*.08,y-s*.3,s*.16,s*.3);
    const cols=['#2f7d4a','#3a9157','#47a565'];
    for(let i=0;i<3;i++){ const yy=y-s*.25-i*s*.32, ww=s*(.62-i*.14); c.fillStyle=cols[i]; c.beginPath(); c.moveTo(x-ww,yy); c.lineTo(x+ww,yy); c.lineTo(x,yy-s*.55); c.fill();
      if(snow){ c.fillStyle='#fff'; c.beginPath(); c.moveTo(x-ww*.35,yy-s*.35); c.lineTo(x+ww*.35,yy-s*.35); c.lineTo(x,yy-s*.55); c.fill(); } }
    return; }
  if(kind==='palm'){ c.strokeStyle='#9a6a3a'; c.lineWidth=s*.12; c.lineCap='round'; c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+s*.25,y-s*.6,x+s*.1,y-s*1.2); c.stroke();
    c.fillStyle='#2fa04f'; for(let i=0;i<6;i++){ c.save(); c.translate(x+s*.1,y-s*1.2); c.rotate(i/6*Math.PI*2+.3); c.beginPath(); c.ellipse(s*.38,0,s*.42,s*.1,0,0,Math.PI*2); c.fill(); c.restore(); }
    c.fillStyle='#7a4a22'; blob(c,x+s*.05,y-s*1.12,s*.07); blob(c,x+s*.17,y-s*1.1,s*.07); return; }
  c.fillStyle='#7a5432'; c.fillRect(x-s*.09,y-s*.45,s*.18,s*.45);
  const g=kind==='autumn'?['#d9771f','#ee9b2c','#f7c548']:kind==='blossom'?['#f29bb9','#f7b8cc','#ffd6e2']:['#2e8b45','#3fa556','#5cc06d'];
  c.fillStyle=g[0]; blob(c,x-s*.25,y-s*.6,s*.32); blob(c,x+s*.25,y-s*.6,s*.32);
  c.fillStyle=g[1]; blob(c,x,y-s*.85,s*.38);
  c.fillStyle=g[2]; blob(c,x-s*.1,y-s*.95,s*.16);
  if(snow){ c.fillStyle='#fff'; ell(c,x,y-s*1.15,s*.28,s*.1); }
}
function house(c,x,y,w,h,wall,roof,lit=false,snow=false){
  c.fillStyle=wall; c.fillRect(x,y-h,w,h);
  c.fillStyle='rgba(0,0,0,.08)'; c.fillRect(x+w*.7,y-h,w*.3,h);
  c.fillStyle=roof; c.beginPath(); c.moveTo(x-w*.1,y-h); c.lineTo(x+w/2,y-h-h*.6); c.lineTo(x+w*1.1,y-h); c.fill();
  if(snow){ c.fillStyle='#fff'; c.beginPath(); c.moveTo(x-w*.1,y-h); c.lineTo(x+w/2,y-h-h*.6); c.lineTo(x+w*1.1,y-h); c.lineTo(x+w*1.1,y-h+6); c.lineTo(x+w/2,y-h-h*.6+12); c.lineTo(x-w*.1,y-h+6); c.fill(); }
  const ww=w*.2; c.fillStyle=lit?'#ffe27a':'#a9d8f5';
  for(let r=0;r<Math.max(1,Math.floor(h/ (w*.42)));r++) for(let i=0;i<2;i++) c.fillRect(x+w*(.15+i*.48),y-h+w*.15+r*w*.38,ww,ww);
  c.fillStyle='#7a4a2a'; c.fillRect(x+w*.4,y-w*.32,w*.2,w*.32);
}
function flower(c,x,y,s,col){ c.fillStyle=col; for(let i=0;i<5;i++){ const a=i/5*Math.PI*2; blob(c,x+Math.cos(a)*s*.45,y+Math.sin(a)*s*.45,s*.38); } c.fillStyle='#ffe14d'; blob(c,x,y,s*.3); }
function tuft(c,x,y,s,col){ c.strokeStyle=col; c.lineWidth=Math.max(1.5,s*.12); c.lineCap='round'; c.beginPath();
  c.moveTo(x-s*.3,y); c.lineTo(x-s*.45,y-s*.7); c.moveTo(x,y); c.lineTo(x,y-s); c.moveTo(x+s*.3,y); c.lineTo(x+s*.45,y-s*.7); c.stroke(); }
function rock(c,x,y,s,col,shade='rgba(0,0,0,.18)'){ c.fillStyle=col; c.beginPath(); c.moveTo(x-s,y); c.lineTo(x-s*.8,y-s*.55); c.lineTo(x-s*.2,y-s*.85); c.lineTo(x+s*.55,y-s*.7); c.lineTo(x+s,y-s*.1); c.lineTo(x+s*.9,y); c.fill();
  c.fillStyle=shade; c.beginPath(); c.moveTo(x+s*.1,y); c.lineTo(x+s*.55,y-s*.7); c.lineTo(x+s,y-s*.1); c.lineTo(x+s*.9,y); c.fill(); }
function waves(c,x0,y0,x1,y1,col,n){ c.strokeStyle=col; c.lineWidth=3; c.lineCap='round'; for(let i=0;i<n;i++){ const x=R(x0,x1), y=R(y0,y1), s=R(10,22); c.beginPath(); c.arc(x,y,s,Math.PI*1.15,Math.PI*1.85); c.stroke(); } }
function path(c,pts,w,col,edge){ const go=()=>{ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length-1;i++){ const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2; c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my); } const l=pts[pts.length-1]; c.lineTo(l[0],l[1]); c.stroke(); };
  c.lineCap='round'; c.lineJoin='round'; if(edge){ c.strokeStyle=edge; c.lineWidth=w+12; go(); } c.strokeStyle=col; c.lineWidth=w; go(); }
function floe(c,x,y,w,h){ c.fillStyle='#9cc7ea'; c.beginPath(); const n=7; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, k=R(.8,1.1); c.lineTo(x+Math.cos(a)*w*k,y+12+Math.sin(a)*h*k); } c.fill();
  c.fillStyle='#f4fbff'; c.beginPath(); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, k=R(.85,1.05); c.lineTo(x+Math.cos(a)*w*k,y+Math.sin(a)*h*k); } c.fill(); }
function bunting(c,x0,y0,x1,y1){ c.strokeStyle='#5b4a3a'; c.lineWidth=2; c.beginPath(); c.moveTo(x0,y0); c.quadraticCurveTo((x0+x1)/2,(y0+y1)/2+40,x1,y1); c.stroke();
  const cols=['#ff5a4e','#ffc61a','#3db7ff','#58d16a','#b07cff']; const n=Math.floor(Math.hypot(x1-x0,y1-y0)/36);
  for(let i=1;i<n;i++){ const t=i/n, x=(1-t)*(1-t)*x0+2*(1-t)*t*(x0+x1)/2+t*t*x1, y=(1-t)*(1-t)*y0+2*(1-t)*t*((y0+y1)/2+40)+t*t*y1;
    c.fillStyle=cols[i%cols.length]; c.beginPath(); c.moveTo(x-10,y); c.lineTo(x+10,y); c.lineTo(x,y+22); c.fill(); } }
function lantern(c,x,y,col){ c.fillStyle='rgba(255,220,120,.25)'; blob(c,x,y,26); c.fillStyle=col; ell(c,x,y,12,15); c.fillStyle='#4a3020'; c.fillRect(x-6,y-18,12,4); c.fillRect(x-6,y+14,12,4); }
function crystal(c,x,y,s,col){ c.fillStyle=col; c.globalAlpha=.25; blob(c,x,y-s*.5,s*.9); c.globalAlpha=1;
  for(const [dx,k,a] of [[0,1,0],[-s*.3,.65,-.35],[s*.3,.7,.3]]){ c.save(); c.translate(x+dx,y); c.rotate(a); c.fillStyle=col; c.beginPath(); c.moveTo(-s*.14,0); c.lineTo(-s*.14,-s*k*.8); c.lineTo(0,-s*k); c.lineTo(s*.14,-s*k*.8); c.lineTo(s*.14,0); c.fill();
    c.fillStyle='rgba(255,255,255,.45)'; c.fillRect(-s*.1,-s*k*.78,s*.06,s*k*.7); c.restore(); } }
function cactus(c,x,y,s){ c.fillStyle='#3e9a4f'; c.lineCap='round'; c.strokeStyle='#3e9a4f'; c.lineWidth=s*.24;
  c.beginPath(); c.moveTo(x,y); c.lineTo(x,y-s); c.moveTo(x,y-s*.5); c.lineTo(x-s*.3,y-s*.5); c.lineTo(x-s*.3,y-s*.75); c.moveTo(x,y-s*.38); c.lineTo(x+s*.3,y-s*.38); c.lineTo(x+s*.3,y-s*.68); c.stroke();
  c.fillStyle='#ff7aa8'; blob(c,x,y-s-s*.1,s*.08); }
function mushroom(c,x,y,s,col='#e5483c',glow=false){ if(glow){ c.fillStyle='rgba(140,255,220,.2)'; blob(c,x,y-s*.5,s); }
  c.fillStyle='#f4ead6'; c.fillRect(x-s*.12,y-s*.45,s*.24,s*.45); c.fillStyle=col; c.beginPath(); c.ellipse(x,y-s*.45,s*.42,s*.3,0,Math.PI,0); c.fill();
  c.fillStyle='rgba(255,255,255,.85)'; blob(c,x-s*.15,y-s*.6,s*.07); blob(c,x+s*.12,y-s*.55,s*.06); }
function bezierPts(p0,p1,p2,p3,n){ const out=[]; for(let i=0;i<=n;i++){ const t=i/n, u=1-t; out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return out; }
function track(c,pts){ c.lineCap='butt'; for(let i=0;i<pts.length-1;i++){ const [x0,y0]=pts[i],[x1,y1]=pts[i+1], a=Math.atan2(y1-y0,x1-x0)+Math.PI/2;
    c.strokeStyle='#6b4a2b'; c.lineWidth=9; c.beginPath(); c.moveTo(x0-Math.cos(a)*30,y0-Math.sin(a)*30); c.lineTo(x0+Math.cos(a)*30,y0+Math.sin(a)*30); c.stroke(); }
  for(const off of [-20,20]){ c.strokeStyle='#8c96a3'; c.lineWidth=6; c.beginPath();
    pts.forEach(([x,y],i)=>{ const q=pts[Math.min(i+1,pts.length-1)], p=pts[Math.max(i-1,0)], a=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2; const X=x+Math.cos(a)*off, Y=y+Math.sin(a)*off; i?c.lineTo(X,Y):c.moveTo(X,Y); }); c.stroke(); } }
function scatter(n,fn,y0=0,y1=H,x0=0,x1=W){ for(let i=0;i<n;i++) fn(R(x0,x1),R(y0,y1),i); }
function sun(c,x,y,r,col='#fff3a0'){ c.fillStyle='rgba(255,240,150,.35)'; blob(c,x,y,r*1.6); c.fillStyle=col; blob(c,x,y,r); }

const themeOf=s=>THEMES[(s-1)%THEMES.length];
const loopOf=s=>Math.floor((s-1)/THEMES.length)+1;

/* ======================================================================
   난이도: 스테이지마다 조금씩 어려워짐 (설정에서 전체 난이도 조절)
   ====================================================================== */
const DIFFS=[['아주 쉬움','포켓몬이 크고 적어요'],['쉬움','조금 천천히 어려워져요'],['보통','기본 난이도'],['어려움','처음부터 북적북적!']];
function params(s){
  const t=(s-1)/(STAGES-1), d=S.set.diff;
  const e=[t*.5, t*.75, t, Math.min(1.25,.18+t*1.07)][d];
  const P={
    e,
    targets:Math.min(d===0?4:7, 3+Math.floor(e*3.6)),
    crowd:Math.round(18+Math.pow(Math.min(e,1.25),1.15)*205),
    size:Math.round(Math.max(52,150-Math.min(e,1)*88-Math.max(0,e-1)*40)),
    similar:Math.min(.75,e*.7),
    occl:Math.max(0,(e-.45))*.5,
    balls:1+Math.floor(Math.min(e,1)*2.4),
  };
  return P;
}

/* ======================================================================
   스테이지 만들기
   ====================================================================== */
const MS=24; // 눌렀는지 알아보는 모양 격자 크기
const ART_CACHE=new Map();
async function getArt(id){
  if(ART_CACHE.has(id)) return ART_CACHE.get(id);
  const bm=await createImageBitmap(PICS.get(id).b);
  const m=document.createElement('canvas'); m.width=m.height=MS; const x=m.getContext('2d',{willReadFrequently:true});
  x.drawImage(bm,0,0,MS,MS); const d=x.getImageData(0,0,MS,MS).data, mask=new Uint8Array(MS*MS);
  for(let i=0;i<MS*MS;i++) mask[i]=d[i*4+3]>70?1:0;
  const o={id,bm,mask,ar:bm.width/bm.height}; ART_CACHE.set(id,o); return o;
}
function trimCache(keep){ if(ART_CACHE.size<320) return; for(const [id,o] of ART_CACHE) if(!keep.has(id)){ o.bm.close&&o.bm.close(); ART_CACHE.delete(id); } }
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const cdist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;

function opaqueAt(it,wx,wy){
  const u=(wx-it.x+it.w/2)/it.w, v=(wy-it.y+it.h/2)/it.h;
  if(u<0||v<0||u>=1||v>=1) return false;
  if(it.ball) return (u-.5)**2+(v-.5)**2<.25;
  const uu=it.flip?1-u:u; return it.art.mask[(v*MS|0)*MS+(uu*MS|0)]===1;
}
const overlap=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;
function coverage(t,list){
  let tot=0,cov=0;
  for(let j=0;j<MS;j+=2) for(let i=0;i<MS;i+=2){ const wx=t.x-t.w/2+(i+.5)/MS*t.w, wy=t.y-t.h/2+(j+.5)/MS*t.h;
    if(!opaqueAt(t,wx,wy)) continue; tot++; if(list.some(o=>opaqueAt(o,wx,wy))) cov++; }
  return tot?cov/tot:0;
}

async function buildStage(s){
  const P=params(s), pool=shuffle([...PICS.keys()]);
  const targets=pool.slice(0,P.targets), rest=pool.slice(P.targets);
  // 헷갈리기: 찾을 포켓몬과 색이 비슷한 포켓몬을 무리에 섞음
  // 같은 포켓몬이 여러 번 나오지 않게: 무리 수만큼 서로 다른 포켓몬을 고름 (받은 그림이 모자랄 때만 겹침)
  const want=Math.min(rest.length,P.crowd);
  const nSim=Math.min(Math.round(want*P.similar),targets.length*4), species=new Set();
  if(nSim){ const cand=rest.slice(0,Math.min(rest.length,260));
    for(let i=0;i<nSim;i++){ const tc=PICS.get(targets[i%targets.length]).c; let best=null,bd=1e9;
      for(const id of cand){ if(species.has(id)) continue; const d=cdist(tc,PICS.get(id).c); if(d<bd){ bd=d; best=id; } }
      if(best!=null) species.add(best); } }
  for(const id of rest){ if(species.size>=want) break; species.add(id); }
  const spec=[...species];
  const need=new Set([...targets,...spec]); trimCache(need);
  const arts=new Map(); await Promise.all([...need].map(async id=>arts.set(id,await getArt(id))));

  const items=[], pts=[];
  const persp=y=>.82+.3*y/H;
  const spot=(k,m)=>{ let best,bd=-1; for(let i=0;i<k;i++){ const p=[R(m,W-m),R(m+20,H-m)]; let d=1e12; for(const q of pts){ const dd=(p[0]-q[0])**2+(p[1]-q[1])**2; if(dd<d) d=dd; } if(d>bd){ bd=d; best=p; } } pts.push(best); return best; };
  const mk=(art,x,y,sz,extra={})=>{ const w=art.ar>=1?sz:sz*art.ar, h=art.ar>=1?sz/art.ar:sz; return Object.assign({art,x,y,w,h,flip:Math.random()<.5,z:y+h/2+Math.random()*4},extra); };
  rnd=Math.random;
  targets.forEach(id=>{ const [x,y]=spot(24,P.size*.7); items.push(mk(arts.get(id),x,y,P.size*R(.88,1.05)*persp(y),{target:true,id})); });
  let queue=[];
  while(items.length<P.crowd+P.targets){ if(!queue.length) queue=shuffle(spec.slice()); const [x,y]=spot(3,P.size*.45); items.push(mk(arts.get(queue.pop()),x,y,P.size*R(.75,1.25)*persp(y))); }
  for(let i=0;i<P.balls;i++){ const [x,y]=spot(10,60), r=Math.max(24,P.size*.34); items.push({ball:true,x,y,w:r,h:r,z:y+r/2}); }
  items.sort((a,b)=>a.z-b.z);
  // 찾을 포켓몬과 몬스터볼이 너무 많이 가려지지 않게 앞으로 끌어냄
  for(const t of items.filter(o=>o.target||o.ball)){
    const allow=t.ball?Math.min(.25,P.occl):P.occl;
    let idx=items.indexOf(t); const later=items.slice(idx+1).filter(o=>overlap(o,t));
    let moved=0; while(later.length&&coverage(t,later)>allow){ later.shift(); moved++; }
    if(moved){ items.splice(idx,1); const after=items.indexOf(later.length?later[0]:null); items.splice(after<0?items.length:after,0,t); }
  }
  return {P,items,targets:items.filter(o=>o.target),balls:items.filter(o=>o.ball)};
}

const cv=$('#cv'), ctx=cv.getContext('2d');
let G=null, bgCanvas=null, raf=0;
const view={s:1,x:0,y:0};
let cw=0,ch=0,dpr=1;

function paintBackground(s){
  const sc=1.25, c=document.createElement('canvas'); c.width=W*sc; c.height=H*sc;
  const x=c.getContext('2d'); x.scale(sc,sc);
  rnd=mulberry(s*7919+13); themeOf(s).paint(x,Math.min(1,params(s).e)); rnd=Math.random;
  return c;
}
function fitScale(){ return Math.min(cw/W,ch/H); }
function minScale(){ return fitScale(); }
function maxScale(){ return Math.max(fitScale()*6,2.2); }
function clampView(){
  view.s=Math.max(minScale(),Math.min(maxScale(),view.s));
  const vw=cw/view.s, vh=ch/view.s;
  view.x=W<=vw?-(vw-W)/2:Math.max(0,Math.min(W-vw,view.x));
  view.y=H<=vh?-(vh-H)/2:Math.max(0,Math.min(H-vh,view.y));
}
function fitView(cover){ const f=fitScale(); view.s=cover?Math.max(f,Math.min(ch/H,cw/W*3)):f; view.x=(W-cw/view.s)/2; view.y=(H-ch/view.s)/2; clampView(); }
function resize(){
  const r=$('#stage').getBoundingClientRect(); if(!r.width) return;
  const old=cw?{cx:view.x+cw/2/view.s,cy:view.y+ch/2/view.s,k:view.s/fitScale()}:null;
  dpr=Math.min(2.5,window.devicePixelRatio||1); cw=r.width; ch=r.height; cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  if(old){ view.s=old.k*fitScale(); view.x=old.cx-cw/2/view.s; view.y=old.cy-ch/2/view.s; clampView(); }
  kick();
}
window.addEventListener('resize',()=>{ if(!$('#play').hidden) resize(); });
const toWorld=(px,py)=>[view.x+px/view.s,view.y+py/view.s];

function drawBall(c,x,y,r){
  c.fillStyle='#e8333a'; c.beginPath(); c.arc(x,y,r,Math.PI,0); c.fill();
  c.fillStyle='#fafafa'; c.beginPath(); c.arc(x,y,r,0,Math.PI); c.fill();
  c.strokeStyle='#222'; c.lineWidth=r*.16; c.beginPath(); c.arc(x,y,r*.92,0,Math.PI*2); c.moveTo(x-r,y); c.lineTo(x+r,y); c.stroke();
  c.fillStyle='#fafafa'; blob(c,x,y,r*.3); c.lineWidth=r*.1; c.beginPath(); c.arc(x,y,r*.3,0,Math.PI*2); c.stroke();
  c.fillStyle='rgba(255,255,255,.6)'; ell(c,x-r*.4,y-r*.5,r*.18,r*.1);
}
function draw(now){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#222'; ctx.fillRect(0,0,cv.width,cv.height);
  if(!G) return;
  // 그림 바깥 빈 곳은 배경을 크게 늘려 흐리게 채움
  const cs=Math.max(cv.width/W,cv.height/H); ctx.globalAlpha=.45; ctx.drawImage(bgCanvas,(cv.width-W*cs)/2,(cv.height-H*cs)/2,W*cs,H*cs); ctx.globalAlpha=1;
  const k=view.s*dpr; ctx.setTransform(k,0,0,k,-view.x*k,-view.y*k);
  ctx.drawImage(bgCanvas,0,0,W,H);
  const vx0=view.x-200, vx1=view.x+cw/view.s+200, vy0=view.y-200, vy1=view.y+ch/view.s+200;
  for(const it of G.items){
    if(it.x<vx0||it.x>vx1||it.y<vy0||it.y>vy1) continue;
    if(it.ball){ if(!it.found) drawBall(ctx,it.x,it.y,it.w/2); continue; }
    ctx.fillStyle='rgba(0,0,0,.16)'; ell(ctx,it.x,it.y+it.h/2-it.h*.04,it.w*.36,Math.max(3,it.w*.07));
    if(it.flip){ ctx.save(); ctx.translate(it.x,it.y); ctx.scale(-1,1); ctx.drawImage(it.art.bm,-it.w/2,-it.h/2,it.w,it.h); ctx.restore(); }
    else ctx.drawImage(it.art.bm,it.x-it.w/2,it.y-it.h/2,it.w,it.h);
  }
  const lw=Math.max(3,4/view.s);
  for(const t of G.targets) if(t.found){ const r=Math.max(t.w,t.h)*.62, p=Math.min(1,(now-t.foundAt)/350), rr=r*(1.6-.6*p);
    ctx.lineWidth=lw*2.2; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(t.x,t.y,rr,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=lw*1.3; ctx.strokeStyle='#ff3b30'; ctx.stroke(); }
  if(G.hint){ const h=G.hint, a=(now-h.t0)/1000; if(a>3.5) G.hint=null; else {
      const pr=h.r*(1+.08*Math.sin(a*8)); ctx.fillStyle=`rgba(255,230,80,${.22*(1-a/3.5)+.05})`; blob(ctx,h.x,h.y,pr);
      ctx.lineWidth=lw*1.5; ctx.setLineDash([lw*4,lw*3]); ctx.strokeStyle=`rgba(255,200,0,${1-a/3.5})`; ctx.beginPath(); ctx.arc(h.x,h.y,pr,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); } }
  G.fx=G.fx.filter(f=>now-f.t0<f.life);
  for(const f of G.fx){ const a=(now-f.t0)/f.life;
    if(f.kind==='x'){ const s=22/view.s; ctx.globalAlpha=1-a; ctx.strokeStyle='#ff3b30'; ctx.lineWidth=7/view.s; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(f.x-s,f.y-s); ctx.lineTo(f.x+s,f.y+s); ctx.moveTo(f.x+s,f.y-s); ctx.lineTo(f.x-s,f.y+s); ctx.stroke(); ctx.globalAlpha=1; }
    else { ctx.globalAlpha=1-a; ctx.fillStyle=f.col; const d=f.sp*a; star(ctx,f.x+Math.cos(f.ang)*d,f.y+Math.sin(f.ang)*d-a*a*20,f.r*(1-a*.5)); ctx.globalAlpha=1; } }
}
function star(c,x,y,r){ c.beginPath(); for(let i=0;i<10;i++){ const a=i/10*Math.PI*2-Math.PI/2, rr=i%2?r*.45:r; c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } c.fill(); }
function loop(now){ draw(now); const anim=G&&(G.fx.length||G.hint||G.targets.some(t=>t.found&&now-t.foundAt<400)); raf=anim?requestAnimationFrame(loop):0; }
function kick(){ if(!raf) raf=requestAnimationFrame(loop); }
function burst(x,y,n=14){ const now=performance.now(); const cols=['#ffd43b','#ff6b8b','#ffffff','#5fd16a','#4aa8ff'];
  for(let i=0;i<n;i++) G.fx.push({kind:'s',x,y,ang:Math.random()*Math.PI*2,sp:R(40,110),r:R(6,12),col:cols[i%cols.length],t0:now,life:700}); }

/* ---------- 손가락 조작: 한 손가락 끌기 = 이동, 두 손가락 = 확대, 톡 = 찾기 ---------- */
const ptrs=new Map(); let gest=null;
const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); const p=pos(e); ptrs.set(e.pointerId,p);
  if(ptrs.size===1) gest={type:'pan',sx:p.x,sy:p.y,vx:view.x,vy:view.y,moved:false};
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()], m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:view.s,anchor:toWorld(m.x,m.y)}; } });
cv.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)||!gest) return; const p=pos(e); ptrs.set(e.pointerId,p);
  if(gest.type==='pan'){ const dx=p.x-gest.sx, dy=p.y-gest.sy; if(Math.hypot(dx,dy)>9) gest.moved=true;
    if(gest.moved){ view.x=gest.vx-dx/view.s; view.y=gest.vy-dy/view.s; clampView(); kick(); } }
  else if(gest.type==='pinch'&&ptrs.size>=2){ const [a,b]=[...ptrs.values()], m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    view.s=gest.s0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0; view.s=Math.max(minScale(),Math.min(maxScale(),view.s));
    view.x=gest.anchor[0]-m.x/view.s; view.y=gest.anchor[1]-m.y/view.s; clampView(); kick(); } });
const up=e=>{ if(!ptrs.has(e.pointerId)) return; const p=pos(e); ptrs.delete(e.pointerId);
  if(gest&&gest.type==='pan'&&!gest.moved&&e.type==='pointerup') tap(p.x,p.y);
  if(ptrs.size===0) gest=null; else if(gest&&gest.type==='pinch') gest={type:'none'}; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const p=pos(e), a=toWorld(p.x,p.y);
  view.s*=Math.pow(1.0015,-e.deltaY); view.s=Math.max(minScale(),Math.min(maxScale(),view.s)); view.x=a[0]-p.x/view.s; view.y=a[1]-p.y/view.s; clampView(); kick(); },{passive:false});
function zoomBy(f){ const cx=cw/2, cy=ch/2, a=toWorld(cx,cy); view.s*=f; clampView(); view.x=a[0]-cx/view.s; view.y=a[1]-cy/view.s; clampView(); kick(); }
$('#zIn').onclick=()=>zoomBy(1.5); $('#zOut').onclick=()=>zoomBy(1/1.5); $('#zFit').onclick=()=>{ fitView(false); kick(); };

function tap(px,py){
  if(!G||G.done||!G.running) return;
  const [wx,wy]=toWorld(px,py);
  let hit=null; for(let i=G.items.length-1;i>=0;i--){ const it=G.items[i]; if(it.found&&it.ball) continue; if(opaqueAt(it,wx,wy)){ hit=it; break; } }
  if(hit&&hit.ball){ return foundBall(hit); }
  let t=hit&&hit.target&&!hit.found?hit:null;
  if(!t){ // 손가락이 살짝 빗나가도 봐줌
    const tol=Math.min(16/view.s,G.P.size*.3);
    t=G.targets.find(o=>!o.found&&opaqueAt(o,wx,wy))
      ||G.targets.find(o=>!o.found&&Math.abs(wx-o.x)<o.w/2+tol&&Math.abs(wy-o.y)<o.h/2+tol&&(!hit||!hit.target)&&Math.hypot(wx-o.x,wy-o.y)<Math.max(o.w,o.h)*.5+tol);
  }
  if(t) return foundTarget(t);
  if(hit&&hit.target&&hit.found) return;
  G.misses++; G.fx.push({kind:'x',x:wx,y:wy,t0:performance.now(),life:600}); sfx.miss(); try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} kick();
}
function foundTarget(t){
  t.found=true; t.foundAt=performance.now(); G.found++; burst(t.x,t.y); sfx.found(); kick();
  const card=document.querySelector(`.tc[data-id="${t.id}"]`); if(card){ card.classList.add('ok'); card.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); }
  hud();
  if(G.found>=G.targets.length){ say(`${nameOf(t.id)}! 모두 찾았다!`); finish(); }
  else say(`${nameOf(t.id)} 찾았다!`);
}
function foundBall(b){ b.found=true; G.ballsFound++; burst(b.x,b.y,18); sfx.ball(); hud(); toast(`몬스터볼 ${G.ballsFound}/${G.balls.length} 발견!`,1000); kick(); }
function hint(){
  if(!G||G.done||!G.running||G.hintsLeft<=0) return;
  const left=G.targets.filter(t=>!t.found); if(!left.length) return;
  const t=left[Math.floor(Math.random()*left.length)], r=Math.max(t.w,t.h)*2.3, a=Math.random()*Math.PI*2, d=Math.random()*r*.5;
  G.hint={x:t.x+Math.cos(a)*d,y:t.y+Math.sin(a)*d,r,t0:performance.now()}; G.hintsLeft--; G.hintsUsed++; sfx.hint(); say(`${nameOf(t.id)}${jong(nameOf(t.id))?'은':'는'} 반짝이는 동그라미 안에 있어요`);
  const vw=cw/view.s, vh=ch/view.s; if(G.hint.x<view.x||G.hint.x>view.x+vw||G.hint.y<view.y||G.hint.y>view.y+vh){ view.x=G.hint.x-vw/2; view.y=G.hint.y-vh/2; clampView(); }
  hud(); kick();
}
const jong=w=>{ const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3?(c-0xAC00)%28:0; };
$('#btnHint').onclick=hint;

let tick=0;
function hud(){
  if(!G) return;
  $('#count').textContent=`🔍 ${G.found}/${G.targets.length}`;
  $('#hintN').textContent=G.hintsLeft; $('#btnHint').disabled=G.hintsLeft<=0;
  const ball=document.querySelector('.tc.ball span'); if(ball) ball.textContent=`${G.ballsFound} / ${G.balls.length}`;
  const bc=document.querySelector('.tc.ball'); if(bc) bc.classList.toggle('ok',G.ballsFound>=G.balls.length);
}
const fmt=sec=>`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
function timerTick(){ if(!G||!G.running) return; const sec=(G.acc+(performance.now()-G.t0))/1000; $('#timer').textContent='⏱ '+fmt(sec); }
document.addEventListener('visibilitychange',()=>{ if(!G||!G.running) return; if(document.hidden){ G.acc+=performance.now()-G.t0; G.paused=true; } else if(G.paused){ G.t0=performance.now(); G.paused=false; } });

async function startStage(s){
  show('play'); $('#ttl').innerHTML=`${s}단계<small>${themeOf(s).ko}</small>`; $('#tray').innerHTML=''; $('#count').textContent='🔍 …';
  G=null; draw(0);
  sheet(`<h2>그림 준비 중…</h2><p>포켓몬들이 모이고 있어요 🔍</p>`,true);
  await new Promise(r=>setTimeout(r,30));
  let st; try{ st=await buildStage(s); }catch(e){ console.error(e); closeSheet(); toast('그림을 불러오지 못했어요'); show('map'); return; }
  bgCanvas=paintBackground(s);
  G=Object.assign(st,{s,found:0,misses:0,hintsLeft:S.set.diff===0?5:S.set.hints,hintsUsed:0,ballsFound:0,fx:[],hint:null,done:false,running:false,acc:0,t0:0});
  $('#tray').innerHTML=G.targets.map(t=>`<button class="tc" data-id="${t.id}"><img src="${picUrl(t.id)}" alt=""><span>${nameOf(t.id)}</span></button>`).join('')
    +`<div class="tc ball"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="#fafafa"/><path d="M6 32a26 26 0 0 1 52 0z" fill="#e8333a"/><circle cx="32" cy="32" r="26" fill="none" stroke="#222" stroke-width="4"/><path d="M6 32h52" stroke="#222" stroke-width="4"/><circle cx="32" cy="32" r="8" fill="#fafafa" stroke="#222" stroke-width="3"/></svg><span></span></div>`;
  document.querySelectorAll('.tc[data-id]').forEach(b=>b.onclick=()=>say(nameOf(+b.dataset.id)));
  hud(); resize(); fitView(true); kick();
  const th=themeOf(s), P=G.P;
  sheet(`<div class="intro"><h2>${s}. ${th.ko}</h2>
    <div class="story">${th.story}</div>
    <h3>이 포켓몬을 찾아보세요</h3>
    <div class="findrow">${G.targets.map(t=>`<div><img src="${picUrl(t.id)}" alt="">${nameOf(t.id)}</div>`).join('')}</div>
    <p style="font-size:16px;opacity:.75">몬스터볼 ${G.balls.length}개도 숨어 있어요! · 포켓몬 ${G.items.length-G.balls.length}마리</p>
    <button class="big-btn" id="go" style="margin-top:10px;min-width:220px">찾기 시작! 🔍</button></div>`);
  say(`${th.ko}. ${G.targets.map(t=>nameOf(t.id)).join(', ')}${jong(nameOf(G.targets[G.targets.length-1].id))?'을':'를'} 찾아보세요!`);
  $('#go').onclick=()=>{ closeSheet(); G.running=true; G.t0=performance.now(); try{ speechSynthesis.cancel(); }catch(e){} };
}
function finish(){
  G.done=true; G.running=false; const ms=G.acc+(performance.now()-G.t0), sec=ms/1000;
  let stars=1; if(G.hintsUsed===0&&G.misses<=2) stars=3; else if(G.hintsUsed<=1&&G.misses<=6) stars=2;
  const s=G.s, prev=S.stars[s]||0, newBest=!S.best[s]||sec<S.best[s];
  S.stars[s]=Math.max(prev,stars); if(newBest) S.best[s]=Math.round(sec*10)/10; S.open=Math.max(S.open,Math.min(STAGES,s+1)); save();
  setTimeout(()=>{ sfx.clear(); confetti();
    const last=s>=STAGES;
    sheet(`<h2>${last?'🏆 모든 스테이지 완료!':'스테이지 클리어!'}</h2>
      <div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}" style="animation-delay:${i*.15}s">⭐</span>`).join('')}</div>
      <div class="stat"><span>⏱ ${fmt(sec)}${newBest&&prev?' (최고 기록!)':''}</span><span>❌ 틀린 곳 ${G.misses}</span><span>💡 힌트 ${G.hintsUsed}</span><span>몬스터볼 ${G.ballsFound}/${G.balls.length}</span></div>
      <p style="font-size:15px;opacity:.7">${stars<3?'힌트 없이, 틀린 곳 2번 이하로 찾으면 별 3개!':'완벽해요!'}</p>
      <div class="row" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">
        <button class="big-btn alt small" id="cAgain">🔄 다시</button><button class="big-btn alt small" id="cMap">🗺️ 목록</button>
        ${last?'':`<button class="big-btn" id="cNext">다음 스테이지 ▶</button>`}</div>`);
    $('#cAgain').onclick=()=>{ closeSheet(); startStage(s); };
    $('#cMap').onclick=()=>{ closeSheet(); openMap(); };
    if(!last) $('#cNext').onclick=()=>{ closeSheet(); startStage(s+1); };
  },900);
}
$('#btnQuit').onclick=()=>{ if(G){ G.running=false; } G=null; openMap(); };
setInterval(timerTick,250);

document.querySelectorAll('[data-home]').forEach(b=>b.onclick=goHome);

function goHome(){
  show('home'); const n=PICS.size, next=Math.min(STAGES,S.open);
  $('#homeMsg').innerHTML=n>=MIN_IMAGES?`포켓몬 그림 ${n}장 준비됨 · ⭐ ${Object.values(S.stars).reduce((a,b)=>a+b,0)} / ${STAGES*3}`
    :`먼저 포켓몬 그림을 받아야 해요.<br>인터넷이 될 때 한 번만 받으면 그다음부터는 인터넷 없이도 놀 수 있어요.`;

/* ---------- 그림 받기 ---------- */
function openDownload(){
  const have=r=>rangeIds(r).filter(id=>PICS.has(id)).length;
  const sel=new Set(REGIONS.filter(r=>have(r)<rangeIds(r).length&&(r.def||PICS.size>=MIN_IMAGES&&false)).map(r=>r.k));
  if(PICS.size>=MIN_IMAGES) sel.clear();
  const render=()=>{
    const need=REGIONS.filter(r=>sel.has(r.k)).reduce((a,r)=>a+rangeIds(r).length-have(r),0);
    sheet(`<h2>📥 포켓몬 그림 받기</h2>
      <p class="note" style="text-align:left">이 앱에는 포켓몬 그림이 들어 있지 않아요. 지역을 고르고 받기를 누르면 이 기기가 PokeAPI 공개 저장소(raw.githubusercontent.com)의 공식 일러스트를 받아
      작게 줄여서 <b>이 기기에만</b> 저장해요. 많이 받을수록 더 다양한 포켓몬이 나와요. (한 장에 약 20KB)</p>
      <div class="packs">${REGIONS.map(r=>{ const n=rangeIds(r).length, h=have(r);
        return `<label class="pk ${sel.has(r.k)?'on':''}"><input type="checkbox" data-r="${r.k}" ${sel.has(r.k)?'checked':''} ${h===n?'disabled':''}><span>${r.ko}<small>${h===n?'✅ 모두 받음':h?`${h} / ${n}장`:`${n}장`}</small></span></label>`; }).join('')}</div>
      <div class="prog" id="prog" hidden><i></i></div><p id="dmsg" style="font-size:16px;min-height:24px">${need?`새로 받을 그림: ${need}장`:'받을 지역을 골라 주세요'}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="big-btn alt small" id="dClose">닫기</button><button class="big-btn" id="dGo" ${need?'':'disabled'}>받기</button></div>
      ${PICS.size?`<p style="margin-top:14px"><button class="big-btn alt small" id="dDel">🗑️ 받은 그림 모두 지우기 (${PICS.size}장)</button></p>`:''}`);
    document.querySelectorAll('[data-r]').forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.r):sel.delete(c.dataset.r); render(); });
    $('#dClose').onclick=()=>{ if(dlBusy) return; closeSheet(); goHome(); };
    const del=$('#dDel'); if(del) del.onclick=async()=>{ if(dlBusy||!confirm('받은 포켓몬 그림을 모두 지울까요?')) return;
      for(const id of [...PICS.keys()]) await idb.del(id); PICS.clear(); URLS.forEach(u=>URL.revokeObjectURL(u)); URLS.clear(); ART_CACHE.clear(); render(); };
    $('#dGo').onclick=async()=>{ if(dlBusy) return; dlBusy=true; const ids=REGIONS.filter(r=>sel.has(r.k)).flatMap(rangeIds);
      $('#prog').hidden=false; $('#dGo').disabled=true; $('#dClose').disabled=true;
      const r=await download(ids,(d,t)=>{ $('#prog i').style.width=(d/t*100)+'%'; $('#dmsg').textContent=`받는 중… ${d} / ${t}`; });
      dlBusy=false; sel.clear(); render();
      $('#dmsg').textContent=r.fail?`${r.total-r.fail}장 받음 · ${r.fail}장은 받지 못했어요 (다시 누르면 이어서 받아요)`:`${r.total}장 모두 받았어요! 🎉`;
      if(PICS.size>=MIN_IMAGES) sfx.clear(); };
  };
  if(PICS.size<MIN_IMAGES) REGIONS.filter(r=>r.def).forEach(r=>sel.add(r.k));
  render();
}

    <p style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="big-btn alt small" id="sReset">기록 지우기</button><button class="big-btn small" id="sClose">닫기</button></p>`);
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k, raw=b.dataset.v, v=raw==='true'?true:raw==='false'?false:+raw;
    S.set[k]=v; save(); b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); if(k==='diff') $('#diffNote').textContent=DIFFS[v][1]+' · 스테이지가 올라갈수록 점점 어려워져요'; });
  $('#sReset').onclick=()=>{ if(!confirm('별과 기록을 모두 지울까요?')) return; S.stars={}; S.best={}; S.open=1; save(); toast('기록을 지웠어요'); };
  $('#sClose').onclick=()=>{ closeSheet(); goHome(); };
}

/* ---------- 시작 ---------- */
(async()=>{ await loadPics(); goHome(); if(PICS.size<MIN_IMAGES) openDownload(); })();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
