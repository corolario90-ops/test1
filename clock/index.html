<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 시계</title>
<meta name="theme-color" content="#cfe6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포켓몬 시계">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/clock-192.png">
<link rel="icon" href="icons/clock-192.png">
<style>
@font-face{font-family:"Jua";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/jua.woff2") format("woff2")}
:root{
  --bg1:#cfe6ff; --bg2:#fff1d6; --ink:#25303a; --card:#ffffff; --soft:#eef3fa; --line:rgba(0,0,0,.1);
  --accent:#ff6b4a; --good:#22c55e; --gold:#ffcf33; --shadow:0 6px 0 rgba(0,0,0,.14);
  --hour:#e11d48; --min:#2563eb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#16233a; --bg2:#2a2440; --ink:#eef2f8; --card:#2c3446; --soft:#242c3c; --line:rgba(255,255,255,.14); }
}
:root[data-theme="dark"]{ --bg1:#16233a; --bg2:#2a2440; --ink:#eef2f8; --card:#2c3446; --soft:#242c3c; --line:rgba(255,255,255,.14); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);background-image:linear-gradient(var(--bg1),var(--bg2));overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{font-weight:normal;margin:0}
#app{height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.big-btn{font-size:24px;padding:12px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;box-shadow:var(--shadow);min-height:60px}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.small{font-size:19px;padding:8px 16px;min-height:48px}
.big-btn:disabled{opacity:.45}
.big-btn.pulse,.pulse{animation:pulse 1s ease-in-out infinite}
.big-btn:active:not(:disabled),.icon-btn:active,.ch:active,.pcard:active,.lcard:active{transform:translateY(3px)}
.icon-btn{font-size:26px;width:56px;height:56px;border:none;border-radius:18px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;flex:none}
.icon-btn.holding::after{content:"";position:absolute;left:0;bottom:0;height:6px;background:var(--accent);animation:hold 1s linear forwards}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 16px 4px 10px;font-size:24px;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
.bar{display:flex;align-items:center;gap:10px}
.sp{flex:1}
@keyframes hold{from{width:0}to{width:100%}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes jump{30%{transform:translate(-50%,-30px)}60%{transform:translate(-50%,0)}80%{transform:translate(-50%,-10px)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(0) invert(1)}}

/* ---------- 포켓몬 그림 ---------- */
.pic{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.pic.sil{filter:brightness(0);opacity:.3}
.noimg{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c,#f59e0b);color:#fff;font-size:calc(var(--sz,80px)*.42);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.noimg.sil{background:#888;opacity:.3}

/* ---------- 처음 화면 ---------- */
.home{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.home h1{font-size:clamp(38px,7.5vw,68px);text-shadow:0 4px 0 rgba(0,0,0,.08)}
.partner{width:clamp(140px,26vmin,230px);aspect-ratio:1;--sz:clamp(140px,26vmin,230px);animation:bob 1.8s ease-in-out infinite}
.pname{font-size:26px}
.evocard{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:8px 16px;box-shadow:0 4px 0 rgba(0,0,0,.1);font-size:20px;text-align:left}
.evocard .mini{width:58px;height:58px}
.menu{display:grid;gap:12px;width:min(640px,100%);grid-template-columns:repeat(2,1fr)}
.menu .big-btn{font-size:26px;min-height:76px}
.menu .wide{grid-column:1/-1}
@media (max-width:520px){ .menu{grid-template-columns:1fr} }
.banner{background:#fff3c4;color:#5b4500;border-radius:18px;padding:12px 16px;max-width:560px;font-size:18px;line-height:1.5}
.mini{display:block;flex:none}

/* ---------- 짝꿍 고르기 · 도감 · 배우기 목록 ---------- */
.list{flex:1;overflow-y:auto}
.list h2{font-size:28px;margin:6px 0 12px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.chips button{border:3px solid transparent;background:var(--card);border-radius:999px;padding:6px 16px;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.chips button.on{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pcard{border:4px solid transparent;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px}
.pcard .im{width:90px;height:90px;--sz:90px}
.pcard small{font-size:14px;opacity:.65}
.pcard .evt{display:flex;align-items:center;gap:6px}
.pcard .evt .mini{width:34px;height:34px}
.pcard.on{border-color:var(--accent)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lcard{border:4px solid transparent;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;text-align:left}
.lcard .e{font-size:46px;line-height:1}
.lcard b{font-weight:normal;font-size:22px;display:block}
.lcard small{font-size:15px;opacity:.7}
.lcard .no{font-size:15px;opacity:.5}
.lcard.done{border-color:var(--good)}
.lcard.next{border-color:var(--gold);animation:pulse 1.4s ease-in-out infinite}

/* ---------- 놀이 화면 (시계 + 하늘) ---------- */
:root{--ck:clamp(230px,min(46vw,calc(100dvh - 190px)),620px)}
@media (max-aspect-ratio:1/1){ :root{--ck:clamp(220px,min(86vw,calc(100dvh - 450px)),560px)} }
.play{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.who{display:flex;align-items:center;gap:8px;font-size:22px;min-width:0}
.who .im{width:46px;height:46px;--sz:46px;flex:none}
.dots{display:flex;gap:2px;font-size:22px;flex:0 1 auto;min-width:0;overflow:hidden}
.dots span{opacity:.3;filter:grayscale(1)}
.dots span.d{opacity:1;filter:none}
.dots span.c{opacity:1;filter:none;display:inline-block;animation:bob 1.2s ease-in-out infinite}
.stage{flex:1;min-height:0;display:flex;gap:16px;align-items:center;justify-content:center}
@media (max-aspect-ratio:1/1){ .stage{flex-direction:column;gap:10px} .side{align-self:center} }
.clockbox{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.digi{font-size:clamp(28px,4.6vmin,44px);background:#1f2633;color:#fff;border-radius:14px;padding:0 16px;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.35}
.digi .h{color:#ff7b8f} .digi .m{color:#7cb8ff}
.side{flex:1;min-width:0;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;align-self:stretch;justify-content:center;min-height:0}
.sky{position:relative;border-radius:24px;height:clamp(120px,30vh,280px);flex:none;overflow:hidden;box-shadow:var(--shadow);transition:background 1s;background:linear-gradient(#5ab8ff,#d6f0ff)}
@media (max-aspect-ratio:1/1){ .sky{height:clamp(110px,17vh,200px)} }
.sky.night::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(2px 2px at 30% 45%,#fff,transparent),
  radial-gradient(2px 2px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 50% 25%,#fff,transparent),radial-gradient(2px 2px at 92% 70%,#fff,transparent)}
.sky .sun{position:absolute;font-size:clamp(30px,5vmin,46px);transition:left 1s,top 1s;transform:translateX(-50%)}
.sky .per{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.85);color:#25303a;border-radius:999px;padding:2px 12px;font-size:20px}
.sky .ground{position:absolute;left:0;right:0;bottom:0;height:18%;background:rgba(80,160,80,.55)}
.sky.night .ground{background:rgba(20,50,40,.7)}
.sky .pk{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);height:78%;aspect-ratio:1;--sz:100px}
.sky .pk.jump{animation:jump .9s ease-out}
.sky .act{position:absolute;right:6%;bottom:10%;font-size:clamp(40px,7vmin,64px);line-height:1}
.sky .act>span{display:inline-block;animation:pop .4s}
.prompt{background:var(--card);border-radius:22px;padding:12px 16px;font-size:clamp(20px,3.1vmin,28px);text-align:center;box-shadow:var(--shadow);line-height:1.45}
.prompt b{color:var(--accent);font-weight:normal}
.prompt .hr{color:var(--hour)} .prompt .mn{color:var(--min)}
.prompt .tw{font-size:clamp(30px,5vmin,46px)}
.ctrl{display:flex;flex-direction:column;gap:10px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices.c2{grid-template-columns:repeat(2,1fr)}
.ch{border:4px solid transparent;background:#fff6dc;color:#3a2d10;border-radius:22px;min-height:84px;box-shadow:var(--shadow);font-size:clamp(24px,3.6vmin,34px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.ch small{font-size:17px;opacity:.6}
.ch.dim{opacity:.25;filter:grayscale(1)}
.ch.glow{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 24px var(--gold);animation:pulse 1s ease-in-out infinite}
.ch.ok{background:#c9f5d6;border-color:var(--good)}
.ch.shake{animation:shake .45s}

/* ---------- 시계 ---------- */
.clock{display:block;width:var(--ck);height:var(--ck);touch-action:none;overflow:visible}
.clock .face{fill:#fff;stroke:var(--rim,#ff6b4a);stroke-width:8}
.clock .tk{stroke:#a3acb8;stroke-width:1.3}
.clock .tk.b{stroke:#4b5563;stroke-width:3}
.clock text{font-family:'Jua',system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.clock .num{font-size:23px;fill:#25303a}
.clock .dot{fill:#cbd5e1}
.clock .ml text{font-size:11px;fill:var(--min)}
.clock .ml circle{fill:#dbeafe}
.clock .half{fill:rgba(96,165,250,.28)}
.clock .hand,.clock .tag{transition:transform .18s ease-out}
.clock .inst{transition:none!important}
.clock.slow .hand,.clock.slow .tag{transition:transform .9s ease-in-out}
.clock .hh line{stroke:var(--hour);stroke-width:11;stroke-linecap:round}
.clock .mh line{stroke:var(--min);stroke-width:6.5;stroke-linecap:round}
.clock .hand.hl{animation:hglow .9s ease-in-out infinite}
@keyframes hglow{50%{filter:drop-shadow(0 0 4px #facc15) drop-shadow(0 0 6px #facc15)}}
.clock .ghost line{opacity:.28}
.clock .tag circle{fill:#fff;stroke-width:2.5}
.clock .tag text{font-size:12px}
.clock .th circle{stroke:var(--hour)} .clock .th text{fill:var(--hour)}
.clock .tm circle{stroke:var(--min)} .clock .tm text{fill:var(--min)}
.clock .gl{animation:gpulse 1s ease-in-out infinite}
.clock .gl.h{fill:#fde047} .clock .gl.m{fill:#93c5fd}
@keyframes gpulse{50%{opacity:.45}}
.clock .walker{transition:transform .35s ease-out}

/* ---------- 창 ---------- */
#modal{position:fixed;inset:0;background:rgba(15,25,30,.5);display:grid;place-items:center;z-index:50;padding:14px}
.sheet{background:var(--card);border-radius:28px;padding:18px;max-width:680px;width:100%;max-height:92dvh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.2);text-align:center;animation:pop .25s}
.sheet h2{font-size:30px;margin-bottom:10px}
.sheet p{font-size:20px;line-height:1.5;margin:8px 0}
.evo{width:clamp(160px,34vmin,260px);aspect-ratio:1;margin:8px auto;--sz:clamp(160px,34vmin,260px)}
.evo.flash{animation:flash .35s linear infinite}
.reward{font-size:80px;line-height:1.1}
.tl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.tl div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;background:var(--soft);border-radius:16px;padding:6px 8px}
.tl .mini{width:48px;height:48px}
.tl .e{font-size:26px}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.egrid .pcard .im{width:70px;height:70px;--sz:70px}
@media (max-width:520px){ .egrid{grid-template-columns:repeat(2,1fr)} }
.set{text-align:left}
.set h3{font-size:21px;margin:16px 0 6px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:12px;padding:10px 6px;font-size:19px}
.seg button.on{background:var(--accent);color:#fff}
.set .note{font-size:15px;opacity:.7;margin:4px 2px;line-height:1.5}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){ .diffs{grid-template-columns:1fr} }
.diffs button{border:3px solid transparent;background:var(--soft);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.diffs .e{font-size:34px;line-height:1.1} .diffs b{font-weight:normal;font-size:20px} .diffs small{font-size:14px;opacity:.7;text-align:center}
.diffs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--soft))}
.dlbar{height:14px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.dlbar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti{position:fixed;top:-60px;font-size:34px;animation:fall 1.8s linear forwards}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:22px;padding:12px 20px;border-radius:18px;z-index:70;max-width:90vw;text-align:center;animation:pop .2s}
@media (max-width:600px){ .pill{font-size:20px;min-height:46px} .icon-btn{width:48px;height:48px;font-size:22px} .who span{display:none} .bar:has(.dots) .who{display:none} .ch{min-height:70px} .dots{font-size:17px} }
.vrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.vrow span{width:58px;font-size:19px;flex:none}
.vrow select{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 8px;border-radius:12px;border:2px solid rgba(0,0,0,.15);background:#fff;color:#26263a}
.vrow .icon-btn{width:50px;height:50px;font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="fx"></div>

async function shrink(blob){ // 기기에 저장하기 전에 256px로 줄이기
  const u=URL.createObjectURL(blob);
  try{ const im=new Image(); im.src=u; await im.decode();
    const Z=256, c=document.createElement('canvas'); c.width=c.height=Z;
    const k=Math.min(Z/im.naturalWidth,Z/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
    c.getContext('2d').drawImage(im,(Z-w)/2,(Z-h)/2,w,h);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
  } finally{ URL.revokeObjectURL(u); }
}

    catch(e){ fail++; }
    progress(++done,total); } };
  await Promise.all([worker(),worker(),worker(),worker(),worker()]);
  return {total,fail};
}

function evoT(i=pIdx(),s=stageOf(i)){ const t=LINES[i].evo[Math.min(s,LINES[i].evo.length-1)]; return lvl()===0?t-mm(t):t; }
const canEvo=(i=pIdx())=>stageOf(i)<maxStage(i);
// 오늘 남은 진화 시간들 (지금 단계부터 끝까지)
function evoList(i=pIdx()){ const out=[]; for(let s=stageOf(i);s<maxStage(i);s++) out.push({k:isMega(i,s)?'mega':'evo',t:evoT(i,s)}); return out; }

function toast(t,ms=2200){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }
let onModalClose=null;
function modal(html,setup,{backdrop=true}={}){
  const m=$('#modal'); m.innerHTML=`<div class="sheet">${html}</div>`; m.hidden=false;
  m.onclick=e=>{ if(backdrop&&e.target===m) closeModal(); };
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal());
  if(setup) setup(m.querySelector('.sheet'));
}
function closeModal(){ $('#modal').hidden=true; $('#modal').innerHTML=''; const f=onModalClose; onModalClose=null; if(f) f(); }
function confetti(n=26){ for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='confetti'; d.textContent=pick(['⭐','✨','🌟','🎉','💖','🎈']);
  d.style.left=rnd(100)+'vw'; d.style.animationDelay=(Math.random()*.5)+'s'; $('#fx').appendChild(d); setTimeout(()=>d.remove(),2500); } }
function holdBtn(b,fn){ let t; const stop=()=>{ clearTimeout(t); b.classList.remove('holding'); };
  b.addEventListener('pointerdown',()=>{ b.classList.add('holding'); t=setTimeout(()=>{ stop(); fn(); },1000); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',()=>{ if($('#modal').hidden) toast('어른 설정은 꾹 눌러 주세요'); }); }

/* ======================================================================
   시계 (빨간 짧은 바늘 = 시 · 파란 긴 바늘 = 분)
   C.T는 계속 늘어나는 '분'이라서 바늘이 늘 앞으로 자연스럽게 돔
   ====================================================================== */
const polar=(deg,r)=>{ const a=deg*Math.PI/180; return {x:+(r*Math.sin(a)).toFixed(2),y:+(-r*Math.cos(a)).toFixed(2)}; };
function miniClock(T,rim='#ff6b4a'){
  let tk=''; for(let i=0;i<12;i++){ const a=polar(i*30,36), b=polar(i*30,42); tk+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#64748b" stroke-width="${i%3?2:4}"/>`; }
  return `<svg class="mini" viewBox="-50 -50 100 100" aria-hidden="true"><circle r="45" fill="#fff" stroke="${rim}" stroke-width="7"/>${tk}
    <line x1="0" y1="4" x2="0" y2="-36" stroke="#2563eb" stroke-width="5" stroke-linecap="round" transform="rotate(${mod(T,60)*6})"/>
    <line x1="0" y1="4" x2="0" y2="-23" stroke="#e11d48" stroke-width="8" stroke-linecap="round" transform="rotate(${mod(T,720)/2})"/>
    <circle r="5" fill="#25303a"/></svg>`;
}
let C=null;
function makeClock(host,o={}){
  let tk=''; for(let i=0;i<60;i++){ const b=i%5===0, a=polar(i*6,b?88:93), z=polar(i*6,98); tk+=`<line class="tk${b?' b':''}" x1="${a.x}" y1="${a.y}" x2="${z.x}" y2="${z.y}"/>`; }
  let nums=''; for(let n=1;n<=12;n++){ const p=polar(n*30,73); nums+=`<circle class="dot" id="cd${n}" cx="${p.x}" cy="${p.y}" r="4" visibility="hidden"/><text class="num" id="cn${n}" x="${p.x}" y="${p.y}">${n}</text>`; }
  let ml=''; for(let k=0;k<12;k++){ const p=polar(k*30,114); ml+=`<circle cx="${p.x}" cy="${p.y}" r="10.5"/><text x="${p.x}" y="${p.y}">${k*5}</text>`; }
  host.innerHTML=`<svg class="clock" viewBox="-125 -125 250 250" style="--rim:${o.rim||'#ff6b4a'}" role="img" aria-label="시계">
    <circle class="face" r="100"/>
    <path class="half" d="M0,-96 A96,96 0 0 1 0,96 Z" visibility="hidden"/>
    <g>${tk}</g><g class="glows"></g><g>${nums}</g>
    <g class="ml" visibility="hidden">${ml}</g>
    <g class="ghost" visibility="hidden"><g class="gm"><line x1="0" y1="0" x2="0" y2="-82" stroke="#2563eb" stroke-width="6.5" stroke-linecap="round"/></g>
      <g class="gh"><line x1="0" y1="0" x2="0" y2="-50" stroke="#e11d48" stroke-width="11" stroke-linecap="round"/></g></g>
    <g class="handsG"><g class="hand mh"><line x1="0" y1="12" x2="0" y2="-82"/></g>
    <g class="hand hh"><line x1="0" y1="10" x2="0" y2="-50"/></g>
    <g class="tag tm"><circle r="9.5"/><text>분</text></g><g class="tag th"><circle r="9.5"/><text>시</text></g></g>
    <circle r="9" fill="#e11d48"/><path d="M-9,0 A9,9 0 0 0 9,0 Z" fill="#fff"/><circle r="9" fill="none" stroke="#25303a" stroke-width="2"/><circle r="3" fill="#fff" stroke="#25303a" stroke-width="1.5"/>
    <g class="walkG"></g>
  </svg>`;
  const svg=host.firstElementChild, q=s=>svg.querySelector(s);
  const hh=q('.hh'), mh=q('.mh'), th=q('.th'), tm=q('.tm'), moving=[hh,mh,th,tm];
  const K={T:o.T||0, step:5, lock:null, interactive:false, onDrop:null, onNum:null, onChange:null, svg};
  K.render=()=>{
    const ha=K.T/2, ma=K.T*6, pt=polar(ha,28), pm=polar(ma,52);
    hh.style.transform=`rotate(${ha}deg)`; mh.style.transform=`rotate(${ma}deg)`;
    th.style.transform=`translate(${pt.x}px,${pt.y}px)`; tm.style.transform=`translate(${pm.x}px,${pm.y}px)`;
    th.style.display=tm.style.display=S.set.tags?'':'none';
    if(K.onChange) K.onChange(K.T);
  };
  K.setT=(t,anim=true)=>{
    if(!anim) moving.forEach(e=>e.classList.add('inst'));
    K.T=t; K.render();
    if(!anim){ svg.getBoundingClientRect(); requestAnimationFrame(()=>requestAnimationFrame(()=>moving.forEach(e=>e.classList.remove('inst')))); }
  };
  // 시간이 앞으로 흘러가는 모습 (긴 바늘이 돌면 짧은 바늘이 따라감)
  K.runTo=async(t,ms=40)=>{ const id=playId; let d=mod(t-K.T,1440); const st=d>=300?15:5;
    while(d>0){ const s=Math.min(st,d); K.T+=s; d-=s; K.render(); if(s===st) sfx.tick(); await sleep(ms); if(id!==playId) return; } };
  K.glow=list=>{ q('.glows').innerHTML=list.map(g=>{ const p=polar(g.n*30,73); return `<circle class="gl ${g.c}" cx="${p.x}" cy="${p.y}" r="16"/>`; }).join(''); };
  K.ghost=t=>{ const g=q('.ghost'); if(t==null){ g.setAttribute('visibility','hidden'); return; }
    q('.gh').setAttribute('transform',`rotate(${mod(t,720)/2})`); q('.gm').setAttribute('transform',`rotate(${mod(t,60)*6})`); g.setAttribute('visibility','visible'); };
  K.half=on=>q('.half').setAttribute('visibility',on?'visible':'hidden');
  K.mlabels=on=>q('.ml').setAttribute('visibility',on?'visible':'hidden');
  K.hands=on=>q('.handsG').setAttribute('visibility',on?'visible':'hidden');
  K.hl=w=>{ hh.classList.toggle('hl',w==='h'); mh.classList.toggle('hl',w==='m'); };
  K.nums=show=>{ for(let n=1;n<=12;n++){ const on=!show||show.has(n); q('#cn'+n).setAttribute('visibility',on?'visible':'hidden'); q('#cd'+n).setAttribute('visibility',on?'hidden':'visible'); } };
  K.walk=(n,id)=>{ const g=q('.walkG'); if(n==null){ g.innerHTML=''; return; }
    if(!g.firstChild){ const u=IMG.get('n'+id);
      g.innerHTML=`<g class="walker">${u?`<image href="${u}" x="-19" y="-19" width="38" height="38"/>`:`<circle r="15" fill="${COLOR[id]}"/><text fill="#fff" font-size="15">${NAME[id][0]}</text>`}</g>`; }
    const p=polar(n*30,104); g.firstChild.style.transform=`translate(${p.x}px,${p.y}px)`; };
  // 손가락으로 바늘 돌리기
  const toSvg=e=>{ const m=svg.getScreenCTM(); if(!m) return {x:0,y:0}; return new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); };
  const angOf=p=>mod(Math.atan2(p.x,-p.y)*180/Math.PI,360);
  const adiff=(a,b)=>{ const d=mod(a-b,360); return Math.min(d,360-d); };
  function apply(hand,a){ let d;
    if(hand==='h'){ const tgt=mod(Math.round(a/30-mm(K.T)/60),12), cur=mod(Math.floor(mod(K.T,720)/60),12); d=mod(tgt-cur,12); if(d>6) d-=12; d*=60; }
    else { const st=K.step, tgt=mod(Math.round(a/6/st)*st,60); d=mod(tgt-mm(K.T),60); if(d>30) d-=60; }
    if(d){ K.T+=d; K.render(); sfx.tick(); } }
  let drag=null;
  svg.addEventListener('pointerdown',e=>{
    const p=toSvg(e), r=Math.hypot(p.x,p.y), a=angOf(p);
    if(K.onNum){ if(r>40) K.onNum(mod(Math.round(a/30),12)||12); return; }
    if(!K.interactive||r>125) return;
    let hand;
    if(K.lock==='min') hand='h'; else if(K.lock==='hour') hand='m';
    else { const dh=adiff(a,mod(K.T/2,360)), dm=adiff(a,mod(K.T*6,360)); hand=(dh<28&&dm<28)?(r<60?'h':'m'):(dh<dm?'h':'m'); }
    drag={hand,start:K.T}; try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault(); apply(hand,a);
  });
  svg.addEventListener('pointermove',e=>{ if(drag) apply(drag.hand,angOf(toSvg(e))); });
  const end=()=>{ if(!drag) return; const d=drag; drag=null; if(K.onDrop) K.onDrop(d.start!==K.T); };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  K.render();
  return K;
}

    <div class="stage"><div class="clockbox"><div id="ck"></div><div class="digi" id="digi"></div></div>

let digiHidden=false;
function updDigi(T){ const el=$('#digi'); if(!el) return;
  el.hidden=!(S.set.digital||freeMode);
  el.innerHTML=digiHidden?'<span class="h">?</span>:<span class="m">??</span>':`<span class="h">${h12(T)}</span>:<span class="m">${String(mm(T)).padStart(2,'0')}</span>`; }
function hideDigi(on){ digiHidden=on; if(C) updDigi(C.T); }
function skyOf(T){ const h=mod(T,1440)/60;
  if(h<5||h>=20.5) return {bg:'linear-gradient(#0f1b4d,#3b3f8f)',c:'🌙',night:true};
  if(h<7) return {bg:'linear-gradient(#ff9a8b,#ffe0b5)',c:'🌅'};
  if(h<17) return {bg:'linear-gradient(#5ab8ff,#d6f0ff)',c:'☀️'};
  if(h<19) return {bg:'linear-gradient(#ff8a65,#ffd59e)',c:'🌇'};
  return {bg:'linear-gradient(#4b3f8f,#f39ab8)',c:'🌆'}; }
function sky(T){ const el=$('#sky'); if(!el) return; const s=skyOf(T), h=mod(T,1440)/60;
  el.style.background=s.bg; el.classList.toggle('night',!!s.night);
  const sun=$('#sun'); sun.textContent=s.c;
  const f=s.night?mod(h-20.5,24)/8.5:Math.min(1,Math.max(0,(h-5)/15.5));
  sun.style.left=(8+f*84)+'%'; sun.style.top=(6+(1-Math.sin(Math.PI*f))*30)+'%';
  $('#per').textContent=period(T); }
function setPrompt(html,say){ const p=$('#prompt'); if(p) p.innerHTML=html; if(say) sayList(say); }
function cheer(emoji){ const pk=$('#pk'); if(pk){ pk.classList.remove('jump'); void pk.offsetWidth; pk.classList.add('jump'); }
  const a=$('#act'); if(a&&emoji) a.innerHTML=`<span>${emoji}</span>`; }
const helpRow=(help=true)=>`<div class="row"><button class="icon-btn" data-q="hear" aria-label="다시 듣기">🔊</button>${help?'<button class="big-btn alt small" data-q="help">💡 도와줘요</button>':''}</div>`;
function tell(html,say,btn='알겠어요 ▶'){
  return new Promise(res=>{ const id=playId; setPrompt(html,say);
    $('#ctrl').innerHTML=`<div class="row"><button class="icon-btn" data-q="hear" aria-label="다시 듣기">🔊</button><button class="big-btn" data-q="next">${btn}</button></div>`;
    $('#ctrl [data-q="hear"]').onclick=()=>sayList(say);
    $('#ctrl [data-q="next"]').onclick=()=>{ if(id===playId){ sfx.pop(); res(); } }; });
}
function updStars(){ const s=$('#starN'); if(s) s.textContent=S.stars; }

/* ---------- 시계 맞추기: 맞을 때까지 기다림, 틀려도 잃는 것 없음 ---------- */
function askSet(target,o){
  return new Promise(res=>{
    const id=playId; let help=0, miss=0, fin=false;
    C.glow([]); C.ghost(null); C.hl(null); C.onNum=null;
    if(o.hourOnly&&mm(C.T)!==mm(target)) C.setT(C.T-mm(C.T)+mm(target),false);
    C.lock=o.hourOnly?'min':null; C.step=o.step||5; C.interactive=true;
    hideDigi(false); setPrompt(o.html,o.say);
    $('#ctrl').innerHTML=helpRow();
    const hb=$('#ctrl [data-q="help"]');
    $('#ctrl [data-q="hear"]').onclick=()=>sayList(o.say);
    const ok=()=>mod(C.T-target,720)===0;
    const finish=()=>{ if(fin) return; fin=true; C.interactive=false; C.onDrop=null; C.glow([]); C.ghost(null); C.hl(null); res(); };
    C.onDrop=moved=>{ if(id!==playId||fin) return; if(ok()) return finish(); if(moved&&++miss===3&&!help) hb.classList.add('pulse'); };
    hb.onclick=async()=>{ if(fin) return; hb.classList.remove('pulse'); help++; sfx.pop();
      const h=h12(target), m=mm(target);
      if(help===1){
        C.glow([{n:h,c:'h'},...(o.hourOnly?[]:[{n:m?m/5:12,c:'m'}])]);
        say(m===0?`짧은 빨간 바늘을 숫자 ${h}에 놓아 봐요.${o.hourOnly?'':' 긴 파란 바늘은 12에 두어요.'}`
          :m===30?`긴 파란 바늘은 6에 놓아요. 짧은 빨간 바늘은 ${h}하고 ${h%12+1} 사이에 와요.`
          :`긴 파란 바늘을 숫자 ${m/5}에 놓으면 ${M_KO[m]} 분이에요. 짧은 빨간 바늘은 ${h}를 조금 지나요.`);
        hb.textContent='💡 더 도와줘요';
      } else if(help===2){ C.ghost(target); say('흐린 바늘 모양을 따라 맞춰 봐요!'); hb.textContent='🤝 같이 하기'; }
      else { C.interactive=false; let d=mod(target-C.T,720); if(d>360) d-=720;
        C.svg.classList.add('slow'); C.setT(C.T+d); await sleep(1000); C.svg.classList.remove('slow'); if(id===playId) finish(); }
    };
  });
}
/* ---------- 몇 시일까: 보기 3개 중 고르기 ---------- */
function readChoices(T,L){ const m=mm(T), c=[T+60,T-60];
  if(m===30) c.push(T-30,T+30); else if(m===0){ if(h12(T)!==12) c.push(T-mod(T,720)); if(L>=1) c.push(T+30); } else c.push(T+5,T-5,T+10);
  const seen=new Set([mod(T,720)]), out=[];
  for(const x of shuffle(c)){ const k=mod(x,720); if(out.length<2&&!seen.has(k)){ seen.add(k); out.push(x); } }
  return shuffle([T,...out]); }
function askRead(T,o={}){
  return new Promise(res=>{
    const id=playId; let miss=0, help=0, fin=false;
    C.interactive=false; C.glow([]); C.ghost(null); hideDigi(true);
    const list=readChoices(T,o.lvl??lvl()), say0=o.say||[K('지금 몇 시일까요?')];
    setPrompt(o.html||'<b>지금 몇 시일까?</b>',say0);
    $('#ctrl').innerHTML=`<div class="choices">${list.map((t,i)=>`<button class="ch" data-i="${i}">${tText(t)}${S.set.digital?`<small>${dText(t)}</small>`:''}</button>`).join('')}</div>`+helpRow();
    const btns=[...$('#ctrl').querySelectorAll('.ch')], hb=$('#ctrl [data-q="help"]');
    const right=list.findIndex(t=>t===T);
    $('#ctrl [data-q="hear"]').onclick=()=>sayList(say0);
    const hint=()=>{ const m=mm(T);
      if(m===0){ C.hl('h'); say('짧은 빨간 바늘이 가리키는 숫자를 봐요! 긴 바늘이 12에 있으면 정각이에요.'); }
      else if(m===30){ C.hl('m'); say('긴 바늘이 6에 있으면 반이에요. 짧은 바늘이 막 지나온 숫자는 뭘까요?'); }
      else { C.hl('m'); C.mlabels(true); say('긴 파란 바늘이 가리키는 곳의 파란 숫자를 봐요!'); } };
    btns.forEach((b,i)=>b.onclick=()=>{ if(fin||b.classList.contains('dim')) return;
      if(i===right){ fin=true; b.classList.add('ok'); C.hl(null); if(!o.keepMl) C.mlabels(false); hideDigi(false); return res(); }
      sfx.no(); b.classList.add('shake','dim'); miss++; hint(); if(miss>=2&&!help) hb.classList.add('pulse'); });
    hb.onclick=()=>{ if(fin) return; help++; hb.classList.remove('pulse'); sfx.pop(); hint();
      if(help>=2||btns.filter(b=>!b.classList.contains('dim')).length<=2) btns[right].classList.add('glow');
      else { const w=btns.find((b,i)=>i!==right&&!b.classList.contains('dim')); if(w) w.classList.add('dim'); } };
  });
}
/* ---------- 그 밖의 보기 고르기 ---------- */
function askChoice(html,say,opts){
  return new Promise(res=>{ setPrompt(html,say);
    $('#ctrl').innerHTML=`<div class="choices${opts.length===2?' c2':''}">${opts.map((o,i)=>`<button class="ch" data-i="${i}">${o.h}</button>`).join('')}</div>`+helpRow(false);
    $('#ctrl [data-q="hear"]').onclick=()=>sayList(say);
    $('#ctrl').querySelectorAll('.ch').forEach((b,i)=>b.onclick=()=>{ if(b.classList.contains('dim')) return;
      if(opts[i].ok){ b.classList.add('ok'); res(); } else { sfx.no(); b.classList.add('shake','dim'); if(opts[i].no) say(opts[i].no); } }); });
}

async function startLesson(i){
  if(S.partner==null){ afterPick=()=>startLesson(i); renderPick(); return say('먼저 함께할 짝꿍을 골라요!'); }
  const L=LESSONS[i];
  renderPlay({screen:'lesson',title:L.name,back:'learn',T:12*60,skyLive:false});
  sky(12*60);
  const id=playId; await L.run(id); if(id!==playId) return;
  const first=!S.lessons[L.k]; S.lessons[L.k]=1; if(first) S.stars+=2; save(); updStars();
  sfx.win(); confetti(30);
  const nx=LESSONS[i+1];
  modal(`<div class="reward">🎓</div><h2>${L.name} 끝!</h2><div class="evo" style="width:150px;--sz:150px">${art(curId())}</div>

      <button class="big-btn alt" data-m="list">📚 목록</button></div>`,sh=>{
    sh.querySelector('[data-m="list"]').onclick=()=>{ closeModal(); renderLearn(); };

  },{backdrop:false});
  say(`${L.name}, 다 배웠어요! ${jo(curName(),'이','가')} 박수를 쳐요!`);
}

  {k:'walk',e:'🐾',t:17*60,a:'산책을 해요',d:'산책을 했어요'},
  {k:'dinner',e:'🍲',t:18*60,a:'저녁밥을 먹어요',d:'저녁밥을 먹었어요'},
  {k:'bath',e:'🛁',t:19*60,a:'목욕을 해요',d:'목욕을 했어요'},
  {k:'brush',e:'🪥',t:20*60,a:'이를 닦아요',d:'이를 닦았어요'},
  {k:'sleep',e:'🌙',t:21*60,a:'잠을 자요',d:'쿨쿨 잠들었어요'},
];
const EVO_EV={k:'evo',e:'✨',a:'진화해요',d:'진화했어요'}, MEGA_EV={k:'mega',e:'💎',a:'메가진화해요',d:'메가진화했어요'};
const evInfo=k=>k==='evo'?EVO_EV:k==='mega'?MEGA_EV:EVENTS.find(e=>e.k===k);
const isEvoEv=ev=>ev.k==='evo'||ev.k==='mega';
function newDay(){
  // 진화가 여러 번이면 다른 일과를 조금 줄여서 하루가 너무 길어지지 않게
  const L=lvl(), evos=evoList(), mid=shuffle(EVENTS.slice(1,-1)).slice(0,Math.max(2,5-evos.length));
  let ev=[EVENTS[0],...mid,EVENTS[EVENTS.length-1]].map(x=>({k:x.k,t:x.t}));
  ev.forEach(x=>{ if(L===1&&rnd(2)) x.t+=30; if(L===2) x.t+=5*rnd(12); });
  const hrs=new Set(evos.map(e=>Math.floor(e.t/60)));
  ev=ev.filter(x=>!hrs.has(Math.floor(x.t/60))).concat(evos);
  ev.sort((a,b)=>a.t-b.t);
  let n=0; ev.forEach(x=>x.mode=isEvoEv(x)?'set':(n++%2===0?'set':'read'));
  S.day={ev,i:0,T:6*60,lvl:L,partner:pIdx()}; save();
}
function drawDots(){ const d=$('#dots'); if(!d||!S.day) return;
  d.innerHTML=S.day.ev.map((x,j)=>`<span class="${j<S.day.i?'d':j===S.day.i?'c':''}">${evInfo(x.k).e}</span>`).join(''); }
async function startDay(){
  if(S.partner==null){ afterPick=startDay; renderPick(); return say('먼저 함께할 짝꿍을 골라요!'); }
  if(S.day&&(S.day.lvl!==lvl()||S.day.partner!==pIdx())) S.day=null;
  const isNew=!S.day; if(isNew) newDay();
  renderPlay({screen:'day',title:`${curName()}의 하루`,dots:true,T:S.day.T});
  const id=playId, nm=curName(), evos=S.day.ev.filter(isEvoEv);
  drawDots();
  const evH=evos.map(e=>`${evInfo(e.k).e} <b>${period(e.t)} ${tText(e.t)}</b>`).join(', '), evS=evos.map(e=>`${period(e.t)} ${tSay(e.t)}`).join(', ');
  const cnt=['','한','두','세'][evos.length]||evos.length;
  if(isNew) await tell(`${jo(nm,'이랑','랑')} 함께 하루를 보내요! ☀️${evos.length?`<br>오늘은 진화 시간이 <b>${evos.length}번</b>! ${evH}`:''}`,
    [K(`${jo(nm,'이랑','랑')} 함께 하루를 보내요!${evos.length?` 오늘은 진화 시간이 ${cnt} 번 있어요! ${evS}.`:''}`)],'출발! ▶');
  while(alive(id)&&S.day&&S.day.i<S.day.ev.length){ await runEvent(S.day.ev[S.day.i],id); }
  if(alive(id)&&S.day) dayEnd();
}
async function runEvent(ev,id){
  const E=evInfo(ev.k), nm=curName(), L=lvl();
  drawDots(); $('#act').innerHTML='';
  if(ev.mode==='set'){
    const W=ev.k==='mega'?'메가진화':'진화';
    const html=isEvoEv(ev)
      ?`${E.e} <b>${W} 시간</b>이에요!<br>시계를 <b class="tw">${tText(ev.t)}</b>에 맞추면 ${jo(nm,'이','가')} ${W}해요!`
      :`${E.e} ${jo(nm,'이','가')} <b>${period(ev.t)} ${tText(ev.t)}</b>에 ${E.a}.<br>시계를 <b class="tw">${tText(ev.t)}</b>에 맞춰 줄래?`;
    const sy=isEvoEv(ev)?[K(`${W} 시간이에요! 시계를 ${period(ev.t)} ${tSay(ev.t)}에 맞추면 ${jo(nm,'이','가')} ${W}해요!`)]
      :[K(`${jo(nm,'이','가')} ${period(ev.t)} ${tSay(ev.t)}에 ${E.a}. 시계를 ${tSay(ev.t)}에 맞춰 줄래?`)];
    if(isEvoEv(ev)) sfx.sparkle();
    await askSet(ev.t,{hourOnly:L===0,step:LVL[L].step,html,say:sy}); if(!alive(id)) return;
  } else {
    setPrompt(`${E.e} 시간이 흘러요…`,null); $('#ctrl').innerHTML='';
    await C.runTo(ev.t); if(!alive(id)) return;
    await askRead(ev.t,{html:`${E.e} ${jo(nm,'이','가')} ${E.a}!<br><b>지금 몇 시일까?</b>`,say:[K(`${jo(nm,'이','가')} ${E.a}! 지금 몇 시일까요?`)]}); if(!alive(id)) return;
  }
  C.setT(ev.t,false); S.day.T=ev.t; S.day.i++; S.stars++; save(); updStars(); drawDots();
  sfx.ok(); cheer(E.e); confetti(8);
  say(`${pick(PRAISE)} ${period(ev.t)} ${tSay(ev.t)}! ${jo(nm,'이','가')} ${E.d}!`);
  setPrompt(`${E.e} <b>${period(ev.t)} ${tText(ev.t)}</b><br>${jo(nm,'이','가')} ${E.d}!`,null);
  if(isEvoEv(ev)&&canEvo()){ await sleep(1400); if(!alive(id)) return; await evolve(); if(!alive(id)) return; }
  $('#ctrl').innerHTML=`<div class="row"><button class="big-btn pulse" data-q="next">${S.day.i<S.day.ev.length?'다음 ▶':'🌙 하루 끝'}</button></div>`;
  await new Promise(res=>{ $('#ctrl [data-q="next"]').onclick=()=>{ sfx.pop(); res(); }; });
}
function dayEnd(){
  const ev=S.day.ev, nm=curName(); S.day=null; S.days++; S.stars+=3; save(); sfx.win(); confetti(40);
  modal(`<h2>하루 끝! 🌙 잘 자, ${nm}</h2><div class="evo" style="width:140px;--sz:140px">${art(curId())}</div>
    <div class="tl">${ev.map(x=>`<div><span class="e">${evInfo(x.k).e}</span>${miniClock(x.t)}${tText(x.t)}</div>`).join('')}</div>

async function evolve(){
  const i=pIdx(), L=LINES[i], from=curId(), fromName=curName(), mega=isMega(i), W=mega?'메가진화':'진화';
  if(L.eevee) S.eevee=await chooseForm('이브이는 여러 모습으로 진화할 수 있어요!',EEVEE);
  if(mega&&L.mega.length>1){ S.mega=S.mega||{}; S.mega[i]=await chooseForm(`${jo(fromName,'은','는')} 두 가지 모습으로 메가진화할 수 있어요!`,L.mega); }
  S.stages[i]=stageOf(i)+1; const to=curId(), toName=curName(); markSeen(to); save();
  await new Promise(res=>{
    modal(`<div class="reward">${mega?'💎🌈':'⏰✨'}</div><h2 id="evh">${W} 시간! 어? ${fromName}의 모습이…!</h2><div class="evo" id="evo">${art(from)}</div>

      $('#evh').textContent=`축하해요! ${jo(fromName,'이','가')} ${ro(toName)} ${W}했어요!`; $('#evb').hidden=false;
      sfx.win(); confetti(mega?50:26); say(`축하해요! ${jo(fromName,'이','가')} ${ro(toName)} ${W}했어요!`); },3600);
  });
  $('#pk').innerHTML=art(to); const w=document.querySelector('.who .im'); if(w) w.innerHTML=art(to);
  const sp=document.querySelector('.who span'); if(sp) sp.textContent=`${toName}의 하루`;

  const now=new Date(), T=now.getHours()*60+Math.round(now.getMinutes()/5)*5;

  let ml=false;
  $('#ctrl [data-q="say"]').onclick=()=>{ sfx.pop(); say(`${period(C.T)} ${tSay(C.T)}`); };
  $('#ctrl [data-q="now"]').onclick=()=>{ const d=new Date(), t=d.getHours()*60+Math.round(d.getMinutes()/5)*5; C.svg.classList.add('slow');
    let x=mod(t-C.T,1440); if(x>720) x-=1440; C.setT(C.T+x); setTimeout(()=>C.svg.classList.remove('slow'),950); say(`지금은 ${period(t)} ${tSay(t)}예요`); };
  $('#ctrl [data-q="ml"]').onclick=e=>{ ml=!ml; C.mlabels(ml); e.currentTarget.classList.toggle('pulse',ml); sfx.pop(); };
  $('#ctrl [data-q="hr"]').onclick=async()=>{ sfx.pop(); const id=playId; for(let i=0;i<12;i++){ C.setT(C.T+5); await sleep(50); if(!alive(id)) return; } say(`${period(C.T)} ${tSay(C.T)}`); };
