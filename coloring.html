<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>알록달록 색칠놀이</title>
<meta name="theme-color" content="#ffd6ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="색칠놀이">
<link rel="manifest" href="coloring.webmanifest">
<link rel="apple-touch-icon" href="icons/color-192.png">
<link rel="icon" href="icons/color-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd6ea; --bg2:#fff4c9; --ink:#2b2b3a; --card:#ffffff; --soft:#f6f1ff; --accent:#ff6b4a;
  --poke:#ffcb2f; --pup:#3b82f6; --shadow:0 6px 0 rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#2a2147; --bg2:#3a2f5c; --ink:#f4f3ff; --card:#332b55; --soft:#2a2448; }
}
:root[data-theme="dark"]{ --bg1:#2a2147; --bg2:#3a2f5c; --ink:#f4f3ff; --card:#332b55; --soft:#2a2448; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);
  background-image:linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden;min-height:100dvh;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
input[type=text],input[type=number]{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.page{max-width:1000px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 40px}

.top{display:flex;align-items:center;gap:10px;padding:0 0 12px}
.icon-btn{font-size:26px;width:58px;height:58px;flex:none;border-radius:18px;border:none;background:var(--card);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.icon-btn:active,.big-btn:active,.card:active,.tab:active,.crayon:active,.tool:active{transform:translateY(3px)}
.icon-btn.holding::after{content:"";position:absolute;left:0;bottom:0;height:6px;background:var(--accent);animation:hold 1.2s linear forwards}
@keyframes hold{from{width:0}to{width:100%}}
.title{flex:1;font-size:clamp(20px,5vw,28px);text-align:center;margin:0;font-weight:normal}
.logo{flex:1;text-align:center;margin:0;font-weight:normal;font-size:clamp(30px,7vw,52px);line-height:1.1}
.logo span:nth-child(1){color:#ef4444}.logo span:nth-child(2){color:#f97316}.logo span:nth-child(3){color:#eab308}
.logo span:nth-child(4){color:#22c55e}.logo span:nth-child(5){color:#3b82f6}.logo span:nth-child(6){color:#8b5cf6}
.spacer{width:58px;flex:none}
h2{font-weight:normal;font-size:22px;margin:22px 0 10px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 12px}
.tab{border:5px solid transparent;border-radius:26px;padding:12px;font-size:clamp(22px,5vw,30px);cursor:pointer;box-shadow:var(--shadow);background:var(--card)}
.tab.poke.on{background:var(--poke);color:#3a2a00;border-color:#fff}
.tab.pup.on{background:var(--pup);color:#fff;border-color:#fff}
.collect{display:block;width:100%;border:none;border-radius:22px;padding:12px 16px;font-size:clamp(19px,4.5vw,24px);background:var(--card);box-shadow:var(--shadow);cursor:pointer;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{border:none;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:10px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.thumb{width:100%;aspect-ratio:1;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.nm{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.nm b{font-weight:normal;font-size:22px}
.nm small{font-size:15px;opacity:.7}
.badge{position:absolute;top:6px;right:6px;background:#fff3cf;color:#3a2a00;border-radius:12px;padding:3px 8px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.ing{position:absolute;top:6px;left:6px;background:#e0f2fe;color:#0c3b5a;border-radius:12px;padding:3px 8px;font-size:14px}
.card.locked .thumb img{opacity:.35}
.card.locked .thumb::after{content:"?";position:absolute;font-size:64px;color:#9aa3b5}
.card .thumb{position:relative}
.empty{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;text-align:center;font-size:21px;line-height:1.5}
.empty .em{font-size:60px}

.big-btn{border:none;background:#ffd54a;color:#3a2a00;border-radius:20px;padding:12px 20px;font-size:20px;box-shadow:var(--shadow);cursor:pointer;display:inline-block}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.go{background:#22c55e;color:#fff}
.big-btn.small{font-size:16px;padding:9px 14px;border-radius:14px}
.big-btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;opacity:.85}
.opt{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px;font-size:18px}
.opt label{display:flex;align-items:center;gap:10px;margin:6px 0;cursor:pointer}
.opt input[type=checkbox],.opt input[type=radio]{width:24px;height:24px;flex:none}
.opt input[type=text],.opt input[type=number],.opt select{font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid #cbd5e1;background:var(--soft);min-width:0}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;font-size:16px}
.picks label{margin:2px 0}
.picks .have{color:#16a34a}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mine div{background:var(--soft);border-radius:14px;padding:6px;text-align:center;font-size:15px}
.mine img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2340;color:#fff;border-radius:20px;
  padding:12px 20px;font-size:20px;z-index:50;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:90vw;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- 색칠 화면 ---------- */
.cs{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr;overflow:hidden;touch-action:none}
.cs header{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 4px}
.cs header .title b{font-weight:normal}
.cs header .title small{font-size:.7em;opacity:.7;margin-left:6px}
.done{border:none;border-radius:20px;background:#22c55e;color:#fff;font-size:22px;padding:0 18px;height:58px;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.board{position:relative;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0;min-width:0}
.paper{position:relative;background:#fff;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.15);touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.paper{isolation:isolate}.paper .paint{z-index:0}.paper .lines{z-index:1}.paper .fx{z-index:2} /* 선은 늘 색칠 위에 */
.paper .lines,.paper .fx{pointer-events:none}
.fx.blink{animation:blink .5s 4 alternate}
@keyframes blink{from{opacity:1}to{opacity:.1}}
.hint{position:absolute;top:10px;left:10px;width:clamp(110px,18vw,170px);background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px;z-index:2}
.hint img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.hint .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.hint .chips button{border:none;border-radius:10px;padding:3px 7px;font-size:14px;background:var(--c);color:var(--t);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px}

.tools{display:flex;flex-direction:column;gap:8px;padding:8px 10px max(10px,env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -4px 0 rgba(0,0,0,.06)}
.crayons{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.crayon{border:none;border-radius:12px 12px 16px 16px;background:var(--c);color:var(--t);min-height:54px;padding:12px 4px 4px;
  font-size:clamp(14px,2vw,19px);cursor:pointer;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.16),0 4px 0 rgba(0,0,0,.14);line-height:1.05}
.crayon::before{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:var(--c);border-top:0;filter:brightness(.9)}
.crayon[data-white]{outline:2px solid #d4d4d8;outline-offset:-2px}
.crayon.on{transform:translateY(-6px) scale(1.06);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--accent),0 8px 0 rgba(0,0,0,.15)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tool{border:3px solid transparent;border-radius:16px;background:var(--soft);min-height:50px;padding:4px 12px;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tool.on{border-color:var(--accent);background:#fff3cf;color:#3a2a00}
.tool i{display:inline-block;border-radius:50%;background:currentColor}
@media (orientation:landscape) and (min-width:700px){
  .cs{grid-template-columns:1fr 270px;grid-template-rows:auto 1fr}
  .cs header{grid-column:1/3}
  .tools{grid-row:2;grid-column:2;overflow-y:auto;box-shadow:-4px 0 0 rgba(0,0,0,.06);padding-top:16px}
  .crayons{grid-template-columns:1fr 1fr;row-gap:16px}
}

/* ---------- 상 받기 ---------- */
.ov{position:fixed;inset:0;background:rgba(10,20,50,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--card);border-radius:30px;padding:22px;max-width:620px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);max-height:94dvh;overflow:auto;position:relative}
.panel h3{font-weight:normal;font-size:clamp(34px,9vw,54px);margin:4px 0;color:#f97316}
.panel p{font-size:22px;margin:6px 0}
.stars{font-size:44px;letter-spacing:4px}
.stage{position:relative;height:300px;display:flex;align-items:center;justify-content:center}
.stage .art{max-height:280px;max-width:90%;border-radius:16px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .45s ease-in,opacity .45s ease-in,filter .45s}
.stage .art.in{transform:scale(0) translateY(80px);opacity:0;filter:brightness(3)}
.ball{position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.85),transparent 32%),var(--bc);
  border:6px solid rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);opacity:0}
.ball.throw{opacity:1;animation:throw .7s cubic-bezier(.3,.8,.4,1) forwards}
.ball.wobble{opacity:1;animation:wobble 1.6s ease-in-out}
.ball.got{opacity:1;animation:gotit .5s}
@keyframes throw{from{transform:translateY(55vh) scale(.4) rotate(-720deg)}to{transform:translateY(60px) scale(1) rotate(0)}}
@keyframes wobble{0%,100%{transform:translateY(60px) rotate(0)}10%,43%,76%{transform:translateY(60px) rotate(-22deg)}22%,55%,88%{transform:translateY(60px) rotate(22deg)}33%,66%{transform:translateY(60px) rotate(0)}}
@keyframes gotit{0%{transform:translateY(60px) scale(1)}50%{transform:translateY(60px) scale(1.25)}100%{transform:translateY(60px) scale(1)}}
.ball.wobble,.ball.got{transform:translateY(60px)}
.burst{position:absolute;font-size:36px;animation:burst 1s ease-out forwards;pointer-events:none}
@keyframes burst{from{transform:translate(0,40px) scale(.3);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.gems{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0}
.gem{display:flex;flex-direction:column;align-items:center;font-size:18px;cursor:pointer;background:none;border:none}
.gem.drop{animation:drop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{from{transform:translateY(-120px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.used{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.used button{border:none;border-radius:14px;padding:6px 12px;font-size:19px;background:var(--c);color:var(--t);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bonus{display:inline-block;background:#fdf2ff;color:#86198f;border-radius:16px;padding:6px 14px;font-size:20px;margin:6px 0}

.chest{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:10px}
.chest button{background:var(--card);border:none;border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;align-items:center;font-size:20px;cursor:pointer}
.chest b{font-weight:normal;font-size:26px}
.viewer img{max-width:100%;max-height:68dvh;border-radius:16px;background:#fff}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================================================================
   알록달록 색칠놀이
   - 앱에는 캐릭터 그림이 들어 있지 않아요. 어른 메뉴에서 기기가 직접 그림을 받아
     이 기기 안에서 색칠 도안(선 그림)으로 바꿔 저장해요.
   - 크레파스 이름은 영어로 보여 주고 읽어 줘요.
   - 다 칠하면 넉넉한 기준으로 별을 주고, 포켓몬은 잡고 퍼피구조대는 보석을 받아요.
   ====================================================================== */
const $=s=>document.querySelector(s);
const $app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mkCanvas=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const toBlob=(c,type='image/png',q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),type,q));

/* ---------- 설정 ---------- */
const OPT_KEY='coloring.opts';
const opts=Object.assign({sound:true,helper:true,easy:true,palm:true,tab:'poke'},(()=>{ try{ return JSON.parse(localStorage.getItem(OPT_KEY))||{}; }catch(e){ return {}; } })());
const saveOpts=()=>{ try{ localStorage.setItem(OPT_KEY,JSON.stringify(opts)); }catch(e){} };

/* ---------- 저장소 (그림이 커서 IndexedDB 사용) ---------- */
const db=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('coloring',1);
    r.onupgradeneeded=()=>{ const d=r.result;
      d.createObjectStore('pages',{keyPath:'id'}); d.createObjectStore('paint'); d.createObjectStore('kv');
      d.createObjectStore('gallery',{keyPath:'id',autoIncrement:true}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const tx=async(store,mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{
    const t=d.transaction(store,mode), r=fn(t.objectStore(store));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return {
    get:(s,k)=>tx(s,'readonly',o=>o.get(k)),
    put:(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),
    del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),
    all:s=>tx(s,'readonly',o=>o.getAll()),
    keys:s=>tx(s,'readonly',o=>o.getAllKeys()),
    clear:s=>tx(s,'readwrite',o=>o.clear()),
  };
})();
let pages=[], inProgress=new Set(), rw={caught:{},pups:{},gems:{}};
const saveRw=()=>db.put('kv',rw,'rw');
function sortPages(){ pages.sort((a,b)=>(a.dex||1e6)-(b.dex||1e6)||a.added-b.added); }
const urls=new Map(); // 도안 미리보기 주소 (도안 id → object URL)
function lineURL(pg){ const k=pg.id+'@'+pg.added; if(!urls.has(k)) urls.set(k,URL.createObjectURL(pg.line)); return urls.get(k); }
function dropURL(pg){ const k=pg.id+'@'+pg.added; if(urls.has(k)){ URL.revokeObjectURL(urls.get(k)); urls.delete(k); } }

/* ---------- 소리 ---------- */
const sfx=(()=>{
  let ac;
  const tone=(f,t0,d,type='sine',v=.16)=>{ if(!opts.sound) return; try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+t0;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); }catch(e){} };
  return { pop:()=>tone(660,0,.08,'triangle'), ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.2)),
    wob:()=>tone(240,0,.12,'square',.06), click:()=>tone(1400,0,.06,'square',.08),
    fan:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,'triangle')), gem:()=>tone(1568,0,.25,'sine',.12) };
})();
let enVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); enVoice=v.find(x=>/^en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(...parts){ // 영어로 읽어 줌
  if(!opts.sound||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel();
    parts.filter(Boolean).forEach(t=>{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(enVoice) u.voice=enVoice; u.rate=.8; u.pitch=1.15; speechSynthesis.speak(u); });
  }catch(e){}
}
function toast(t,ms=2600){ document.querySelectorAll('.toast').forEach(e=>e.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }

/* ---------- 크레파스 (영어 이름) ---------- */
const PALETTE=[['Red','#e53935'],['Orange','#fb8c00'],['Yellow','#fdd835'],['Light Green','#9ccc65'],['Green','#2e9e46'],
  ['Sky Blue','#4fc3f7'],['Blue','#1e5bd6'],['Purple','#8e44ad'],['Pink','#f48fb1'],['Peach','#ffcc9e'],
  ['Brown','#8d5524'],['Gray','#9e9e9e'],['Black','#262626'],['White','#ffffff']];
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const textOn=h=>{ const [r,g,b]=hexRGB(h); return (r*299+g*587+b*114)/1000>150?'#2b2b3a':'#ffffff'; };
const crayonStyle=i=>`--c:${PALETTE[i][1]};--t:${textOn(PALETTE[i][1])}`;

/* ---------- 보석 ---------- */
const GEMS={ruby:['Ruby','#e0115f'],topaz:['Topaz','#ffb300'],emerald:['Emerald','#10b981'],sapphire:['Sapphire','#2563eb'],amethyst:['Amethyst','#9b59d0'],diamond:['Diamond','#a5e9ff']};
const GEM_OF={'Red':'ruby','Pink':'ruby','Orange':'topaz','Yellow':'topaz','Peach':'topaz','Brown':'topaz','Light Green':'emerald','Green':'emerald',
  'Sky Blue':'sapphire','Blue':'sapphire','Purple':'amethyst','Gray':'diamond','Black':'diamond','White':'diamond'};
const gemSvg=(c,s=48)=>`<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><polygon points="16,6 48,6 60,24 32,60 4,24" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>`+
  `<polygon points="16,6 48,6 40,24 24,24" fill="#fff" opacity=".45"/><polygon points="4,24 24,24 32,60" fill="#000" opacity=".12"/><polygon points="60,24 40,24 32,60" fill="#fff" opacity=".2"/></svg>`;

/* ---------- 색 계산 ---------- */
const LIN=new Float32Array(256); for(let i=0;i<256;i++){ const c=i/255; LIN[i]=c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4); }
const fLab=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
function toLab(r,g,b,o){ const R=LIN[r],G=LIN[g],B=LIN[b];
  const x=fLab((R*.4124+G*.3576+B*.1805)/.95047), y=fLab(R*.2126+G*.7152+B*.0722), z=fLab((R*.0193+G*.1192+B*.9505)/1.08883);
  o[0]=116*y-16; o[1]=500*(x-y); o[2]=200*(y-z); return o; }
const PAL_LAB=PALETTE.map(([,h])=>toLab(...hexRGB(h),[0,0,0]));
function palRank(r,g,b){ const l=toLab(r,g,b,[0,0,0]);
  return PAL_LAB.map((p,i)=>[i,(p[0]-l[0])**2+(p[1]-l[1])**2+(p[2]-l[2])**2]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]); }

/* ======================================================================
   그림 → 색칠 도안 만들기 (기기 안에서만 처리)
   · 컬러 그림: 비슷한 색끼리 묶어 면을 나누고 면의 경계를 검은 선으로 그림
   · 이미 선으로 된 도안: 어두운 부분을 선으로 씀
   ====================================================================== */
function comps(lab,W,H){ // 같은 값끼리 이어진 덩어리 (값<0은 제외)
  const N=W*H, id=new Int32Array(N).fill(-1), area=[], st=new Int32Array(N); let n=0;
  for(let p=0;p<N;p++){
    if(lab[p]<0||id[p]>=0) continue;
    const v=lab[p]; let sp=0, a=0; st[sp++]=p; id[p]=n;
    while(sp){ const q=st[--sp], x=q%W; a++;
      if(x>0&&id[q-1]<0&&lab[q-1]===v){ id[q-1]=n; st[sp++]=q-1; }
      if(x<W-1&&id[q+1]<0&&lab[q+1]===v){ id[q+1]=n; st[sp++]=q+1; }
      if(q>=W&&id[q-W]<0&&lab[q-W]===v){ id[q-W]=n; st[sp++]=q-W; }
      if(q<N-W&&id[q+W]<0&&lab[q+W]===v){ id[q+W]=n; st[sp++]=q+W; } }
    area.push(a); n++;
  }
  return {id,n,area};
}
function dilate(src,dst,W,H,R){
  const off=[]; const r=Math.ceil(R); for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++) if(dx*dx+dy*dy<=R*R) off.push([dx,dy]);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(!src[y*W+x]) continue;
    for(const [dx,dy] of off){ const X=x+dx, Y=y+dy; if(X>=0&&Y>=0&&X<W&&Y<H) dst[Y*W+X]=1; } }
}
function otsu(hist){ let tot=0,sum=0; for(let i=0;i<256;i++){ tot+=hist[i]; sum+=i*hist[i]; }
  let sB=0,wB=0,best=0,th=128; for(let i=0;i<256;i++){ wB+=hist[i]; if(!wB) continue; const wF=tot-wB; if(!wF) break;
    sB+=i*hist[i]; const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)**2; if(v>best){ best=v; th=i; } } return th; }

async function makePage(blob,mode='auto',easy=opts.easy){
  const url=URL.createObjectURL(blob), im=new Image(); im.src=url;
  try{ await im.decode(); }catch(e){ URL.revokeObjectURL(url); throw new Error('그림을 열 수 없어요'); }
  const MAX=900, PAD=40, s=(MAX-2*PAD)/Math.max(im.naturalWidth,im.naturalHeight);
  const iw=Math.max(1,Math.round(im.naturalWidth*s)), ih=Math.max(1,Math.round(im.naturalHeight*s)), W=iw+2*PAD, H=ih+2*PAD, N=W*H;
  const cv=mkCanvas(W,H), cx=cv.getContext('2d',{willReadFrequently:true});
  cx.imageSmoothingQuality='high'; cx.drawImage(im,PAD,PAD,iw,ih); URL.revokeObjectURL(url);
  const img=cx.getImageData(0,0,W,H), d=img.data;
  const inner=(x,y)=>x>=PAD&&y>=PAD&&x<PAD+iw&&y<PAD+ih;

  // 어떤 그림인지 살펴보기
  let tr=0,colorful=0,white=0,mid=0,dark=0,cnt=0;
  for(let y=PAD;y<PAD+ih;y+=2) for(let x=PAD;x<PAD+iw;x+=2){
    const i=(y*W+x)*4, a=d[i+3]/255; cnt++; if(a<.12) tr++;
    const r=255+(d[i]-255)*a, g=255+(d[i+1]-255)*a, b=255+(d[i+2]-255)*a, mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=.299*r+.587*g+.114*b;
    if(mx-mn>60&&l>50) colorful++; if(l>200) white++; else if(l>90) mid++; else dark++;
  }
  const hasAlpha=tr>cnt*.03; // 배경이 투명한 그림은 컬러 그림으로 봄
  const lineMode=mode==='line'||(mode==='auto'&&!hasAlpha&&colorful<cnt*.04&&white>cnt*.5&&mid<cnt*.18&&dark<cnt*.25);
  const ink=new Uint8Array(N);
  let art=null;

  if(lineMode){
    const g=new Uint8Array(N), hist=new Uint32Array(256);
    for(let p=0;p<N;p++){ const i=p*4, a=d[i+3]/255; g[p]=Math.round(255+((.299*d[i]+.587*d[i+1]+.114*d[i+2])-255)*a); }
    for(let y=PAD;y<PAD+ih;y++) for(let x=PAD;x<PAD+iw;x++) hist[g[y*W+x]]++;
    const th=Math.min(190,Math.max(90,otsu(hist)));
    const raw=new Uint8Array(N); for(let p=0;p<N;p++) raw[p]=g[p]<th?1:0;
    dilate(raw,ink,W,H,1);
  }else{
    // 1) 그림과 배경 나누기
    const fig=new Uint8Array(N);
    if(hasAlpha){ for(let p=0;p<N;p++) fig[p]=d[p*4+3]>=128?1:0; }
    else{
      for(let y=PAD;y<PAD+ih;y++) fig.fill(1,y*W+PAD,y*W+PAD+iw);
      const ring=[]; for(let x=PAD;x<PAD+iw;x++){ ring.push(PAD*W+x,(PAD+ih-1)*W+x); } for(let y=PAD;y<PAD+ih;y++){ ring.push(y*W+PAD,y*W+PAD+iw-1); }
      const med=k=>{ const v=ring.map(p=>d[p*4+k]).sort((a,b)=>a-b); return v[v.length>>1]; }, bg=[med(0),med(1),med(2)];
      const near=p=>Math.abs(d[p*4]-bg[0])+Math.abs(d[p*4+1]-bg[1])+Math.abs(d[p*4+2]-bg[2])<60;
      if(ring.filter(near).length>ring.length*.6){ // 테두리가 한 가지 색이면 배경으로 보고 지움
        const st=[]; ring.forEach(p=>{ if(fig[p]&&near(p)){ fig[p]=0; st.push(p); } });
        while(st.length){ const q=st.pop(), x=q%W, y=(q/W)|0;
          for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){ if(!inner(nx,ny)) continue; const r=ny*W+nx; if(fig[r]&&near(r)){ fig[r]=0; st.push(r); } } }
      }
    }
    { // 떨어진 부스러기 지우기
      const fl=new Int32Array(N); for(let p=0;p<N;p++) fl[p]=fig[p]?0:-1;
      const C=comps(fl,W,H), big=Math.max(0,...C.area);
      for(let p=0;p<N;p++) if(fig[p]&&C.area[C.id[p]]<big*.03) fig[p]=0;
    }
    let figArea=0;
    for(let p=0;p<N;p++){ const i=p*4;
      if(!fig[p]){ d[i+3]=0; continue; } figArea++;
      const a=d[i+3]/255; d[i]=255+(d[i]-255)*a; d[i+1]=255+(d[i+1]-255)*a; d[i+2]=255+(d[i+2]-255)*a; d[i+3]=255; }
    if(figArea<N*.03) throw new Error('그림에서 캐릭터를 찾지 못했어요');
    cx.putImageData(img,0,0); art=cv;

    // 2) 색 묶기 (k-평균, 밝기보다 색깔을 더 중요하게)
    const L=new Float32Array(N), A=new Float32Array(N), B=new Float32Array(N), t=[0,0,0], wL=.6;
    const figIdx=new Int32Array(figArea); let fi=0;
    for(let p=0;p<N;p++) if(fig[p]){ figIdx[fi++]=p; toLab(d[p*4],d[p*4+1],d[p*4+2],t); L[p]=t[0]; A[p]=t[1]; B[p]=t[2]; }
    const K=easy?9:13, S=Math.min(figArea,24000), step=figArea/S, sx=new Float32Array(S*3);
    for(let i=0;i<S;i++){ const p=figIdx[Math.floor(i*step)]; sx[i*3]=L[p]*wL; sx[i*3+1]=A[p]; sx[i*3+2]=B[p]; }
    const C=new Float32Array(K*3), md=new Float32Array(S).fill(Infinity); let nK=0, pick=0;
    while(nK<K){ C[nK*3]=sx[pick*3]; C[nK*3+1]=sx[pick*3+1]; C[nK*3+2]=sx[pick*3+2]; nK++;
      let best=-1, bi=0;
      for(let i=0;i<S;i++){ const dd=(sx[i*3]-C[nK*3-3])**2+(sx[i*3+1]-C[nK*3-2])**2+(sx[i*3+2]-C[nK*3-1])**2; if(dd<md[i]) md[i]=dd; if(md[i]>best){ best=md[i]; bi=i; } }
      if(best<36) break; pick=bi; }
    const nearest=(l,a,b)=>{ let bk=0,bd=Infinity; for(let k=0;k<nK;k++){ const dd=(l-C[k*3])**2+(a-C[k*3+1])**2+(b-C[k*3+2])**2; if(dd<bd){ bd=dd; bk=k; } } return bk; };
    for(let it=0;it<8;it++){ const sum=new Float64Array(nK*4);
      for(let i=0;i<S;i++){ const k=nearest(sx[i*3],sx[i*3+1],sx[i*3+2]); sum[k*4]+=sx[i*3]; sum[k*4+1]+=sx[i*3+1]; sum[k*4+2]+=sx[i*3+2]; sum[k*4+3]++; }
      for(let k=0;k<nK;k++) if(sum[k*4+3]){ C[k*3]=sum[k*4]/sum[k*4+3]; C[k*3+1]=sum[k*4+1]/sum[k*4+3]; C[k*3+2]=sum[k*4+2]/sum[k*4+3]; } }
    let lab=new Int32Array(N).fill(-1);
    for(const p of figIdx) lab[p]=nearest(L[p]*wL,A[p],B[p]);

    // 3) 자잘한 얼룩 다듬기 (주변에 가장 많은 색으로)
    const R=easy?3:2, cntK=new Int32Array(nK);
    for(let pass=0;pass<(easy?2:1);pass++){
      const out=new Int32Array(N).fill(-1);
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const p=y*W+x; if(lab[p]<0) continue; cntK.fill(0);
        for(let yy=Math.max(0,y-R);yy<=Math.min(H-1,y+R);yy++) for(let xx=Math.max(0,x-R);xx<=Math.min(W-1,x+R);xx++){ const v=lab[yy*W+xx]; if(v>=0) cntK[v]++; }
        let bk=lab[p]; for(let k=0;k<nK;k++) if(cntK[k]>cntK[bk]) bk=k; out[p]=bk; }
      lab=out;
    }

    // 4) 면 합치기: 그림자처럼 같은 색의 밝기만 다른 면, 너무 작거나 가는 면
    const minA=Math.max(40,figArea*(easy?.008:.003)), dabT=easy?14:11, dLT=easy?30:24;
    // 눈동자처럼 작고 까만 면은 까맣게 칠해 둠 (몸 전체가 까만 그림이면 하지 않음)
    let darkPx=0; for(const p of figIdx) if(L[p]<30) darkPx++;
    const inkOK=darkPx<figArea*.12, inkMin=figArea*(easy?.0005:.00015);
    const inkOf=(mL,ar,per)=>inkOK&&mL<30&&ar>=inkMin&&(ar<figArea*.015||per/ar>.45);
    let CC, isInk;
    for(let round=0;round<4;round++){
      CC=comps(lab,W,H); const n=CC.n, id=CC.id;
      const ar=new Float64Array(n), sL=new Float64Array(n), sA=new Float64Array(n), sB=new Float64Array(n), per=new Float64Array(n), adj=new Map();
      const addAdj=(a,b)=>{ const k=a<b?a*n+b:b*n+a; adj.set(k,(adj.get(k)||0)+1); };
      for(let p=0;p<N;p++){ const c=id[p]; if(c<0) continue; ar[c]++; sL[c]+=L[p]; sA[c]+=A[p]; sB[c]+=B[p];
        const x=p%W; let edge=false;
        if(x<W-1){ const q=id[p+1]; if(q!==c){ edge=true; if(q>=0) addAdj(c,q); } } else edge=true;
        if(p+W<N){ const q=id[p+W]; if(q!==c){ edge=true; if(q>=0) addAdj(c,q); } } else edge=true;
        if(x===0||id[p-1]!==c||p<W||id[p-W]!==c) edge=true;
        if(edge) per[c]++; }
      isInk=new Uint8Array(n); for(let c=0;c<n;c++) isInk[c]=inkOf(sL[c]/ar[c],ar[c],per[c])?1:0;
      if(round===3) break;
      const par=new Int32Array(n); for(let c=0;c<n;c++) par[c]=c;
      const find=c=>{ while(par[c]!==c){ par[c]=par[par[c]]; c=par[c]; } return c; };
      const area0=Float64Array.from(ar);
      const union=(a,b)=>{ a=find(a); b=find(b); if(a===b) return; if(ar[a]<ar[b]) [a,b]=[b,a]; par[b]=a; ar[a]+=ar[b]; sL[a]+=sL[b]; sA[a]+=sA[b]; sB[a]+=sB[b]; };
      const nb=Array.from({length:n},()=>[]);
      const edges=[...adj].sort((a,b)=>b[1]-a[1]);
      for(const [k,c] of edges){ const a=Math.floor(k/n), b=k%n; nb[a].push([b,c]); nb[b].push([a,c]); }
      if(round<2) for(const [k] of edges){ const a=Math.floor(k/n), b=k%n; if(isInk[a]||isInk[b]) continue;
        const ra=find(a), rb=find(b); if(ra===rb) continue;
        const dab=Math.hypot(sA[ra]/ar[ra]-sA[rb]/ar[rb],sB[ra]/ar[ra]-sB[rb]/ar[rb]), dL=Math.abs(sL[ra]/ar[ra]-sL[rb]/ar[rb]);
        if(dab<dabT&&dL<dLT) union(ra,rb); }
      const order=[...Array(n).keys()].sort((a,b)=>area0[a]-area0[b]);
      for(const c of order){ if(isInk[c]) continue; const r=find(c);
        const thin=r===c&&per[c]/area0[c]>.5;
        if(ar[r]>=minA&&!thin) continue;
        let best=-1, bc=0; for(const [q,cn] of nb[c]) if(!isInk[q]&&find(q)!==r&&cn>bc){ bc=cn; best=q; }

    const id=CC.id, edge=new Uint8Array(N);
    for(let p=0;p<N;p++){ const c=id[p], x=p%W;
      if((x<W-1&&id[p+1]!==c)||(p+W<N&&id[p+W]!==c)) edge[p]=1;
      if(c>=0&&isInk[c]) ink[p]=1; }
    dilate(edge,ink,W,H,easy?2.3:1.8);
  }

  const out=mkCanvas(W,H), ox=out.getContext('2d'), od=ox.createImageData(W,H);

  ox.putImageData(od,0,0);
  return {w:W,h:H,line:await toBlob(out),art:art?await toBlob(art):null};
}

/* 도안을 읽어서 칠할 면(영역)을 찾음 */
async function analyze(pg){
  const W=pg.w, H=pg.h, N=W*H;
  const draw=async blob=>{ const u=URL.createObjectURL(blob), im=new Image(); im.src=u; await im.decode();
    const c=mkCanvas(W,H), x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(im,0,0,W,H); URL.revokeObjectURL(u); return {c,d:x.getImageData(0,0,W,H).data}; };
  const ln=await draw(pg.line), art=pg.art?(await draw(pg.art)).d:null;
  const lab=new Int32Array(N); for(let p=0;p<N;p++) lab[p]=ln.d[p*4+3]>=128?-1:0;
  const C=comps(lab,W,H), n=C.n, out=new Uint8Array(n);
  for(let x=0;x<W;x++){ [x,(H-1)*W+x].forEach(p=>{ if(C.id[p]>=0) out[C.id[p]]=1; }); }
  for(let y=0;y<H;y++){ [y*W,y*W+W-1].forEach(p=>{ if(C.id[p]>=0) out[C.id[p]]=1; }); }
  const op=new Float64Array(n), sr=new Float64Array(n), sg=new Float64Array(n), sb=new Float64Array(n);
  if(art) for(let p=0;p<N;p++){ const c=C.id[p]; if(c<0||art[p*4+3]<128) continue; op[c]++; sr[c]+=art[p*4]; sg[c]+=art[p*4+1]; sb[c]+=art[p*4+2]; }
  if(art){ for(let c=0;c<n;c++) if(op[c]<C.area[c]*.5) out[c]=1; } // 그림 사이 빈 곳
  else{ let big=-1, inA=0; for(let c=0;c<n;c++) if(!out[c]){ inA+=C.area[c]; if(big<0||C.area[c]>C.area[big]) big=c; }
    if(big>=0&&C.area[big]>inA*.4) out[big]=1; } // 도안 테두리 안쪽 큰 바탕
  const rid=new Int32Array(N), regions=[null,{area:0,out:true}];
  const map=new Int32Array(n);
  for(let c=0;c<n;c++){ if(out[c]){ map[c]=1; regions[1].area+=C.area[c]; continue; }
    map[c]=regions.length;
    const ref=art&&op[c]?[Math.round(sr[c]/op[c]),Math.round(sg[c]/op[c]),Math.round(sb[c]/op[c])]:null;
    regions.push({area:C.area[c],ref}); }
  for(let p=0;p<N;p++) rid[p]=C.id[p]<0?0:map[C.id[p]];
  let fig=0; for(let r=2;r<regions.length;r++) fig+=regions[r].area;
  for(let r=2;r<regions.length;r++){ const g=regions[r]; g.score=g.area>=Math.max(30,fig*.003);
    if(g.ref){ const [R,G,B]=g.ref, mx=Math.max(R,G,B), mn=Math.min(R,G,B); g.auto=(R*299+G*587+B*114)/1000>228&&mx-mn<28; } } // 흰 면은 종이 색 그대로 OK
  return {W,H,N,rid,regions,fig,lineCanvas:ln.c};
}

function parentGate(ok){ if(ok){ sfx.pop(); parent(); } }
function holdButton(btn,onHold,onTap){
  let t=null, fired=false;
  const stop=()=>{ clearTimeout(t); t=null; btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown',e=>{ fired=false; btn.classList.add('holding'); t=setTimeout(()=>{ fired=true; stop(); onHold(); },1200); });
  btn.addEventListener('pointerup',()=>{ const was=t; stop(); if(was&&!fired) onTap(); });
  btn.addEventListener('pointerleave',stop); btn.addEventListener('pointercancel',stop);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ======================================================================
   색칠하기
   ====================================================================== */
async function colorPage(pg){
  show(`<div class="cs">
    <header>
      <button class="icon-btn" id="cBack" aria-label="처음으로">🏠</button>
      <h2 class="title"><b>${esc(pg.en)}</b><small>${esc(pg.ko)}</small></h2>
      ${pg.art?'<button class="icon-btn" id="cHint" aria-label="원래 그림 보기">👀</button>':''}
      <button class="icon-btn" id="cUndo" aria-label="되돌리기">↩️</button>
      <button class="done" id="cDone">✅ 다 했어요!</button>
    </header>
    <div class="board" id="board"><div class="loading">도안 펼치는 중… 🖍️</div></div>
    <div class="tools">
      <div class="crayons">${PALETTE.map(([n,h],i)=>`<button class="crayon" data-i="${i}" style="${crayonStyle(i)}" ${h==='#ffffff'?'data-white':''}>${n}</button>`).join('')}</div>
      <div class="toolrow">
        <button class="tool" data-size="0"><i style="width:10px;height:10px"></i>Small</button>
        <button class="tool" data-size="1"><i style="width:16px;height:16px"></i>Medium</button>
        <button class="tool" data-size="2"><i style="width:24px;height:24px"></i>Big</button>
        <button class="tool" id="cEraser">🧽 Eraser</button>
        <button class="tool" id="cHelper">🪄 선 지킴이</button>
        <button class="tool" id="cClear">🗑️</button>
      </div>
    </div>
  </div>`);
  document.body.style.overflow='hidden';
  let alive=true, saveT=null, dirty=false, finished=false;
  screenCleanup=()=>{ alive=false; };
  $('#cBack').onclick=()=>{ sfx.pop(); home(); };
  const A=await analyze(pg);
  if(!alive) return;
  const {W,H,N,rid,regions}=A;
  const board=$('#board');
  board.innerHTML=`<div class="paper" id="paper"><canvas class="paint"></canvas><canvas class="lines"></canvas><canvas class="fx"></canvas></div>`+
    (pg.art?`<div class="hint" id="hint" hidden><img alt="원래 그림"><div class="chips"></div></div>`:'');
  const paper=$('#paper'), [pc,lc,fc]=paper.querySelectorAll('canvas');
  [pc,lc,fc].forEach(c=>{ c.width=W; c.height=H; });
  const pctx=pc.getContext('2d'); // 그래픽 칩으로 그리도록 (willReadFrequently를 쓰면 CPU로 그려서 느려짐)
  lc.getContext('2d').drawImage(A.lineCanvas,0,0);
  const fctx=fc.getContext('2d');
  const tmp=mkCanvas(W,H), tctx=tmp.getContext('2d');
  pctx.lineCap=tctx.lineCap='round'; pctx.lineJoin=tctx.lineJoin='round';

  const saved=await db.get('paint',pg.id);
  if(saved){ try{ const u=URL.createObjectURL(saved), im=new Image(); im.src=u; await im.decode(); pctx.drawImage(im,0,0,W,H); URL.revokeObjectURL(u); }catch(e){} }

  const fit=()=>{ const bw=board.clientWidth-16, bh=board.clientHeight-16, s=Math.min(bw/W,bh/H);
    paper.style.width=Math.floor(W*s)+'px'; paper.style.height=Math.floor(H*s)+'px'; };
  fit(); window.addEventListener('resize',fit);
  let hintURL=null;
  screenCleanup=()=>{ alive=false; window.removeEventListener('resize',fit); clearTimeout(saveT); if(hintURL) URL.revokeObjectURL(hintURL); if(dirty) saveNow(); };

  // 원래 그림 보기 + 어떤 색인지 영어로
  if(pg.art){
    hintURL=URL.createObjectURL(pg.art); $('#hint img').src=hintURL;
    const tally=new Map();
    for(let r=2;r<regions.length;r++){ const g=regions[r]; if(!g.ref||!g.score||g.auto) continue; const k=palRank(...g.ref)[0]; tally.set(k,(tally.get(k)||0)+g.area); }
    const top=[...tally].sort((a,b)=>b[1]-a[1]).slice(0,4).map(a=>a[0]);
    $('#hint .chips').innerHTML=top.map(i=>`<button data-i="${i}" style="${crayonStyle(i)}">${PALETTE[i][0]}</button>`).join('');
    $('#hint .chips').querySelectorAll('button').forEach(b=>b.onclick=()=>pickColor(+b.dataset.i));
    $('#cHint').onclick=()=>{ sfx.pop(); $('#hint').hidden=!$('#hint').hidden; if(!$('#hint').hidden) say(...top.slice(0,3).map(i=>PALETTE[i][0])); };
  }

  // 도구
  let color=0, size=1, eraser=false, helper=opts.helper;
  const SIZES=[.016,.032,.056].map(f=>f*Math.max(W,H));
  const crayons=[...$app.querySelectorAll('.crayon')];
  function pickColor(i){ color=i; eraser=false; sfx.pop(); say(PALETTE[i][0]); paintTools(); }
  function paintTools(){
    crayons.forEach(b=>b.classList.toggle('on',!eraser&&+b.dataset.i===color));
    $app.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('on',+b.dataset.size===size));
    $('#cEraser').classList.toggle('on',eraser); $('#cHelper').classList.toggle('on',helper);
  }
  crayons.forEach(b=>b.onclick=()=>pickColor(+b.dataset.i));
  $app.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ size=+b.dataset.size; sfx.pop(); say(['Small','Medium','Big'][size]); paintTools(); });
  $('#cEraser').onclick=()=>{ eraser=!eraser; sfx.pop(); if(eraser) say('Eraser'); paintTools(); };
  $('#cHelper').onclick=()=>{ helper=!helper; sfx.pop(); toast(helper?'🪄 선 지킴이: 선 밖으로 색이 안 나가요':'선 지킴이를 껐어요'); paintTools(); };
  paintTools();

  // 되돌리기: 픽셀을 읽어 오지 않고 캔버스끼리 복사 (그래픽 칩 안에서 끝나서 빠름)
  const undo=[], spare=[];
  const snap=()=>{ const c=spare.pop()||mkCanvas(W,H), x=c.getContext('2d'); x.clearRect(0,0,W,H); x.drawImage(pc,0,0); undo.push(c); if(undo.length>8) spare.push(undo.shift()); };
  const restore=()=>{ const c=undo.pop(); pctx.clearRect(0,0,W,H); pctx.drawImage(c,0,0); spare.push(c); };
  $('#cUndo').onclick=()=>{ if(!undo.length){ sfx.wob(); return; } restore(); sfx.pop(); changed(); };
  $('#cClear').onclick=()=>{ if(!confirm('그림을 모두 지우고 처음부터 칠할까요?')) return; snap(); pctx.clearRect(0,0,W,H); changed(); };
  // 저장은 그림 파일로 바꾸느라 잠깐 멈칫하니, 손을 떼고 조금 쉴 때만
  function saveNow(){ if(finished) return; if(active!==null){ changed(); return; } dirty=false;
    toBlob(pc).then(b=>finished||db.put('paint',b,pg.id).then(()=>inProgress.add(pg.id))).catch(()=>{}); }
  function changed(){ dirty=true; clearTimeout(saveT); saveT=setTimeout(saveNow,4000); }

  // 선 지킴이: 처음 닿은 면 안에만 칠해짐
  const masks=new Map();
  function maskFor(r){
    if(masks.has(r)) return masks.get(r);
    const c=mkCanvas(W,H), x=c.getContext('2d'), m=x.createImageData(W,H), m32=new Uint32Array(m.data.buffer);
    for(let p=0;p<N;p++){ const v=rid[p]; if(v===r||v===0) m32[p]=0xff000000; }
    x.putImageData(m,0,0); masks.set(r,c); if(masks.size>16) masks.delete(masks.keys().next().value); return c;
  }
  function regionAt(x,y){
    const X=Math.round(x), Y=Math.round(y);
    for(let r=0;r<=14;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; const xx=X+dx, yy=Y+dy;
      if(xx<0||yy<0||xx>=W||yy>=H) continue; const v=rid[yy*W+xx]; if(v>0) return v; }
    return 1;
  }

  // 애플펜슬 / 손가락
  let active=null, activeType='', last=null, clip=null, penSeen=false, rect=null;
  const pt=e=>[(e.clientX-rect.left)*W/rect.width,(e.clientY-rect.top)*H/rect.height];
  const widthOf=e=>{ const w=SIZES[size]*(eraser?1.4:1); return e.pointerType==='pen'&&e.pressure>0?w*Math.min(1.35,.55+e.pressure*.9):w; };
  // 펜은 1초에 수백 번 움직임을 알려 주니, 모아 두었다가 화면이 바뀔 때 한 번에 그림
  const pending=[]; let raf=0;
  function seg(x0,y0,x1,y1,w){ pending.push(x0,y0,x1,y1,w); if(!raf) raf=requestAnimationFrame(flush); }
  function flush(){
    if(raf){ cancelAnimationFrame(raf); raf=0; } if(!pending.length) return;
    const ctx=clip?tctx:pctx;
    ctx.globalCompositeOperation=eraser&&!clip?'destination-out':'source-over'; ctx.strokeStyle=PALETTE[color][1];
    let ax=Infinity, ay=Infinity, bx=-Infinity, by=-Infinity;
    for(let i=0;i<pending.length;i+=5){ const x0=pending[i], y0=pending[i+1], x1=pending[i+2], y1=pending[i+3], w=pending[i+4];
      ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1+.01,y1); ctx.stroke();
      ax=Math.min(ax,x0-w,x1-w); ay=Math.min(ay,y0-w,y1-w); bx=Math.max(bx,x0+w,x1+w); by=Math.max(by,y0+w,y1+w); }
    pending.length=0; ctx.globalCompositeOperation='source-over';
    if(clip){ // 이번에 그린 곳만 칸 모양으로 잘라서 옮김
      const x=Math.max(0,Math.floor(ax)), y=Math.max(0,Math.floor(ay)), w=Math.min(W,Math.ceil(bx))-x, h=Math.min(H,Math.ceil(by))-y; if(w<=0||h<=0) return;
      tctx.globalCompositeOperation='destination-in'; tctx.drawImage(clip,x,y,w,h,x,y,w,h); tctx.globalCompositeOperation='source-over';
      pctx.globalCompositeOperation=eraser?'destination-out':'source-over'; pctx.drawImage(tmp,x,y,w,h,x,y,w,h); pctx.globalCompositeOperation='source-over';
      tctx.clearRect(x,y,w,h);
    }
  }
  paper.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen') penSeen=true;
    if(e.pointerType==='touch'&&penSeen&&opts.palm) return; // 펜을 쓰면 손바닥 터치는 무시
    if(active!==null){
      if(e.pointerType==='pen'&&activeType!=='pen'&&undo.length){ pending.length=0; restore(); active=null; } // 손바닥이 먼저 닿았으면 취소
      else return;
    }
    e.preventDefault(); flush(); active=e.pointerId; activeType=e.pointerType; try{ paper.setPointerCapture(e.pointerId); }catch(_){}
    rect=paper.getBoundingClientRect();
    snap(); const [x,y]=pt(e); last=[x,y];
    clip=helper?maskFor(regionAt(x,y)):null;
    seg(x,y,x,y,widthOf(e));
  });
  paper.addEventListener('pointermove',e=>{
    if(e.pointerId!==active) return; e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){ const [x,y]=pt(ev); seg(last[0],last[1],x,y,widthOf(ev)); last=[x,y]; }
  });
  const end=e=>{ if(e.pointerId!==active) return; flush(); active=null; clip=null; changed(); };
  paper.addEventListener('pointerup',end); paper.addEventListener('pointercancel',end);
  paper.addEventListener('contextmenu',e=>e.preventDefault());

  // 다 했어요 → 채점 (넉넉하게)
  $('#cDone').onclick=async()=>{
    const J=judge();
    if(!J.stars){ sfx.wob(); say('Keep going!'); showMissing(J.missing); toast('조금만 더 칠해 볼까요? 반짝이는 곳을 칠해 봐요! ✨',3200); return; }
    $('#cDone').disabled=true; finished=true; clearTimeout(saveT);
    const out=mkCanvas(W,H), ox=out.getContext('2d'); ox.fillStyle='#fff'; ox.fillRect(0,0,W,H); ox.drawImage(pc,0,0); ox.drawImage(lc,0,0);
    const img=await toBlob(out,'image/jpeg',.88);
    const gid=await db.put('gallery',{pid:pg.id,cat:pg.cat,en:pg.en,ko:pg.ko,stars:J.stars,date:Date.now(),img});
    let gems=[];
    if(pg.cat==='poke'){ const c=rw.caught[pg.id]||{n:0,best:0}; c.n++; c.best=Math.max(c.best,J.stars); c.thumb=gid; rw.caught[pg.id]=c; }
    else{
      const g1=GEM_OF[PALETTE[J.used[0]??0][0]], g2=J.used[1]!=null?GEM_OF[PALETTE[J.used[1]][0]]:'diamond';
      gems=Array(J.stars).fill(g1); if(J.colorBonus) gems.push(g2);
      gems.forEach(g=>rw.gems[g]=(rw.gems[g]||0)+1);
      const u=rw.pups[pg.id]||{n:0,gems:0}; u.n++; u.gems+=gems.length; u.thumb=gid; rw.pups[pg.id]=u;
    }
    await saveRw();
    clearTimeout(saveT); dirty=false; await db.del('paint',pg.id); inProgress.delete(pg.id);
    reward(pg,J,img,gems);
  };
  function judge(){
    const pd=pctx.getImageData(0,0,W,H).data, P=PALETTE.length, nR=regions.length;
    const painted=new Float64Array(nR), votes=new Float64Array(nR*P), all=new Float64Array(P), cache=new Map();
    PALETTE.forEach(([,h],i)=>{ const [r,g,b]=hexRGB(h); cache.set((r<<16)|(g<<8)|b,i); });
    for(let p=0;p<N;p++){ const r=rid[p]; if(r<2) continue; const i=p*4; if(pd[i+3]<100) continue; painted[r]++;
      if(pd[i+3]<250) continue; const key=(pd[i]<<16)|(pd[i+1]<<8)|pd[i+2]; let k=cache.get(key);
      if(k===undefined){ k=palRank(pd[i],pd[i+1],pd[i+2])[0]; cache.set(key,k); } votes[r*P+k]++; all[k]++; }
    let tot=0, got=0, own=0, cTot=0, cOk=0; const missing=[];
    for(let r=2;r<nR;r++){ const g=regions[r]; if(!g.score) continue; tot+=g.area;
      const cov=painted[r]/g.area;
      if(g.auto&&cov<.5){ got+=g.area; continue; }
      const s=Math.min(1,cov/.5); got+=s*g.area; own+=s*g.area;
      if(cov<.25&&g.area>A.fig*.01) missing.push(r);
      if(g.ref&&cov>=.3){ let bk=0; for(let k=1;k<P;k++) if(votes[r*P+k]>votes[r*P+bk]) bk=k;
        cTot+=g.area; if(palRank(...g.ref).slice(0,2).includes(bk)) cOk+=g.area; } }
    let score=tot?got/tot:0;
    if(own<A.fig*.15) score=Math.min(score,own/(A.fig*.15)*.39); // 하얀 면만 있는 그림도 조금은 칠해야 해요
    const stars=score>=.85?3:score>=.65?2:score>=.4?1:0;
    const sum=all.reduce((a,b)=>a+b,0);
    const used=[...all.keys()].filter(k=>all[k]>sum*.03).sort((a,b)=>all[b]-all[a]);
    return {score,stars,missing,used,colorBonus:cTot>0&&cOk/cTot>=.6};
  }
  function showMissing(list){
    const m=fctx.createImageData(W,H), md=m.data, set=new Set(list);
    for(let p=0;p<N;p++) if(set.has(rid[p])){ md[p*4]=255; md[p*4+1]=214; md[p*4+2]=0; md[p*4+3]=150; }
    fctx.putImageData(m,0,0); fc.classList.remove('blink'); void fc.offsetWidth; fc.classList.add('blink');
    setTimeout(()=>{ if(alive){ fctx.clearRect(0,0,W,H); fc.classList.remove('blink'); } },2100);
  }
}

  const buttons=`<div class="row" style="justify-content:center;margin-top:10px">
    <button class="big-btn" id="rHome">🏠 처음으로</button>
    <button class="big-btn alt" id="rCol">${pg.cat==='poke'?'📖 도감 보기':'💎 보석함 보기'}</button></div>`;
  await sleep(700);
  if(pg.cat==='poke'){
    const b=ov.querySelector('.ball');
    sfx.pop(); b.classList.add('throw'); await sleep(650);
    art.classList.add('in'); await sleep(450);
    b.classList.remove('throw'); b.classList.add('wobble');
    for(let i=0;i<3;i++){ await sleep(i?530:180); sfx.wob(); }
    await sleep(450); b.classList.remove('wobble'); b.classList.add('got'); sfx.click(); burst('⭐'); await sleep(350); sfx.fan();
    say('Gotcha!',`${pg.en}!`,J.colorBonus?'Great colors!':'');
    msg.innerHTML=`<h3>Gotcha!</h3><p><b style="font-size:30px">${esc(pg.en)}</b><br>${esc(pg.ko)}을(를) <b>${ball[0]}</b>로 잡았어요!</p>${starRow}${bonus}${usedChips}${buttons}`;
  }else{
    sfx.fan(); burst('✨',12); await sleep(300);
    say('Great job!',`You got ${gems.length} ${gems.length>1?'gems':'gem'}!`,...[...new Set(gems)].map(g=>GEMS[g][0]));
    msg.innerHTML=`<h3>Great job!</h3><p>${esc(pg.ko)}와(과) 함께 보석 <b>${gems.length}개</b>를 받았어요!</p>
      <div class="gems">${gems.map((g,i)=>`<button class="gem drop" style="animation-delay:${i*.25}s" data-g="${g}">${gemSvg(GEMS[g][1],70)}<span>${GEMS[g][0]}</span></button>`).join('')}</div>
      ${starRow}${bonus}${usedChips}${buttons}`;

  }
  msg.querySelectorAll('.used button').forEach(b=>b.onclick=()=>say(PALETTE[+b.dataset.i][0]));
  const close=()=>{ ov.remove(); URL.revokeObjectURL(src); };

   어른 메뉴: 도안 받기 · 설정

async function savePage(pg){ await db.put('pages',pg); const old=pages.find(p=>p.id===pg.id); if(old){ dropURL(old); pages.splice(pages.indexOf(old),1); } pages.push(pg); sortPages(); }
async function getBlob(url){ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return r.blob(); }
async function downloadPokemon(list,progress){
  let ok=0; const fail=[];
  for(let i=0;i<list.length;i++){ const [n,en,ko]=list[i];
    progress(`${ko} 받는 중… (${i+1}/${list.length})`);
    try{ const pg=await makePage(await getBlob(POKE_ART(n)),'art');
      await savePage({id:'poke-'+n,cat:'poke',dex:n,en,ko,...pg,added:Date.now()}); ok++; }
    catch(e){ fail.push(ko); }
    await sleep(30);
  }
  return {ok,fail};
}
async function downloadPups(list,progress){
  progress('친구 목록을 찾는 중…');
  const api='https://pawpatrol.fandom.com/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles='
    +encodeURIComponent(list.map(p=>p[0]).join('|'));
  const q=(await (await fetch(api)).json()).query||{};
  const alias={}; (q.normalized||[]).concat(q.redirects||[]).forEach(r=>alias[r.from]=r.to);
  const real=t=>{ let s=t; for(let i=0;i<3&&alias[s];i++) s=alias[s]; return s; };
  const src={}; Object.values(q.pages||{}).forEach(pg=>{ if(pg.thumbnail&&WIKI_IMG.test(pg.thumbnail.source)) src[pg.title]=pg.thumbnail.source; });
  let ok=0; const fail=[];
  for(let i=0;i<list.length;i++){ const [t,en,ko]=list[i], url=src[real(t)];
    progress(`${ko} 받는 중… (${i+1}/${list.length})`);
    try{ if(!url) throw 0; const pg=await makePage(await getBlob(url),'auto');
      await savePage({id:'pup-'+t.toLowerCase(),cat:'pup',dex:900000+PUPS.findIndex(p=>p[0]===t),en,ko,...pg,added:Date.now()}); ok++; }
    catch(e){ fail.push(ko); }
    await sleep(30);
  }
  return {ok,fail};
}

    pages.forEach(pg=>{ const d=document.createElement('div');
      d.innerHTML=`<img alt="" src="${lineURL(pg)}"><div>${esc(pg.ko)}</div><button class="big-btn small alt">지우기</button>`;
      d.querySelector('button').onclick=async()=>{ if(!confirm(`‘${pg.ko}’ 도안을 지울까요?`)) return;
        await db.del('pages',pg.id); await db.del('paint',pg.id); inProgress.delete(pg.id); dropURL(pg); pages.splice(pages.indexOf(pg),1); refreshMine(); };
      box.appendChild(d); });
  }
  refreshMine();
}

/* ---------- 시작 ---------- */
(async function boot(){
  try{
    rw=Object.assign({caught:{},pups:{},gems:{}},await db.get('kv','rw')||{});
    pages=await db.all('pages'); sortPages(); inProgress=new Set(await db.keys('paint'));
  }catch(e){ $app.innerHTML='<div class="page"><div class="empty">이 브라우저에서는 그림을 저장할 수 없어요. 사파리에서 열어 주세요.</div></div>'; return; }
  home();
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
