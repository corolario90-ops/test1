<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>몬스터 숫자 놀이</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="몬스터 숫자">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<meta name="theme-color" content="#FFF7DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<style>
:root{
  --bg:#fff7dc;--card:#ffffff;--ink:#2b2b2b;--muted:#7a7468;--line:#f0e2b0;--soft:#fffbea;
  --red:#e3350d;--yellow:#ffcb05;--blue:#3b4cca;--blue-soft:#eef0ff;--red-soft:#fff1ee;--green:#2fae5a;--shadow:0 4px 0 rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 40px}

header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:22px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.ball{width:28px;height:28px;border-radius:50%;border:3px solid #222;background:linear-gradient(var(--red) 0 44%,#222 44% 56%,#fff 56%);position:relative;flex:none}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:9px;height:9px;transform:translate(-50%,-50%);background:#fff;border:2.5px solid #222;border-radius:50%}
.icon-btn{background:var(--card);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);font-size:16px;font-weight:700}

.screen{display:none}
.screen.on{display:block}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px}

/* 홈 */
/* 파트너 */
.partner-card{display:flex;align-items:center;gap:16px}
.partner-card .pic{width:130px;height:130px;flex:none}
.partner-info{flex:1;min-width:0}
.partner-info h2{margin:0 0 4px;font-size:24px}
.partner-info p{margin:6px 0 0;color:var(--muted);font-size:14px}
.lv{display:inline-block;background:var(--blue);color:#fff;border-radius:10px;padding:1px 8px;font-size:15px;margin-left:6px;vertical-align:middle}
.expbar{height:12px;border-radius:6px;background:#efe6c8;overflow:hidden;margin-top:6px}
.expbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5bc8f5,var(--blue));border-radius:6px;transition:width .8s ease}
.partner-card .ghost{padding:8px 12px;font-size:15px;margin-top:10px;border-width:2px}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.starter{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;font-weight:800;font-size:18px}
.starter .pic{width:100px;height:100px;margin:0 auto}
.starter small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px;line-height:1.4}
.starter.sel{border-color:var(--blue);background:var(--blue-soft)}
.mini{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px;color:var(--blue)}
.mini .pic{width:40px;height:40px}
.evo-box{text-align:center;border-top:3px dashed var(--line);margin-top:14px;padding-top:12px}
.evo-box .pic{width:170px;height:170px;margin:0 auto}
.evo-box h3{margin:6px 0;font-size:22px}
.evo-box .row-btns{margin-top:10px}
.evo-flash{animation:evoflash 1.2s ease-in-out}
@keyframes evoflash{0%{filter:none}30%,70%{filter:brightness(0) invert(1) drop-shadow(0 0 18px #ffe36b);transform:scale(1.15)}100%{filter:none}}
.levelup{color:var(--red);font-weight:900}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;font-size:20px;font-weight:800}
.mode small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.mode .emo{font-size:32px;display:block;margin-bottom:4px}
.mode.wide{grid-column:1 / -1}
.mode.sel,.level.sel{border-color:var(--blue);background:var(--blue-soft)}
.levels{display:flex;gap:10px}
.level{flex:1;background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:12px 6px;font-weight:800;font-size:18px}
.level small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
.start{display:block;width:100%;background:var(--red);color:#fff;font-size:24px;font-weight:900;padding:18px;border-radius:20px;box-shadow:0 5px 0 #a3260a}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 #a3260a}
.voice-row{display:flex;gap:8px}
.voice-row select{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:3px solid var(--line);background:var(--soft);color:var(--ink)}
.voice-info{margin:8px 0 0;font-size:13px;color:var(--muted)}

/* 게임 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:#e8dcb5}
.dot.ok{background:var(--green)}
.dot.retry{background:var(--yellow)}
.dot.now{outline:3px solid var(--blue);outline-offset:1px}
.question{font-size:22px;font-weight:800;text-align:center;margin:2px 0 6px;line-height:1.45;text-wrap:balance}
.equation{font-size:40px;font-weight:900;text-align:center;letter-spacing:1px;margin:0 0 6px;color:var(--blue)}
.equation.long{font-size:30px}
.tap-hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 6px}
.scene{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:120px;padding:6px 0}
.group{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;background:var(--soft);border:3px dashed var(--line);border-radius:18px;padding:10px;max-width:100%}
.op{font-size:40px;font-weight:900;color:var(--red)}
.mon{position:relative;width:var(--sz,72px);height:var(--sz,72px);display:flex;align-items:center;justify-content:center;transition:transform .5s,opacity .5s,filter .5s;cursor:pointer}
.pic{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
img.pic{object-fit:contain;-webkit-user-drag:none}
.mon .emo-item{font-size:calc(var(--sz,72px) * .78);line-height:1}
.pop{animation:pop .35s ease-out backwards}
.tag{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;animation:pop .25s;z-index:1}
.gone{opacity:.25;filter:grayscale(1);transform:translateX(12px) scale(.85)}
.mon.gone::after{content:"💨";position:absolute;left:-6px;bottom:0;font-size:18px}

/* 10마리 묶음 */
.ten{position:relative;display:grid;grid-template-columns:repeat(5,22px);gap:1px;padding:16px 5px 5px;border:3px solid var(--blue);border-radius:12px;background:var(--blue-soft);cursor:pointer;transition:opacity .5s,filter .5s,transform .5s}
.ten .pic{width:22px;height:22px}
.ten::before{content:"10마리";position:absolute;top:0;left:7px;font-size:11px;font-weight:800;color:var(--blue)}
.unpacked{position:relative;display:flex;flex-wrap:wrap;gap:2px;max-width:calc(5 * (var(--sz) + 2px) + 14px);padding:18px 5px 5px;border:3px dashed var(--blue);border-radius:12px}
.unpacked::before{content:"묶음 1개를 풀었어요";position:absolute;top:1px;left:7px;font-size:11px;font-weight:800;color:var(--blue);white-space:nowrap}
/* 곱하기 묶음 */
.bag{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;padding:10px;border:3px solid var(--red);border-radius:26px;background:var(--red-soft);max-width:calc(3 * (var(--sz) + 2px) + 26px)}
/* 시계 */
.clock{width:230px;height:230px;max-width:100%}
/* 디지털 시계 */
.digital{background:#22302a;color:#7dfc9a;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:72px;font-weight:700;letter-spacing:4px;padding:14px 30px;border-radius:20px;border:6px solid #2b2b2b;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(125,252,154,.5)}
/* 달력 */
.cal{width:160px;border-radius:16px;overflow:hidden;border:3px solid var(--ink);background:var(--card);text-align:center}
.cal .m{background:var(--red);color:#fff;font-size:26px;font-weight:900;padding:6px}
.cal .d{font-size:70px;font-weight:900;padding:6px 0 10px;line-height:1}

.hint-row{display:flex;justify-content:center;margin-top:6px}
.hint-btn{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:700;font-size:15px}
.hint-box{margin:10px auto 0;max-width:460px;background:var(--blue-soft);border-radius:14px;padding:10px 14px;font-size:17px;font-weight:700;line-height:1.6;color:var(--blue);text-align:center}

.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.answers.text{grid-template-columns:repeat(2,1fr)}
.ans{background:var(--yellow);border-radius:18px;padding:12px 4px 8px;font-size:38px;font-weight:900;box-shadow:0 5px 0 #c99c00;line-height:1.1}
.answers.text .ans{font-size:22px;padding:16px 6px}
.ans small{display:block;font-size:14px;font-weight:700;margin-top:4px;color:#6b5400}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 #c99c00}
.ans.wrong{background:#e9e4d6;box-shadow:0 5px 0 #c8c1ad;color:#aaa;animation:shake .4s}
.ans.wrong small{color:#aaa}
.ans.right{background:var(--green);color:#fff;box-shadow:0 5px 0 #1d7a3c}
.ans.right small{color:#e3ffe9}
.speak{background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px}

/* 정답 창 */
.overlay{position:fixed;inset:0;background:rgba(30,25,10,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.pop-card{background:var(--card);border-radius:26px;padding:22px 20px;text-align:center;width:min(360px,100%);animation:pop .35s ease-out}
.pop-card h3{margin:0;font-size:30px;color:var(--green)}
.pop-card p{margin:6px 0;font-size:18px}
.pop-card .pic{width:160px;height:160px;margin:0 auto;animation:wiggle 1s ease-in-out}
.pop-card .new{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:2px 8px;font-size:13px;font-weight:800;margin-left:4px;vertical-align:middle}
.next{margin-top:12px;background:var(--blue);color:#fff;font-size:20px;font-weight:800;padding:12px 28px;border-radius:16px;box-shadow:0 4px 0 #24318f}

/* 결과 */
.stars{font-size:54px;text-align:center;letter-spacing:6px;margin:6px 0}
.result-score{text-align:center;font-size:22px;font-weight:800;margin:0 0 12px}
.caught-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 16px}
.caught-row .pic{width:64px;height:64px}
.row-btns{display:flex;gap:10px}
.row-btns button{flex:1}
.ghost{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:14px;font-size:18px;font-weight:800}

/* 도감 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dex-item{background:var(--soft);border-radius:14px;padding:6px 4px;text-align:center;font-size:13px;font-weight:700}
.dex-item .pic{width:72px;height:72px;margin:0 auto}
.dex-item span{display:block}
.dex-item.no .pic{filter:brightness(0);opacity:.25}
.dex-item.no span{color:#bbb}
.dex-item .cnt{font-size:11px;color:var(--muted);font-weight:500}
.dex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dex-head h2{margin:0}
.small-link{background:none;color:var(--muted);text-decoration:underline;font-size:13px;margin-top:14px}

@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:480px){
  .answers{grid-template-columns:repeat(2,1fr)}
  .equation{font-size:34px}
  .equation.long{font-size:24px}
  .question{font-size:19px}
  .op{font-size:30px}
}
</style>
<div class="wrap">
  <header>
    <h1><span class="ball"></span>몬스터 숫자 놀이</h1>
    <button class="icon-btn" id="soundBtn" title="소리 켜기/끄기">🔊</button>
    <button class="icon-btn" id="dexBtn">📖 도감</button>
  </header>

  <!-- 홈 -->
  <section class="screen on" id="home">
    <div class="card partner-card" id="partnerCard"></div>
    <div class="card">
      <h2>무엇을 할까요?</h2>
      <div class="modes" id="modes">
        <button class="mode sel" data-mode="two"><span class="emo">➕</span>더하기·빼기<small>10마리 묶음으로 자리값 익히기</small></button>
        <button class="mode" data-mode="mul"><span class="emo">✖️</span>곱하기<small>몇씩 몇 묶음?</small></button>
        <button class="mode" data-mode="clock"><span class="emo">🕒</span>시계 읽기<small>몇 시 몇 분?</small></button>
        <button class="mode" data-mode="unit"><span class="emo">🍎</span>세는 말<small>개·마리·명·날짜</small></button>
        <button class="mode wide" data-mode="mix"><span class="emo">🎲</span>섞어서<small>네 가지를 골고루</small></button>
      </div>
    </div>
    <div class="card">
      <h2>얼마나 어렵게?</h2>
      <div class="levels" id="levels">
        <button class="level sel" data-level="1">쉬움<small></small></button>
        <button class="level" data-level="2">보통<small></small></button>
        <button class="level" data-level="3">어려움<small></small></button>
      </div>
    </div>
    <div class="card">
      <h2>목소리</h2>
      <div class="voice-row">
        <select id="voiceSel" aria-label="목소리 고르기"></select>
        <button class="speak" id="voiceTest">▶ 들어 보기</button>
      </div>
      <p class="voice-info" id="voiceInfo"></p>
    </div>
    <div class="card">
      <h2>그림</h2>
      <div id="artBox"></div>
    </div>
    <button class="start" id="startBtn">시작하기!</button>
  </section>

  <!-- 게임 -->
  <section class="screen" id="game">
    <div class="topbar">
      <button class="icon-btn" id="homeBtn">🏠</button>
      <div class="mini" id="mini"></div>
      <div class="dots" id="dots"></div>
      <button class="speak" id="replayBtn">🔈 다시 듣기</button>
    </div>
    <div class="card">
      <p class="question" id="question"></p>
      <p class="equation" id="equation"></p>
      <p class="tap-hint" id="tapHint"></p>
      <div class="scene" id="scene"></div>
      <div class="hint-row"><button class="hint-btn" id="hintBtn">💡 힌트</button></div>
      <div class="hint-box" id="hintBox" hidden></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="result">
    <div class="card">
      <div class="stars" id="stars"></div>
      <p class="result-score" id="resultScore"></p>
      <div class="partner-card" id="expBox"></div>
      <div class="evo-box" id="evoBox" hidden></div>
      <h2 style="text-align:center;margin-top:14px">이번에 잡은 포켓몬</h2>
      <div class="caught-row" id="caughtRow"></div>
      <div class="row-btns">
        <button class="ghost" id="toHome">🏠 처음으로</button>
        <button class="start" id="again">한 번 더!</button>
      </div>
    </div>
  </section>

  <!-- 파트너 고르기 -->
  <section class="screen" id="partnerScreen">
    <div class="card">
      <h2>함께할 포켓몬을 골라요</h2>
      <p class="voice-info" style="margin:0 0 12px">문제를 맞히면 경험치가 쌓여 레벨이 올라요. 레벨이 오르면 진화할 수 있어요! 포켓몬마다 레벨은 따로 기억해요.</p>
      <div class="starters" id="starters"></div>
    </div>
  </section>

  <!-- 도감 -->
  <section class="screen" id="dexScreen">
    <div class="card">
      <div class="dex-head">
        <h2 id="dexTitle">포켓몬 도감</h2>
        <button class="icon-btn" id="dexBack">← 돌아가기</button>
      </div>
      <div class="dex" id="dex"></div>
      <button class="small-link" id="resetDex">도감 비우기</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="pop-card" id="popCard"></div>
</div>

<script>
// 'artifact' = Claude 링크, 'app' = 아이패드 홈 화면 앱 (build.py가 바꿔 넣어요)
const BUILD = 'app';
// 직접 그린 포켓몬 그림 (몬스터 한글 모험 pokemon-hangul/app-src.html 에서 그대로 가져옴)
// 공식 이미지를 쓰지 않고 SVG로 그려요. 한 줄: 도감번호|이름|몸 색|모양|꾸밈
const MON_SPEC = `
1|이상해씨|#82D6BC|wide|ears=cat bulb=#3F9F50 spots eye=big ec=#B3263A mouth=open
2|이상해풀|#6FC7AE|wide|ears=cat bulb=#E98BB0 sprout=#3F9F50 spots eye=big ec=#B3263A mouth=open
3|이상해꽃|#5FB89B|wide|ears=cat flower=#F27A93 spots eye=dot mouth=open
4|파이리|#FF9940|tall|b=#FFE3A3 tail=flame eye=big mouth=smile
5|리자드|#E9573F|tall|b=#FFE3A3 tail=flame horn=#E9573F eye=dot mouth=open
6|리자몽|#FF8A2E|tall|b=#FFE3A3 tail=flame wings=#2F8F94 ears=nub eye=dot mouth=open
7|꼬부기|#86CDF2|round|b=#FFE2A0 shell=#C47A3A plates tail=thin eye=big mouth=smile
8|어니부기|#7BA9E8|round|b=#FFE2A0 shell=#A0673A plates tail=fluffy ears=fox ear2=#E9F1FA eye=dot mouth=smile
9|거북왕|#5B9FE3|wide|b=#FFE2A0 shell=#8A5A2E plates cannons ears=nub eye=dot mouth=open
10|캐터피|#8ED35B|tall|b=#FFE7A6 antenna=#E2493B eye=big mouth=smile
11|단데기|#7FC25A|tall|spikes=#5E9C3F eye=dot mouth=none
12|버터플|#5E58C4|small|wings=#F4F4FF antenna=#2B2B2B eye=big ec=#D8323A mouth=smile
13|뿔충이|#E3A44D|tall|horn=#B8B8B8 eye=dot mouth=none nose=#F49AB0
15|독침붕|#F2C230|small|wings=#DDEFFF stripes=#2B2B2B eye=big ec=#D8323A mouth=none
16|구구|#C68E58|round|b=#F4E2C4 crest=#E2B56A eye=dot mouth=beak bk=#8E8E8E
17|피죤|#C9905A|round|b=#F4E2C4 crest=#E8584A wings=#B98250 eye=dot mouth=beak bk=#C9A0A0
18|피죤투|#C08A55|tall|b=#F4E2C4 crest=#E8584A wings=#B98250 eye=dot mouth=beak bk=#C9A0A0

// 틀린 보기: 자주 하는 실수(likely)를 먼저 넣고 나머지는 가까운 수로 채워요
function numChoices(ans, likely, max=99){
  const ok = v => v > 0 && v <= max && v !== ans;
  const wrong = [...new Set(likely.filter(ok))].slice(0, 2);
  const near = shuffle([ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, ans+3].filter(v => ok(v) && !wrong.includes(v)));
  while(wrong.length < 3 && near.length) wrong.push(near.shift());
  return shuffle([ans, ...wrong]).map(v => ({key: String(v), label: String(v), sub: sino(v)}));
}
function textChoices(answer, wrongs){
  const list = [answer, ...[...new Set(wrongs)].filter(w => w !== answer).slice(0, 3)];
  return shuffle(list).map(t => ({key: t, label: t}));
}

// 두 자리 수를 10마리 묶음과 낱개로 그려요
function placeGroup(id, n, {goneTens=0, goneOnes=0, unpack=false} = {}){
  const g = div('group');
  const tens = Math.floor(n/10), ones = n%10;
  const keep = unpack ? tens - 1 : tens;
  for(let i=0;i<keep;i++) g.appendChild(tenEl(id, i, i >= keep - goneTens));
  if(unpack){
    const u = div('unpacked');
    for(let i=0;i<10;i++) u.appendChild(monEl(id, i, i >= 10 - goneOnes));
    g.appendChild(u);
    for(let i=0;i<ones;i++) g.appendChild(monEl(id, i, false));
  } else {
    for(let i=0;i<ones;i++) g.appendChild(monEl(id, i, i >= ones - goneOnes));
  }
  return g;
}

function clockSVG(h, m){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 200 200'); svg.setAttribute('class', 'clock');
  const add = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(text) e.textContent = text; svg.appendChild(e); return e; };
  add('circle', {cx:100, cy:100, r:94, fill:'#ffffff', stroke:'#2b2b2b', 'stroke-width':6});
  for(let i=0;i<60;i++){
    const a = i*6*Math.PI/180, big = i%5 === 0, r1 = big ? 80 : 85;
    add('line', {x1:100+r1*Math.sin(a), y1:100-r1*Math.cos(a), x2:100+89*Math.sin(a), y2:100-89*Math.cos(a), stroke:'#2b2b2b', 'stroke-width': big ? 3 : 1});
  }
  for(let i=1;i<=12;i++){
    const a = i*30*Math.PI/180;
    add('text', {x:100+66*Math.sin(a), y:100-66*Math.cos(a)+7, 'text-anchor':'middle', 'font-size':20, 'font-weight':800, fill:'#2b2b2b'}, String(i));
  }
  const hand = (deg, len, w, color) => { const a = deg*Math.PI/180; add('line', {x1:100, y1:100, x2:100+len*Math.sin(a), y2:100-len*Math.cos(a), stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}); };
  hand(((h%12) + m/60)*30, 44, 9, '#e3350d');   // 짧은 바늘 = 시
  hand(m*6, 72, 5, '#3b4cca');                  // 긴 바늘 = 분
  add('circle', {cx:100, cy:100, r:7, fill:'#2b2b2b'});
  return svg;
}

let mode = 'two', level = 1;

function qTwo(){
  const [id, name] = pick(POKEMON);
  const add = Math.random() < 0.5;
  if(level === 1) return qSmall(id, name, add);
  let a, b;
  const hard = level === 3 && Math.random() < 0.4;
  if(level === 2){        // 두 자리 ± 한 자리, 받아올림 없음 (가끔 '묶음 + 낱개')
    if(add && Math.random() < 0.3){ a = rand(1,9)*10; b = rand(1,9); }
    else if(add){ const o = rand(0,8); a = rand(1,8)*10 + o; b = rand(1, 9-o); }
    else   { const o = rand(1,9); a = rand(1,9)*10 + o; b = rand(1, o); }
  } else if(!hard){       // 두 자리 ± 두 자리, 받아올림 없음
    if(add){ const t1 = rand(1,7), o1 = rand(0,8); a = t1*10 + o1; b = rand(1, 8-t1)*10 + rand(1, 9-o1); }
    else   { const t1 = rand(2,9), o1 = rand(1,9); a = t1*10 + o1; b = rand(1, t1-1)*10 + rand(0, o1); }
  } else {                // 두 자리 ± 한 자리, 받아올림·받아내림
    if(add){ const o = rand(2,9); a = rand(1,8)*10 + o; b = rand(10-o, 9); }
    else   { const o = rand(0,8); a = rand(2,9)*10 + o; b = rand(o+1, 9); }
  }
  const ans = add ? a + b : a - b;
  const ta = a - a%10, oa = a%10, tb = b - b%10, ob = b%10;
  const carry = add && oa + ob >= 10, borrow = !add && ob > oa;
  let hint, likely;
  if(add){
    if(oa === 0 && b < 10) hint = [`${a} = 10마리 묶음 ${ta/10}개`, `묶음 ${ta/10}개 + 낱개 ${b}마리 = ${ans}`];
    else if(carry) hint = [`${a} = ${ta} + ${oa}`, `일의 자리끼리: ${oa} + ${ob} = ${oa+ob}`, `10마리가 모이면 묶음 1개! ${ta} + ${oa+ob} = ${ans}`];
    else if(b < 10) hint = [`${a} = ${ta} + ${oa}`, `일의 자리끼리: ${oa} + ${ob} = ${oa+ob}`, `${ta} + ${oa+ob} = ${ans}`];
    else hint = [`십의 자리끼리: ${ta} + ${tb} = ${ta+tb}`, `일의 자리끼리: ${oa} + ${ob} = ${oa+ob}`, `${ta+tb} + ${oa+ob} = ${ans}`];
    likely = carry ? [ans-10, ans+10] : b < 10 ? [b*10 + ta/10, a + b*10, ans+10] : [ans+10, ans-10];
  } else {
    if(borrow) hint = [`${a} = ${ta-10} + ${oa+10}  (묶음 1개를 풀었어요)`, `${oa+10} − ${ob} = ${oa+10-ob}`, `${ta-10} + ${oa+10-ob} = ${ans}`];
    else if(b < 10) hint = [`${a} = ${ta} + ${oa}`, `일의 자리끼리: ${oa} − ${ob} = ${oa-ob}`, `${ta} + ${oa-ob} = ${ans}`];
    else hint = [`십의 자리끼리: ${ta} − ${tb} = ${ta-tb}`, `일의 자리끼리: ${oa} − ${ob} = ${oa-ob}`, `${ta-tb} + ${oa-ob} = ${ans}`];
    likely = borrow ? [ans+10, ta + (ob-oa)] : [ans-10, ans+10];
  }
  return {
    kind:'two', id,
    text: add ? `${name} ${a}마리가 있는데 ${b}마리가 더 왔어요. 모두 몇 마리일까요?`
              : `${name} ${a}마리 중에 ${b}마리가 도망갔어요. 몇 마리 남았을까요?`,
    say:  add ? `${name} ${mari(a)}가 있는데 ${mari(b)}가 더 왔어요. 모두 몇 마리일까요?`
              : `${name} ${mari(a)} 중에 ${mari(b)}가 도망갔어요. 몇 마리 남았을까요?`,
    eq: `${a} ${add ? '+' : '−'} ${b} = ?`,
    tapHint: '묶음을 누르면 10씩, 한 마리를 누르면 1씩 세어 줘요',
    hint, choices: numChoices(ans, likely), answer: String(ans),
    done: `${a} ${add ? '+' : '−'} ${b} = ${ans}`, answerSay: mari(ans),
    render(scene){
      scene.style.setProperty('--sz', '40px');
      if(add){ scene.append(placeGroup(id, a), opEl('+'), placeGroup(id, b)); }
      else {
        scene.append(placeGroup(id, a, borrow ? {goneOnes: ob, unpack: true} : {goneTens: tb/10, goneOnes: ob}));
        setTimeout(() => scene.querySelectorAll('[data-gone]').forEach(m => m.classList.add('gone')), 900);
      }
    }
  };
}

}

function qClock(){
  const h = rand(1,12);
  const m = level === 3 ? rand(0,11)*5 : pick([0,30]);
  const digital = level === 1;
  const wrap = x => ((x - 1 + 12) % 12) + 1;
  const label = (hh, mm) => mm ? `${hh}시 ${mm}분` : `${hh}시`;
  const read = (hh, mm) => `${counterNum(hh)} 시` + (mm ? ` ${sino(mm)} 분` : '');
  const hint = digital
    ? ['앞의 숫자는 \'시\', 뒤의 숫자는 \'분\'이에요.', m ? `${h}:30 → ${h}시 30분` : `뒤가 00이면 '정각'이에요. ${h}:00 → ${h}시`]
    : ['빨간 짧은 바늘은 \'시\', 파란 긴 바늘은 \'분\'이에요.',
       m ? `긴 바늘이 가리키는 숫자 ${m/5} → ${m}분 (5, 10, 15 … 5분씩)` : '긴 바늘이 12에 있으면 \'정각\'이에요.'];
  if(m && !digital) hint.push('짧은 바늘이 두 숫자 사이에 있으면 작은 숫자를 읽어요.');
  if(m === 30) hint.push(`30분은 '반'이라고도 해요. ${counterNum(h)} 시 반!`);
  hint.push('시는 \'한, 두, 세 시\', 분은 \'일, 이, 삼 분\'으로 읽어요.');
  const base = { kind:'clock', hint, tapHint: '', answerSay: read(h, m), done: label(h, m),
    render(scene){
      if(!digital){ scene.appendChild(clockSVG(h, m)); return; }
      const d = div('digital pop'); d.textContent = `${h}:${String(m).padStart(2,'0')}`; scene.appendChild(d);
    } };

  if(level !== 2 && Math.random() < (digital ? 0.4 : 0.35)){
    // 시각을 우리말로 읽기
    const wrongs = m
      ? [`${sino(h)} 시 ${sino(m)} 분`, `${counterNum(h)} 시 ${counterNum(m)} 분`, `${sino(h)} 시 ${counterNum(m)} 분`]
      : [`${sino(h)} 시`, `${nativeNum(h)} 시`, `${counterNum(h)} 분`, `${sino(h)} 분`];
    return { ...base, text: '이 시각을 어떻게 읽을까요?', say: '이 시각을 어떻게 읽을지 골라 보세요.',
      eq: digital ? '' : `${h}:${String(m).padStart(2,'0')}`, choices: textChoices(read(h, m), wrongs), answer: read(h, m) };
  }
  let wrongs;
  if(digital) wrongs = [label(wrap(h+1), m), label(h, m ? 0 : 30), label(wrap(h-1), m)];
  else if(!m) wrongs = [label(wrap(h+1),0), label(wrap(h-1),0), label(wrap(h+6),0)];
  else {
    wrongs = [label(wrap(m >= 30 ? h+1 : h-1), m)];          // 짧은 바늘을 다음 숫자로 읽는 실수
    if(m/5 !== m) wrongs.push(label(h, m/5));                // 숫자를 그대로 '분'으로 읽는 실수
    wrongs.push(label(wrap(m/5 || 12), (h*5) % 60));        // 두 바늘을 바꿔 읽는 실수
    wrongs.push(label(h, (m + 5) % 60), label(h, (m + 55) % 60));
  }
  const choices = textChoices(label(h, m), wrongs.filter(w => w !== label(h, m)));
  choices.forEach(c => { const [, hh, mm] = c.key.match(/(\d+)시(?: (\d+)분)?/); c.sub = read(+hh, +(mm||0)); });
  return { ...base, text: '시계가 가리키는 시각은 몇 시 몇 분일까요?',
    say: digital ? '디지털 시계를 보고, 몇 시 몇 분인지 골라 보세요.' : '짧은 바늘과 긴 바늘을 보고, 몇 시 몇 분인지 골라 보세요.',
    eq: '', choices, answer: label(h, m) };
}

function qUnit(){
  const sub = level < 3 ? (Math.random() < 0.6 ? 'read' : 'blank') : pick(['read','blank','age','date']);
  const maxN = level === 1 ? 5 : level === 2 ? 10 : 20;
  const numHint = '물건을 셀 때는 \'한, 두, 세, 네 …\'를 써요.';

  if(sub === 'age'){
    const n = rand(3, 12), right = `${counterNum(n)} 살`;
    return { kind:'unit', text: `생일 케이크에 초가 ${n}개 있어요. 몇 살일까요?`,
      say: `생일 케이크에 초가 ${counterNum(n)} 개 있어요. 몇 살일까요?`, eq: '',
      tapHint: '초를 누르면 하나씩 세어 줘요',
      hint: ['나이는 \'살\'로 세요.', `${n}살 → ${counterNum(n)} 살`],
      choices: textChoices(right, [`${sino(n)} 살`, `${counterNum(n)} 개`, `${counterNum(n+1)} 살`]),
      answer: right, done: right, answerSay: right,
      render(scene){
        scene.style.setProperty('--sz', '44px');
        const g = div('group'); g.appendChild(emojiEl('🎂', 0));
        const c = div('group'); for(let i=0;i<n;i++) c.appendChild(emojiEl('🕯️', i));
        scene.append(g, c);
        g.firstChild.onclick = null;
      } };
  }
  if(sub === 'date'){
    const mo = Math.random() < 0.4 ? pick([6,10]) : rand(1,12), d = rand(1,28);
    const right = `${monthWord(mo)} ${sino(d)} 일`;
    const badMonth = mo === 6 ? '육월' : mo === 10 ? '십월' : `${counterNum(mo)} 월`;
    return { kind:'unit', text: '달력의 날짜를 어떻게 읽을까요?', say: '달력의 날짜를 어떻게 읽을지 골라 보세요.',
      eq: '', tapHint: '',
      hint: ['날짜는 \'일, 이, 삼 …\'으로 읽어요.', '6월은 \'유월\', 10월은 \'시월\'이라고 읽어요.'],
      choices: textChoices(right, [`${badMonth} ${sino(d)} 일`, `${monthWord(mo)} ${counterNum(d)} 일`, `${badMonth} ${counterNum(d)} 일`]),
      answer: right, done: `${mo}월 ${d}일 → ${right}`, answerSay: right,
      render(scene){
        const c = div('cal pop');
        const a = div('m'); a.textContent = `${mo}월`;
        const b = div('d'); b.textContent = d;
        c.append(a, b); scene.appendChild(c);
      } };
  }

  // 물건 세기
  const pool = THINGS.filter(t => t.lv <= level);
  const usePoke = Math.random() < 0.2;
  const [pid, pname] = pick(POKEMON);
  const t = usePoke ? {n: pname, c: '마리', poke: pid} : pick(pool);
  const n = rand(1, maxN);
  const hint = [`${eunneun(t.n)} '${t.c}'${euro(t.c).slice(t.c.length)} 세요.`, numHint];
  const render = scene => {
    scene.style.setProperty('--sz', n <= 5 ? '60px' : n <= 10 ? '48px' : '40px');
    const g = div('group');
    for(let i=0;i<n;i++) g.appendChild(t.poke ? monEl(t.poke, i, false) : emojiEl(t.e, i));
    scene.appendChild(g);
  };
  const right = `${t.n} ${counterNum(n)} ${t.c}`;
  const others = shuffle(COUNTERS.filter(c => c !== t.c));
  const base = { kind:'unit', render, hint, tapHint: '그림을 누르면 하나씩 세어 줘요', done: right, answerSay: right };

  if(sub === 'blank'){
    return { ...base, text: '빈칸에 알맞은 말을 골라요.', say: `${t.n} ${counterNum(n)}, 무엇이라고 셀까요? 알맞은 말을 골라 보세요.`,
      eq: `${t.n} ${counterNum(n)} ( ? )`,
      choices: textChoices(t.c, others.slice(0, 3)), answer: t.c };
  }
  const badNum = (n%10 >= 1 && n%10 <= 4 && Math.random() < 0.5) ? nativeNum(n) : sino(n);
  return { ...base, text: '어떻게 세면 좋을까요?', say: '그림을 보고, 알맞게 센 말을 골라 보세요.', eq: '',
    choices: textChoices(right, [`${t.n} ${counterNum(n)} ${others[0]}`, `${t.n} ${badNum} ${t.c}`,
      `${t.n} ${counterNum(n < maxN ? n+1 : n-1)} ${t.c}`]),
    answer: right };
}

const MAKERS = {two: qTwo, mul: qMul, clock: qClock, unit: qUnit};
const makeQuestion = () => MAKERS[mode === 'mix' ? pick(Object.keys(MAKERS)) : mode]();

// ---------- 홈 ----------
// 파트너 카드 (홈 화면, 결과 화면)
function partnerCard(box, {gained = 0, ups = 0, home = false} = {}){
  const p = P(); box.innerHTML = '';
  if(!p){
    box.appendChild(pic(25));
    const info = div('partner-info');
    info.innerHTML = '<h2>함께할 포켓몬을 골라요</h2><p>문제를 맞히면 파트너의 레벨이 오르고, 진화할 수 있어요!</p>';
    const b = document.createElement('button'); b.className = 'ghost'; b.textContent = '파트너 고르기';
    b.onclick = showPartners; info.appendChild(b);
    box.appendChild(info);
    return;
  }
  box.appendChild(pic(p.id));
  const info = div('partner-info');
  const h = document.createElement('h2'); h.textContent = NAME[p.id];
  const lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = `Lv.${p.lv}`; h.appendChild(lv);
  const bar = div('expbar'); const fill = document.createElement('i'); bar.appendChild(fill);
  const t = document.createElement('p');
  const e = EVO[p.id];
  if(gained){
    t.innerHTML = `경험치 +${gained}` + (ups ? ` · <span class="levelup">레벨 업! Lv.${p.lv}</span>` : '');
  } else {
    t.textContent = e ? (p.lv >= e[0] ? `${euro(NAME[e[1]])} 진화할 수 있어요!` : `Lv.${e[0]}${hasBatchim(sino(e[0])) ? '이' : '가'} 되면 ${euro(NAME[e[1]])} 진화해요!`) : '마지막 모습까지 진화했어요!';
  }
  info.append(h, bar, t);
  if(home){ const b = document.createElement('button'); b.className = 'ghost'; b.textContent = '파트너 바꾸기'; b.onclick = showPartners; info.appendChild(b); }
  box.appendChild(info);
  requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = `${Math.round(p.exp / needExp(p.lv) * 100)}%`));
}
function renderHero(){ partnerCard($('partnerCard'), {home: true}); }
function renderMini(){
  const p = P(), m = $('mini'); m.innerHTML = '';
  if(!p) return;
  m.appendChild(pic(p.id));
  const s = document.createElement('span'); s.textContent = `Lv.${p.lv}`; m.appendChild(s);
}
let afterPartner = null;
function showPartners(){
  const box = $('starters'); box.innerHTML = '';
  STARTERS.forEach(no => {
    const mine = partners[no];
    const b = document.createElement('button');
    b.className = 'starter' + (String(no) === String(active) ? ' sel' : '');
    b.appendChild(pic(mine ? mine.id : no));
    b.appendChild(document.createTextNode(mine ? `${NAME[mine.id]} Lv.${mine.lv}` : NAME[no]));
    const sm = document.createElement('small'); sm.textContent = evoLine(no); b.appendChild(sm);
    b.onclick = () => {
      if(!partners[no]) partners[no] = {id: no, lv: 1, exp: 0};
      if(!caught[no]){ caught[no] = 1; save('pkmath.caught', caught); }
      active = no; savePartners(); sfx.catch();
      speak(`${NAME[partners[no].id]}, 너로 정했다!`);
      renderHero();
      const go = afterPartner; afterPartner = null;
      go ? go() : show('home');
    };
    box.appendChild(b);
  });
  show('partnerScreen');
  speak('함께할 포켓몬을 골라 보세요.');
}
renderHero();

// 그림 설정 (공식 이미지는 앱 버전에서만)
function renderArtBox(){
  const box = $('artBox');
  if(BUILD !== 'app'){
    box.innerHTML = '<p class="voice-info">직접 그린 그림을 써요. 아이패드 홈 화면 앱에서는 공식 이미지로 바꿀 수 있어요.</p>';
    return;
  }
  box.innerHTML = `
    <div class="voice-row">
      <select id="artSel" aria-label="그림 고르기">
        <option value="drawn">직접 그린 그림 (기본)</option>
        <option value="official">공식 이미지</option>
      </select>
      <button class="speak" id="artFetch">그림 미리 받기</button>
    </div>
    <p class="voice-info" id="artMsg"></p>
    <p class="voice-info">공식 이미지는 포켓몬 회사(닌텐도·크리처스·게임프리크)의 저작물이에요. 이 앱에는 들어 있지 않고, 켜면 아이패드가 인터넷의 PokeAPI 공개 그림 저장소에서 직접 받아 이 기기에만 보관해요. 가족끼리 집에서만 쓰는 용도로 써 주세요. 인터넷 없이 쓰려면 켠 다음 '그림 미리 받기'를 눌러 주세요.</p>`;
  const sel = $('artSel');
  sel.value = officialArt ? 'official' : 'drawn';
  $('artFetch').disabled = !officialArt;
  sel.onchange = () => { officialArt = sel.value === 'official'; save('pkmath.officialArt', officialArt); renderArtBox(); renderHero(); };
  $('artFetch').onclick = async () => {
    let done = 0, fail = 0;
    $('artFetch').disabled = true;
    for(const {no: id} of MON){
      try{ const r = await fetch(ART(id), {mode:'cors'}); if(!r.ok) throw 0; await r.blob(); done++; }catch{ fail++; }
      $('artMsg').textContent = `받는 중… ${done + fail}/${MON.length}`;
    }
    $('artMsg').textContent = fail ? `${done}개를 받았어요. ${fail}개는 인터넷이 될 때 다시 눌러 주세요.` : `${done}개를 모두 받았어요. 이제 인터넷 없이도 보여요.`;
    $('artFetch').disabled = false;
  };
}
renderArtBox();
function updateLevelDesc(){ document.querySelectorAll('.level').forEach((b,i) => b.querySelector('small').textContent = LEVEL_DESC[mode][i]); }
updateLevelDesc();
$('modes').onclick = e => { const b = e.target.closest('.mode'); if(!b) return; mode = b.dataset.mode; document.querySelectorAll('.mode').forEach(x => x.classList.toggle('sel', x===b)); updateLevelDesc(); sfx.tap(); };
$('levels').onclick = e => { const b = e.target.closest('.level'); if(!b) return; level = +b.dataset.level; document.querySelectorAll('.level').forEach(x => x.classList.toggle('sel', x===b)); sfx.tap(); };
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; setTimeout(pickVoice, 500); }
$('voiceSel').onchange = e => { savedVoice = e.target.value; save('pkmath.voice', savedVoice); pickVoice(); speak('안녕! 나랑 같이 숫자 놀이 하자!'); };
$('voiceTest').onclick = () => { if(!soundOn){ soundOn = true; save('pkmath.sound', true); $('soundBtn').textContent = '🔊'; } speak('피카츄가 스물세 마리 있어요. 지금은 세 시 삼십 분이에요.'); };
$('soundBtn').textContent = soundOn ? '🔊' : '🔇';
$('soundBtn').onclick = () => { soundOn = !soundOn; save('pkmath.sound', soundOn); $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; if(!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); };

// ---------- 게임 ----------
let qi = 0, results = [], current = null, newlyCaught = [], locked = false, roundExp = 0, roundUps = 0;

function startRound(){
  if(!P()){ afterPartner = startRound; showPartners(); return; }
  qi = 0; results = []; newlyCaught = []; roundExp = 0; roundUps = 0;
  renderMini();
  show('game');
  nextQuestion();
}

function renderDots(){
  $('dots').innerHTML = '';
  for(let i=0;i<ROUND;i++){
    const d = div('dot' + (results[i]===true ? ' ok' : results[i]===false ? ' retry' : '') + (i===qi ? ' now' : ''));
    $('dots').appendChild(d);
  }
}

function showHint(){
  const box = $('hintBox'); box.innerHTML = '';
  current.hint.forEach(line => { const d = document.createElement('div'); d.textContent = line; box.appendChild(d); });
  box.hidden = false; $('hintBtn').hidden = true;
}

function nextQuestion(){
  current = makeQuestion(); counted = 0; locked = false;
  const q = current;
  renderDots();
  $('question').textContent = q.text;
  $('equation').textContent = q.eq;
  $('equation').hidden = !q.eq;
  $('equation').classList.toggle('long', q.eq.length > 10);
  $('tapHint').textContent = q.tapHint;
  $('tapHint').hidden = !q.tapHint;
  $('hintBox').hidden = true; $('hintBtn').hidden = false;

  const scene = $('scene'); scene.innerHTML = ''; scene.style.removeProperty('--sz');
  q.render(scene);

  const ans = $('answers'); ans.innerHTML = '';
  ans.classList.toggle('text', q.choices.some(c => c.label.length > 3));
  q.choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.textContent = c.label;
    if(c.sub){ const s = document.createElement('small'); s.textContent = c.sub; b.appendChild(s); }
    b.onclick = () => choose(c.key, b);
    ans.appendChild(b);
  });
  speak(q.say);
}

function choose(key, btn){
  if(locked || btn.classList.contains('wrong')) return;
  const q = current;
  if(key !== q.answer){
    btn.classList.add('wrong'); sfx.wrong();
    if(results[qi] === undefined) results[qi] = false;
    renderDots();
    if($('hintBox').hidden){ showHint(); speak('힌트를 보고 다시 생각해 볼까요?'); }
    else speak('다시 한 번 생각해 볼까요?');
    return;
  }
  locked = true;
  btn.classList.add('right'); sfx.right();
  const firstTry = results[qi] === undefined;
  results[qi] = firstTry;
  renderDots();
  setTimeout(() => showReward(firstTry), 500);
}

function showReward(firstTry){
  const q = current;
  const card = $('popCard'); card.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = firstTry ? '정답이에요! 🎉' : '맞았어요! 👏';
  const p = document.createElement('p'); p.textContent = q.done;
  card.append(h, p);
  let say = `정답! ${q.answerSay}.`;
  // 파트너 경험치
  const gained = firstTry ? EXP_FIRST : EXP_RETRY;
  const ups = gainExp(gained);
  roundExp += gained; roundUps += ups;
  renderMini();
  const ex = document.createElement('p');
  ex.innerHTML = `${NAME[P().id]} 경험치 +${gained}` + (ups ? ` · <span class="levelup">레벨 업! Lv.${P().lv}</span>` : '');
  card.appendChild(ex);
  if(ups) say += ` ${NAME[P().id]}의 레벨이 올랐어요!`;

  if(firstTry){
    // 아직 못 잡은 포켓몬을 먼저 만나게
    const pool = Math.random() < 0.06 ? RARE : POKEMON;
    const notYet = pool.filter(([id]) => !caught[id]);
    const [id, name] = pick(notYet.length ? notYet : pool);
    const isNew = !caught[id];
    caught[id] = (caught[id]||0) + 1; save('pkmath.caught', caught);
    newlyCaught.push(id);
    card.appendChild(pic(id));
    const c = document.createElement('p');
    const b = document.createElement('b'); b.textContent = `${eulreul(name)} 잡았어요!`;
    c.appendChild(b);
    if(isNew){ const s = document.createElement('span'); s.className = 'new'; s.textContent = 'NEW'; c.appendChild(s); }
    card.appendChild(c);
    say += ` ${eulreul(name)} 잡았어요!`;
    setTimeout(sfx.catch, 250);
  } else {
    const c = document.createElement('p'); c.textContent = '다음엔 한 번에 맞혀서 포켓몬을 잡아 보자!';
    card.appendChild(c);
  }
  const next = document.createElement('button'); next.className = 'next';
  next.textContent = qi + 1 < ROUND ? '다음 문제 ▶' : '결과 보기 ▶';
  next.onclick = () => { $('overlay').classList.remove('on'); qi++; qi < ROUND ? nextQuestion() : showResult(); };
  card.appendChild(next);
  $('overlay').classList.add('on');
  speak(say);
}

function showResult(){
  const score = results.filter(r => r === true).length;
  const stars = score >= 9 ? 3 : score >= 6 ? 2 : 1;
  $('stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  $('resultScore').textContent = `${ROUND}문제 중 ${score}문제를 한 번에 맞혔어요!`;
  // 끝까지 풀면 별만큼 보너스 경험치
  const bonus = stars * 10;
  roundUps += gainExp(bonus); roundExp += bonus;
  partnerCard($('expBox'), {gained: roundExp, ups: roundUps});
  renderEvo();
  const row = $('caughtRow'); row.innerHTML = '';
  if(!newlyCaught.length) row.textContent = '다음엔 꼭 잡아 보자!';
  newlyCaught.forEach(id => row.appendChild(pic(id)));
  show('result');
  if(!evoReady()) speak(stars === 3 ? '최고예요! 포켓몬 마스터!' : stars === 2 ? '잘했어요!' : '수고했어요! 또 해 볼까요?');
}

// 진화: 레벨이 되면 결과 화면에서 진화시킬지 골라요
function renderEvo(){
  const box = $('evoBox'), to = evoReady();
  box.hidden = !to; box.innerHTML = '';
  if(!to) return;
  const p = P(), from = p.id;
  const pc = div('evo-pic'); pc.appendChild(pic(from));
  const h = document.createElement('h3'); h.textContent = `어라…? ${NAME[from]}의 모습이…!`;
  const t = document.createElement('p'); t.textContent = `${euro(NAME[to])} 진화할 수 있어요!`;
  const row = div('row-btns');
  const yes = document.createElement('button'); yes.className = 'start'; yes.textContent = '진화시키기!';
  const no = document.createElement('button'); no.className = 'ghost'; no.textContent = '지금 모습이 좋아';
  row.append(no, yes);
  box.append(pc, h, t, row);
  speak(`어라? ${NAME[from]}의 모습이!`);
  no.onclick = () => { box.hidden = true; };
  yes.onclick = () => {
    row.remove(); sfx.catch();
    pc.classList.add('evo-flash');
    setTimeout(() => pc.replaceChildren(pic(to)), 600);
    setTimeout(() => {
      p.id = to; savePartners();
      caught[to] = (caught[to]||0) + 1; save('pkmath.caught', caught);
      h.textContent = `축하해요! ${eunneun(NAME[from])} ${euro(NAME[to])} 진화했어요!`;
      t.textContent = '도감에도 새로 등록됐어요!';
      speak(`축하해요! ${euro(NAME[to])} 진화했어요!`);
      partnerCard($('expBox'));
      renderHero();
    }, 1250);
  };
}

// ---------- 도감 ----------
let dexReturn = 'home';
function showDex(){
  const now = document.querySelector('.screen.on').id;
  if(now !== 'dexScreen') dexReturn = now;
  const dex = $('dex'); dex.innerHTML = '';
  const all = [...MON].sort((a,b) => a.no - b.no).map(m => [m.no, m.n]);
  const have = all.filter(([id]) => caught[id]).length;
  $('dexTitle').textContent = `포켓몬 도감 ${have}/${all.length}`;
  all.forEach(([id, name]) => {
    const d = div('dex-item' + (caught[id] ? '' : ' no'));
    d.appendChild(pic(id));
    const s = document.createElement('span'); s.textContent = caught[id] ? name : '???';
    d.appendChild(s);
    if(caught[id]){ const c = document.createElement('span'); c.className = 'cnt'; c.textContent = `${caught[id]}번 잡음`; d.appendChild(c); d.onclick = () => speak(name); }
    dex.appendChild(d);
  });
  show('dexScreen');
}
// 확인 창 대신 같은 버튼을 한 번 더 누르게 해요
function twoTap(btn, ask, action){
  const label = btn.textContent;
  let timer = null;
  const reset = () => { clearTimeout(timer); timer = null; btn.textContent = label; };
  btn.onclick = () => {
    if(timer){ reset(); action(); return; }
    btn.textContent = ask;
    timer = setTimeout(reset, 3000);
  };
}
$('dexBtn').onclick = showDex;
$('dexBack').onclick = () => show(dexReturn);
twoTap($('resetDex'), '정말 비울까요? 한 번 더 누르세요', () => { caught = {}; save('pkmath.caught', caught); showDex(); });

// ---------- 버튼 ----------
$('startBtn').onclick = () => { sfx.tap(); startRound(); };
$('again').onclick = startRound;
$('toHome').onclick = () => { renderHero(); show('home'); };
twoTap($('homeBtn'), '🏠 그만할까요?', () => { if('speechSynthesis' in window) speechSynthesis.cancel(); renderHero(); show('home'); });
$('hintBtn').onclick = showHint;
$('replayBtn').onclick = () => current && speak(current.say);
// 홈 화면 앱: 한 번 열면 인터넷 없이도 열리게
if(BUILD === 'app'){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
