<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 동전 가게</title>
<meta name="theme-color" content="#ffe39a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동전 가게">
<link rel="manifest" href="poke-shop.webmanifest">
<link rel="apple-touch-icon" href="icons/shop-192.png">
<link rel="icon" href="icons/shop-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe39a; --bg2:#fff7e2; --ink:#2e2a24; --card:#ffffff; --soft:#fff3d6; --line:rgba(0,0,0,.1);
  --accent:#f2672e; --good:#22c55e; --gold:#ffcf33; --shadow:0 6px 0 rgba(0,0,0,.14); --wood:#c98a4b; --tag:#fff0b8; --tagink:#5b4500;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#3a2e16; --bg2:#231f2e; --ink:#f6efe2; --card:#3a3428; --soft:#2d2820; --line:rgba(255,255,255,.14); --wood:#8a5a2c; --tag:#5b4a1c; --tagink:#ffe9a8; }
}
:root[data-theme="dark"]{ --bg1:#3a2e16; --bg2:#231f2e; --ink:#f6efe2; --card:#3a3428; --soft:#2d2820; --line:rgba(255,255,255,.14); --wood:#8a5a2c; --tag:#5b4a1c; --tagink:#ffe9a8; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);background-image:linear-gradient(var(--bg1),var(--bg2));overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{font-weight:normal;margin:0}
#app{height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.big-btn{font-size:24px;padding:12px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;box-shadow:var(--shadow);min-height:60px}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.small{font-size:19px;padding:8px 16px;min-height:52px}
.big-btn:disabled{opacity:.45}
.big-btn.pulse,.glow-btn{animation:pulse 1s ease-in-out infinite}
.big-btn:active:not(:disabled),.icon-btn:active,.qc:active,.tcoin:active,.cbtn:active,.pcard button:active,.mcard:active{transform:translateY(3px)}
.icon-btn{font-size:26px;width:56px;height:56px;border:none;border-radius:18px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;flex:none}
.icon-btn.holding::after{content:"";position:absolute;left:0;bottom:0;height:6px;background:var(--accent);animation:hold 1s linear forwards}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 16px 4px 12px;font-size:24px;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.pill.bump{animation:pop .4s}
.bar{display:flex;align-items:center;gap:10px;flex:none}
.sp{flex:1}
@keyframes hold{from{width:0}to{width:100%}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(0) invert(1)}}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-90px);opacity:0}}
@keyframes walkin{from{transform:translateX(60vw)}to{transform:none}}

/* ---------- 포켓몬 그림 ---------- */
.im{position:relative}
.pic{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.pic.sil{filter:brightness(0);opacity:.3}
.noimg{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c,#f59e0b);color:#fff;font-size:calc(var(--sz,80px)*.42);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.noimg.sil{background:#888;opacity:.3}
.shfb{filter:saturate(1.7) hue-rotate(35deg) drop-shadow(0 0 8px #ffd54a)}
.spark{position:absolute;right:-4%;top:-4%;font-size:calc(var(--sz,80px)*.3);line-height:1;animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
.dots i.sh{border-radius:2px;transform:rotate(45deg) scale(.85)}
.dots i.sh.on{background:#ffb703;box-shadow:0 0 6px #ffd54a}

/* ---------- 돈 (실제 한국 돈의 색·크기 비율을 본뜬 그림 또는 어른이 찍은 사진) ---------- */
.coin{display:inline-block;flex:none;vertical-align:middle;border-radius:50%;width:calc(var(--cw)*var(--k,1));height:calc(var(--cw)*var(--k,1));filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.coin.d10{--cw:44px} .coin.d50{--cw:52px} .coin.d100{--cw:58px} .coin.d500{--cw:64px}
.bill{display:inline-block;flex:none;vertical-align:middle;width:calc(var(--bw)*var(--k,1));height:calc(50px*var(--k,1));border-radius:calc(4px*var(--k,1));filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.bill.d1000{--bw:100px} .bill.d5000{--bw:104px} .bill.d10000{--bw:109px}
img.photo{object-fit:cover;background:#ddd}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mcell{background:var(--soft);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px}
.mcell .pile{min-height:70px}
.mcell .row{gap:6px}
.mcell button{border:none;border-radius:12px;background:var(--card);padding:6px 10px;font-size:16px;min-height:40px}
.fact{font-size:20px;margin:6px 0}
.pile{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:560px}
.money{font-size:clamp(30px,6vmin,46px)}
.money small{font-size:.6em}

/* ---------- 처음 화면 ---------- */
.home{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.home h1{font-size:clamp(36px,7vw,64px);text-shadow:0 4px 0 rgba(0,0,0,.08)}
.partner{width:clamp(140px,26vmin,230px);aspect-ratio:1;--sz:clamp(140px,26vmin,230px);animation:bob 1.8s ease-in-out infinite}
.pname{font-size:26px}
.menu{display:grid;gap:12px;width:min(560px,100%);grid-template-columns:1fr 1fr}
.menu .big-btn{font-size:26px;min-height:80px}
.menu .big-btn.wide{grid-column:1/-1}
.banner{background:#fff3c4;color:#5b4500;border-radius:18px;padding:12px 16px;max-width:560px;font-size:18px;line-height:1.5}
.goal{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.1);width:min(560px,100%);text-align:left}
.goal .im{width:56px;height:56px;--sz:56px;flex:none}
.goal .gt{flex:1;font-size:20px}
.goal .gt small{display:block;font-size:16px;opacity:.7}
.gbar{height:14px;background:var(--soft);border-radius:8px;overflow:hidden;margin-top:4px}
.gbar i{display:block;height:100%;background:var(--good);border-radius:8px}

/* ---------- 목록 화면 ---------- */
.list{flex:1;overflow-y:auto}
.list h2{font-size:28px;margin:6px 0 4px;text-align:center}
.list .sub{text-align:center;font-size:18px;opacity:.7;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:12px}
.pcard,.mcard{border:4px solid transparent;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:21px;text-align:center}
.pcard .im,.mcard .im{width:100px;height:100px;--sz:100px}
.pcard small,.mcard small{font-size:15px;opacity:.65}
.pcard.on{border-color:var(--accent)}
.pcard button{border:none;border-radius:14px;background:var(--soft);font-size:17px;padding:8px 10px;width:100%;min-height:44px}
.pcard button.evob{background:var(--accent);color:#fff}
.pcard button.evob.far{background:var(--soft);color:var(--ink)}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.tag{display:inline-block;background:var(--tag);color:var(--tagink);border-radius:12px;padding:3px 12px;font-size:20px}
.mcard.can .tag{background:#c9f5d6;color:#14532d}
.mcard .need{font-size:15px;opacity:.75}
.mcard .gbar{width:90%}

/* ---------- 가게 ---------- */
.work{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.scene{flex:none;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:linear-gradient(#bfe6ff,#e9f6ff);border-radius:24px;padding:10px 16px 0;overflow:hidden;height:clamp(150px,27vh,230px)}
:root[data-theme="dark"] .scene{background:linear-gradient(#26405a,#1d2d3d)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .scene{background:linear-gradient(#26405a,#1d2d3d)} }
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--wood);box-shadow:inset 0 6px 0 rgba(255,255,255,.25)}
.scene .keeper,.scene .guest{position:relative;z-index:1;flex:none;width:clamp(76px,min(24%,18vh),150px);aspect-ratio:1;margin-bottom:4%;--sz:clamp(76px,14vh,140px)}
.scene .guest{animation:walkin .6s ease-out}
.scene .sign{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--card);border-radius:14px;padding:4px 14px;font-size:18px;z-index:2;white-space:nowrap}
.bubble{position:relative;z-index:2;align-self:center;background:#fff;color:#2e2a24;border-radius:20px;padding:10px 16px;font-size:clamp(20px,3.6vmin,28px);box-shadow:0 4px 0 rgba(0,0,0,.12);max-width:46%;text-align:center;animation:pop .3s}
.bubble .ie{font-size:1.5em;line-height:1}
.dayn{display:flex;gap:6px}
.dayn i{width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.dayn i.on{background:var(--good)}
.qbox{flex:1;min-height:0;overflow:auto;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:12px;text-align:center;display:flex;flex-direction:column;gap:10px}
.qline{font-size:clamp(22px,4vmin,30px)}
.qq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--soft);border-radius:22px;padding:12px}
.qq .note{font-size:18px;opacity:.65}
.qq .eqn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-size:clamp(26px,5vmin,40px)}
.qq .ie{font-size:clamp(50px,9vmin,72px);line-height:1}
.qch{display:grid;gap:10px;grid-template-columns:repeat(var(--n,3),1fr)}
.qc{border:4px solid transparent;background:#fff6dc;color:#3a2d10;border-radius:22px;min-height:90px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.qc .cm{font-weight:normal;font-size:clamp(28px,5.4vmin,44px)} .qc .cm small{font-size:.6em}
.qc .ie{font-size:48px;line-height:1}
.qc .pile{--k:.78}
.qc.dim{opacity:.25;filter:grayscale(1)}
.qc.glow,.glow{border-color:var(--gold)!important;box-shadow:0 0 0 4px var(--gold),0 0 24px var(--gold)!important;animation:pulse 1s ease-in-out infinite}
.qc.ok{background:#c9f5d6;border-color:var(--good)}
.plus{position:fixed;left:50%;top:40%;font-size:44px;color:#15803d;text-shadow:0 3px 0 #fff;z-index:65;animation:rise 1.4s ease-out forwards;pointer-events:none}

/* ---------- 계산대 (돈 내기) ---------- */
.pay{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.payhead{display:flex;align-items:center;justify-content:center;gap:14px;flex:none}
.payhead .im{width:clamp(80px,15vmin,130px);height:clamp(80px,15vmin,130px);--sz:110px}
.payhead .ptitle{font-size:clamp(22px,4vmin,30px)}
.payhead .ptag{font-size:clamp(34px,7vmin,54px);color:var(--accent)}
.counter{flex:1;min-height:110px;overflow:auto;background:var(--wood);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:inset 0 6px 0 rgba(255,255,255,.2)}
.clabel{background:var(--card);border-radius:14px;padding:4px 14px;font-size:22px}
.clabel b{font-weight:normal;color:var(--accent)}
.cbtn{border:none;background:none;padding:0;border-radius:50%}
.cbtn.glow{border-radius:12px}
.tray{flex:none;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--card);border-radius:24px;padding:12px;box-shadow:var(--shadow)}
.tray .label{width:100%;text-align:center;font-size:18px;opacity:.7}
.tray{max-height:40vh;overflow:auto}
.pay>.row{flex-wrap:nowrap;flex:none}
.tcoin{border:4px solid transparent;background:var(--soft);border-radius:18px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:72px}
.tcoin .n{font-size:22px}
.tcoin.glow{border-color:var(--gold)}

/* ---------- 지갑 · 바꾸기 ---------- */
.wrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.1);margin:0 auto 10px;max-width:560px;font-size:22px}
.wrow .cw{width:120px;display:grid;place-items:center}
.wrow .sum{margin-left:auto;opacity:.8}
.wtotal{text-align:center;font-size:clamp(30px,6vmin,46px);margin:6px 0 12px}
.xrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--soft);border-radius:18px;padding:8px;margin:8px 0}
.xrow .big-btn{font-size:17px;min-height:48px;padding:6px 12px}
.eqrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:30px;margin:6px 0}
.lesson{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lesson button{border:4px solid transparent;background:var(--soft);border-radius:18px;padding:10px;min-height:80px;display:grid;place-items:center}
.lesson button.on{border-color:var(--accent)}

/* ---------- 창 ---------- */
#modal{position:fixed;inset:0;background:rgba(25,20,10,.5);display:grid;place-items:center;z-index:50;padding:14px}
.sheet{background:var(--card);border-radius:28px;padding:18px;max-width:700px;width:100%;max-height:92dvh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.2);text-align:center;animation:pop .25s}
.sheet h2{font-size:30px;margin-bottom:10px}
.sheet p{font-size:20px;line-height:1.5;margin:8px 0}
.sheet .qbox{box-shadow:none;padding:0}
.evo{width:clamp(160px,34vmin,260px);aspect-ratio:1;margin:8px auto;--sz:clamp(160px,34vmin,260px)}
.evo.flash{animation:flash .35s linear infinite}
.reward{font-size:80px;line-height:1.1}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.egrid button{border:4px solid transparent;background:var(--soft);border-radius:18px;padding:6px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.egrid .im{width:70px;height:70px;--sz:70px}
.set{text-align:left}
.set h3{font-size:21px;margin:16px 0 6px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:12px;padding:10px 6px;font-size:19px}
.seg button.on{background:var(--accent);color:#fff}
.set .note{font-size:15px;opacity:.7;margin:4px 2px;line-height:1.5}
.diffs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.diffs button{border:3px solid transparent;background:var(--soft);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.diffs .e{font-size:34px;line-height:1.1} .diffs b{font-weight:normal;font-size:20px} .diffs small{font-size:14px;opacity:.7;text-align:center}
.diffs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--soft))}
.dlbar{height:14px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.dlbar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti{position:fixed;top:-60px;font-size:34px;animation:fall 1.8s linear forwards}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:22px;padding:12px 20px;border-radius:18px;z-index:70;max-width:90vw;text-align:center;animation:pop .2s}
.vrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.vrow span{width:58px;font-size:19px;flex:none}
.vrow select{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 8px;border-radius:12px;border:2px solid rgba(0,0,0,.15);background:#fff;color:#26263a}
.vrow .icon-btn{width:50px;height:50px;font-size:20px}
@media (max-width:600px){
  .pill{font-size:19px;min-height:46px;padding:4px 12px} .icon-btn{width:48px;height:48px;font-size:22px}
  .menu .big-btn{font-size:21px;min-height:66px} .qc{min-height:76px} .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tray{--k:.8;gap:8px;padding:10px} .tcoin{min-height:60px;padding:4px 8px} .pay>.row .big-btn{font-size:17px;padding:8px 12px;min-height:52px}
  .scene .sign{display:none} .qch.n4{grid-template-columns:1fr 1fr} .egrid{grid-template-columns:repeat(2,1fr)} .wrow .cw{width:90px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="fx"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sum=a=>a.reduce((s,v)=>s+v,0);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ======================================================================
   포켓몬 (그림은 앱에 들어 있지 않음: 어른 설정에서 기기로 받음)
   p: 데려오는 값(단위 수) · evo: 진화 값(없으면 p로 계산) · starter: 처음에 고를 수 있음
   ====================================================================== */
const FAM=[
  {ids:[1,2,3],ko:['이상해씨','이상해풀','이상해꽃'],c:'#4ade80',p:10,starter:1},
  {ids:[4,5,6],ko:['파이리','리자드','리자몽'],c:'#fb923c',p:10,starter:1},
  {ids:[7,8,9],ko:['꼬부기','어니부기','거북왕'],c:'#60a5fa',p:10,starter:1},
  {ids:[172,25,26],ko:['피츄','피카츄','라이츄'],c:'#facc15',p:10,starter:1},
  {ids:[133],ko:['이브이'],c:'#c99a6b',p:12,eevee:1,starter:1},
  {ids:[129,130],ko:['잉어킹','갸라도스'],c:'#f87171',p:2,evo:[20,25]},
  {ids:[10,11,12],ko:['캐터피','단데기','버터플'],c:'#a3e635',p:3},
  {ids:[16,17,18],ko:['구구','피죤','피죤투'],c:'#d6a96b',p:4},

const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open('pokeshop',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img',mode), r=fn(t.objectStore('img'));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return {
    put:(k,v)=>tx('readwrite',o=>o.put(v,k)),
    del:k=>tx('readwrite',o=>o.delete(k)),
    all:async()=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img'), out=[], c=t.objectStore('img').openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } };
      t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); },
  };
})();
const IMG=new Map();
async function loadImages(){ try{ for(const [k,b] of await idb.all()) if(!IMG.has(k)&&b) IMG.set(k,URL.createObjectURL(b)); }catch(e){} }
const ART=(id,dir='')=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dir}${id}.png`;
async function shrink(blob){ // 기기에 저장하기 전에 256px로 줄이기
  const u=URL.createObjectURL(blob);
  try{ const im=new Image(); im.src=u; await im.decode();
    const Z=256, c=document.createElement('canvas'); c.width=c.height=Z;
    const k=Math.min(Z/im.naturalWidth,Z/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
    c.getContext('2d').drawImage(im,(Z-w)/2,(Z-h)/2,w,h);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
  } finally{ URL.revokeObjectURL(u); }
}
async function downloadImages(progress){
  const jobs=IMG_JOBS.filter(([k])=>!IMG.has(k)), total=jobs.length; let done=0, fail=0;
  const worker=async()=>{ while(jobs.length){ const [k,id,dir]=jobs.shift();
    try{ const r=await fetch(ART(id,dir)); if(!r.ok) throw new Error(r.status); const b=await shrink(await r.blob()); await idb.put(k,b); IMG.set(k,URL.createObjectURL(b)); }
    catch(e){ fail++; }
    progress(++done,total); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {total,fail};
}

  const sp=shiny?'<span class="spark">✨</span>':'', su=shiny&&IMG.get('s'+id), u=su||IMG.get('n'+id);

}

function sino(n){

  const D=['','일','이','삼','사','오','육','칠','팔','구'];
  const part=x=>[[1000,'천'],[100,'백'],[10,'십'],[1,'']].map(([u,w])=>{ const d=Math.floor(x/u)%10; return d?(d===1&&u>1?'':D[d])+w:''; }).join('');
  const man=Math.floor(n/10000), rest=n%10000;
  return (man?(man===1?'':part(man))+'만':'')+part(rest);
}

function greedy(amount,dens=LV[S.set.diff].den){ const out=[];

function solve(amount,have){
  if(amount===0) return {}; if(amount<0||amount%10) return null;
  const N=amount/10; let best=new Array(N+1).fill(Infinity); best[0]=0; const layers=[];
  for(const d of DEN){ const c=have[d]||0, u=d/10; if(!c||u>N) continue;
    const prev=best.slice(), take=new Uint16Array(N+1);
    for(let a=u;a<=N;a++) for(let k=1;k<=c&&k*u<=a;k++){ const v=prev[a-k*u]+k; if(v<best[a]){ best[a]=v; take[a]=k; } }
    layers.push([d,take]); }
  if(best[N]===Infinity) return null;
  const out={}; let a=N;
  for(let i=layers.length-1;i>=0;i--){ const [d,take]=layers[i], k=take[a]; if(k){ out[d]=k; a-=k*d/10; } }
  return out;
}

  find:(E,n)=>{ const t=E===0?pick([100,100,1000]):pick(LV[E].den), pool=E===0?[10,50,100,500,1000]:DEN.slice(0,E>=3?7:5), it=pick(ITEMS);
    const list=shuffle([t,...shuffle(pool.filter(d=>d!==t)).slice(0,n-1)]);
    return {item:it,bubble:`<span class="ie">${it.e}</span> ${won(t)}이에요!`,ask:`${jo(coinName(t),'은','는')} 어느 것일까요?`,
      q:`<div class="money">${moneyHTML(t)}</div><div class="note">돈에 적힌 숫자를 잘 봐요</div>`,
      say:[K(`${it.n} 값은 ${wonSay(t)}이에요.`),K(`${jo(coinName(t),'은','는')} 어느 것일까요?`)],
      choices:list.map(d=>({h:`<div class="pile" style="--k:1.15">${coin(d)}</div>`,ok:d===t,read:[K(coinName(d))]})),
      name:[K(jo(coinName(t),'이에요!','예요!'))],hint:[K(`${sino(t)}이라고 적힌 돈을 찾아요.`)],earn:[t]}; },
  more:(E,n)=>{ let a,b;
    if(E<=1){ a=pick([[500],[500],[500,100],[1000]]); const ta=sum(a);
      const ks=(ta===1000?[3,4,6,7,8,9]:[2,3,4,7,8,9]).filter(k=>k*100!==ta); b=Array(pick(ks)).fill(100); }
    else { do{ a=makePile(E).slice(0,4); b=makePile(E).slice(-5); }while(sum(a)===sum(b)); }
    if(rnd(2)) [a,b]=[b,a];
    const ta=sum(a), tb=sum(b);
    return {item:null,bubble:'누가 돈을 더 많이 냈을까요?',ask:'어느 쪽 돈이 더 많을까요?',q:'<div class="note">개수가 아니라 돈에 적힌 숫자를 봐요</div>',noDim:true,
      say:[K('두 손님이 돈을 냈어요. 어느 쪽 돈이 더 많을까요?')],
      choices:[{h:pileHTML(a),ok:ta>tb,read:[K(`이쪽은 ${wonSay(ta)}`)]},{h:pileHTML(b),ok:tb>ta,read:[K(`이쪽은 ${wonSay(tb)}`)]}],
      name:[K(`${wonSay(Math.max(ta,tb))}이 더 많아요!`)],
      hint:[K('오백 원 동전 하나는 백 원 동전 다섯 개와 같아요.'),K(`왼쪽은 ${running(a)}`),K(`오른쪽은 ${running(b)}`)],earn:ta>tb?a:b}; },
  change:(E,n)=>{ let pay,P; const r=E>=3?rnd(3):0;
    if(r===0){ pay=1000; P=100*(1+rnd(9)); } else if(r===1){ pay=5000; P=100*(10+rnd(40)); } else { pay=10000; P=1000*(1+rnd(9)); }
    return changeQ(P,[pay],n,pick(ITEMS)); },
  afford:(E,n)=>{ const u=E>=3?1000:100, X=u*(3+rnd(7)), okP=u*(1+rnd(X/u));
    const items=shuffle(ITEMS).slice(0,n), prices=[okP,...shuffle([1,2,3,4,5]).slice(0,n-1).map(k=>X+k*u)];
    const ch=items.map((it,i)=>({h:`<span class="ie">${it.e}</span><span class="tag">${won(prices[i])}</span>`,ok:i===0,read:[K(`${it.n}, ${wonSay(prices[i])}`)]}));
    return {item:null,bubble:`나는 ${won(X)} 있어요!`,ask:`${won(X)}으로 살 수 있는 것은?`,
      q:`${pileHTML(greedy(X),.85)}<div class="note">값이 ${won(X)}보다 적거나 같아야 살 수 있어요</div>`,
      say:[K(`손님은 ${wonSay(X)}이 있어요. 살 수 있는 것은 무엇일까요?`)],choices:shuffle(ch),
      name:[K(`${items[0].n}! ${wonSay(okP)}이니까 살 수 있어요.`)],hint:[K(`${wonSay(X)}보다 값이 작거나 같은 것을 찾아요.`)],earn:greedy(okP)}; },
};
function makeQ(){ const E=effD(), L=LV[E], kind=pick(L.q); return Object.assign(QB[kind](E,L.n),{kind,miss:0,help:0}); }

// 문제 그리기: 맞힐 때까지 기다리고, 틀린 보기는 흐려지기만 함
function ask(box,Q){
  return new Promise(res=>{
    let done=false;
    const draw=()=>{ const n=Q.choices.length;
      box.innerHTML=`<div class="qline">${Q.ask}</div><div class="qq">${Q.q}</div>
        <div class="qch${n>=4?' n4':''}" style="--n:${n}">${Q.choices.map((c,i)=>`<button class="qc${c.dim?' dim':''}${c.glow?' glow':''}${c.okd?' ok':''}" data-c="${i}">${c.h}</button>`).join('')}</div>
        <div class="row"><button class="icon-btn" data-q="hear" aria-label="다시 듣기">🔊</button>
          <button class="big-btn alt small${Q.miss>=2&&!Q.help?' pulse':''}" data-q="help">${Q.help?'🤝 정답 보기':'💡 도와줘요'}</button></div>`;
      box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(+b.dataset.c));
      box.querySelector('[data-q="hear"]').onclick=()=>sayList(Q.say);
      box.querySelector('[data-q="help"]').onclick=help; };
    const choose=i=>{
      if(done) return; const c=Q.choices[i]; if(c.dim) return;
      if(c.ok){ done=true; c.okd=true; draw(); sfx.ok(); confetti(12);
        adapt(!Q.miss&&!Q.help,Q.miss>=2||Q.help>=2); save();
        sayList([K('맞았어요!'),...Q.name,...(Q.after||[])]); res(); return; }
      Q.miss++; c.dim=true; sfx.no(); draw();
      sayList([K('음, 이건'),...c.read,K(Q.miss>=2?'괜찮아요! 다시 골라 봐요. 도와줘요를 눌러도 돼요.':'다시 골라 봐요!')]);
    };
    const help=()=>{
      if(done) return; Q.help++;
      if(Q.help===1){ if(!Q.noDim){ const wrong=shuffle(Q.choices.filter(c=>!c.ok&&!c.dim)); wrong.slice(0,Math.max(1,Math.floor(wrong.length/2))).forEach(c=>c.dim=true); }
        draw(); sayList([...Q.say,...(Q.hint||[])],.85); }
      else { Q.choices.forEach(c=>{ if(c.ok) c.glow=true; }); draw(); sayList([...Q.name,K('반짝이는 걸 눌러요!')],.85); }
    };
    draw(); setTimeout(()=>sayList(Q.say),300);
  });
}

function give(d){
  if(!PAY||avail()[d]<=0) return;
  PAY.cnt[d]=(PAY.cnt[d]||0)+1; PAY.glow=null; sfx.coin(); renderPay();
  say(S.set.total?wonSay(wTotal(PAY.cnt)):wonSay(d));

function ret(d){
  if(!PAY||!PAY.cnt[d]) return;

function payHelp(){
  const P=PAY, tot=wTotal(P.cnt), rem=P.price-tot, left=avail();
  if(rem<0){
    const d=DEN.slice().reverse().find(d=>P.cnt[d]&&tot-d>=P.price);
    if(d){ P.glow={ret:d}; renderPay(); say(`너무 많아요. 반짝이는 ${coinName(d)}을 빼 봐요.`); return; }
    P.glow={go:true}; renderPay(); say(`${wonSay(tot)}을 냈어요. 내기를 누르면 거스름돈 ${wonSay(-rem)}을 받아요.`); return;
  }
  if(rem===0){ P.glow={go:true}; renderPay(); say('딱 맞아요! 내기를 눌러요.'); return; }
  const sol=solve(rem,left);
  if(sol){ const d=Math.max(...Object.keys(sol).map(Number)); P.glow={give:d}; renderPay();
    sayList([K(`${wonSay(rem)} 더 내야 해요.`),K(`반짝이는 ${coinName(d)}을 눌러 봐요.`)]); return; }
  if(wTotal(left)<rem){ say(`돈이 ${wonSay(rem-wTotal(left))} 모자라요. 그만하고 가게에서 더 벌어 올까요?`); return; }
  const big=DEN.find(d=>d>=rem&&left[d]>0);
  if(big){ P.glow={give:big}; renderPay(); sayList([K(`${wonSay(rem)}을 딱 맞게 낼 동전이 없어요.`),K(`${coinName(big)}을 내고 거스름돈을 받아요. 바꾸기를 해도 돼요.`)]); return; }
  const d=DEN.slice().reverse().find(d=>left[d]>0); P.glow={give:d}; renderPay();
  say(`${wonSay(rem)} 더 내야 해요. ${coinName(d)}부터 내 봐요.`);
}
async function payGo(){
  const P=PAY, tot=wTotal(P.cnt);

  if(tot<P.price){ sfx.no(); toast(`${won(P.price-tot)} 모자라요`); say(`${wonSay(P.price-tot)}이 모자라요. 조금 더 내 볼까요?`); return; }
  if(tot>P.price){ const extra=DEN.slice().reverse().find(d=>P.cnt[d]&&tot-d>=P.price);
    if(extra){ sfx.no(); P.glow={ret:extra}; renderPay(); say(`너무 많이 냈어요! ${coinName(extra)} 하나는 빼도 돼요.`); return; } }
  const change=tot-P.price, paid=counterCoins();
  if(change>0&&effD()>=2){   // 거스름돈 문제 하나 (맞힐 때까지 기다림)
    const Q=Object.assign(changeQ(P.price,paid,LV[effD()].n,null),{miss:0,help:0});
    await new Promise(r=>modal('<div class="qbox" id="mq"></div>',sh=>ask(sh.querySelector('#mq'),Q).then(()=>setTimeout(()=>{ closeModal(); r(); },2800)),{backdrop:false}));
  }
  DEN.forEach(d=>S.wallet[d]=(S.wallet[d]||0)-(P.cnt[d]||0));
  const back=change>0?greedy(change):[]; addCoins(S.wallet,back); save(); sfx.ok();
  if(change>0) await new Promise(r=>{ onModalClose=r;
    modal(`<h2>거스름돈 ${won(change)}을 받았어요</h2>${pileHTML(back)}<p>${won(tot)} − ${won(P.price)} = <b>${won(change)}</b></p>
      <div class="row"><button class="big-btn" data-close>좋아요!</button></div>`,null,{backdrop:false});
    say(`${wonSay(tot)}을 내고, 거스름돈 ${wonSay(change)}을 받았어요.`); });
  const res=P.res; PAY=null; res(true);
}

   ====================================================================== */
function pickMoneyPhoto(d){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) cropMoney(d,f).then(()=>settings()); };
  inp.click();
}
async function cropMoney(d,file){
  const bill=isBill(d), url=URL.createObjectURL(file), img=new Image(); img.src=url;
  try{ await img.decode(); }catch(e){ URL.revokeObjectURL(url); toast('사진을 열 수 없어요'); return; }
  // 큰 사진은 먼저 줄여서 다루기
  const k0=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)), src=document.createElement('canvas');
  src.width=Math.round(img.naturalWidth*k0); src.height=Math.round(img.naturalHeight*k0); src.getContext('2d').drawImage(img,0,0,src.width,src.height); URL.revokeObjectURL(url);
  const CW=600, CH=bill?400:600, mw=bill?520:440, mh=bill?260:440, mx=(CW-mw)/2, my=(CH-mh)/2;
  let rot=0, ox=CW/2, oy=CH/2, z=1, base=1;
  const fit=()=>{ const w=rot%2?src.height:src.width, h=rot%2?src.width:src.height; base=Math.max(mw/w,mh/h); z=1; ox=CW/2; oy=CH/2; };
  fit();
  const place=(c,s)=>{ c.translate(ox,oy); c.rotate(rot*Math.PI/2); c.scale(s,s); c.drawImage(src,-src.width/2,-src.height/2); };
  const mask=c=>{ if(bill){ const r=14; c.moveTo(mx+r,my); c.arcTo(mx+mw,my,mx+mw,my+mh,r); c.arcTo(mx+mw,my+mh,mx,my+mh,r); c.arcTo(mx,my+mh,mx,my,r); c.arcTo(mx,my,mx+mw,my,r); c.closePath(); }
    else { c.moveTo(CW/2+mw/2,CH/2); c.arc(CW/2,CH/2,mw/2,0,Math.PI*2); } };
  return new Promise(res=>{
    modal(`<h2>${won(d)} ${kindOf(d)} 사진 맞추기</h2>
      <p style="font-size:17px">사진을 손가락으로 끌어서 ${bill?'지폐의 앞면이 노란 네모에 꽉 차게':'동전이 노란 동그라미에 꼭 맞게'} 맞춰요. 두 손가락이나 아래 막대로 크기를 바꿔요.</p>
      <canvas id="crop" width="${CW}" height="${CH}" style="width:min(100%,${bill?520:400}px);touch-action:none;border-radius:16px;background:#222"></canvas>
      <div class="vrow"><span>크기</span><input type="range" id="zm" min="0.5" max="5" step="0.01" value="1" style="flex:1"></div>
      <div class="row"><button class="big-btn small alt" id="rot">↻ 돌리기</button><button class="big-btn small alt" id="cx">취소</button><button class="big-btn small" id="ok">✅ 저장</button></div>`,sh=>{
      const cv=sh.querySelector('#crop'), ctx=cv.getContext('2d'), zm=sh.querySelector('#zm');
      const draw=()=>{ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,CW,CH); ctx.save(); place(ctx,base*z); ctx.restore();
        ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.rect(0,0,CW,CH); mask(ctx); ctx.fill('evenodd');
        ctx.lineWidth=5; ctx.strokeStyle='#ffcf33'; ctx.beginPath(); mask(ctx); ctx.stroke(); };
      const pts=new Map(); let pinch=0;
      const sc=()=>CW/cv.clientWidth;
      cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); pinch=0; });
      cv.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; const [px,py]=pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
        if(pts.size===1){ ox+=(e.clientX-px)*sc(); oy+=(e.clientY-py)*sc(); }
        else { const [a,b]=[...pts.values()], dist=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch){ z=Math.min(5,Math.max(.5,z*dist/pinch)); zm.value=z; } pinch=dist; }
        draw(); });
      const up=e=>{ pts.delete(e.pointerId); pinch=0; };
      cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
      cv.addEventListener('wheel',e=>{ e.preventDefault(); z=Math.min(5,Math.max(.5,z*(e.deltaY<0?1.06:1/1.06))); zm.value=z; draw(); },{passive:false});
      zm.oninput=()=>{ z=+zm.value; draw(); };
      sh.querySelector('#rot').onclick=()=>{ rot=(rot+1)%4; fit(); zm.value=1; draw(); };
      sh.querySelector('#cx').onclick=()=>res(false);
      sh.querySelector('#ok').onclick=()=>{
        const OW=bill?480:256, OH=bill?240:256, f=OW/mw, oc=document.createElement('canvas'); oc.width=OW; oc.height=OH;
        const c=oc.getContext('2d');
        if(!bill){ c.beginPath(); c.arc(OW/2,OH/2,OW/2,0,Math.PI*2); c.clip(); }
        c.setTransform(f,0,0,f,-mx*f,-my*f); place(c,base*z);
        oc.toBlob(async b=>{ if(!b){ res(false); return; }
          try{ await idb.put('m'+d,b); }catch(e){ toast('저장하지 못했어요'); res(false); return; }
          const old=IMG.get('m'+d); if(old) URL.revokeObjectURL(old); IMG.set('m'+d,URL.createObjectURL(b));
          sfx.coin(); toast(`${won(d)} 사진을 넣었어요!`); res(true); },'image/png');
      };
      draw();
    },{backdrop:false});
  });
}
async function dropMoneyPhoto(d){
  try{ await idb.del('m'+d); }catch(e){}
  const u=IMG.get('m'+d); if(u) URL.revokeObjectURL(u); IMG.delete('m'+d);

      작게 줄인 뒤 <b>기기 안에만</b> 저장해요. 한 번 받으면 인터넷 없이도 보여요. 그림의 저작권은 Nintendo·Creatures·GAME FREAK에 있으니 가정에서만 써 주세요.</p>
    <p class="note" id="imgHave">받은 그림 ${imgN()} / ${IMG_JOBS.length}장</p><div class="dlbar"><i id="dlbar"></i></div>
    <div class="row" style="justify-content:flex-start"><button class="big-btn small" id="dl">⬇️ 그림 받기</button><button class="big-btn small alt" id="clr">🗑️ 받은 그림 지우기</button></div>
    <h3>난이도</h3><div class="diffs">${LV.map((d,i)=>`<button data-diff="${i}" class="${S.set.diff===i?'on':''}"><span class="e">${d.e}</span><b>${d.name}</b><small>${d.desc}</small></button>`).join('')}</div>
    <p class="note">포켓몬 값은 🐣·🐥·🐔에서는 백 원 단위, 🦅 어려움에서는 천 원 단위(10배)예요. 지갑의 돈은 난이도를 바꿔도 그대로예요.</p>
    <h3>자동 맞춤</h3>${seg('auto',[[true,'켜기'],[false,'끄기']])}
    <p class="note">켜 두면 가게 문제를 연달아 어려워할 때 몰래 한 단계 쉬운 문제를 내고, 잘하면 위에서 고른 난이도까지 다시 올라가요.${S.set.auto&&E<S.set.diff?` 지금은 ${LV[E].e} ${LV[E].name} 문제를 내고 있어요.`:''}
      ${LV[S.set.diff].q.includes('change')?' 계산대에서 큰 돈을 내면 거스름돈 문제도 나와요(🐔 보통부터).':''}</p>
    <h3>계산대의 ‘낸 돈’ 합계</h3>${seg('total',[[true,'보여 주기'],[false,'숨기기 (스스로 세기)']])}
    <h3>💰 진짜 돈 사진으로 바꾸기</h3>
    <p class="note">게임 속 돈은 실제 한국 돈의 색·크기 비율·앞면 그림(다보탑, 이순신 장군, 세종대왕…)을 본떠 그렸어요. 집에 있는 진짜 동전·지폐의 <b>앞면</b>을 찍어 넣으면
      게임 속 돈이 그 사진으로 바뀌어요. 사진은 <b>이 기기 안에만</b> 저장되고 어디에도 보내지 않아요. 가정 학습용으로만 써 주세요.</p>
    <div class="mgrid">${DEN.map(d=>`<div class="mcell">${pileHTML([d],isBill(d)?1.15:1.1)}<span>${won(d)}</span>
      <div class="row"><button data-photo="${d}">📷 ${IMG.has('m'+d)?'다시 찍기':'사진 넣기'}</button>${IMG.has('m'+d)?`<button data-unphoto="${d}" aria-label="그림으로 되돌리기">↺</button>`:''}</div></div>`).join('')}</div>
    <h3>💝 용돈 주기</h3><div class="row" style="justify-content:flex-start">${[1,5,10].map(k=>`<button class="big-btn small alt" data-gift="${k*u}">+ ${won(k*u)}</button>`).join('')}</div>
    <p class="note">집안일을 도왔을 때처럼 칭찬으로 지갑에 돈을 넣어 줄 수 있어요. 지금 지갑: <b id="wnow">${won(wTotal(S.wallet))}</b></p>
    <h3>소리 · 목소리</h3>${seg('sound',[[true,'켜기'],[false,'끄기']])}${voiceHTML()}
    <p class="note">⏱️ 시간 제한은 없어요. 문제는 맞힐 때까지 기다리고, 틀려도 돈이 줄지 않아요. 💡 도와줘요를 누르면 틀린 보기가 흐려지고, 한 번 더 누르면 정답이 반짝여요.
      계산대에서도 💡를 누르면 다음에 낼 돈이 반짝여요.</p>
    <div class="row" style="margin-top:18px"><button class="big-btn small alt" data-m="reset">처음부터 다시</button><button class="big-btn small" data-close>닫기</button></div></div>`,sh=>{
    bindVoice(sh);
    sh.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>pickMoneyPhoto(+b.dataset.photo));
    sh.querySelectorAll('[data-unphoto]').forEach(b=>b.onclick=async()=>{ await dropMoneyPhoto(+b.dataset.unphoto); toast('그림으로 되돌렸어요'); settings(); });
    sh.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{ S.set.diff=+b.dataset.diff; S.adj=S.set.diff; S.good=S.hard=0; save(); const f=onModalClose; settings(); onModalClose=f; });
    sh.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; S.set[k]=b.dataset.v==='true';
      if(k==='auto'){ S.adj=S.set.diff; S.good=S.hard=0; } save(); b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
    sh.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.gift; addCoins(S.wallet,greedy(v)); save(); sfx.coin();
      sh.querySelector('#wnow').textContent=won(wTotal(S.wallet)); toast(`용돈 ${won(v)}을 넣었어요`); });
    sh.querySelector('#dl').onclick=async()=>{
      if(IMG_JOBS.every(([k])=>IMG.has(k))){ toast('이미 다 받았어요!'); return; }
      try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
      const dl=sh.querySelector('#dl'); dl.disabled=true;
      const r=await downloadImages((d,t)=>{ const b=$('#dlbar'), m=$('#imgHave'); if(b) b.style.width=(d/t*100)+'%'; if(m) m.textContent=`받는 중… ${d} / ${t}`; });
      const m=$('#imgHave'); if(m) m.textContent=r.fail?`${r.total-r.fail}장 받았어요. ${r.fail}장은 받지 못했어요. 인터넷을 확인하고 한 번 더 눌러 주세요.`:`모두 받았어요! 🎉 (${imgN()} / ${IMG_JOBS.length}장)`;
      dl.disabled=false;
    };
    sh.querySelector('#clr').onclick=()=>modal(`<h2>받은 그림을 지울까요?</h2><p>포켓몬 그림만 지워지고, 돈 사진·지갑·포켓몬 기록은 그대로예요.</p>
      <div class="row"><button class="big-btn" data-m="yes">지울래요</button><button class="big-btn alt" data-close>아니요</button></div>`,s2=>{
      s2.querySelector('[data-m]').onclick=async()=>{ for(const [k,v] of [...IMG]) if(k[0]==='n'||k[0]==='s'){ try{ await idb.del(k); }catch(e){} URL.revokeObjectURL(v); IMG.delete(k); } closeModal(); toast('그림을 지웠어요'); };
    });
    sh.querySelector('[data-m="reset"]').onclick=()=>modal(`<h2>처음부터 다시 할까요?</h2><p>짝꿍, 모은 포켓몬, 진화, 지갑의 돈이 모두 처음으로 돌아가요.<br>설정과 받은 그림은 그대로 남아요.</p>
      <div class="row"><button class="big-btn" data-m="yes">네, 다시 할래요</button><button class="big-btn alt" data-close>아니요</button></div>`,s2=>{
      s2.querySelector('[data-m]').onclick=()=>{ const set=S.set; S=fresh(); S.set=set; S.adj=set.diff; PAY=null; save(); onModalClose=null; closeModal(); renderPick(); };
    });
  });
}

/* ======================================================================
   눌렀을 때
   ====================================================================== */
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.disabled) return;
  const d=t.dataset;
  if(d.give) return give(+d.give);
  if(d.ret) return ret(+d.ret);
  if(d.starter!==undefined){ sfx.pop(); return chooseStarter(+d.starter); }
  if(d.mf){ MART_F=d.mf; sfx.pop(); return renderMart(); }
  if(d.buy!==undefined){ sfx.pop(); return doBuy(+d.buy); }
  if(d.evo!==undefined){ sfx.pop(); return doEvolve(+d.evo); }
  if(d.partner!==undefined){ S.partner=+d.partner; save(); sfx.pop(); say(`${jo(curName(S.partner),'이','가')} 가게 짝꿍이에요!`); return renderBox(); }
  switch(d.act){
    case 'home': sfx.pop(); return renderHome();
    case 'work': sfx.pop(); return renderWork();
    case 'mart': sfx.pop(); renderMart(); return say('포켓몬 마트예요! 어떤 포켓몬을 데려올까요?');
    case 'box': sfx.pop(); renderBox(); return say('내 포켓몬이에요!');
    case 'wallet': sfx.pop(); renderWallet(); return say(`지갑에 ${wonSay(wTotal(S.wallet))}이 있어요.`);
    case 'wcount': return walletCount();
    case 'lesson': sfx.pop(); return lesson();
    case 'exch': sfx.pop(); exchange(screen==='pay'?renderPay:renderWallet); return say('돈을 바꿔 볼까요?');
    case 'payhelp': return payHelp();
    case 'paygo': return payGo();
    case 'paycancel': { sfx.pop(); const r=PAY&&PAY.res; PAY=null; if(r) r(false); return; }
  }
});

(async function boot(){ await loadImages(); renderHome(); })();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
