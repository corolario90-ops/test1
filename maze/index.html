<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 미로 탐험</title>
<meta name="theme-color" content="#bfeccd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미로 탐험">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/maze-192.png">
<link rel="icon" href="icons/maze-192.png">
<style>
@font-face{font-family:"Jua";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/jua.woff2") format("woff2")}
:root{
  --bg1:#bfeccd; --bg2:#fff4cf; --ink:#25303a; --card:#ffffff; --soft:#eef6f0; --line:rgba(0,0,0,.1);
  --accent:#ff6b4a; --good:#22c55e; --gold:#ffcf33; --shadow:0 6px 0 rgba(0,0,0,.14);
  --floor:#fff8e6; --seen:#ffe9a8; --hint:#b8f5c8; --wall:#2f6b3a; --mazebg:#7cc48a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#16302a; --bg2:#2a2440; --ink:#eef4f0; --card:#2c3a36; --soft:#24302c; --line:rgba(255,255,255,.14);
    --floor:#3a4a42; --seen:#5b5532; --hint:#2f6b45; --wall:#9be3a8; --mazebg:#1f3d2c; }
}
:root[data-theme="dark"]{ --bg1:#16302a; --bg2:#2a2440; --ink:#eef4f0; --card:#2c3a36; --soft:#24302c; --line:rgba(255,255,255,.14);
  --floor:#3a4a42; --seen:#5b5532; --hint:#2f6b45; --wall:#9be3a8; --mazebg:#1f3d2c; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);background-image:linear-gradient(var(--bg1),var(--bg2));overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{font-weight:normal;margin:0}
#app{height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.big-btn{font-size:24px;padding:12px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;box-shadow:var(--shadow);min-height:60px}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.small{font-size:19px;padding:8px 16px;min-height:48px}
.big-btn:disabled{opacity:.45}
.big-btn.pulse{animation:pulse 1s ease-in-out infinite}
.big-btn:active:not(:disabled),.icon-btn:active,.pad button:active,.qc:active,.pcard:active{transform:translateY(3px)}
.icon-btn{font-size:26px;width:56px;height:56px;border:none;border-radius:18px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;flex:none}
.icon-btn.holding::after{content:"";position:absolute;left:0;bottom:0;height:6px;background:var(--accent);animation:hold 1s linear forwards}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 16px 4px 10px;font-size:24px;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bar{display:flex;align-items:center;gap:10px}
.sp{flex:1}
@keyframes hold{from{width:0}to{width:100%}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(0) invert(1)}}
@keyframes glowc{50%{box-shadow:inset 0 0 0 999px rgba(120,255,160,.55)}}

/* ---------- 포켓몬 그림 ---------- */
.pic{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.pic.sil{filter:brightness(0);opacity:.3}
.noimg{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c,#f59e0b);color:#fff;font-size:calc(var(--sz,80px)*.42);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.noimg.sil{background:#888;opacity:.3}

/* ---------- 처음 화면 ---------- */
.home{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.home h1{font-size:clamp(38px,7.5vw,68px);text-shadow:0 4px 0 rgba(0,0,0,.08)}
.partner{width:clamp(150px,28vmin,250px);aspect-ratio:1;--sz:clamp(150px,28vmin,250px);animation:bob 1.8s ease-in-out infinite;position:relative}
.pname{font-size:26px}
.pname small{display:block;font-size:17px;opacity:.65}
.menu{display:grid;gap:12px;width:min(440px,100%)}
.menu .big-btn{font-size:28px;min-height:76px}
.banner{background:#fff3c4;color:#5b4500;border-radius:18px;padding:12px 16px;max-width:560px;font-size:18px;line-height:1.5}

/* ---------- 짝꿍 고르기 · 도감 ---------- */
.list{flex:1;overflow-y:auto}
.list h2{font-size:28px;margin:6px 0 12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pcard{border:4px solid transparent;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px}
.pcard .im{width:90px;height:90px;--sz:90px}
.pcard small{font-size:14px;opacity:.6}
.pcard.on{border-color:var(--accent)}

/* ---------- 미로 ---------- */
.mz{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.mz .who{display:flex;align-items:center;gap:8px;font-size:22px;min-width:0}
.mz .who .im{width:46px;height:46px;--sz:46px;flex:none}
.mzbody{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center}
@media (max-aspect-ratio:1/1){ .mzbody{flex-direction:column} }
.mzwrap{flex:1;min-width:0;min-height:0;align-self:stretch;display:grid;place-items:center;touch-action:none}
.maze{position:relative;background:var(--mazebg);border-radius:16px;box-shadow:0 0 0 6px var(--wall),var(--shadow)}
.cell{position:absolute;width:var(--cs);height:var(--cs);background:var(--floor);border:3px solid transparent;display:grid;place-items:center;font-size:calc(var(--cs)*.56);line-height:1}
.cell.v{background:var(--seen)}
.cell.h{background:var(--hint);animation:glowc 1.2s ease-in-out infinite}
.cell.n{border-top-color:var(--wall)} .cell.e{border-right-color:var(--wall)} .cell.s{border-bottom-color:var(--wall)} .cell.w{border-left-color:var(--wall)}
.cell .bush{animation:bob 2s ease-in-out infinite}
.me{position:absolute;width:var(--cs);height:var(--cs);padding:calc(var(--cs)*.04);transition:left .13s linear,top .13s linear;z-index:2;--sz:var(--cs)}
.me.bump{animation:shake .35s}
.me.zap{transition:none;animation:pop .5s}
.me .trap{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cs)*.8);opacity:.85}
.pad{display:grid;grid-template-columns:repeat(3,clamp(62px,9vmin,86px));grid-template-rows:repeat(3,clamp(62px,9vmin,86px));gap:6px;flex:none}
.pad button{border:none;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:clamp(30px,4.5vmin,42px)}
.pad .u{grid-area:1/2} .pad .l{grid-area:2/1} .pad .r{grid-area:2/3} .pad .d{grid-area:3/2}
.pad .mid{grid-area:2/2;display:grid;place-items:center;font-size:28px;opacity:.5}

/* ---------- 창 (문제 · 진화) ---------- */
#modal{position:fixed;inset:0;background:rgba(15,25,30,.5);display:grid;place-items:center;z-index:50;padding:14px}
.sheet{background:var(--card);border-radius:28px;padding:18px;max-width:680px;width:100%;max-height:92dvh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.2);text-align:center;animation:pop .25s}
.sheet h2{font-size:30px;margin-bottom:10px}
.sheet p{font-size:20px;line-height:1.5;margin:8px 0}
.qhead{font-size:26px;display:flex;align-items:center;justify-content:center;gap:8px}
.qhead .qi{font-size:44px}
.qsub{font-size:18px;opacity:.65;margin:2px 0 8px}
.qq{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--soft);border-radius:22px;padding:12px;margin-bottom:12px}
.qq .big{font-size:clamp(70px,13vmin,110px);line-height:1}
.qq .pic2{font-size:clamp(80px,14vmin,120px);line-height:1}
.qq .eq{font-size:clamp(48px,9vmin,80px);line-height:1}
.qq .note{font-size:18px;opacity:.6}
.cnt{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:330px;font-size:clamp(34px,6vmin,48px);line-height:1.1}
.cnt span.x{opacity:.3;position:relative}
.cnt span.x::after{content:'✕';position:absolute;inset:0;color:#ef4444;display:grid;place-items:center}
.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.grp b{font-weight:normal;font-size:40px}
.qch{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:12px}
.qch.c3{grid-template-columns:repeat(3,1fr)}
.qc{border:4px solid transparent;background:#fff6dc;color:#3a2d10;border-radius:22px;min-height:96px;box-shadow:var(--shadow);display:grid;place-items:center;padding:6px}
.qc .cn{font-size:52px} .qc .cl{font-size:56px} .qc .cw{font-size:clamp(24px,4.4vmin,34px)}
.qc.dim{opacity:.25;filter:grayscale(1)}
.qc.glow{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 24px var(--gold);animation:pulse 1s ease-in-out infinite}
.qc.ok{background:#c9f5d6;border-color:var(--good)}
.qc.shake{animation:shake .45s}
.evo{width:clamp(160px,34vmin,260px);aspect-ratio:1;margin:8px auto;--sz:clamp(160px,34vmin,260px)}
.evo.flash{animation:flash .35s linear infinite}
.reward{font-size:90px;line-height:1.1}
.set{text-align:left}
.set h3{font-size:21px;margin:16px 0 6px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:12px;padding:10px 6px;font-size:19px}
.seg button.on{background:var(--accent);color:#fff}
.set .note{font-size:15px;opacity:.7;margin:4px 2px;line-height:1.5}
.diffs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.diffs button{border:3px solid transparent;background:var(--soft);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.diffs .e{font-size:34px;line-height:1.1} .diffs b{font-weight:normal;font-size:20px} .diffs small{font-size:14px;opacity:.7}
.diffs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--soft))}
.dlbar{height:14px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.dlbar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti{position:fixed;top:-60px;font-size:34px;animation:fall 1.8s linear forwards}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:22px;padding:12px 20px;border-radius:18px;z-index:70;max-width:90vw;text-align:center;animation:pop .2s}
@media (max-width:600px){ .pill{font-size:20px;min-height:46px} .icon-btn{width:48px;height:48px;font-size:22px} .mz .who span{display:none} .qc{min-height:80px} }
</style>

<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="fx"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ======================================================================
   포켓몬 (그림은 앱에 들어 있지 않음: 어른 설정에서 기기로 받음)
   ====================================================================== */
const PARTNERS=[
  {ids:[1,2,3],ko:['이상해씨','이상해풀','이상해꽃'],c:'#4ade80'},
  {ids:[4,5,6],ko:['파이리','리자드','리자몽'],c:'#fb923c'},
  {ids:[7,8,9],ko:['꼬부기','어니부기','거북왕'],c:'#60a5fa'},
  {ids:[172,25,26],ko:['피츄','피카츄','라이츄'],c:'#facc15'},
  {ids:[133],ko:['이브이'],c:'#c99a6b',eevee:true},
  {ids:[152,153,154],ko:['치코리타','베이리프','메가니움'],c:'#86efac'},
  {ids:[155,156,157],ko:['브케인','마그케인','블레이범'],c:'#f97316'},
  {ids:[158,159,160],ko:['리아코','엘리게이','장크로다일'],c:'#38bdf8'},
  {ids:[387,388,389],ko:['모부기','수풀부기','토대부기'],c:'#65a30d'},
  {ids:[390,391,392],ko:['불꽃숭이','파이숭이','초염몽'],c:'#ef4444'},
  {ids:[393,394,395],ko:['팽도리','팽태자','엠페르트'],c:'#3b82f6'},
  {ids:[147,148,149],ko:['미뇽','신뇽','망나뇽'],c:'#a5b4fc'},
  {ids:[10,11,12],ko:['캐터피','단데기','버터플'],c:'#a3e635'},
];
const EEVEE=[[134,'샤미드'],[135,'쥬피썬더'],[136,'부스터'],[196,'에브이'],[197,'블래키'],[470,'리피아'],[471,'글레이시아'],[700,'님피아']];
const NAME={}, COLOR={};
PARTNERS.forEach(p=>p.ids.forEach((id,i)=>{ NAME[id]=p.ko[i]; COLOR[id]=p.c; }));
EEVEE.forEach(([id,n])=>{ NAME[id]=n; COLOR[id]='#c99a6b'; });
const ALL_IDS=[...PARTNERS.flatMap(p=>p.ids),...EEVEE.map(e=>e[0])];
const maxStage=i=>PARTNERS[i].eevee?1:PARTNERS[i].ids.length-1;

const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open('pokemaze',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img',mode), r=fn(t.objectStore('img'));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return {
    put:(k,v)=>tx('readwrite',o=>o.put(v,k)),
    clear:()=>tx('readwrite',o=>o.clear()),
    all:async()=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img'), out=[], c=t.objectStore('img').openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } };
      t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); },
  };
})();
const IMG=new Map();
async function loadImages(){ try{ for(const [k,b] of await idb.all()) if(!IMG.has(k)&&b) IMG.set(k,URL.createObjectURL(b)); }catch(e){} }
const ART=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
async function shrink(blob){ // 기기에 저장하기 전에 256px로 줄이기
  const u=URL.createObjectURL(blob);
  try{ const im=new Image(); im.src=u; await im.decode();
    const Z=256, c=document.createElement('canvas'); c.width=c.height=Z;
    const k=Math.min(Z/im.naturalWidth,Z/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
    c.getContext('2d').drawImage(im,(Z-w)/2,(Z-h)/2,w,h);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
  } finally{ URL.revokeObjectURL(u); }
}
async function downloadImages(progress){
  const jobs=ALL_IDS.filter(id=>!IMG.has('n'+id)), total=jobs.length; let done=0, fail=0;
  const worker=async()=>{ while(jobs.length){ const id=jobs.shift();
    try{ const r=await fetch(ART(id)); if(!r.ok) throw new Error(r.status); const b=await shrink(await r.blob()); await idb.put('n'+id,b); IMG.set('n'+id,URL.createObjectURL(b)); }
    catch(e){ fail++; }
    progress(++done,total); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {total,fail};
}
const haveImages=()=>ALL_IDS.some(id=>IMG.has('n'+id));
// 그림이 없으면 이름 첫 글자를 넣은 동그라미
function art(id,cls=''){
  const u=IMG.get('n'+id);
  if(u) return `<img class="pic ${cls}" src="${u}" alt="" draggable="false">`;
  return `<div class="noimg ${cls}" style="--c:${COLOR[id]||'#f59e0b'}">${cls==='sil'?'?':(NAME[id]||'?')[0]}</div>`;
}

/* ======================================================================
   글자 · 낱말 자료
   ====================================================================== */
const KO_UNIT=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
const KO_TEN=['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
const koNum=n=>(n<=0||n>=100)?String(n):KO_TEN[Math.floor(n/10)]+KO_UNIT[n%10];
const koCnt=n=>n===20?'스무':koNum(n).replace(/하나$/,'한').replace(/둘$/,'두').replace(/셋$/,'세').replace(/넷$/,'네');
const jong=w=>{ const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3?(c-0xAC00)%28:0; };
const jo=(w,a,b)=>w+(jong(w)?a:b);
const ro=w=>w+(jong(w)&&jong(w)!==8?'으로':'로');
const CONS=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CNAME={'ㄱ':'기역','ㄴ':'니은','ㄷ':'디귿','ㄹ':'리을','ㅁ':'미음','ㅂ':'비읍','ㅅ':'시옷','ㅇ':'이응','ㅈ':'지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히읗'};
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const choOf=w=>CHO[Math.floor((w.charCodeAt(0)-0xAC00)/588)];
const KO_WORDS=[['곰','🐻'],['개','🐶'],['소','🐮'],['말','🐴'],['배','🍐'],['귤','🍊'],['달','🌙'],['별','⭐'],['꽃','🌸'],['공','⚽'],

const DIRS={up:[0,-1,1,4],right:[1,0,2,8],down:[0,1,4,1],left:[-1,0,8,2]};
const TRAPS=[['🕸️','거미줄'],['🌀','소용돌이'],['🪨','떨어진 바위'],['🧊','미끌미끌 얼음'],['💤','잠 가루']];
// 갈림길이 많이 생기도록 ‘가장 최근 칸’과 ‘아무 칸’을 반씩 섞어서 파 나감
function carve(w,h,loops){
  const cells=new Array(w*h).fill(15),seen=new Array(w*h).fill(false),list=[0]; seen[0]=true;
  const open=(c,[dx,dy,b,o])=>{ const nc=c+dy*w+dx; cells[c]&=~b; cells[nc]&=~o; return nc; };
  const inside=(c,[dx,dy])=>{ const x=c%w+dx, y=Math.floor(c/w)+dy; return x>=0&&y>=0&&x<w&&y<h; };
  while(list.length){ const i=Math.random()<.55?list.length-1:rnd(list.length), c=list[i];
    const can=Object.values(DIRS).filter(d=>inside(c,d)&&!seen[c+d[1]*w+d[0]]);
    if(!can.length){ list.splice(i,1); continue; }
    const nc=open(c,pick(can)); seen[nc]=true; list.push(nc); }
  // 막다른 길 몇 곳은 옆길과 이어서 빙 돌아가는 길을 만듦
  for(let c=1;c<w*h;c++){ const shut=Object.values(DIRS).filter(d=>inside(c,d)&&(cells[c]&d[2]));
    if(shut.length===3&&Math.random()<loops) open(c,pick(shut)); }
  return {w,h,cells};
}
function nbrs(M,c){ const x=c%M.w, y=Math.floor(c/M.w), out=[]; for(const [dx,dy,b] of Object.values(DIRS)) if(!(M.cells[c]&b)) out.push((y+dy)*M.w+x+dx); return out; }
function bfs(M,from){ const N=M.w*M.h, dist=new Array(N).fill(-1), par=new Array(N).fill(-1), q=[from]; dist[from]=0;
  while(q.length){ const c=q.shift(); for(const n of nbrs(M,c)) if(dist[n]<0){ dist[n]=dist[c]+1; par[n]=c; q.push(n); } } return {dist,par}; }
function pathTo(M,from,to){ const {par}=bfs(M,from), p=[to]; while(p[0]!==from&&par[p[0]]>=0) p.unshift(par[p[0]]); return p; }
function newMaze(){
  const E=effD(), d=DIFF[E], rows=Math.min(d.rows[1],d.rows[0]+Math.floor(S.cleared/2));
  // 미로가 들어갈 자리의 가로세로 비율 (가로 화면은 오른쪽에 방향 버튼, 세로 화면은 아래에 방향 버튼)
  const wrap=$('#mzwrap'), land=innerWidth>innerHeight;
  const ratio=wrap&&wrap.clientHeight?wrap.clientWidth/wrap.clientHeight:land?(innerWidth-300)/Math.max(1,innerHeight-100):(innerWidth-30)/Math.max(1,innerHeight-370);
  const h=rows, w=Math.max(5,Math.min(Math.round(rows*1.7),Math.round(rows*Math.max(.6,ratio))));
  const M=carve(w,h,d.loops); M.v2=true; M.start=0;
  const {dist}=bfs(M,0); M.exit=dist.indexOf(Math.max(...dist));
  const path=pathTo(M,0,M.exit), onPath=new Set(path);
  // 🔒 문: 깃발 바로 앞 칸 · 🔑 열쇠: 탈출 길에서 가장 멀리 떨어진 막다른 길
  M.door=d.key&&path.length>4?path[path.length-2]:-1; M.key=-1; M.hasKey=false;
  let deads=range(0,w*h-1).filter(c=>c!==0&&c!==M.exit&&nbrs(M,c).length===1);
  if(M.door>=0&&deads.length){
    const far=new Array(w*h).fill(-1), q=[...onPath]; q.forEach(c=>far[c]=0);
    while(q.length){ const c=q.shift(); for(const n of nbrs(M,c)) if(far[n]<0){ far[n]=far[c]+1; q.push(n); } }
    M.key=deads.reduce((a,b)=>far[b]>far[a]?b:a); deads=deads.filter(c=>c!==M.key);
  } else M.door=-1;
  // 풀숲: 가장 먼 막다른 길에 진화의 돌, 나머지는 별·열매
  deads.sort((a,b)=>dist[b]-dist[a]);
  const evo=stageOf(pIdx())<maxStage(pIdx());
  // 막다른 길이 많으니 절반쯤만 풀숲(나머지는 그냥 막다른 길)으로 두어 화면이 빽빽하지 않게
  const keep=Math.max(3,Math.ceil(deads.length*.45)), bush=[deads[0],...shuffle(deads.slice(1)).slice(0,keep-1)].filter(c=>c!=null);
  M.items={}; bush.forEach(c=>M.items[c]={k:c===deads[0]&&evo?'stone':pick(['star','star','berry']),open:false});
  // 탈출 길 위의 함정 (피해 갈 수 없음)
  M.traps={}; const cand=path.slice(2,-2), k=Math.min(d.traps,cand.length);
  for(let j=1;j<=k;j++){ const c=cand[Math.floor(cand.length*j/(k+1))]; if(c!==M.door) M.traps[c]=rnd(TRAPS.length); }
  Object.assign(M,{pos:0,last:0,visited:[0],hint:[]});
  S.maze=M; save();
}
const goal=M=>M.door>=0&&!M.hasKey?M.key:M.exit;

let CS=40;
function cellHTML(M,c){
  const b=M.cells[c], cls=['cell'];
  if(b&1) cls.push('n'); if(b&2) cls.push('e'); if(b&4) cls.push('s'); if(b&8) cls.push('w');
  if(M.hint.includes(c)) cls.push('h'); else if(M.visited.includes(c)) cls.push('v');
  const it=M.items[c];
  const inner=c===M.exit?'🚩':c===M.key&&!M.hasKey?'<span class="bush">🔑</span>':c===M.door?(M.hasKey?'🔓':'🔒'):M.traps[c]!=null?TRAPS[M.traps[c]][0]:it&&!it.open?'<span class="bush">🌿</span>':M.hint.includes(c)?'✨':'';
  return `<div class="${cls.join(' ')}" id="c${c}" style="left:${(c%M.w)*CS}px;top:${Math.floor(c/M.w)*CS}px">${inner}</div>`;
}
function layoutMaze(){
  const M=S.maze, wrap=$('#mzwrap'); if(!M||!wrap) return;
  CS=Math.max(24,Math.floor(Math.min((wrap.clientWidth-16)/M.w,(wrap.clientHeight-16)/M.h)));
  const mz=$('#maze'); mz.style.cssText=`width:${CS*M.w}px;height:${CS*M.h}px;--cs:${CS}px`;
  mz.innerHTML=range(0,M.w*M.h-1).map(c=>cellHTML(M,c)).join('')+`<div class="me" id="me">${art(curId())}</div>`;
  placeMe(true);
}
function redrawCell(c){ const el=$('#c'+c); if(el) el.outerHTML=cellHTML(S.maze,c); }
function placeMe(instant){ const M=S.maze, me=$('#me'); if(!me) return; if(instant) me.style.transition='none';
  me.style.left=(M.pos%M.w)*CS+'px'; me.style.top=Math.floor(M.pos/M.w)*CS+'px'; if(instant){ void me.offsetWidth; me.style.transition=''; } }
function bindSwipe(){
  const w=$('#mzwrap'); let sx=0,sy=0,on=false;
  w.addEventListener('pointerdown',e=>{ on=true; sx=e.clientX; sy=e.clientY; });
  w.addEventListener('pointerup',e=>{ if(!on) return; on=false; const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<28) return; move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); });
}
let moving=false;
const isStop=(M,c)=>c===M.exit||c===M.key||c===M.door||M.traps[c]!=null||(M.items[c]&&!M.items[c].open)||nbrs(M,c).length!==2;
async function move(dir){
  const M=S.maze; if(!M||moving||quizOpen||!$('#modal').hidden) return;
  const [dx,dy,b]=DIRS[dir];
  if(M.cells[M.pos]&b){ sfx.bump(); const me=$('#me'); me.classList.remove('bump'); void me.offsetWidth; me.classList.add('bump'); return; }
  let prev=M.pos, c=M.pos+dy*M.w+dx;
  if(c===M.door&&!M.hasKey){ sfx.bump(); const me=$('#me'); me.classList.remove('bump'); void me.offsetWidth; me.classList.add('bump');
    say('문이 잠겨 있어요! 🔑 열쇠를 찾아 와요.'); toast('🔒 잠긴 문 → 🔑 열쇠를 찾아요'); return; }
  moving=true; await stepTo(c);
  // 길 따라 쭉: 갈림길·막다른 길·함정·풀숲·출구 앞에서 멈춤
  while(S.set.slide&&!isStop(M,c)){ const nx=nbrs(M,c).filter(x=>x!==prev); if(nx.length!==1) break; prev=c; c=nx[0]; await stepTo(c); }
  moving=false; save(); arrive(c);
}
async function stepTo(c){
  const M=S.maze, old=M.pos; M.pos=c;
  if(!M.visited.includes(c)) M.visited.push(c);
  if(nbrs(M,c).length>=3) M.last=c;
  if(M.hint.length){ if(M.hint.includes(c)) M.hint=M.hint.filter(x=>x!==c); else { const h=M.hint; M.hint=[]; h.forEach(redrawCell); } }
  redrawCell(old); redrawCell(c); placeMe(); sfx.step();
  await sleep(140);
}
async function arrive(c){
  const M=S.maze;
  if(c===M.exit) return escape();
  if(c===M.key&&!M.hasKey){ M.hasKey=true; save(); sfx.sparkle(); confetti(12); redrawCell(c); redrawCell(M.door);
    say('열쇠를 찾았어요! 이제 잠긴 문을 열 수 있어요!'); toast('🔑 열쇠를 찾았어요! 🔒 문으로 가요'); return; }
  if(c===M.door){ sfx.zap(); say('철컥! 문이 열렸어요!'); return; }
  if(M.traps[c]!=null){
    const [e,nm]=TRAPS[M.traps[c]]; sfx.trap();
    $('#me').insertAdjacentHTML('beforeend',`<div class="trap">${e}</div>`);
    await quiz(e,`${nm}에 걸렸어요!`,'문제를 풀면 빠져나올 수 있어요');
    delete M.traps[c]; save(); layoutMaze(); sfx.zap(); say('빠져나왔어요! 계속 가 볼까요?');
    return;
  }
  const it=M.items[c];
  if(it&&!it.open){
    await quiz('🌿','막다른 길이에요!','문제를 풀면 풀숲을 헤쳐 볼 수 있어요');
    it.open=true; save(); redrawCell(c);

    await backToJunction();
  }
}
async function reward(k){
  if(k==='stone') return evolve();
  const n=k==='star'?2:1; S.stars+=n; save();
  sfx.sparkle(); confetti(10);
  await new Promise(res=>{ onModalClose=res;
    modal(`<div class="reward">${k==='star'?'⭐⭐':'🍓'}</div><h2>${k==='star'?'반짝 별 두 개를 찾았어요!':'맛있는 열매! 별 하나!'}</h2>

// 막다른 길을 해결하면 마지막 갈림길로 돌아가고, 출구 쪽으로 몇 칸 반짝이는 길을 보여 줌
async function backToJunction(){
  const M=S.maze; if(!M||M.pos===M.last) return;
  say('갈림길로 휘리릭!'); sfx.zap();

  const me=$('#me'); me.classList.remove('zap'); placeMe(true); void me.offsetWidth; me.classList.add('zap');
  const p=pathTo(M,M.pos,goal(M)); M.hint=p.slice(1,5).filter(c=>c!==M.exit&&c!==M.key); save();
  M.hint.forEach(redrawCell);
}
async function evolve(){

    <h3>소리 · 목소리</h3>${seg('sound',[[true,'켜기'],[false,'끄기']])}
    <p class="note">⏱️ 시간 제한은 없어요. 함정과 막다른 길의 문제는 맞힐 때까지 기다리고, 틀려도 별이 줄지 않아요. 💡 도와줘요를 누르면 틀린 보기가 흐려지고, 한 번 더 누르면 정답이 반짝여요.</p>
    <div class="row" style="margin-top:18px"><button class="big-btn small alt" data-m="newmaze">새 미로로 바꾸기</button><button class="big-btn small alt" data-m="reset">처음부터 다시</button><button class="big-btn small" data-close>닫기</button></div></div>`,sh=>{
    sh.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{ S.set.diff=+b.dataset.diff; S.adj=S.set.diff; S.good=S.hard=0; save(); settings(); });
    sh.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; S.set[k]=b.dataset.v==='true';
      if(k==='auto'){ S.adj=S.set.diff; S.good=S.hard=0; } save(); b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
    sh.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{ const k=b.dataset.topic, t=S.set.topics;
      if(t[k]&&Object.values(t).filter(Boolean).length===1){ toast('하나는 켜 두어야 해요'); return; }
      t[k]=!t[k]; save(); b.classList.toggle('on',t[k]); });
    sh.querySelector('#dl').onclick=async()=>{
      if(ALL_IDS.every(id=>IMG.has('n'+id))){ toast('이미 다 받았어요!'); return; }
      try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
      const dl=sh.querySelector('#dl'); dl.disabled=true;
      const r=await downloadImages((d,t)=>{ const b=$('#dlbar'), m=$('#imgHave'); if(b) b.style.width=(d/t*100)+'%'; if(m) m.textContent=`받는 중… ${d} / ${t}`; });
      const m=$('#imgHave'); if(m) m.textContent=r.fail?`${r.total-r.fail}장 받았어요. ${r.fail}장은 받지 못했어요. 인터넷을 확인하고 한 번 더 눌러 주세요.`:`모두 받았어요! 🎉 (${imgN()} / ${ALL_IDS.length}장)`;
      dl.disabled=false;
    };
    sh.querySelector('#clr').onclick=()=>modal(`<h2>받은 그림을 지울까요?</h2><p>포켓몬 그림만 지워지고, 별과 진화 기록은 그대로예요.</p>
      <div class="row"><button class="big-btn" data-m="yes">지울래요</button><button class="big-btn alt" data-close>아니요</button></div>`,s2=>{
      s2.querySelector('[data-m]').onclick=async()=>{ try{ await idb.clear(); }catch(e){} IMG.forEach(u=>URL.revokeObjectURL(u)); IMG.clear(); closeModal(); toast('그림을 지웠어요'); };
    });
    sh.querySelector('[data-m="newmaze"]').onclick=()=>{ S.maze=null; save(); onModalClose=null; closeModal(); if(screen==='maze') startMaze(); else renderHome(); toast('새 미로를 만들었어요'); };
    sh.querySelector('[data-m="reset"]').onclick=()=>modal(`<h2>처음부터 다시 할까요?</h2><p>짝꿍, 진화, 별, 도감이 모두 처음으로 돌아가요.<br>설정과 받은 그림은 그대로 남아요.</p>
      <div class="row"><button class="big-btn" data-m="yes">네, 다시 할래요</button><button class="big-btn alt" data-close>아니요</button></div>`,s2=>{
      s2.querySelector('[data-m]').onclick=()=>{ const set=S.set; S=fresh(); S.set=set; S.adj=set.diff; save(); onModalClose=null; closeModal(); renderHome(); };
    });
  });
}

/* ======================================================================
   눌렀을 때
   ====================================================================== */
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  if(d.dir) return move(d.dir);
  if(d.pick!==undefined){ S.partner=+d.pick; markSeen(curId()); save(); sfx.pop(); say(`${curName()}! 같이 가자!`); return renderHome(); }
  if(d.say){ sfx.pop(); return say(d.say); }
  switch(d.act){
    case 'home': sfx.pop(); return renderHome();
    case 'play': sfx.pop(); return startMaze();
    case 'pick': sfx.pop(); renderPick(); return say('함께 갈 짝꿍을 골라요!');
    case 'dex': sfx.pop(); renderDex(); return say('진화 도감이에요!');
  }
});
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
  if(m&&screen==='maze'){ e.preventDefault(); move(m); }
});
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(screen==='maze') layoutMaze(); },150); });

(async function boot(){ await loadImages(); renderHome(); })();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
