<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 영어 쓰기</title>
<meta name="theme-color" content="#bfe3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 쓰기">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/abc-192.png">
<link rel="icon" href="icons/abc-192.png">
<style>
@font-face{font-family:"Jua";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/jua.woff2") format("woff2")}
@font-face{font-family:"Andika";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/andika.woff2") format("woff2")}
:root{
  --bg1:#fff3b0; --bg2:#ffe0e9; --ink:#2b2b3a; --card:#ffffff; --soft:#f4f5f9; --accent:#ef4444; --line:#d7dbe4;
  --sheet:#5f6470; --sheet2:#4c515c; --shadow:0 6px 0 rgba(0,0,0,.14); --ok:#22c55e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#1f2240; --bg2:#2b2350; --ink:#f4f3ff; --card:#2f3157; --soft:#272a4a; --sheet:#3a3e58; --sheet2:#30344c; }
}
:root[data-theme="dark"]{ --bg1:#1f2240; --bg2:#2b2350; --ink:#f4f3ff; --card:#2f3157; --soft:#272a4a; --sheet:#3a3e58; --sheet2:#30344c; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);
  background-image:linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden;min-height:100dvh;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
input[type=search]{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.page{max-width:1100px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 40px}

.top{display:flex;align-items:center;gap:10px;padding:0 0 12px}
.icon-btn{font-size:26px;width:58px;height:58px;flex:none;border-radius:18px;border:none;background:var(--card);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.icon-btn:active,.big-btn:active,.card:active,.tab:active,.menu-btn:active{transform:translateY(3px)}
.icon-btn:disabled{opacity:.35}
.icon-btn.holding::after{content:"";position:absolute;left:0;bottom:0;height:6px;background:var(--accent);animation:hold 1.2s linear forwards}
@keyframes hold{from{width:0}to{width:100%}}
.title{flex:1;font-size:clamp(20px,4.5vw,30px);text-align:center;margin:0;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{width:58px;flex:none}
h2{font-weight:normal;font-size:22px;margin:22px 0 10px}
.logo{text-align:center;margin:6px 0 14px;font-weight:normal;font-size:clamp(34px,7vw,58px);line-height:1.1;color:#ef4444;
  text-shadow:3px 3px 0 #ffd54a,6px 6px 0 rgba(0,0,0,.12)}
.logo small{display:block;font-size:.42em;color:var(--ink);text-shadow:none;opacity:.75;margin-top:6px}

.big-btn{border:none;background:#ffd54a;color:#3a2a00;border-radius:20px;padding:12px 20px;font-size:20px;box-shadow:var(--shadow);cursor:pointer;display:inline-block}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.go{background:var(--ok);color:#fff}
.big-btn.red{background:#ef4444;color:#fff}
.big-btn.small{font-size:16px;padding:9px 14px;border-radius:14px}
.big-btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;opacity:.85}
.opt{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px;font-size:18px}
.opt label{display:flex;align-items:center;gap:10px;margin:6px 0;cursor:pointer}
.opt input[type=checkbox],.opt input[type=radio]{width:24px;height:24px;flex:none}
.opt select{font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid #cbd5e1;background:var(--soft)}
.bar{height:14px;border-radius:8px;background:var(--soft);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#84cc16);width:0;transition:width .3s}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2340;color:#fff;border-radius:20px;
  padding:12px 20px;font-size:20px;z-index:60;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:90vw;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- 그림 ---------- */
img.art{object-fit:contain;display:block}
img.art.ph{opacity:.55}
img.shadow{filter:brightness(0);opacity:.28}
img.shadow.ph{filter:grayscale(1);opacity:.35}

/* ---------- 첫 화면 ---------- */
.home{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){ .home{grid-template-columns:1.1fr 1fr} }
.partner{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:18px;text-align:center;position:relative}
.partner .pimg{width:min(300px,70vw);height:min(300px,70vw);margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#fff 55%,#f1f3f8 56%,#f1f3f8 62%,#fff 63%);border-radius:50%}
.partner .pimg img{width:86%;height:86%}
.partner h3{font-weight:normal;font-size:clamp(28px,5vw,40px);margin:10px 0 2px}
.partner .lv{display:inline-block;background:#ef4444;color:#fff;border-radius:14px;padding:2px 12px;font-size:20px;margin-right:6px;vertical-align:middle}
.partner p{font-size:20px;margin:6px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--soft);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.dots i.on{background:#ffd54a;border-color:#f59e0b}
.menu{display:flex;flex-direction:column;gap:14px}
.menu-btn{border:none;border-radius:26px;padding:18px;font-size:clamp(24px,4vw,32px);box-shadow:var(--shadow);cursor:pointer;background:var(--card);display:flex;align-items:center;gap:14px;text-align:left}
.menu-btn .em{font-size:1.5em}
.menu-btn small{display:block;font-size:.55em;opacity:.7}
.menu-btn.main{background:#ef4444;color:#fff}
.banner{background:#fff7d6;color:#5a4300;border:3px dashed #f59e0b;border-radius:20px;padding:12px 14px;font-size:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.other{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;background:var(--card);border-radius:18px;box-shadow:var(--shadow);height:58px;padding:0 16px;font-size:20px}

/* ---------- 목록 ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tab{flex:none;border:3px solid transparent;border-radius:16px;padding:8px 14px;font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);background:var(--card)}
.tab.on{background:#ef4444;color:#fff;border-color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .tab{font-size:17px;padding:6px 12px}
.filters input{flex:1;min-width:140px;font-size:18px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{border:none;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:8px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:4px;content-visibility:auto;contain-intrinsic-size:150px 190px}
.card .thumb{width:100%;aspect-ratio:1;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .thumb img{width:88%;height:88%}
.card b{font-weight:normal;font-size:clamp(18px,2.6vw,22px)}
.card small{font-size:13px;opacity:.6}
.card .st{position:absolute;top:6px;right:8px;font-size:15px}
.card.done{outline:4px solid #86efac}
.card.locked{cursor:default;background:var(--soft);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.card.locked .thumb{background:transparent}
.card.locked b{opacity:.45}
.card.today{outline:5px solid #ef4444;animation:glow 1.4s ease-in-out infinite alternate}
.card .badge{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;border-radius:12px;padding:2px 10px;font-size:14px;white-space:nowrap;z-index:1}
@keyframes glow{from{box-shadow:0 6px 0 rgba(0,0,0,.14)}to{box-shadow:0 0 0 8px rgba(239,68,68,.25),0 6px 0 rgba(0,0,0,.14)}}

/* ---------- 쓰기 화면 ---------- */
.ws{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.ws header{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 6px}
.ws header .title b{font-weight:normal}
.mini{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);height:58px;padding:0 10px 0 4px;flex:none;cursor:pointer;border:none}
.mini img{width:50px;height:50px}
.mini .md{display:flex;gap:3px}
.mini .md i{width:12px;height:12px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.mini .md i.on{background:#ffd54a;border-color:#f59e0b}
.mini span{font-size:16px}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 12px max(10px,env(safe-area-inset-bottom))}
.info{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:12px;display:flex;gap:14px;align-items:center;flex:none}
.info .pic{width:150px;height:150px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#fff 52%,#ece8f8 53%,#ece8f8 64%,#fff 65%)}
.info .pic img{width:92%;height:92%}
.info .txt{flex:1;min-width:0}
.info .nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info .nm .no{background:#ef4444;color:#fff;border-radius:14px;padding:2px 10px;font-size:18px}
.info .nm b{font-weight:normal;font-size:clamp(28px,4vw,40px)}
.info .nm button{border:none;background:var(--soft);border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:17px;font-family:'Noto Sans KR',system-ui,sans-serif}
.info dt{font-weight:700;white-space:nowrap}.info dt::before{content:"● ";font-size:.7em;vertical-align:2px}
.info dd{margin:0;overflow-wrap:anywhere}
.chip{display:inline-block;border-radius:10px;padding:0 8px;margin-right:4px;color:#fff;font-size:15px;line-height:24px}
.sheet{flex:1;min-height:0;background:var(--sheet);border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:10px;
  background-image:radial-gradient(rgba(255,255,255,.08) 1.5px,transparent 1.6px);background-size:16px 16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .lbl{color:#fff;font-size:18px;margin-right:auto}
.tbtn{border:none;border-radius:14px;background:#fff;color:#2b2b3a;font-size:18px;height:46px;padding:0 14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pen{width:40px;height:40px;border-radius:50%;border:4px solid #fff;background:var(--c);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pen.on{outline:4px solid #ffd54a}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px}
.wrow{display:flex;align-items:center;gap:8px;justify-content:center}
.wrow .tag{color:#fff;font-size:16px;writing-mode:vertical-rl;letter-spacing:2px;opacity:.85;flex:none}
.wrow .boxes{display:flex;background:#eef0f4;border-radius:16px;padding:6px;gap:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);position:relative}
.box{position:relative;border:2px solid #9aa1ae;margin-left:-2px;background:#fff;touch-action:none}
.box:first-child{margin-left:0;border-radius:10px 0 0 10px}
.box:last-child{border-radius:0 10px 10px 0}
.box:only-child{border-radius:10px}
.box canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.box .g{pointer-events:none}
.box.ok{background:#f0fdf4}
.box.ok::after{content:"✔";position:absolute;right:4px;top:0;color:#16a34a;font-size:22px;pointer-events:none;animation:popin .3s}
.box.static{background:#f6f7fa}
.box.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.wrow .side{display:flex;flex-direction:column;gap:6px;flex:none}
.wrow .side button{border:none;border-radius:14px;width:84px;height:46px;font-size:22px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);background:#fff}
.wrow .side .chk{height:auto;min-height:62px;font-size:19px;line-height:1.15;padding:6px 4px}
.wrow .side .chk{background:var(--ok);color:#fff}
.wrow.done .boxes{box-shadow:inset 0 0 0 4px #4ade80}
.wrow.done .side .chk{background:#fff;color:var(--ok)}
.jamo{color:#fff;text-align:center;font-size:16px;opacity:.85;font-family:'Noto Sans KR',system-ui,sans-serif;min-height:1em}
@media (orientation:landscape) and (min-width:800px){
  .wbody{flex-direction:row}
  .info{flex-direction:column;width:300px;align-items:stretch;overflow-y:auto}
  .info .pic{width:220px;height:220px;margin:0 auto}
}
@media (max-height:700px) and (orientation:portrait){ .info .pic{width:110px;height:110px} }

/* ---------- 상·진화 ---------- */
.ov{position:fixed;inset:0;background:rgba(10,20,50,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.panel{background:var(--card);border-radius:30px;padding:22px;max-width:620px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);max-height:94dvh;overflow:auto;position:relative}
.panel h3{font-weight:normal;font-size:clamp(32px,8vw,52px);margin:4px 0;color:#f97316}
.panel p{font-size:22px;margin:6px 0}
.stars{font-size:46px;letter-spacing:4px}
.stage{position:relative;height:300px;display:flex;align-items:center;justify-content:center;overflow:visible}
.stage img{position:absolute;max-height:270px;max-width:80%;transition:transform .45s ease-in,opacity .45s ease-in,filter .3s}
.stage img.in{transform:scale(0) translateY(80px);opacity:0;filter:brightness(3)}
.stage img.white{filter:brightness(0) invert(1) drop-shadow(0 0 14px #93c5fd)}
.stage.glow{background:radial-gradient(circle,#dbeafe 0,transparent 65%)}
.ball{position:absolute;width:110px;height:110px;border-radius:50%;opacity:0;border:6px solid #222;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.75),transparent 26%),linear-gradient(#ef4444 0 45%,#222 45% 55%,#fff 55%)}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:6px solid #222}
.ball.throw{opacity:1;animation:throw .7s cubic-bezier(.3,.8,.4,1) forwards}
.ball.wobble{opacity:1;animation:wobble 1.6s ease-in-out}
.ball.got{opacity:1;animation:gotit .5s}
@keyframes throw{from{transform:translateY(55vh) scale(.4) rotate(-720deg)}to{transform:translateY(60px) scale(1) rotate(0)}}
@keyframes wobble{0%,100%{transform:translateY(60px) rotate(0)}10%,43%,76%{transform:translateY(60px) rotate(-22deg)}22%,55%,88%{transform:translateY(60px) rotate(22deg)}33%,66%{transform:translateY(60px) rotate(0)}}
@keyframes gotit{0%{transform:translateY(60px) scale(1)}50%{transform:translateY(60px) scale(1.25)}100%{transform:translateY(60px) scale(1)}}
.ball.wobble,.ball.got{transform:translateY(60px)}
.burst{position:absolute;font-size:36px;animation:burst 1s ease-out forwards;pointer-events:none;z-index:3}
@keyframes burst{from{transform:translate(0,40px) scale(.3);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.flick{animation:flick .5s 6 alternate}
@keyframes flick{from{transform:scale(1)}to{transform:scale(.82)}}

/* ---------- 내 포켓몬 ---------- */
.chain{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.chain .st{flex:none;display:flex;flex-direction:column;align-items:center;width:clamp(96px,16vw,140px);border:none;background:none;cursor:pointer;padding:4px}
.chain .st .im{width:100%;aspect-ratio:1;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.chain .st img{width:86%;height:86%}
.chain .st b{font-weight:normal;font-size:clamp(15px,2.2vw,19px);margin-top:4px;white-space:nowrap}
.chain .st.now .im{background:#fff3cf;box-shadow:0 0 0 4px #f59e0b}
.chain .ar{flex:none;font-size:24px;opacity:.5}
:root{ --bg1:#cfeaff; --bg2:#fff1c9; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg1:#1b2a46; --bg2:#2b2350; } }
:root[data-theme="dark"]{ --bg1:#1b2a46; --bg2:#2b2350; }
.logo{color:#2563eb;text-shadow:3px 3px 0 #ffd54a,6px 6px 0 rgba(0,0,0,.12)}
.menu-btn.main{background:#2563eb}
.tab.on{background:#2563eb}
.info .nm .no{background:#2563eb}
.en{font-family:'Andika',system-ui,sans-serif}
.info .word button{border:none;background:var(--soft);border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.info .word{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.info .word .em{font-size:clamp(46px,6vw,64px);line-height:1}
.info .word b{font-family:'Andika',system-ui,sans-serif;font-weight:normal;font-size:clamp(40px,5.5vw,60px);line-height:1}
.info .ko{font-size:24px;margin:6px 0 2px}
.info .line{font-size:19px;line-height:1.4;margin:6px 0;background:var(--soft);border-radius:14px;padding:8px 10px}
.info .who{font-size:15px;opacity:.7}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tiles button{border:none;border-radius:12px;background:#fff;color:#1f2937;font-family:'Andika',system-ui,sans-serif;font-size:26px;min-width:46px;height:46px;padding:0 10px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tiles button.all{background:#ffd54a;font-size:22px}
.box.ln{border-color:#9aa1ae}
.quiz{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.quiz button{border:none;border-radius:22px;background:var(--soft);font-size:clamp(54px,12vw,84px);padding:12px 0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.quiz button.right{background:#bbf7d0}
.quiz button.shake{animation:shake .45s}
.quiz button img{width:70%;aspect-ratio:1;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wcard{border:none;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.wcard .thumb{width:100%;aspect-ratio:1;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.wcard .thumb img{width:84%;height:84%}
.wcard .thumb .em{position:absolute;right:4px;bottom:0;font-size:40px}
.wcard b{font-family:'Andika',system-ui,sans-serif;font-weight:normal;font-size:28px;line-height:1.1}
.wcard small{font-size:16px;opacity:.75}
.other{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;background:var(--card);border-radius:18px;box-shadow:var(--shadow);height:58px;padding:0 16px;font-size:20px}
</style>
</head>
<body>
<div id="app"></div>

<script>

/* ---------- 그림 저장소 (포켓몬 한글 쓰기와 같은 저장소를 함께 씀) ---------- */
const db=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('hangulpoke',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('art'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const tx=async(mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{
    const t=d.transaction('art',mode), r=fn(t.objectStore('art'));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return { get:k=>tx('readonly',o=>o.get(k)), put:(k,v)=>tx('readwrite',o=>o.put(v,k)),
    keys:()=>tx('readonly',o=>o.getAllKeys()), clear:()=>tx('readwrite',o=>o.clear()) };
})();
const POKE_ART=n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${n}.png`;
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#c5cad6" stroke-width="6"/><path d="M6 50a44 44 0 0 1 88 0z" fill="#e5e7eb"/><rect x="6" y="46" width="88" height="8" fill="#c5cad6"/><circle cx="50" cy="50" r="13" fill="#fff" stroke="#c5cad6" stroke-width="6"/></svg>');
const have=new Set(), artURL=new Map(), pending=new Map();
async function artGet(pid){
  if(artURL.has(pid)) return artURL.get(pid);
  if(!have.has(pid)) return null;
  try{ const b=await db.get(pid); if(!b) return null; const u=URL.createObjectURL(b); artURL.set(pid,u); return u; }catch(e){ return null; }
}
async function shrink(blob,max=360){
  let img; try{ img=await createImageBitmap(blob); }
  catch(e){ img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(blob); }); }
  const s=Math.min(1,max/Math.max(img.width,img.height)), c=mkCanvas(Math.round(img.width*s),Math.round(img.height*s));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}
function artFetch(pid){
  if(pending.has(pid)) return pending.get(pid);
  const pr=(async()=>{
    const r=await fetch(POKE_ART(pid)); if(!r.ok) throw new Error('HTTP '+r.status);
    const b=await shrink(await r.blob()); await db.put(pid,b); have.add(pid);
    const u=URL.createObjectURL(b); artURL.set(pid,u); return u;
  })().finally(()=>pending.delete(pid));
  pending.set(pid,pr); return pr;
}
async function artEnsure(pid){ return (await artGet(pid))||(opts.auto&&navigator.onLine!==false?await artFetch(pid).catch(()=>null):null); }
const imgTag=(pid,cls='')=>`<img class="art ph ${cls}" data-pid="${pid}" src="${PH}" alt="" draggable="false">`;
function hydrate(root,fetchMissing=true){
  root.querySelectorAll('img[data-pid]').forEach(async im=>{
    const pid=+im.dataset.pid, u=fetchMissing?await artEnsure(pid):await artGet(pid);
    if(u){ im.src=u; im.classList.remove('ph'); }
  });
}
let lazyObs=null;
function lazyHydrate(root){
  if(lazyObs) lazyObs.disconnect();
  lazyObs=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; lazyObs.unobserve(e.target);
    const im=e.target; artGet(+im.dataset.pid).then(u=>{ if(u){ im.src=u; im.classList.remove('ph'); } }); }),{rootMargin:'300px'});
  root.querySelectorAll('img[data-pid]').forEach(im=>{ if(have.has(+im.dataset.pid)) lazyObs.observe(im); });
}

const sfx=(()=>{
  let ac;
  const tone=(f,t0,d,type='sine',v=.16)=>{ if(!opts.sound) return; try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+t0;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); }catch(e){} };
  return { pop:()=>tone(660,0,.08,'triangle'), ding:()=>{ tone(988,0,.12,'triangle',.12); tone(1319,.08,.2,'triangle',.12); },
    ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.2)), no:()=>tone(220,0,.18,'square',.05),
    wob:()=>tone(240,0,.12,'square',.06), click:()=>tone(1400,0,.06,'square',.08),
    fan:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,'triangle')),
    evo:()=>[392,440,494,523,587,659,698,784].forEach((f,i)=>tone(f,i*.18,.22,'sine',.1)) };
})();
let enVoice=null, koVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices();
  const en=v.filter(x=>/^en[-_]US/i.test(x.lang)), ko=v.filter(x=>/^ko/i.test(x.lang));
  enVoice=en.find(x=>/samantha|premium|enhanced/i.test(x.name))||en[0]||v.find(x=>/^en/i.test(x.lang))||null;
  koVoice=ko.find(x=>/yuna|유나|premium|enhanced/i.test(x.name))||ko[0]||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
// say(['cat','en'],['고양이','ko'], …) — 차례대로 이어서 읽음
function say(...parts){
  if(!opts.sound||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel();
    parts.filter(p=>p&&p[0]).forEach(([t,l])=>{ const u=new SpeechSynthesisUtterance(t);
      if(l==='en'){ u.lang='en-US'; if(enVoice) u.voice=enVoice; u.rate=opts.rate; }
      else{ if(!opts.ko&&l==='ko') return; u.lang='ko-KR'; if(koVoice) u.voice=koVoice; u.rate=Math.min(1,opts.rate+.05); }
      u.pitch=1.1; speechSynthesis.speak(u); });
  }catch(e){}
}

/* ======================================================================
   영어 4줄 칸과 글자 모양 비교 (넉넉하게)
   ====================================================================== */
const GFONT='"Andika","Comic Sans MS",system-ui,sans-serif';
const fontReady=()=>document.fonts?document.fonts.load(`100px ${GFONT}`,'Hxgaby').catch(()=>{}):Promise.resolve();
const BOX_W=.72;                       // 칸 너비 = 높이 × 0.72
let FM=null;                           // 글꼴 비율(대문자 높이, x 높이, 아래로 내려가는 길이)
function fontMetrics(){
  if(FM) return FM;
  const x=mkCanvas(10,10).getContext('2d'); x.font=`100px ${GFONT}`;
  const a=c=>x.measureText(c);
  FM={cap:(a('H').actualBoundingBoxAscent||70)/100,xh:(a('x').actualBoundingBoxAscent||50)/100,desc:(a('g').actualBoundingBoxDescent||22)/100};
  return FM;
}
function guide(H){ // 4줄의 자리와 글자 크기
  const m=fontMetrics(), base=H*.7, fs=H*.5/m.cap;
  return {fs,base,top:base-m.cap*fs,mid:base-m.xh*fs,bot:base+m.desc*fs};
}
function drawGlyph(ctx,ch,W,H,fill,stroke){
  const g=guide(H); ctx.font=`${g.fs}px ${GFONT}`; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=fill; ctx.fillText(ch,W/2,g.base);
  if(stroke){ ctx.save(); ctx.setLineDash([H*.03,H*.03]); ctx.lineWidth=Math.max(1,H*.008); ctx.strokeStyle=stroke; ctx.strokeText(ch,W/2,g.base); ctx.restore(); }
}
function drawLines(ctx,W,H){
  const g=guide(H); ctx.save(); ctx.lineWidth=1.5;
  const ln=(y,col,dash)=>{ ctx.strokeStyle=col; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); };
  ln(g.top,'#b9c3d6'); ln(g.mid,'#c7cedb',[6,6]); ln(g.base,'#ef8a8a'); ln(g.bot,'#b9c3d6');
  ctx.restore();
}
const MH=56, MW=Math.round(MH*BOX_W), maskCache=new Map();
function glyphMask(ch){
  if(maskCache.has(ch)) return maskCache.get(ch);
  const c=mkCanvas(MW,MH), x=c.getContext('2d',{willReadFrequently:true}); drawGlyph(x,ch,MW,MH,'#000');
  const d=x.getImageData(0,0,MW,MH).data, m=new Uint8Array(MW*MH); for(let i=0;i<m.length;i++) m[i]=d[i*4+3]>110?1:0;
  maskCache.set(ch,m); return m;
}
function inkMask(strokes,fit){
  const c=mkCanvas(MW,MH), x=c.getContext('2d',{willReadFrequently:true});
  let tr=p=>[p.x*MW,p.y*MH];
  if(fit){ let x0=1,y0=1,x1=0,y1=0; strokes.forEach(s=>s.forEach(p=>{ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }));
    const [gx0,gy0,gx1,gy1]=fit, sw=Math.max(x1-x0,.05), sh=Math.max(y1-y0,.05);
    tr=p=>[(gx0+(p.x-x0)/sw*(gx1-gx0))*MW,(gy0+(p.y-y0)/sh*(gy1-gy0))*MH]; }
  x.lineCap=x.lineJoin='round'; x.strokeStyle='#000'; x.lineWidth=MH*.07;
  strokes.forEach(s=>{ x.beginPath(); s.forEach((p,i)=>{ const [a,b]=tr(p); i?x.lineTo(a,b):x.moveTo(a,b); }); if(s.length===1){ const [a,b]=tr(s[0]); x.lineTo(a+.1,b); } x.stroke(); });
  const d=x.getImageData(0,0,MW,MH).data, m=new Uint8Array(MW*MH); for(let i=0;i<m.length;i++) m[i]=d[i*4+3]>60?1:0; return m;
}
function dilate(m,r){
  const o=new Uint8Array(m.length);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){ if(!m[y*MW+x]) continue;
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ if(dx*dx+dy*dy>r*r+1) continue; const X=x+dx,Y=y+dy; if(X>=0&&Y>=0&&X<MW&&Y<MH) o[Y*MW+X]=1; } }
  return o;
}
function bbox(m){ let x0=MW,y0=MH,x1=0,y1=0; for(let i=0;i<m.length;i++) if(m[i]){ const x=i%MW,y=i/MW|0; x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); } return [x0/MW,y0/MH,(x1+1)/MW,(y1+1)/MH]; }
function judge(box){
  const E={cov:0,prec:0,much:0,q:0,empty:true};
  if(!box.strokes.length) return E;
  const G=glyphMask(box.ch), I=inkMask(box.strokes,box.mode===2?bbox(G):null), r=box.mode===2?3:2;
  let ink=0; for(const v of I) ink+=v;
  if(ink<MW*MH*.008) return E;
  const Id=dilate(I,r), Gd=dilate(G,r); let g=0,gc=0,ic=0;
  for(let i=0;i<G.length;i++){ if(G[i]){ g++; if(Id[i]) gc++; } if(I[i]&&Gd[i]) ic++; }
  const cov=gc/g, prec=ic/ink, much=ink/g;
  return {cov,prec,much,q:Math.sqrt(cov*prec)};
}
// 다 썼어요를 누르면 이 기준으로 봐 줌. 같은 칸을 두 번 넘게 다시 써도 안 되면 PASS_TRIED로 통과
const PASS_HAND=r=>r.cov>=.4&&r.prec>=.55&&r.much<2.8, PASS_TRIED=r=>!r.empty&&r.prec>=.35&&r.much<3.2;

async function writePage(p){
  const OPEN=ORDER.filter(isOpen), idx=OPEN.indexOf(p), prev=idx>0?OPEN[idx-1]:null, next=idx>=0?OPEN[idx+1]:null;
  const pt=partner(), modes=[[0],[0,2],[0,1,2]][Math.max(1,Math.min(3,opts.rows))-1];
  const ROWTAG=['따라 쓰기','흐린 글씨','혼자 쓰기','이름 쓰기'];
  const rowsDef=modes.map(m=>({mode:m,text:p.text,tag:ROWTAG[m]}));
  if(p.kind==='abc') rowsDef.push({mode:0,text:p.name,tag:ROWTAG[3]});   // 그 글자로 시작하는 포켓몬 이름도 따라 쓰기
  const d=st.done[p.key];
  const info=p.kind==='abc'

      <div class="line"><span class="en" style="font-size:24px">${esc(p.text[0])} is for <b>${esc(p.name)}</b>!</span><br>${esc(KO[p.pid])}의 영어 이름은 <b class="en">${esc(p.name)}</b>${pp(p.name,'이에요','예요')}.</div>

    :`<div class="word"><span class="em">${p.em}</span><b>${esc(p.text)}</b><button id="speak" title="읽어 주기">🔊</button>${d?`<span>${'⭐'.repeat(d.s||1)}</span>`:''}</div>
      <div class="ko">뜻: <b>${esc(p.ko)}</b></div>
      <div class="line">${esc(p.line)}</div>
      <div class="who">${LEVELS[p.lv].t} · 소개: <span class="en">${esc(EN[p.pid])}</span> (${esc(KO[p.pid])})</div>`;
  show(`<div class="ws">
    <header>
      <button class="icon-btn" id="back">🏠</button>
      <button class="icon-btn" id="prev" ${prev?'':'disabled'}>◀</button>
      <h2 class="title"><b class="en">${esc(pageLabel(p))}</b></h2>
      <button class="icon-btn" id="next" ${next?'':'disabled'}>▶</button>
      <button class="mini" id="mini">${pt?imgTag(pt.pid):imgTag(4,'shadow')}<span>${pt?'Lv.'+st.level:'?'}</span>${dotsHTML('md')}</button>
    </header>
    <div class="wbody">
      <div class="info">
        <div class="pic">${imgTag(p.pid)}</div>
        <div class="txt">${info}</div>
      </div>
      <div class="sheet">
        <div class="toolbar"><span class="lbl">✏️ 글자를 누르면 이름을 읽어 줘요</span>
          ${PENS.map(([c,n],i)=>`<button class="pen ${i===opts.pen?'on':''}" style="--c:${c}" data-i="${i}" title="${n}"></button>`).join('')}
          <button class="tbtn" id="undo">↶ 되돌리기</button></div>
        <div class="tiles" id="tiles">${[...p.text].map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')}<button class="all" id="allw">🔊 ${esc(p.kind==='abc'?p.text[0]:p.text)}</button></div>
        <div class="rows" id="rows">${rowsDef.map((r,ri)=>`<div class="wrow" data-r="${ri}"><span class="tag">${r.tag}</span><div class="boxes"></div>
          <div class="side"><button class="chk">다 썼어요<br>✔</button><button class="clr" title="이 줄 지우기">🧽</button></div></div>`).join('')}</div>
      </div>
    </div>
  </div>`);
  hydrate($app);
  const intro=()=>p.kind==='abc'?say([p.text[0],'en'],[`${p.text[0]} is for ${p.name}!`,'en']):say([p.text,'en'],[p.ko,'ko']);
  $('#back').onclick=()=>{ sfx.pop(); try{ speechSynthesis.cancel(); }catch(e){} home(); };
  $('#mini').onclick=()=>{ sfx.pop(); myDex(); };
  if(prev) $('#prev').onclick=()=>{ sfx.pop(); writePage(prev); };
  if(next) $('#next').onclick=()=>{ sfx.pop(); writePage(next); };
  $('#speak').onclick=intro;
  $('#tiles').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; sfx.click();
    if(b.id==='allw') return p.kind==='abc'?say([`${p.text[0]}, ${p.text[1]}`,'en']):say([p.text,'en'],[spell(p.text),'en'],[p.text,'en']);
    say([LNAME[b.dataset.c.toLowerCase()]||b.dataset.c,'en']); };
  $app.querySelectorAll('.pen').forEach(b=>b.onclick=()=>{ opts.pen=+b.dataset.i; saveOpts(); $app.querySelectorAll('.pen').forEach(x=>x.classList.toggle('on',x===b)); sfx.click(); });

  await fontReady();
  const hist=[]; let finished=false, activeId=null, S=100;
  const rows=rowsDef.map((rd,ri)=>{
    const el=$app.querySelector(`.wrow[data-r="${ri}"]`), wrap=el.querySelector('.boxes');
    const boxes=[...rd.text].map(ch=>{
      const b={ch,mode:rd.mode,han:/[A-Za-z]/.test(ch),strokes:[],done:!/[A-Za-z]/.test(ch),fails:0,row:null};
      b.el=document.createElement('div'); b.el.className='box ln'+(b.han?'':' static');
      b.g=mkCanvas(1,1); b.g.className='g'; b.k=mkCanvas(1,1); b.el.append(b.g,b.k); wrap.appendChild(b.el);
      if(b.han) bindInk(b);
      return b;
    });
    const row={el,boxes,done:false,text:rd.text}; boxes.forEach(b=>b.row=row);
    el.querySelector('.chk').onclick=()=>checkRow(row);
    el.querySelector('.clr').onclick=()=>{ sfx.pop(); boxes.forEach(b=>{ if(!b.han) return; b.strokes=[]; b.done=false; b.fails=0; b.el.classList.remove('ok'); paint(b); });
      for(let i=hist.length-1;i>=0;i--) if(hist[i].row===row) hist.splice(i,1); row.done=false; el.classList.remove('done'); };
    return row;
  });
  const all=rows.flatMap(r=>r.boxes), maxLen=Math.max(...rows.map(r=>r.boxes.length));
  $('#undo').onclick=()=>{ const b=hist.pop(); if(!b){ sfx.no(); return; } sfx.pop(); b.strokes.pop(); paint(b);
    if(b.done&&!b.strokes.length){ b.done=false; b.el.classList.remove('ok'); b.row.done=false; b.row.el.classList.remove('done'); } };

  let W=72;
  function layout(){
    const rowsEl=$('#rows'); if(!rowsEl) return;
    const AW=rowsEl.clientWidth-(28+92+16+12+16), AH=rowsEl.clientHeight;
    S=Math.floor(Math.max(56,Math.min(200,AW/maxLen/BOX_W,(AH-rows.length*8)/rows.length-14)));
    W=Math.round(S*BOX_W);
    const dpr=Math.min(3,window.devicePixelRatio||1);
    all.forEach(b=>{ b.el.style.width=W+'px'; b.el.style.height=S+'px';
      [b.g,b.k].forEach(c=>{ c.width=Math.round(W*dpr); c.height=Math.round(S*dpr); });
      const g=b.g.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,S);
      drawLines(g,W,S);
      if(!b.han) drawGlyph(g,b.ch,W,S,'#4b5563');
      else if(b.mode===0) drawGlyph(g,b.ch,W,S,'#c7ccd6','#8a91a0');
      else if(b.mode===1) drawGlyph(g,b.ch,W,S,'#e8eaef');
      b.k.getContext('2d').setTransform(dpr,0,0,dpr,0,0); paint(b); });
  }
  const widthAt=pr=>S*.06*(.65+pr*.7);
  function seg(ctx,a,b,col){ ctx.strokeStyle=col; ctx.lineCap=ctx.lineJoin='round'; ctx.lineWidth=widthAt((a.p+b.p)/2);
    ctx.beginPath(); ctx.moveTo(a.x*W,a.y*S); ctx.lineTo(b.x*W+(a===b?.01:0),b.y*S); ctx.stroke(); }
  function paint(b){ const x=b.k.getContext('2d'); x.clearRect(0,0,W,S);
    b.strokes.forEach(s=>{ for(let i=0;i<s.length;i++) seg(x,s[Math.max(0,i-1)],s[i],s.col); }); }
  function bindInk(b){
    const cv=b.k;
    const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pointerType==='pen'?(e.pressure||.5):.5}; };
    cv.addEventListener('pointerdown',e=>{
      if(e.pointerType==='pen'&&!penSeen) penSeen=true;
      if(opts.palm&&penSeen&&e.pointerType==='touch') return;   // 펜슬을 쓰는 동안 손바닥·손가락은 무시
      if(activeId!==null||finished) return;
      e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      activeId=e.pointerId;
      const s=[pt(e)]; s.col=PENS[opts.pen][0]; b.strokes.push(s); b.cur=s; hist.push(b);
      seg(cv.getContext('2d'),s[0],s[0],s.col);
    });
    cv.addEventListener('pointermove',e=>{
      if(e.pointerId!==activeId||!b.cur) return; e.preventDefault();
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e], x=cv.getContext('2d');
      (evs.length?evs:[e]).forEach(ev=>{ const q=pt(ev), l=b.cur[b.cur.length-1]; if(Math.abs(q.x-l.x)+Math.abs(q.y-l.y)<.004) return; b.cur.push(q); seg(x,l,q,b.cur.col); });
    });
    const end=e=>{ if(e.pointerId!==activeId) return; activeId=null; b.cur=null; };
    cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  }
  function checkRow(row){
    if(finished) return;
    if(row.done){ say([row.text,'en']); return; }
    let miss=null;
    row.boxes.forEach(b=>{ if(b.done) return; const r=judge(b);
      if(PASS_HAND(r)||(b.fails>=2&&PASS_TRIED(r))){ b.done=true; b.el.classList.add('ok'); } else { b.fails++; miss=miss||b; } });
    if(miss){ sfx.no(); miss.el.classList.remove('shake'); void miss.el.offsetWidth; miss.el.classList.add('shake');
      say([miss.ch,'en'],[miss.strokes.length?'조금 더 또박또박 써 볼까요?':'여기도 써 주세요!','ko']); return; }
    row.done=true; row.el.classList.add('done'); sfx.ok();
    // 다 쓴 줄은 철자와 함께 읽어 줌: c, a, t — cat!
    if(p.kind==='abc'&&row.text===p.text) say([`${p.text[0]}, ${p.text[1]}`,'en']);
    else say([spell(row.text),'en'],[row.text,'en']);
    if(rows.every(r=>r.done)){ finished=true; setTimeout(()=>p.kind==='word'?quiz(p,all):finishPage(p,all),1600); }
  }
  layout(); window.onresize=()=>{ clearTimeout(layout.t); layout.t=setTimeout(layout,120); };
  setTimeout(intro,250);
}

    else{ tries++; sfx.no(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); b.disabled=true; b.style.opacity=.35;

}

/* ======================================================================
   다 썼어요 → 별 · 단어 카드 · 레벨업 · 잡기/진화
   ====================================================================== */
async function finishPage(p,boxes,quizFirst){
  const hs=boxes.filter(b=>b.han), q=hs.reduce((a,b)=>a+judge(b).q,0)/hs.length;
  let stars=q>=.78?3:q>=.6?2:1; if(quizFirst===false) stars=Math.max(1,stars-1);
  const first=!st.done[p.key];
  const prev=st.done[p.key]; st.done[p.key]={n:(prev?prev.n:0)+1,s:Math.max(stars,prev?prev.s:0)};
  st.words++;
  let ev=null; const from=partner();
  if(!st.level){ st.level=1; st.since=0; ev='catch'; }
  else if(st.level<STAGES.length){ st.since++; if(st.since>=opts.per){ st.since=0; st.level++; ev=STAGES[st.level-1].j===0?'catch':'evolve'; } }
  saveSt();
  const to=partner();
  const ov=document.createElement('div'); ov.className='ov'; ov.innerHTML='<div class="panel"></div>'; document.body.appendChild(ov);
  const panel=ov.querySelector('.panel');
  const nx=STAGES[st.level], left=opts.per-st.since, next=nextPage();
  const buttons=`<div class="row" style="justify-content:center;margin-top:14px">
      <button class="big-btn alt" id="rAgain">🔁 다시 쓰기</button><button class="big-btn alt" id="rHome">🏠 처음으로</button>
      <button class="big-btn go" id="rNext">다음 ▶<br><small class="en">${esc(pageLabel(next))}</small></button></div>`;
  const progress=()=>to?`${dotsHTML()}<p style="font-size:19px">${nx?(nx.j===0?`${left}쪽 더 쓰면 새 포켓몬!`:`${left}쪽 더 쓰면 진화!`):'모든 포켓몬을 모았어요!'}</p>`:'';
  const wire=()=>{ const close=()=>ov.remove();
    panel.querySelector('#rAgain').onclick=()=>{ close(); writePage(p); };
    panel.querySelector('#rHome').onclick=()=>{ close(); home(); };
    panel.querySelector('#rNext').onclick=()=>{ close(); writePage(next); }; };

  // 1) 칭찬 + (처음 쓴 단어면) 포켓몬 단어 카드
  sfx.fan();
  const card=p.kind==='word'
    ?`<div class="wcard" style="max-width:220px;margin:8px auto;cursor:default"><div class="thumb">${imgTag(p.pid)}<span class="em">${p.em}</span></div><b>${esc(p.text)}</b><small>${esc(p.ko)}</small></div>`
    :`<div class="wcard" style="max-width:220px;margin:8px auto;cursor:default"><div class="thumb">${imgTag(p.pid)}</div><b>${esc(p.text[0])} ${esc(p.text[1])}</b><small class="en">${esc(p.name)}</small></div>`;
  panel.innerHTML=`<h3>Great job!</h3><p>참 잘했어요!</p><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    ${first?`<p style="font-size:20px">🃏 새 포켓몬 단어 카드를 받았어요!</p>`:''}${card}`;
  hydrate(panel); burst(panel,'⭐',10);
  say(['Great job!','en'],[p.kind==='word'?p.text:EN_LINE(p),'en']);
  if(!ev){ panel.insertAdjacentHTML('beforeend',progress()+buttons); wire(); return; }
  await sleep(2600);

  // 2) 잡기 또는 진화
  const toEn=EN[to.pid], toKo=KO[to.pid];
  if(ev==='catch'){
    const wasLast=from&&STAGES[st.level-2]&&STAGES[st.level-2].last;
    panel.innerHTML=`<h3>${wasLast?'새 친구 등장!':'앗! 포켓몬이다!'}</h3>
      ${wasLast?`<p>${esc(KO[from.pid])}의 진화를 모두 마쳤어요!</p>`:'<p>몬스터볼을 던져요!</p>'}
      <div class="stage"><img id="pk" class="in" alt=""><div class="ball" id="ball"></div></div><div id="msg"></div>`;
    const u=await artEnsure(to.pid); const im=panel.querySelector('#pk'); im.src=u||PH;
    say([wasLast?`${KO[from.pid]}${pp(KO[from.pid],'은','는')} 최종 진화를 마쳤어요. 새로운 포켓몬이 나타났다!`:'앗! 야생 포켓몬이 나타났다!','ko']);
    im.classList.remove('in'); await sleep(1400);
    const b=panel.querySelector('#ball'); b.classList.add('throw'); sfx.pop(); await sleep(650);
    im.classList.add('in'); await sleep(450); b.classList.remove('throw'); b.classList.add('wobble');
    for(let i=0;i<3;i++){ await sleep(520); sfx.wob(); }
    await sleep(300); b.classList.remove('wobble'); b.classList.add('got'); sfx.click(); burst(panel,'⭐'); await sleep(350); sfx.fan();
    b.remove(); im.classList.remove('in');
    panel.querySelector('#msg').innerHTML=`<p><b class="en" style="font-size:36px">${esc(toEn)}</b></p><p>${esc(toKo)}${pp(toKo,'을','를')} 잡았다!</p>`+progress()+buttons;
    say(['Gotcha!','en'],[toEn,'en'],[`${toKo}${pp(toKo,'을','를')} 잡았다!`,'ko']);
  }else{
    const fromKo=KO[from.pid], mega=toEn.startsWith('Mega');
    panel.innerHTML=`<h3>${mega?'메가진화!':'어라…?'}</h3><p id="hm">${esc(fromKo)}의 모습이…!</p>
      <div class="stage glow"><img id="a" alt=""><img id="b" alt="" style="opacity:0"></div><div id="msg"></div>`;
    const [ua,ub]=await Promise.all([artEnsure(from.pid),artEnsure(to.pid)]);
    const A=panel.querySelector('#a'), B=panel.querySelector('#b'); A.src=ua||PH; B.src=ub||PH;
    say(['What?','en'],[`${fromKo}의 모습이…!`,'ko']); sfx.evo();
    await sleep(1200); A.classList.add('white'); await sleep(400);
    for(let i=0;i<7;i++){ const s=1-(i%2); A.style.opacity=s; B.style.opacity=1-s; B.classList.add('white'); await sleep(Math.max(140,420-i*45)); }
    A.style.opacity=0; B.style.opacity=1; await sleep(300); B.classList.remove('white'); burst(panel,'✨',14); sfx.fan();
    panel.querySelector('h3').textContent='축하해요!'; panel.querySelector('#hm').remove();
    panel.querySelector('#msg').innerHTML=`<p>${esc(fromKo)}${pp(fromKo,'은','는')} <b class="en" style="font-size:32px">${esc(toEn)}</b>(${esc(toKo)})${roP(toKo)} 진화했어요!</p>
      ${to.last?`<p>🎉 최종 진화! 다음 레벨에는 새 포켓몬을 만나요!</p>`:''}`+progress()+buttons;
    say(['Congratulations!','en'],[toEn,'en'],[`${fromKo}${pp(fromKo,'은','는')} ${toKo}${roP(toKo)} 진화했어요!`,'ko']);
  }
  wire();
}
function burst(host,em,n=8){
  const stage=host.querySelector('.stage')||host;
  for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='burst'; s.textContent=em;
    const a=Math.random()*Math.PI*2, r=110+Math.random()*120;
    s.style.cssText=`left:calc(50% - 18px);top:40%;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${i*.04}s`;
    stage.appendChild(s); setTimeout(()=>s.remove(),1400); }
}

async function listenQuiz(pool){

  const ov=document.createElement('div'); ov.className='ov'; ov.innerHTML='<div class="panel"></div>'; document.body.appendChild(ov);
  const panel=ov.querySelector('.panel');
  for(let i=0;i<N;i++){
    const p=qs[i], ch=shuffle([p,...shuffle(pool.filter(x=>x!==p)).slice(0,2)]);
    panel.innerHTML=`<p>${i+1} / ${N}</p><h3 style="color:#2563eb">잘 듣고 골라요!</h3><button class="big-btn" id="again">🔊 다시 듣기</button>
      <div class="quiz">${ch.map(x=>`<button data-k="${x.key}">${imgTag(x.pid)}<div>${x.em}</div></button>`).join('')}</div>`;
    hydrate(panel);
    const hear=()=>say([p.text,'en']); panel.querySelector('#again').onclick=hear; hear();
    let miss=0;
    await new Promise(res=>{ panel.querySelector('.quiz').onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b||b.disabled) return;
      if(b.dataset.k===p.key){ b.classList.add('right'); sfx.ok(); if(!miss) right++; say([p.text,'en'],[p.ko,'ko']);
        panel.querySelectorAll('.quiz button').forEach(x=>x.disabled=true); setTimeout(res,1500); }
      else{ miss++; sfx.no(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); b.disabled=true; b.style.opacity=.35; hear(); } }; });
  }
  const s=right>=N?3:right>=N-1?2:1; sfx.fan();
  panel.innerHTML=`<h3>Well done!</h3><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><p>${N}개 중 ${right}개를 한 번에 맞혔어요!</p>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="big-btn alt" id="qa">🔁 한 번 더</button><button class="big-btn go" id="qc">카드 보기</button></div>`;
  say(['Well done!','en']);
  panel.querySelector('#qa').onclick=()=>{ ov.remove(); listenQuiz(pool); };
  panel.querySelector('#qc').onclick=()=>{ ov.remove(); cards(); };
}

/* ======================================================================
   내 포켓몬 (잡고 진화시킨 포켓몬)
   ====================================================================== */
function myDex(){
  const shownChains=Math.min(CHAINS.length,(st.level?STAGES[st.level-1].ci:0)+2);
  let html='';
  for(let ci=0;ci<shownChains;ci++){
    html+=`<div class="chain">`+CHAINS[ci].map((pid,j)=>{
      const k=STAGES.findIndex(s=>s.ci===ci&&s.j===j), got=k<st.level, now=k===st.level-1;
      return (j?'<span class="ar">▶</span>':'')+`<button class="st ${now?'now':''}" data-pid="${got?pid:''}"><div class="im">${imgTag(pid,got?'':'shadow')}</div><b class="en">${got?esc(EN[pid]):'???'}</b><small style="font-size:14px;opacity:.7">${got?esc(KO[pid]):''}</small></button>`;
    }).join('')+`</div>`;
  }
  show(`<div class="page">
    <div class="top"><button class="icon-btn" id="back">🏠</button><h2 class="title">🏆 내 포켓몬</h2><div class="spacer"></div></div>
    ${st.level?`<p style="font-size:20px;text-align:center">레벨 ${st.level} · 쓴 쪽 ${st.words}개 · ${opts.per}쪽마다 레벨업!</p>`:'<p style="font-size:22px;text-align:center">첫 쪽을 끝까지 쓰면 첫 포켓몬을 잡아요!</p>'}
    ${html}
  </div>`);
  hydrate($app,true);
  $('#back').onclick=()=>{ sfx.pop(); home(); };
  $app.querySelectorAll('.st[data-pid]').forEach(b=>b.onclick=()=>{ const pid=+b.dataset.pid; if(pid){ sfx.pop(); say([EN[pid],'en'],[KO[pid],'ko']); } else toast('계속 쓰면 만날 수 있어요!'); });
}

/* ======================================================================
   어른 메뉴: 그림 받기 · 설정
   ====================================================================== */
let dlCancel=false;
async function downloadMany(pids,progress){
  pids=[...new Set(pids)].filter(p=>!have.has(p)); let done=0, ok=0; const fail=[]; dlCancel=false;
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
  const work=async()=>{ while(pids.length&&!dlCancel){ const pid=pids.shift();
    try{ await artFetch(pid); ok++; }catch(e){ fail.push(EN[pid]||pid); } done++; progress(done,done+pids.length); } };
  await Promise.all([work(),work(),work(),work()]);
  return {ok,fail};
}
function parent(){
  const needPids=[...new Set(PAGES.map(p=>p.pid).concat(CHAINS.slice(0,12).flat()))];
  const cnt=a=>a.filter(p=>have.has(p)).length;
  show(`<div class="page">
    <div class="top"><button class="icon-btn" id="back">🏠</button><h2 class="title">⚙️ 어른 메뉴</h2><div class="spacer"></div></div>
    <p class="note">이 앱에는 포켓몬 그림이 들어 있지 않아요. 아래 버튼을 누르면 이 기기가 PokeAPI 공개 저장소(raw.githubusercontent.com)에서 공식 일러스트를 직접 받아
      <b>이 기기 안에만</b> 작게 줄여 저장해요. 같은 사이트의 ‘포켓몬 한글 쓰기’와 받은 그림을 함께 써요.
      그림의 저작권은 Nintendo·Creatures·GAME FREAK에 있으니 가정에서 아이와 함께 쓰는 용도로만 사용해 주세요.</p>

    <h2>⬇️ 포켓몬 그림 받기</h2>
    <div class="opt">
      <div class="row">
        <button class="big-btn" id="dlNeed">🃏 이 앱에 나오는 포켓몬 (${needPids.length}장 · 약 ${Math.round(needPids.length*.07)}MB)</button>
        <button class="big-btn small alt" id="dlStop" hidden>그만 받기</button>
      </div>
      <div class="bar"><i id="dlBar"></i></div><p class="note" id="dlMsg">받은 그림 ${cnt(needPids)}/${needPids.length}</p>
      <label><input type="checkbox" id="oAuto" ${opts.auto?'checked':''}> 아직 없는 그림은 화면을 열 때 자동으로 받기 (인터넷 연결 시)</label>
    </div>

    <h2>✏️ 공부 설정</h2>
    <div class="opt">
      <label>공부 순서 <select id="oCourse"><option value="mix">알파벳 하나, 단어 하나 번갈아</option><option value="abc">알파벳 A~Z 먼저</option><option value="words">단어 먼저</option></select></label>
      <label>한 쪽에 쓰는 줄
        <select id="oRows"><option value="3">3줄 (따라 쓰기·흐린 글씨·혼자 쓰기)</option><option value="2">2줄 (따라 쓰기·혼자 쓰기)</option><option value="1">1줄 (따라 쓰기만)</option></select></label>
      <label>레벨업까지 쓸 쪽 수 <select id="oPer">${[3,5,7,10].map(n=>`<option value="${n}">${n}쪽</option>`).join('')}</select></label>
      <label><input type="checkbox" id="oPalm" ${opts.palm?'checked':''}> ✏️ 애플펜슬을 쓰면 손바닥·손가락 터치는 무시</label>
      <label><input type="checkbox" id="oSound" ${opts.sound?'checked':''}> 🔊 소리와 읽어 주기</label>
      <label><input type="checkbox" id="oKo" ${opts.ko?'checked':''}> 🇰🇷 뜻과 안내도 한국어로 읽어 주기</label>
      <label>읽는 빠르기 <select id="oRate"><option value=".65">천천히</option><option value=".8">보통</option><option value=".95">빠르게</option></select>
        <button class="big-btn small alt" id="tts">🔊 들어 보기</button></label>
      <p class="note">단어는 c·a·t 같은 짧은 소리부터 생활 단어·색깔까지 ${LEVELS.length}단계 ${WORD_PAGES.length}개예요. 단어마다 뜻이 어울리는 포켓몬이 소개해 주고,
        다 쓰면 뜻에 맞는 그림을 고른 뒤 그 포켓몬 단어 카드를 받아요. 알파벳 쪽에서는 대문자·소문자와 그 글자로 시작하는 포켓몬 영어 이름을 따라 써요.
        줄마다 ‘다 썼어요’를 누를 때만 글자 모양과 비교해요. 같은 칸을 두 번 넘게 다시 써도 안 되면 통과시켜 줘요.</p>
    </div>

    <h2>🧹 기록</h2>
    <div class="opt"><p style="margin-top:0">레벨 ${st.level} · 쓴 쪽 ${st.words}개 · 다 쓴 쪽 ${Object.keys(st.done).length}개</p>
      <button class="big-btn small red" id="reset">처음부터 다시 하기 (기록 지우기)</button></div>
  </div>`);
  $('#back').onclick=()=>{ sfx.pop(); dlCancel=true; home(); };
  $('#oRows').value=String(opts.rows); $('#oPer').value=String(opts.per); $('#oCourse').value=opts.course; $('#oRate').value=String(opts.rate);
  const bindC=(id,k)=>{ $(id).onchange=e=>{ opts[k]=e.target.checked; saveOpts(); }; };
  bindC('#oAuto','auto'); bindC('#oPalm','palm'); bindC('#oSound','sound'); bindC('#oKo','ko');
  $('#oRows').onchange=e=>{ opts.rows=+e.target.value; saveOpts(); };
  $('#oPer').onchange=e=>{ opts.per=+e.target.value; if(st.since>=opts.per) st.since=opts.per-1; saveOpts(); saveSt(); };
  $('#oCourse').onchange=e=>{ opts.course=e.target.value; saveOpts(); ORDER=course(); };
  $('#oRate').onchange=e=>{ opts.rate=+e.target.value; saveOpts(); };
  $('#tts').onclick=()=>say(['cat','en'],[spell('cat'),'en'],['cat','en'],['고양이','ko']);
  const busy=on=>{ $('#dlNeed').disabled=on; $('#dlStop').hidden=!on; };
  $('#dlNeed').onclick=async()=>{
    if(navigator.onLine===false) return alert('인터넷에 연결된 뒤 다시 눌러 주세요.');
    busy(true); const bar=$('#dlBar'), msg=$('#dlMsg');
    const r=await downloadMany(needPids,(d,t)=>{ if(!bar.isConnected) return; bar.style.width=(d/t*100)+'%'; msg.textContent=`받는 중… ${d}/${t}`; });
    if(!bar.isConnected) return;
    busy(false); bar.style.width='100%';
    msg.textContent=(dlCancel?'멈췄어요. ':'')+`${r.ok}장 받았어요. 모두 ${cnt(needPids)}/${needPids.length}`+(r.fail.length?` · 받지 못한 그림 ${r.fail.length}장 (다시 누르면 이어서 받아요)`:''); if(r.ok) sfx.ok();
    if(!r.ok&&r.fail.length) alert('그림을 받지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.');
  };
  $('#dlStop').onclick=()=>{ dlCancel=true; };
  $('#reset').onclick=()=>{ if(!confirm('레벨·잡은 포켓몬·단어 카드 기록을 모두 지울까요?')) return;
    Object.assign(st,{words:0,level:0,since:0,done:{}}); saveSt(); toast('처음부터 다시 시작해요'); parent(); };
}

/* ---------- 시작 ---------- */
(async function boot(){
  try{ (await db.keys()).forEach(k=>have.add(+k)); }catch(e){}
  home();
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
