<title>포켓몬 한글 모험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&family=Gaegu&family=Hi+Melody&family=Gamja+Flower&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen game. Top bar + a stage that swaps between home, the town map, play stages, gym battles, 도감 and the parents' page.
   Sky over grass like a Pokémon route; cream sticker panels with thick ink outlines; pokéball red is the action color. */
:root {
  color-scheme: light;
  --sky: #CDEEFF;
  --grass: #9ED96E;
  --grass-deep: #5DAA3C;
  --paper: #FFFDF3;
  --paper-dim: #EEF1E6;
  --ink: #22304D;
  --ink-soft: #5D6884;
  --ball: #E8433F;
  --volt: #FFD23F;
  --water: #6EC3F0;
  --berry: #FF9DBB;
  --line: #E4DDC4;
  --guide: #DCD4B8;
  --miss: #F7A39B;
  --pen: #24408E;
  --good: #34A86B;
  --hp: #3CC46A;
  --hp-low: #E8433F;
  --white: #FFFFFF;
  --veil: rgba(34, 48, 77, .6);
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --letter: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: linear-gradient(var(--sky) 0 58%, var(--grass) 58% 100%);
  color: var(--ink);
  font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 4px solid var(--pen); outline-offset: 3px; }

#app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-weight: 400; font-size: clamp(20px, 3.2vw, 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 52px; padding: 6px 14px;
  font-size: 19px; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink); white-space: nowrap;
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.chip b { font-weight: 400; color: var(--ball); font-variant-numeric: tabular-nums; }
.chip .mini { width: 38px; height: 38px; margin: -6px -2px -6px -6px; }

.pball {
  position: relative; flex: none; display: inline-block;
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid var(--ink);
  background: linear-gradient(var(--ball) 0 43%, var(--ink) 43% 57%, var(--white) 57%);
}
.pball::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 34%; height: 34%; transform: translate(-50%, -50%);
  border-radius: 50%; background: var(--white); border: 2.5px solid var(--ink);
}
.pball.huge { width: 120px; height: 120px; border-width: 6px; }
.pball.huge::after { border-width: 5px; }
.pball.dim { filter: grayscale(1) opacity(.35); }

#stage { flex: 1; min-height: 0; position: relative; }
.scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 4px 28px; }

/* ---------- shared pieces ---------- */
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 6px 0 rgba(34, 48, 77, .28); }
.big {
  font-size: clamp(21px, 2.6vw, 28px);
  padding: 12px 26px; min-height: 62px;
  background: var(--ball); color: var(--white);
  border: 3px solid var(--ink); border-radius: 20px;
  box-shadow: 0 5px 0 var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.big.alt { background: var(--paper); color: var(--ink); }
.big.go { background: var(--good); }
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.big:disabled { opacity: .45; }
.big svg { width: 30px; height: 30px; }
.linkish { font-size: 17px; background: none; border: 0; color: var(--ink-soft); text-decoration: underline; padding: 6px; }

.mon { width: 100%; height: 100%; display: block; overflow: visible; transition: filter .7s ease; }
.mon.shadow { filter: brightness(0) opacity(.8); }
.mon.shiny { filter: hue-rotate(150deg) saturate(1.2); }
.mon.shadow.shiny { filter: brightness(0) opacity(.8); }

.expbar { height: 14px; border-radius: 99px; background: var(--paper-dim); border: 2px solid var(--ink); overflow: hidden; }
.expbar i { display: block; height: 100%; background: var(--water); transition: width .9s ease; }
.hpbar { height: 16px; border-radius: 99px; background: var(--paper-dim); border: 2px solid var(--ink); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--hp); transition: width .5s ease; }
.hpbar.low i { background: var(--hp-low); }

/* ---------- 처음 화면 ---------- */
.home { height: 100%; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; align-items: center; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bubble {
  position: relative;
  font-size: clamp(20px, 2.8vw, 30px); line-height: 1.35; text-align: center; text-wrap: balance;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; padding: 14px 22px;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -16px; margin-left: -12px; border: 12px solid transparent; border-top: 16px solid var(--ink); border-bottom: 0; }
.hero-mon { width: min(100%, 280px); aspect-ratio: 1; max-width: 100%; background: none; border: 0; padding: 0; }
.hero-mon.hop .mon, .hop .mon { animation: hop .5s ease; }
.partner-card { width: min(100%, 360px); display: grid; gap: 6px; padding: 12px 16px; }
.partner-card .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; }
.partner-card .row span { color: var(--ink-soft); font-size: 17px; }
.homeside { display: flex; flex-direction: column; gap: 14px; }
.go-adventure { width: 100%; min-height: 96px; font-size: clamp(26px, 3.4vw, 36px); flex-direction: column; gap: 2px; }
.go-adventure small { font-size: 17px; opacity: .9; }
.menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.menu button {
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 74px; padding: 10px 16px; font-size: clamp(20px, 2.4vw, 25px);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink);
}
.menu button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.menu button small { display: block; font-size: 15px; color: var(--ink-soft); }
.menu .ic { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border: 3px solid var(--ink); border-radius: 14px; font-size: 22px; font-family: var(--letter); font-weight: 700; }
.stamps { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 17px; color: var(--ink-soft); }
.stamps .day { display: grid; justify-items: center; gap: 2px; font-size: 13px; }

/* 파트너 고르기 */
.starter { height: 100%; display: grid; align-content: center; justify-items: center; gap: 18px; }
.starters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; width: min(100%, 900px); }
.starters button { display: grid; justify-items: center; gap: 6px; padding: 14px 8px 16px; background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); font-size: 26px; }
.starters button:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.starters .pic { width: 100%; max-width: 170px; aspect-ratio: 1; }

/* ---------- 지도 ---------- */
.map { display: grid; gap: 16px; max-width: 1000px; margin: 0 auto; }
.town { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px 18px; }
.town.locked { background: var(--paper-dim); box-shadow: none; }
.town.locked .nodes, .town.locked .letters { opacity: .5; }
.badge { width: 72px; height: 72px; display: block; }
.badge.off { filter: grayscale(1) opacity(.3); }
.town h3 { margin: 0; font-weight: 400; font-size: 26px; }
.town .letters { font-family: var(--letter); font-weight: 700; font-size: 18px; color: var(--ink-soft); letter-spacing: 1px; margin-top: 2px; }
.nodes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.node {
  display: grid; justify-items: center; align-content: center; gap: 2px;
  min-width: 92px; min-height: 84px; padding: 6px 8px;
  background: var(--white); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink);
  font-size: 17px; line-height: 1.15;
}
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.node .stars { font-size: 18px; letter-spacing: 1px; color: var(--volt); -webkit-text-stroke: 1.2px var(--ink); }
.node .stars.none { color: var(--paper-dim); -webkit-text-stroke: 1.2px var(--line); }
.node.next { background: var(--volt); animation: glow 1.4s ease-in-out infinite; }
.node.gym { background: var(--berry); }
.node.gym.done { background: var(--white); }
.node:disabled { background: var(--paper-dim); color: var(--ink-soft); box-shadow: none; border-color: var(--line); }
.league { text-align: center; padding: 18px; display: grid; gap: 10px; justify-items: center; }

/* ---------- play layout ---------- */
.play { height: 100%; display: grid; grid-template-columns: minmax(0, .72fr) minmax(0, 1.28fr); gap: 16px; }
.side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; min-height: 0; min-width: 0; }
.side .who { width: min(100%, 220px); aspect-ratio: 1; max-width: 100%; }
.hint { margin: 0; font-size: clamp(17px, 2.2vw, 22px); color: var(--ink-soft); text-align: center; text-wrap: balance; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.dots .pball { width: 30px; height: 30px; }
.dots .pball.todo { filter: grayscale(1) opacity(.3); }
.dots .pball.miss { background: var(--paper-dim); }
.dots .pball.miss::after { content: "×"; width: auto; height: auto; border: 0; background: none; font-size: 18px; color: var(--ball); line-height: 1; }
.task { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 18px; min-height: 0; min-width: 0; position: relative; }
.ask { margin: 0; font-size: clamp(21px, 2.8vw, 30px); text-align: center; text-wrap: balance; }
.speak svg { width: 30px; height: 30px; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(100%, 440px); }
.opt {
  display: grid; place-items: center; aspect-ratio: 1.3;
  font-family: var(--letter); font-weight: 700; font-size: clamp(54px, 8vw, 96px); line-height: 1;
  background: var(--white); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
}
.opt:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.right { background: var(--grass) !important; animation: pop .35s ease; }
.wrong { animation: shake .45s ease; background: var(--berry) !important; }
.reveal { outline: 5px dashed var(--good); outline-offset: 4px; }

/* 글자 만들기 */
.target { font-family: var(--letter); font-weight: 700; font-size: clamp(76px, 12vw, 130px); line-height: 1; color: var(--ball); }
.equation { display: flex; align-items: center; gap: 8px; font-size: 40px; color: var(--ink-soft); flex-wrap: wrap; justify-content: center; }
.equation .box {
  display: grid; place-items: center; width: clamp(68px, 9vw, 100px); aspect-ratio: 1;
  font-family: var(--letter); font-weight: 700; font-size: clamp(44px, 6.4vw, 72px); color: var(--ink);
  background: var(--white); border: 3px dashed var(--ink-soft); border-radius: 18px;
}
.equation .box.filled { border-style: solid; border-color: var(--ink); }
.equation .box.result { background: var(--volt); border-style: solid; border-color: var(--ink); }
.equation .box.result.wrong { background: var(--berry); }
.jamorow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.jamorow .lab { width: 100%; text-align: center; font-size: 17px; color: var(--ink-soft); }
.jamo {
  display: grid; place-items: center; width: clamp(64px, 8.4vw, 86px); aspect-ratio: 1;
  font-family: var(--letter); font-weight: 700; font-size: clamp(36px, 5.2vw, 52px);
  background: var(--white); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
}
.jamo.v { background: #EAF6FF; }
.jamo.j { background: #FFF0F4; }
.jamo.none { font-family: var(--display); font-weight: 400; font-size: 20px; }
.jamo.on { background: var(--volt); transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }

/* 읽고 고르기 */
.tiles { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.tile {
  display: grid; place-items: center; width: clamp(82px, 12vw, 140px); aspect-ratio: 1;
  font-family: var(--letter); font-weight: 700; font-size: clamp(56px, 8.6vw, 100px); line-height: 1;
  background: var(--white); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
}
.tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.tile.heard { background: #FFF6CC; }
.pics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(100%, 520px); }
.pic {
  display: grid; place-items: center; aspect-ratio: 1; padding: 8px;
  font-size: clamp(56px, 8vw, 92px); line-height: 1;
  background: var(--white); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
}
.pic:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.pic .mon { width: 100%; height: 100%; }

/* 쓰기 */
.writebox { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
.pad { position: relative; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--paper); }
.pad canvas { position: absolute; inset: 0; display: block; }
.pad canvas.i { touch-action: none; }
.pad-msg {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; padding: 16px;
  background: rgba(255, 253, 243, .84); font-size: clamp(26px, 3.6vw, 38px); pointer-events: none; text-wrap: balance;
}
.pad-msg .stars { font-size: clamp(54px, 8vw, 84px); color: var(--volt); -webkit-text-stroke: 3px var(--ink); letter-spacing: 6px; animation: pop .4s ease; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.parentcheck { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 20px; background: rgba(255, 253, 243, .97); border-radius: 25px; text-align: center; }
.parentcheck .cmp { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
.parentcheck canvas, .parentcheck .model { width: 150px; height: 150px; border: 3px solid var(--ink); border-radius: 14px; background: var(--white); }
.parentcheck .model { display: grid; place-items: center; font-family: var(--letter); font-weight: 500; font-size: 110px; line-height: 1; }
.parentcheck p { margin: 0; font-size: 18px; color: var(--ink-soft); max-width: 420px; }

/* 체육관 */
.arena { display: grid; grid-template-rows: auto auto; gap: 10px; width: 100%; }
.fighter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.fighter .info { display: grid; gap: 4px; font-size: 19px; }
.fighter .pic2 { width: clamp(90px, 13vw, 150px); aspect-ratio: 1; }
.fighter.me { grid-template-columns: auto minmax(0, 1fr); }
.hit .mon { animation: hit .5s ease; }
.lunge .mon { animation: lunge .45s ease; }

/* ---------- 도감 ---------- */
.dexhead { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 20px; margin-bottom: 14px; }
.dexhead .count b { color: var(--ball); font-weight: 400; }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.dexcard {
  position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 8px 12px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 rgba(34, 48, 77, .3);
}
.dexcard:not(.got) { background: var(--paper-dim); }
.dexcard .no { justify-self: start; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.dexcard .pic3 { width: 100%; max-width: 104px; aspect-ratio: 1; }
.dexcard b { font-weight: 700; font-size: 21px; font-family: var(--letter); }
.dexcard:not(.got) b { font-weight: 400; }
.dexcard small { font-size: 14px; color: var(--ink-soft); }
.dexcard .shinymark { position: absolute; top: 6px; right: 8px; font-size: 18px; color: var(--volt); -webkit-text-stroke: 1.2px var(--ink); }
.detail { display: grid; justify-items: center; gap: 12px; padding: 20px; text-align: center; width: min(100%, 520px); }
.detail .pic4 { width: min(100%, 240px); aspect-ratio: 1; }

/* ---------- 배지 · 부모님 ---------- */
.badgecase { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 20px; max-width: 760px; margin: 0 auto; }
.badgecase figure { margin: 0; display: grid; justify-items: center; gap: 6px; font-size: 18px; text-align: center; }
.badgecase figcaption small { display: block; color: var(--ink-soft); font-size: 14px; }
.parent { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; font-family: var(--letter); }
.parent section { padding: 18px 20px; }
.parent h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 26px; }
.parent p, .parent li { font-size: 16px; line-height: 1.6; color: var(--ink); }
.parent .muted { color: var(--ink-soft); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpis div { padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--white); }
.kpis b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; font-variant-numeric: tabular-nums; }
.kpis span { font-size: 14px; color: var(--ink-soft); }
.weak { display: flex; gap: 8px; flex-wrap: wrap; }
.weak span { display: inline-grid; justify-items: center; min-width: 64px; padding: 6px 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); font-size: 13px; color: var(--ink-soft); }
.weak span b { font-size: 30px; color: var(--ink); font-weight: 700; }
.typetable { width: 100%; border-collapse: collapse; font-size: 15px; }
.typetable td, .typetable th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.typetable .n { text-align: right; font-variant-numeric: tabular-nums; }
.setrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 16px; }
.setrow select, .setrow input[type=range] { font-size: 16px; min-height: 40px; max-width: 100%; }
.setrow select { padding: 6px 10px; border-radius: 10px; border: 2px solid var(--ink-soft); background: var(--white); color: var(--ink); }
.smallbtn { font-family: var(--display); font-size: 17px; padding: 8px 16px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

/* ---------- 결과 · 잡기 overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--veil); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card { width: min(100%, 560px); display: grid; justify-items: center; gap: 14px; padding: 22px 20px; text-align: center; }
.card .stage { position: relative; width: min(100%, 240px); aspect-ratio: 1; display: grid; place-items: center; }
.card .stage > .mon, .card .stage > .caught { width: 100%; height: 100%; }
.throwball { animation: drop .55s cubic-bezier(.3, 1.4, .6, 1) both, wobble 1.35s .6s ease-in-out both; transform-origin: 50% 90%; }
.caught { animation: pop .5s ease; }
.spark { position: absolute; font-size: 32px; color: var(--volt); -webkit-text-stroke: 2px var(--ink); animation: spark 1s ease-out both; }
.card h2 { margin: 0; font-weight: 400; font-size: clamp(28px, 4.6vw, 42px); line-height: 1.25; text-wrap: balance; }
.card p { margin: 0; font-size: 20px; color: var(--ink-soft); text-wrap: balance; }
.card .new { color: var(--good); }
.card .bigstars { font-size: clamp(56px, 9vw, 80px); color: var(--volt); -webkit-text-stroke: 3px var(--ink); letter-spacing: 8px; }
.card .bigstars i { font-style: normal; display: inline-block; animation: pop .4s ease both; }
.card .bigstars i.off { color: var(--paper-dim); -webkit-text-stroke-color: var(--line); }
.card .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.card .expline { width: min(100%, 380px); display: grid; gap: 6px; font-size: 20px; }

<script>
(() => {
'use strict';
// 'artifact' = Claude 링크로 여는 버전, 'app' = 아이패드 홈 화면 앱 버전
const BUILD = /*BUILD*/'artifact';

/* ================= 글씨 채점 엔진 =================
   따라 쓰기: 회색 글자의 뼈대(가운데 선)를 펜 선이 얼마나 지나갔는지, 획 덩어리마다 따로 확인.
   받아쓰기: 쓴 글씨를 크기·위치 맞춰 정규화한 뒤, 정답 글자와 헷갈리는 글자 수십 개(자음·모음·받침 하나만 다른 글자)
             와 모양을 비교해서 정답이 가장 가까울 때만 맞음. */
const Ink = (() => {
  const S0 = 0xAC00;
  const CHO_STROKES = [1, 2, 1, 2, 4, 3, 3, 4, 8, 2, 4, 1, 2, 4, 3, 2, 3, 4, 3];
  const JUNG_STROKES = [2, 3, 3, 4, 2, 3, 3, 4, 2, 4, 5, 3, 3, 2, 4, 5, 3, 3, 1, 2, 1];
  const JONG_STROKES = [0, 1, 2, 3, 1, 3, 4, 2, 3, 4, 6, 7, 5, 6, 7, 6, 3, 4, 6, 2, 4, 1, 2, 3, 2, 3, 4, 3];
  const dec = ch => { const k = ch.charCodeAt(0) - S0; return { cho: Math.floor(k / 588), jung: Math.floor((k % 588) / 28), jong: k % 28 }; };
  const com = (a, b, c = 0) => String.fromCharCode(S0 + a * 588 + b * 28 + c);
  const expectedStrokes = ch => { const d = dec(ch); return CHO_STROKES[d.cho] + JUNG_STROKES[d.jung] + JONG_STROKES[d.jong]; };

  const ctx2d = N => { const c = document.createElement('canvas'); c.width = c.height = N; return c.getContext('2d', { willReadFrequently: true }); };
  const toMask = (x, N) => { const d = x.getImageData(0, 0, N, N).data, m = new Uint8Array(N * N); for (let i = 0; i < N * N; i++) m[i] = d[i * 4 + 3] > 110 ? 1 : 0; return m; };

  // 화면 안내 글자와 같은 위치·크기로 그림
  function drawGlyph(x, ch, S, font, color, strokeW = 0, scale = .74) {
    x.save();
    x.font = `${font.w} ${Math.round(S * scale)}px ${font.f}`;
    x.textAlign = 'center';
    x.textBaseline = 'alphabetic';
    const mt = x.measureText(ch);
    const asc = mt.actualBoundingBoxAscent || S * .6, des = mt.actualBoundingBoxDescent || S * .06;
    const y = S / 2 + (asc - des) / 2;
    x.fillStyle = color;
    x.fillText(ch, S / 2, y);
    if (strokeW) { x.strokeStyle = color; x.lineWidth = strokeW; x.lineJoin = 'round'; x.strokeText(ch, S / 2, y); }
    x.restore();
  }
  function glyphMask(ch, N, font, strokeW = 0) { const x = ctx2d(N); drawGlyph(x, ch, N, font, '#000', strokeW); return toMask(x, N); }

  function drawStrokes(x, strokes, S, color, wf, usePressure) {
    x.save();
    x.strokeStyle = x.fillStyle = color;
    x.lineCap = x.lineJoin = 'round';
    for (const st of strokes) {
      const w = p => S * wf * (usePressure ? p.w : 1);
      if (st.length === 1) { x.beginPath(); x.arc(st[0].x * S, st[0].y * S, w(st[0]) / 2, 0, Math.PI * 2); x.fill(); continue; }
      for (let k = 1; k < st.length; k++) {
        x.beginPath(); x.lineWidth = w(st[k]);
        x.moveTo(st[k - 1].x * S, st[k - 1].y * S); x.lineTo(st[k].x * S, st[k].y * S); x.stroke();
      }
    }
    x.restore();
  }
  function strokesMask(strokes, N, wf) { const x = ctx2d(N); drawStrokes(x, strokes, N, '#000', wf, false); return toMask(x, N); }
  const strokeLength = (strokes, N) => strokes.reduce((s, st) => { for (let k = 1; k < st.length; k++) s += Math.hypot(st[k].x - st[k - 1].x, st[k].y - st[k - 1].y) * N; return s; }, 0);

  // Zhang-Suen 세선화: 굵은 글씨를 1픽셀 뼈대로
  function thin(src, N) {
    const m = src.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? 0 : m[y * N + x];
    let changed = true;
    const del = [];
    while (changed) {
      changed = false;
      for (let pass = 0; pass < 2; pass++) {
        del.length = 0;
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          if (!m[y * N + x]) continue;
          const p = [at(x, y - 1), at(x + 1, y - 1), at(x + 1, y), at(x + 1, y + 1), at(x, y + 1), at(x - 1, y + 1), at(x - 1, y), at(x - 1, y - 1)];
          const b = p.reduce((s, v) => s + v, 0);
          if (b < 2 || b > 6) continue;
          let a = 0; for (let k = 0; k < 8; k++) if (!p[k] && p[(k + 1) % 8]) a++;
          if (a !== 1) continue;
          if (pass === 0 ? (p[0] * p[2] * p[4] || p[2] * p[4] * p[6]) : (p[0] * p[2] * p[6] || p[0] * p[4] * p[6])) continue;
          del.push(y * N + x);
        }
        if (del.length) { changed = true; for (const i of del) m[i] = 0; }
      }
    }
    return m;
  }

  // 각 칸에서 가장 가까운 선까지 거리 (3-4 체임퍼 근사, 픽셀 단위)
  function distance(mask, N) {
    const INF = 1e6, d = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) d[i] = mask[i] ? 0 : INF;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x; let v = d[i];
      if (x > 0) v = Math.min(v, d[i - 1] + 3);
      if (y > 0) { v = Math.min(v, d[i - N] + 3); if (x > 0) v = Math.min(v, d[i - N - 1] + 4); if (x < N - 1) v = Math.min(v, d[i - N + 1] + 4); }
      d[i] = v;
    }
    for (let y = N - 1; y >= 0; y--) for (let x = N - 1; x >= 0; x--) {
      const i = y * N + x; let v = d[i];
      if (x < N - 1) v = Math.min(v, d[i + 1] + 3);
      if (y < N - 1) { v = Math.min(v, d[i + N] + 3); if (x < N - 1) v = Math.min(v, d[i + N + 1] + 4); if (x > 0) v = Math.min(v, d[i + N - 1] + 4); }
      d[i] = v;
    }
    for (let i = 0; i < N * N; i++) d[i] /= 3;
    return d;
  }

  function components(mask, N, minSize) {
    const lab = new Int32Array(N * N).fill(-1), out = [];
    for (let s = 0; s < N * N; s++) {
      if (!mask[s] || lab[s] >= 0) continue;
      const id = out.length, list = [s], q = [s]; lab[s] = id;
      while (q.length) {
        const i = q.pop(), x = i % N, y = (i - x) / N;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= N || yy >= N) continue;
          const j = yy * N + xx;
          if (mask[j] && lab[j] < 0) { lab[j] = id; q.push(j); list.push(j); }
        }
      }
      out.push(list);
    }
    return out.filter(c => c.length >= minSize);
  }

  /* ---------- 따라 쓰기 채점 ---------- */
  const TN = 128;
  function scoreTrace(ch, strokes, font, fonts) {
    const G = glyphMask(ch, TN, font);
    const K = thin(G, TN);
    const comps = components(G, TN, 12);
    const wide = strokesMask(strokes, TN, .1);       // 펜 선에서 반경 약 6px 안이면 지나간 것으로
    const narrow = strokesMask(strokes, TN, .03);
    const near = glyphMask(ch, TN, font, TN * .13);  // 회색 글자 테두리 바깥 약 8px까지는 봐줌
    let kAll = 0, kHit = 0;
    const perComp = comps.map(list => {
      let k = 0, h = 0;
      for (const i of list) if (K[i]) { k++; if (wide[i]) h++; }
      kAll += k; kHit += h;
      return k ? h / k : 1;
    });
    let inkN = 0, outN = 0;
    for (let i = 0; i < TN * TN; i++) if (narrow[i]) { inkN++; if (!near[i]) outN++; }
    const cover = kAll ? kHit / kAll : 0;
    const out = inkN ? outN / inkN : 1;
    const overdraw = kAll ? strokeLength(strokes, TN) / kAll : 0;
    const minStrokes = Math.ceil(expectedStrokes(ch) / 2);
    const missing = perComp.map((v, k) => v < .7 ? k : -1).filter(k => k >= 0);
    let reason = '';
    if (!strokes.length) reason = 'empty';
    else if (missing.length) reason = 'missing';
    else if (cover < .85) reason = 'missing';
    else if (out > .14) reason = 'outside';
    else if (overdraw > 2.3) reason = 'scribble';
    else if (strokes.length < minStrokes) reason = 'strokes';
    // 회색 글자를 대충 덮었지만 실제로는 다른 글자 모양(파 위에 퍼)인 경우 걸러내기
    let shape = null;
    if (!reason) {
      const F = features(strokesMask(strokes, 96, .045), 96);
      shape = F && judge(ch, F, fonts || [font], null, 1);
      if (!shape || !shape.pass) reason = 'shape';
    }
    const pass = !reason;
    const stars = !pass ? 0 : cover >= .95 && out <= .05 ? 3 : cover >= .9 && out <= .09 ? 2 : 1;
    return { pass, stars, reason, cover, out, overdraw, perComp, missing, comps, shape, strokes: strokes.length, minStrokes };
  }

  /* ---------- 받아쓰기 채점 ----------
     글씨 굵기·크기·비율을 없앤 뒤(뼈대만 남겨 같은 굵기로 다시 그림), 8×8 칸마다 선의 방향(—, /, |, \) 세기를 모은
     256개 숫자로 모양을 나타냄. 여러 글꼴로 그린 정답·헷갈리는 글자 중 가장 가까운 것이 정답일 때만 맞음. */
  const FN = 32, FB = 26;
  function features(mask, N) {
    const sk = thin(mask, N);
    let x0 = N, y0 = N, x1 = -1, y1 = -1, cnt = 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (sk[y * N + x]) { cnt++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (cnt < 4) return null;
    const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
    let sx = FB / w, sy = FB / h;
    const lim = 2.2; // 비율을 너무 많이 바꾸지 않게
    if (sx > sy * lim) sx = sy * lim; if (sy > sx * lim) sy = sx * lim;
    const ox = (FN - w * sx) / 2, oy = (FN - h * sy) / 2;
    const img = new Float32Array(FN * FN);
    const plot = (fx, fy) => {
      for (let yy = Math.floor(fy - 1.5); yy <= Math.ceil(fy + 1.5); yy++) for (let xx = Math.floor(fx - 1.5); xx <= Math.ceil(fx + 1.5); xx++) {
        if (xx < 0 || yy < 0 || xx >= FN || yy >= FN) continue;
        const d = Math.hypot(xx - fx, yy - fy), v = Math.max(0, 1 - Math.max(0, d - .5) / 1.1);
        if (v > img[yy * FN + xx]) img[yy * FN + xx] = v;
      }
    };
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (sk[y * N + x]) {
      plot(ox + (x - x0) * sx, oy + (y - y0) * sy);
      // 늘어난 부분의 끊김 방지: 오른쪽·아래 이웃까지 선으로 채움
      for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [-1, 1]]) if (sk[(y + dy) * N + x + dx]) for (let t = .25; t < 1; t += .25) plot(ox + (x + dx * t - x0) * sx, oy + (y + dy * t - y0) * sy);
    }
    const G = 8, cell = FN / G, f = new Float32Array(G * G * 4);
    for (let y = 1; y < FN - 1; y++) for (let x = 1; x < FN - 1; x++) {
      const p = (a, b) => img[(y + b) * FN + x + a];
      const gx = (p(1, -1) + 2 * p(1, 0) + p(1, 1)) - (p(-1, -1) + 2 * p(-1, 0) + p(-1, 1));
      const gy = (p(-1, 1) + 2 * p(0, 1) + p(1, 1)) - (p(-1, -1) + 2 * p(0, -1) + p(1, -1));
      const m = Math.hypot(gx, gy); if (m < 1e-3) continue;
      let th = Math.atan2(gy, gx); if (th < 0) th += Math.PI;
      const bin = th / (Math.PI / 4), b0 = Math.floor(bin) % 4, b1 = (b0 + 1) % 4, wb = bin - Math.floor(bin);
      const cx = (x + .5) / cell - .5, cy = (y + .5) / cell - .5;
      const ix = Math.floor(cx), iy = Math.floor(cy), fx = cx - ix, fy = cy - iy;
      for (const [ax, ay, wv] of [[ix, iy, (1 - fx) * (1 - fy)], [ix + 1, iy, fx * (1 - fy)], [ix, iy + 1, (1 - fx) * fy], [ix + 1, iy + 1, fx * fy]]) {
        if (ax < 0 || ay < 0 || ax >= G || ay >= G) continue;
        const base = (ay * G + ax) * 4;
        f[base + b0] += m * wv * (1 - wb); f[base + b1] += m * wv * wb;
      }
    }
    let norm = 0;
    for (let i = 0; i < f.length; i++) { f[i] = Math.sqrt(f[i]); norm += f[i] * f[i]; }
    norm = Math.sqrt(norm) || 1;
    for (let i = 0; i < f.length; i++) f[i] /= norm;
    return f;
  }
  const fdist = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); };

  const COMMON_JONG = [1, 4, 7, 8, 16, 17, 19, 21];
  function confusables(ch) {
    const d = dec(ch), out = new Set();
    for (let c = 0; c < 19; c++) if (c !== d.cho) out.add(com(c, d.jung, d.jong));
    for (let v = 0; v < 21; v++) if (v !== d.jung) out.add(com(d.cho, v, d.jong));
    for (const j of [0, ...COMMON_JONG]) if (j !== d.jong) out.add(com(d.cho, d.jung, j));
    return [...out];
  }
  const tplCache = new Map();
  function templates(ch, fonts) {
    if (tplCache.has(ch)) return tplCache.get(ch);
    const t = fonts.map(f => features(glyphMask(ch, 96, f), 96)).filter(Boolean);
    if (tplCache.size > 1500) tplCache.clear();
    tplCache.set(ch, t);
    return t;
  }
  const dist = (F, ch, fonts) => Math.min(...templates(ch, fonts).map(T => fdist(F, T)));

  function scoreDictation(ch, strokes, fonts) {
    if (!strokes.length) return { pass: false, reason: 'empty' };
    const F = features(strokesMask(strokes, 96, .045), 96);
    if (!F) return { pass: false, reason: 'empty' };
    return judge(ch, F, fonts, strokes.length);
  }
  const LIMIT = { abs: .66, k: 1.05 };
  function judge(ch, F, fonts, nStrokes, k = LIMIT.k) {
    const target = dist(F, ch, fonts);
    let best = null, bestD = Infinity;
    for (const c of confusables(ch)) { const v = dist(F, c, fonts); if (v < bestD) { bestD = v; best = c; } }
    const minStrokes = Math.ceil(expectedStrokes(ch) / 2);
    let reason = '';
    if (target > LIMIT.abs) reason = 'shape';
    else if (target > bestD * k) reason = 'other';
    else if (nStrokes != null && nStrokes < minStrokes) reason = 'strokes';
    return { pass: !reason, reason, target, nearest: best, nearestD: bestD };
  }

  return { _thin: thin, _components: components, drawGlyph, drawStrokes, scoreTrace, scoreDictation, judge, features, LIMIT, glyphMask, confusables, expectedStrokes, dec, com };
})();

/* ================= 한글 도구 ================= */
const S0 = 0xAC00;
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_NAME = ['기역','쌍기역','니은','디귿','쌍디귿','리을','미음','비읍','쌍비읍','시옷','쌍시옷','이응','지읒','쌍지읒','치읓','키읔','티읕','피읖','히읗'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const dec = ch => { const k = ch.charCodeAt(0) - S0; return (k < 0 || k > 11171) ? null : { cho: Math.floor(k / 588), jung: Math.floor((k % 588) / 28), jong: k % 28 }; };
const com = (a, b, c = 0) => String.fromCharCode(S0 + a * 588 + b * 28 + c);
const josa = (w, a, b) => (dec(w[w.length - 1]) || {}).jong ? a : b;

UNITS.forEach((u, i) => { for (const k of 'CVJ') for (const j of u[k]) UNIT_OF[k][j] = i + 1; });
const sylUnit = ch => { const d = dec(ch); if (!d) return 9; return Math.max(UNIT_OF.C[CHO[d.cho]] || 8, UNIT_OF.V[JUNG[d.jung]] || 8, d.jong ? (UNIT_OF.J[JONG[d.jong]] || 8) : 1); };

let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang)); } catch (e) { voices = []; } };
const voiceScore = v => (/premium|고급/i.test(v.name) ? 40 : 0) + (/enhanced|향상/i.test(v.name) ? 30 : 0) + (/yuna|유나/i.test(v.name) ? 10 : 0) + (v.localService ? 2 : 0);
function pickVoice() {
  if (!voices.length) return null;
  const chosen = S.settings.voice && voices.find(v => v.name === S.settings.voice);
  return chosen || voices.slice().sort((p, q) => voiceScore(q) - voiceScore(p))[0];
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function say(text, slow = false) {
  try {
    const s = window.speechSynthesis;
    if (!s || !text) return;
    // 글자 하나만 읽을 때는 끝에 마침표를 붙여야 이름이나 영어처럼 읽지 않고 또박또박 소리 냄
    const t = [...text].length === 1 && dec(text) ? text + '.' : text;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ko-KR';
    const v = pickVoice(); if (v) u.voice = v;
    u.rate = Math.max(.5, (S.settings.rate || .9) * (slow ? .85 : 1));
    u.pitch = 1;
    if (s.speaking || s.pending) { s.cancel(); setTimeout(() => s.speak(u), 80); } else s.speak(u);
  } catch (e) { /* 소리 없이 진행 */ }
}
let ac = null;
function tone(freqs, dur = .12, type = 'triangle', vol = .16) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    let t = ac.currentTime;
    for (const f of freqs) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
      t += dur * .8;
    }
  } catch (e) { /* 효과음 없이 진행 */ }
}
const sfx = {
  good: () => tone([660, 880], .14), bad: () => tone([240, 190], .16, 'square', .06), tap: () => tone([520], .06),
  catch: () => tone([523, 659, 784, 1047], .16), level: () => tone([523, 659, 784, 659, 784, 1047], .12), hit: () => tone([180, 120], .12, 'sawtooth', .07)
};
document.addEventListener('pointerdown', () => {
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* 무시 */ }

}, { once: true });

const LS_KEY = 'pokemon-hangul.v2', LS_OLD = 'pokemon-hangul.v1';
const blank = () => ({ v: 2, partner: null, caught: {}, stages: {}, badges: [], days: [], stats: { syl: {}, type: {} }, totals: { answers: 0, correct: 0, stages: 0 }, settings: { rate: .9, voice: '' }, updated: 0 });
let S = blank();
const clone = o => JSON.parse(JSON.stringify(o));
// 두 기록을 합칠 때는 늘 '더 많이 한 쪽'을 남김 — 어느 쪽에서도 성과가 줄어들지 않게
function merge(a, b) {
  const r = clone(a);
  if (!b || typeof b !== 'object') return r;
  const pv = p => p ? p.lv * 1e6 + p.exp : -1;
  if (pv(b.partner) > pv(r.partner)) r.partner = clone(b.partner);
  for (const [n, c] of Object.entries(b.caught || {})) {
    const x = r.caught[n];
    r.caught[n] = x ? { n: Math.max(x.n || 0, c.n || 0), s: Math.max(x.s || 0, c.s || 0), t: Math.min(x.t || Infinity, c.t || Infinity) } : clone(c);
  }
  for (const [k, v] of Object.entries(b.stages || {})) {
    const x = r.stages[k];
    r.stages[k] = x ? { stars: Math.max(x.stars, v.stars), plays: Math.max(x.plays || 1, v.plays || 1) } : clone(v);
  }
  r.badges = [...new Set([...(r.badges || []), ...(b.badges || [])])].sort((p, q) => p - q);
  r.days = [...new Set([...(r.days || []), ...(b.days || [])])].sort();
  for (const g of ['syl', 'type']) for (const [k, v] of Object.entries((b.stats || {})[g] || {})) { const x = r.stats[g][k]; if (!x || v[0] > x[0]) r.stats[g][k] = v.slice(); }
  for (const k of ['answers', 'correct', 'stages']) r.totals[k] = Math.max(r.totals[k] || 0, (b.totals || {})[k] || 0);
  if ((b.updated || 0) > (a.updated || 0) && b.settings) r.settings = { ...r.settings, ...b.settings };
  r.updated = Math.max(a.updated || 0, b.updated || 0);
  return r;
}

try {
  const o = JSON.parse(localStorage.getItem(LS_OLD));

let dbRef = null, saving = false, dirty = false, saveTimer = 0;
function persist() {
  S.updated = Date.now();

}
async function flush() {
  if (!dbRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await dbRef.set({ state: clone(S) }); }
  catch (e) { if (!e || e.code === 'unavailable' || e.code === 'resource_exhausted') { dirty = true; setTimeout(flush, 4000 + Math.random() * 3000); } }
  saving = false;
  if (dirty) flush();
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);

})();

function gainExp(n) {
  const p = S.partner; if (!p) return { from: 0, to: 0, ups: 0 };
  const from = { lv: p.lv, exp: p.exp };
  p.exp += n;
  let ups = 0;
  while (p.exp >= needExp(p.lv) && p.lv < 100) { p.exp -= needExp(p.lv); p.lv++; ups++; }
  return { from, ups };
}

  const nb = stage.querySelector('.node.next');
  if (nb) nb.scrollIntoView({ block: 'center' });

/* ================= 문제 만들기 ================= */
function unitSyllables(u) {
  const U = UNITS[u - 1];
  const C = [...allowed(u, 'C')].map(j => CHO.indexOf(j));
  const V = [...allowed(u, 'V')].map(j => JUNG.indexOf(j)).filter(v => u >= 8 || ![9, 10, 14, 15, 19, 3, 7].includes(v));
  const basicV = V.filter(v => [0, 4, 8, 13, 18, 20].includes(v));
  const basicC = C.filter(c => ![1, 4, 8, 10, 13].includes(c));
  const out = new Set();
  const newC = [...U.C].map(j => CHO.indexOf(j)), newV = [...U.V].map(j => JUNG.indexOf(j)), newJ = [...U.J].map(j => JONG.indexOf(j));
  for (const c of newC) for (const v of V) out.add(com(c, v));
  for (const v of newV) for (const c of (u >= 8 ? basicC : C)) out.add(com(c, v));
  for (const j of newJ) for (const c of basicC) for (const v of basicV) out.add(com(c, v, j));
  // 실제 낱말·포켓몬 이름에 나오는 글자를 더 자주
  const real = [...WORDS.map(w => w.w), ...MON.map(m => m.n)].flatMap(w => [...w]).filter(ch => sylUnit(ch) === u);
  for (const ch of real) out.add(ch);
  return [...out];
}
const realSyllables = u => [...new Set([...WORDS.map(w => w.w), ...MON.map(m => m.n)].flatMap(w => [...w]).filter(ch => sylUnit(ch) === u))];
function pickSyllables(u, n) {
  const pool = unitSyllables(u), real = realSyllables(u);
  const out = [];
  while (out.length < n) {
    const src = real.length && Math.random() < .5 ? real : pool;
    const s = rand(src);
    if (!out.includes(s) || out.length >= pool.length) out.push(s);
  }
  return out;
}
function similar(ch, u, n) {
  const d = dec(ch), seen = new Set([ch]), out = [];
  const C = [...allowed(Math.max(u, 1), 'C')].map(j => CHO.indexOf(j));
  const V = [...allowed(Math.max(u, 1), 'V')].map(j => JUNG.indexOf(j));
  const J = [0, ...[...allowed(u, 'J')].map(j => JONG.indexOf(j))];
  const add = s => { if (!seen.has(s)) { seen.add(s); out.push(s); } };
  if (d.jong) add(com(d.cho, d.jung));
  let guard = 0;
  while (out.length < n && guard++ < 400) {
    const r = Math.random();
    if (r < .4) add(com(d.cho, rand(V), d.jong));
    else if (r < .8) add(com(rand(C), d.jung, d.jong));
    else add(com(d.cho, d.jung, rand(J)));
  }
  return out.slice(0, n);
}
function readItems(u) {
  const words = WORDS.filter(w => w.u <= u).map(w => ({ w: w.w, pic: w.e, u: w.u }));
  const mons = MON.filter(m => m.u <= u && !m.rare).map(m => ({ w: m.n, mon: m, u: m.u }));
  return [...words, ...mons];
}
function makeQuestions(u, kind) {
  const n = KIND[kind].n;
  if (kind === 'league') return Array.from({ length: n }, () => makeQuestions(rand([4, 5, 6, 7, 8]), rand(['listen', 'build', 'read', 'dictate', 'read']))[0]);
  if (kind === 'gym') {
    const types = shuffle(['listen', 'listen', 'build', 'build', 'read', 'read', 'read', 'listen']);
    const seen = new Set();
    return types.map(t => {
      let q;
      for (let k = 0; k < 6; k++) { q = makeQuestions(u, t)[0]; if (!seen.has(q.ch || q.item.w)) break; }
      seen.add(q.ch || q.item.w);
      return q;
    });
  }
  if (kind === 'read') {
    const items = readItems(u);
    const near = items.filter(x => x.u >= u - 1);
    const chosen = [];
    while (chosen.length < n) { const src = near.length >= 3 && Math.random() < .75 ? near : items; const x = rand(src); if (!chosen.includes(x) || chosen.length >= items.length) chosen.push(x); }
    return chosen.map(x => {
      const same = items.filter(y => y !== x && (!!y.mon === !!x.mon) && y.w !== x.w);
      return { kind, u, item: x, others: sample(same.length >= 2 ? same : items.filter(y => y !== x), 2) };
    });
  }
  return pickSyllables(u, n).map(ch => ({ kind, u, ch }));
}

const TPL_FONTS = [{ w: 500, f: '"Noto Sans KR"' }, { w: 400, f: 'Gaegu' }, { w: 400, f: '"Hi Melody"' }, { w: 400, f: '"Gamja Flower"' }, { w: 400, f: '"Nanum Pen Script"' }];
const GUIDE_FONT = TPL_FONTS[0];
function preloadFonts(text) {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  return Promise.all(TPL_FONTS.map(f => document.fonts.load(`${f.w} 40px ${f.f}`, text).catch(() => {}))).catch(() => {});
}

function pickReward(u, rare) {
  if (rare) {
    const r = MON.filter(m => m.rare && !S.caught[m.n]);
    if (r.length) return { m: r[0], shiny: false };
  }
  const pool = MON.filter(m => !m.rare);
  const unc = pool.filter(m => !S.caught[m.n]);
  if (unc.length) {
    const fit = unc.filter(m => m.u <= u + 1);
    const src = fit.length ? fit : unc.slice().sort((a, b) => a.u - b.u).slice(0, 8);
    const m = rand(src);
    return { m, shiny: false };
  }
  const m = rand(rare ? MON : pool);
  return { m, shiny: Math.random() < .2 };
}

function startNode(id) {
  if (id === 'league') return go(runStage, 8, 'league');
  const [u, k] = id.split('-');
  go(runStage, +u, k);
}

function runStage(u, kind) {
  current = 'stage';
  const id = kind === 'league' ? 'league' : `${u}-${kind}`;
  const title = kind === 'league' ? '포켓몬 리그' : `${UNITS[u - 1].town} · ${KIND[kind].t}`;
  setTitle(title);
  const qs = makeQuestions(u, kind);
  const isGym = kind === 'gym';
  const reward = pickReward(u, isGym);
  const results = [];
  let qi = 0, exp = 0;
  const p = S.partner, me = MON_BY[p.id];
  const leader = isGym ? MON_BY[UNITS[u - 1].leader] : null;
  let hpL = 6, hpP = 3;

  const sideHTML = isGym
    ? `<section class="panel side" style="justify-content:space-around">
         <div class="arena">
           <div class="fighter" id="fL"><div class="info"><span>${leader.n} · 관장 포켓몬</span><div class="hpbar" id="hpL"><i style="width:100%"></i></div></div><div class="pic2">${art(leader)}</div></div>
           <div class="fighter me" id="fP"><div class="pic2">${art(me)}</div><div class="info"><span>${p.id} Lv.${p.lv}</span><div class="hpbar" id="hpP"><i style="width:100%"></i></div></div></div>
         </div>
         <p class="hint" id="sideHint">맞히면 ${p.id}의 공격!</p>
       </section>`
    : `<section class="panel side">
         <div class="who">${art(reward.m, { shadow: true })}</div>
         <p class="hint">문제를 다 풀면 이 포켓몬을 잡을 수 있어!</p>
         <div class="dots" id="dots"></div>
       </section>`;
  stage.innerHTML = `<div class="play">${sideHTML}<section class="panel task" id="task"></section></div>`;
  const task = $('#task');
  const dots = () => { const d = $('#dots'); if (d) d.innerHTML = qs.map((_, i) => `<span class="pball${i >= results.length ? ' todo' : results[i] ? '' : ' miss'}"></span>`).join(''); };
  dots();

  const allText = qs.map(q => q.ch ? q.ch + Ink.confusables(q.ch).join('') : '').join('');
  if (allText) preloadFonts(allText);

  function ask() {
    const q = qs[qi];
    task.onclick = null;
    Q[q.kind](q, task, { single: isGym || kind === 'league' }, ok => {
      results.push(ok);
      record(q.kind, q.ch || q.item.w, ok);
      exp += ok ? 10 : 3;
      dots();
      if (isGym) return battle(ok);
      qi++;
      later(() => qi < qs.length ? ask() : finish(), 900);
    });
  }
  function battle(ok) {
    const fL = $('#fL'), fP = $('#fP');
    const hit = (el, att) => { att.classList.remove('lunge'); void att.offsetWidth; att.classList.add('lunge'); later(() => { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); sfx.hit(); }, 250); };
    if (ok) { hpL--; hit(fL, fP); $('#sideHint').textContent = `${p.id}의 공격! 효과가 굉장했다!`; }
    else { hpP--; hit(fP, fL); $('#sideHint').textContent = `${leader.n}의 공격! 다음 문제는 꼭 맞혀 보자!`; }
    const setHp = (sel, v, max) => { const b = $(sel); b.querySelector('i').style.width = `${v / max * 100}%`; b.classList.toggle('low', v / max <= .34); };
    setHp('#hpL', hpL, 6); setHp('#hpP', hpP, 3);
    qi++;
    later(() => {
      if (hpL <= 0) return finish(true);
      if (hpP <= 0 || qi >= qs.length) return finish(false);
      ask();
    }, 1300);
  }
  function finish(won) {
    const wrong = results.filter(x => !x).length;
    if (isGym && !won) {
      const g = gainExp(exp);
      persist(); updateBar();
      return showGymLost(u, g);
    }
    const stars = isGym ? (hpP === 3 ? 3 : hpP === 2 ? 2 : 1) : wrong === 0 ? 3 : wrong <= 2 ? 2 : 1;
    const prev = S.stages[id];
    if (kind !== 'league') S.stages[id] = { stars: Math.max(stars, prev ? prev.stars : 0), plays: (prev ? prev.plays : 0) + 1 };
    S.totals.stages++;
    markDay();
    let badge = null;
    if (isGym && !S.badges.includes(u)) { S.badges.push(u); S.badges.sort((a, b) => a - b); badge = u; }
    exp += 20 + stars * 10 + (isGym ? 60 : 0);
    const g = gainExp(exp);
    persist(); updateBar();
    showResult({ id, u, kind, stars, exp, g, reward, badge, first: !prev });
  }
  ask();
}

    <div class="jamorow"><span class="lab">자음</span>${cOpts.map(x => `<button class="jamo" data-c="${x}">${CHO[x]}</button>`).join('')}</div>
    <div class="jamorow"><span class="lab">모음</span>${vOpts.map(x => `<button class="jamo v" data-v="${x}">${JUNG[x]}</button>`).join('')}</div>
    ${withJ ? `<div class="jamorow"><span class="lab">받침</span>${jOpts.map(x => `<button class="jamo j${x ? '' : ' none'}" data-j="${x}">${x ? JONG[x] : '없음'}</button>`).join('')}</div>` : ''}`;
  later(() => say(q.ch, true), 300);
  const paint = () => {
    el.querySelectorAll('.jamo').forEach(b => {
      const on = ('c' in b.dataset && +b.dataset.c === pc) || ('v' in b.dataset && +b.dataset.v === pv) || ('j' in b.dataset && withJ && +b.dataset.j === pj);
      b.classList.toggle('on', on);
    });
    const set = (id, v) => { const b = el.querySelector(id); if (!b) return; b.textContent = v || ''; b.classList.toggle('filled', !!v); };
    set('#bc', pc === null ? '' : CHO[pc]); set('#bv', pv === null ? '' : JUNG[pv]);
    if (withJ) set('#bj', pj === null ? '' : pj ? JONG[pj] : '·');
    const br = el.querySelector('#br'); br.textContent = ''; br.className = 'box';
  };
  el.onclick = e => {
    const b = e.target.closest('.jamo'); if (!b || busy) return;
    if ('c' in b.dataset) { pc = +b.dataset.c; say(CHO_NAME[pc]); }
    else if ('v' in b.dataset) { pv = +b.dataset.v; say(com(11, pv)); }
    else { pj = +b.dataset.j; if (pj) say(CHO_NAME[CHO.indexOf(JONG[pj])] || JONG[pj]); }
    paint();
    if (pc === null || pv === null || pj === null) return;
    const made = com(pc, pv, pj), br = el.querySelector('#br');
    br.textContent = made; busy = true;
    if (made === q.ch) {
      br.classList.add('result'); sfx.good();
      later(() => say(`${made}! ${rand(PRAISE)}`), 400);
      done(tries === 0);
    } else {
      tries++;
      br.classList.add('result', 'wrong'); sfx.bad();
      later(() => say(`이건 ${made}. ${o.single ? `정답은 ${q.ch}` : '다시 해 볼까?'}`), 400);
      if (o.single) { done(false); return; }
      later(() => { busy = false; pc = pv = null; pj = withJ ? null : 0; paint(); }, 2200);
    }
  };
};

// 쓰기 칸 (따라 쓰기·받아쓰기 공용)
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function makePad(holder) {
  holder.innerHTML = `<div class="pad"><canvas class="g"></canvas><canvas class="i" aria-label="글씨 쓰는 칸"></canvas><div class="pad-msg" hidden></div></div>`;
  const pad = holder.firstElementChild, gc = pad.querySelector('.g'), ic = pad.querySelector('.i'), msg = pad.querySelector('.pad-msg');
  let SZ = 0, guide = null, faint = false, missing = null, strokes = [], cur = null, active = null, penSeen = false, locked = false;
  const paintGuide = () => {
    if (!SZ) return;
    const x = gc.getContext('2d');
    x.clearRect(0, 0, SZ, SZ);
    x.fillStyle = css('--paper'); x.fillRect(0, 0, SZ, SZ);
    x.strokeStyle = css('--line'); x.lineWidth = 2; x.setLineDash([SZ * .03, SZ * .025]);
    x.beginPath(); x.moveTo(SZ / 2, 0); x.lineTo(SZ / 2, SZ); x.moveTo(0, SZ / 2); x.lineTo(SZ, SZ / 2); x.stroke();
    x.setLineDash([]);
    if (guide) {
      x.globalAlpha = faint ? .45 : 1;
      Ink.drawGlyph(x, guide, SZ, GUIDE_FONT, css('--guide'));
      x.globalAlpha = 1;
      if (missing && missing.length) {
        // 안 쓴 부분을 빨갛게 보여 주기 (채점 칸 128×128 기준)
        const k = SZ / 128; x.fillStyle = css('--miss');
        for (const list of missing) for (const i of list) x.fillRect((i % 128) * k, Math.floor(i / 128) * k, k + .6, k + .6);
      }
    }
  };
  const paintInk = () => { if (!SZ) return; const x = ic.getContext('2d'); x.clearRect(0, 0, SZ, SZ); Ink.drawStrokes(x, strokes, SZ, css('--pen'), .058, true); };
  const layout = () => {
    const s = Math.floor(Math.min(holder.clientWidth, holder.clientHeight));
    if (s <= 40 || s === SZ) return;
    SZ = s; pad.style.width = pad.style.height = SZ + 'px';
    const d = window.devicePixelRatio || 1;
    for (const c of [gc, ic]) { c.width = c.height = Math.round(SZ * d); c.style.width = c.style.height = SZ + 'px'; c.getContext('2d').setTransform(d, 0, 0, d, 0, 0); }
    paintGuide(); paintInk();
  };
  const ro = new ResizeObserver(layout); ro.observe(holder);
  const addPt = e => {
    const r = ic.getBoundingClientRect();
    cur.push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, w: e.pointerType === 'pen' && e.pressure > 0 ? .65 + e.pressure * .7 : 1 });
    Ink.drawStrokes(ic.getContext('2d'), [cur.length > 1 ? cur.slice(-2) : cur], SZ, css('--pen'), .058, true);
  };
  ic.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeen = true;
    if (penSeen && e.pointerType === 'touch') return; // 펜슬을 쓰는 중에는 손바닥 터치 무시
    if (active !== null || locked) return;
    e.preventDefault(); active = e.pointerId;
    try { ic.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    if (missing) { missing = null; paintGuide(); }
    cur = []; strokes.push(cur); addPt(e);
  });
  ic.addEventListener('pointermove', e => {
    if (e.pointerId !== active) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) addPt(ev);
  });
  const end = e => { if (e.pointerId === active) { active = null; if (cur && cur.length) cur = null; } };
  ic.addEventListener('pointerup', end); ic.addEventListener('pointercancel', end);
  ic.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  return {
    strokes: () => strokes,
    clear() { strokes = []; paintInk(); },
    setGuide(ch, isFaint = false) { guide = ch; faint = isFaint; missing = null; paintGuide(); if (ch && document.fonts) document.fonts.load(`${GUIDE_FONT.w} 100px ${GUIDE_FONT.f}`, ch).then(paintGuide, () => {}); },
    showMissing(lists) { missing = lists; paintGuide(); },
    show(html) { msg.innerHTML = html; msg.hidden = false; locked = true; },
    hide() { msg.hidden = true; locked = false; },
    snapshot(size) { const c = document.createElement('canvas'); c.width = c.height = size; Ink.drawStrokes(c.getContext('2d'), strokes, size, css('--pen'), .058, false); return c; },
    destroy() { ro.disconnect(); }
  };
}

const TRACE_TIP = {
  missing: '빨간 부분을 아직 안 썼어. 거기도 따라 써 볼까?',
  outside: '선 밖으로 많이 나갔어. 회색 글자 위로 천천히!',
  scribble: '여러 번 덧칠했어. 한 획씩 또박또박 써 볼까?',
  strokes: '한 번에 이어서 썼네. 획마다 펜을 떼고 써 볼까?',
  shape: '다른 글자처럼 보여. 회색 글자를 잘 보고 써 볼까?',
  empty: '먼저 글자를 따라 써 봐!'
};
const DICT_TIP = {
  other: (d) => `${d}처럼 보여. 다시 써 볼까?`,
  shape: () => '조금 알아보기 어려워. 칸을 크게 쓰면서 다시 써 볼까?',
  strokes: () => '획을 하나씩 떼어서 다시 써 볼까?',
  empty: () => '들은 글자를 칸에 써 봐!'
};

function writeTask(q, el, o, done, mode) {
  el.innerHTML = `
    <p class="ask" id="wask">${mode === 'trace' ? '회색 글자를 따라 써 봐!' : '잘 듣고 글자를 써 봐!'}</p>
    <div class="writebox" id="wb"></div>
    <div class="tools">
      <button class="big alt speak" id="wListen">${SPEAKER}듣기</button>
      <button class="big alt" id="wErase">지우기</button>
      <button class="big go" id="wCheck">다 썼어!</button>
    </div>
    <div class="tools"><button class="linkish" id="wSkip" hidden>이 글자는 건너뛰기</button><button class="linkish" id="wParent" hidden>부모님 확인</button></div>`;
  const pad = makePad(el.querySelector('#wb'));
  cleanup = () => pad.destroy();
  let fails = 0, practicing = mode === 'trace', busy = false;
  pad.setGuide(mode === 'trace' ? q.ch : null);
  later(() => say(q.ch, true), 300);
  el.querySelector('#wListen').onclick = () => say(q.ch, true);
  el.querySelector('#wErase').onclick = () => { if (!busy) { pad.clear(); sfx.tap(); } };
  const resolve = (ok, msgHtml, speech) => {
    busy = true;
    pad.show(msgHtml); say(speech);
    later(() => { cleanup = null; pad.destroy(); done(ok); }, 1800);
  };
  el.querySelector('#wSkip').onclick = () => { if (!busy) resolve(false, '<div>다음에 다시 써 보자!</div>', '다음에 다시 써 보자!'); };
  el.querySelector('#wParent').onclick = () => {
    if (busy) return;
    const box = document.createElement('div');
    box.className = 'parentcheck';
    box.innerHTML = `<div class="cmp"><span id="pcInk"></span><span class="model">${q.ch}</span></div>
      <p>아이가 쓴 글씨(왼쪽)와 정답(오른쪽)이에요. 자동 채점이 틀렸다고 했지만 바르게 쓴 글씨라면 '맞게 썼어요'를 눌러 주세요.</p>
      <div class="tools"><button class="big go" id="pcYes">맞게 썼어요</button><button class="big alt" id="pcNo">다시 쓸게요</button></div>`;
    el.appendChild(box);
    box.querySelector('#pcInk').appendChild(pad.snapshot(150));
    box.querySelector('#pcYes').onclick = () => { box.remove(); resolve(true, `<div class="stars">★★☆</div><div>${rand(PRAISE)}</div>`, rand(PRAISE)); };
    box.querySelector('#pcNo').onclick = () => { box.remove(); pad.clear(); };
  };
  el.querySelector('#wCheck').onclick = () => {
    if (busy) return;
    const strokes = pad.strokes();
    if (!strokes.length) { say(practicing ? TRACE_TIP.empty : DICT_TIP.empty()); return; }
    if (practicing) {
      const r = Ink.scoreTrace(q.ch, strokes, GUIDE_FONT, TPL_FONTS);
      if (r.pass) {
        // 처음에 바로 통과해야 맞힌 것으로 셈 (받아쓰기에서 정답을 보고 따라 쓴 것은 연습)
        resolve(mode === 'trace' && fails === 0,
          `<div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</div><div>${mode === 'trace' ? rand(PRAISE) : '잘 따라 썼어! 다음엔 혼자 써 보자'}</div>`,
          `${q.ch}! ${mode === 'trace' ? rand(PRAISE) : '잘 따라 썼어!'}`);
        return;
      }
      fails++; sfx.bad();
      const tip = TRACE_TIP[r.reason] || TRACE_TIP.shape;
      if (r.reason === 'missing') pad.showMissing(r.comps.filter((_, k) => r.perComp[k] < .85));
      pad.show(`<div>${tip}</div>`); say(tip);
      later(() => { pad.hide(); pad.clear(); }, 2200);
      if (fails >= 3) el.querySelector('#wSkip').hidden = false;
      return;
    }
    const r = Ink.scoreDictation(q.ch, strokes, TPL_FONTS);
    if (r.pass) return resolve(fails === 0, `<div class="stars">${fails ? '★★☆' : '★★★'}</div><div>${rand(PRAISE)}</div>`, `${q.ch}! ${rand(PRAISE)}`);
    fails++; sfx.bad();
    el.querySelector('#wParent').hidden = false;
    if (o.single || fails >= 2) {
      // 두 번 틀리면 정답을 보여 주고 따라 쓰며 익히기 (점수는 틀린 것으로)
      practicing = true;
      pad.show(`<div>정답은 <b style="font-family:var(--letter);font-size:1.6em">${q.ch}</b>야.<br>같이 따라 써 보자!</div>`);
      say(`정답은 ${q.ch}. 같이 따라 써 보자!`);
      later(() => { pad.hide(); pad.clear(); pad.setGuide(q.ch); el.querySelector('#wask').textContent = '회색 글자를 따라 써 봐!'; }, 2200);
      if (o.single) { busy = true; later(() => { cleanup = null; pad.destroy(); done(false); }, 2300); }
      return;
    }
    const tip = (DICT_TIP[r.reason] || DICT_TIP.shape)(r.nearest);
    pad.show(`<div>${tip}</div>`); say(tip);
    later(() => { pad.hide(); pad.clear(); }, 2200);
  };
}
Q.trace = (q, el, o, done) => writeTask(q, el, o, done, 'trace');
Q.dictate = (q, el, o, done) => writeTask(q, el, o, done, 'dictate');

    <section class="panel">
      <h2>자주 틀리는 글자</h2>
      ${weak.length ? `<div class="weak">${weak.map(([ch, v]) => `<span><b>${ch}</b>${v[1]}/${v[0]}번 틀림</span>`).join('')}</div>` : '<p class="muted">아직 충분한 기록이 없어요. 두 번 이상 나온 글자 중 틀린 글자가 여기에 모여요.</p>'}
      <table class="typetable"><thead><tr><th>놀이</th><th class="n">푼 문제</th><th class="n">첫 시도 정답률</th></tr></thead><tbody>${typeRows}</tbody></table>
    </section>
    <section class="panel">
      <h2>읽어 주는 목소리</h2>
      <div class="setrow"><label for="voiceSel">목소리</label>
        <select id="voiceSel">${vs.length ? vs.map(v => `<option value="${esc(v.name)}" ${curVoice && v.name === curVoice.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('') : '<option>한국어 목소리를 찾지 못했어요</option>'}</select>
        <button class="smallbtn" id="voiceTest">들어 보기</button></div>
      <div class="setrow"><label for="rate">빠르기</label><input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="${S.settings.rate || .9}"><span id="rateV">${S.settings.rate || .9}</span></div>
      <p>발음이 어색하면 더 좋은 한국어 목소리를 받아 주세요. 아이패드 <b>설정 → 손쉬운 사용 → 콘텐츠 말하기 → 음성 → 한국어</b>에서 ‘유나(향상됨)’ 또는 ‘고급’ 목소리를 내려받은 뒤 이 화면을 다시 열면 목록에 나타나요. 기본 목소리보다 글자 하나하나를 훨씬 또렷하게 읽어요.</p>
    </section>
    <section class="panel">
      <h2>채점은 이렇게 해요</h2>
      <p><b>따라 쓰기</b>: 회색 글자의 가운데 선을 펜이 얼마나 지나갔는지 획 덩어리마다 따로 봐요. 한 부분이라도 빠지면 그 부분을 빨갛게 보여 주고, 선 밖으로 많이 나가거나 덧칠하거나 다른 글자 모양이면 통과하지 않아요. 세 번 틀리면 건너뛸 수 있지만 맞힌 것으로 치지 않아요.</p>
      <p><b>받아쓰기</b>: 쓴 글씨의 크기와 위치를 맞춘 뒤, 자음·모음·받침 하나만 다른 비슷한 글자 수십 개와 모양을 비교해서 정답이 가장 가까울 때만 맞다고 해요. 손글씨 글꼴로 시험했을 때 엉뚱한 글자를 맞다고 한 경우는 2% 이하였지만, 바르게 쓴 글씨를 틀렸다고 하는 경우는 15~25% 정도 있었어요. 그럴 때는 ‘부모님 확인’을 눌러 아이 글씨와 정답을 나란히 보고 직접 맞음 처리해 주세요.</p>
    </section>
  </div></div>`;
  const bkMsg = t => { $('#bkMsg').textContent = t; };
  $('#bkSave').onclick = () => saveBackup(bkMsg);
  const bkFile = $('#bkFile');
  bkFile.onchange = async () => {
    const f = bkFile.files && bkFile.files[0];
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const st = j && j.state ? j.state : j;
      if (!st || st.v !== 2) throw new Error('not a backup');
      S = merge(S, st);
      persist(); updateBar();
      go(showParent);
      $('#bkMsg').textContent = `불러왔어요! 포켓몬 ${Object.keys(S.caught).length}마리, 배지 ${S.badges.length}개예요.`;
    } catch (e) { bkMsg('이 파일은 포켓몬 한글 모험 기록 파일이 아니에요.'); }
    bkFile.value = '';
  };
  const sel = $('#voiceSel');
  sel.onchange = () => { S.settings.voice = sel.value; persist(); say('피카츄! 가 나 다'); };
  $('#voiceTest').onclick = () => say('안녕! 피카츄랑 한글 놀이 하자. 가, 나, 다');
  const rate = $('#rate');
  rate.oninput = () => { $('#rateV').textContent = rate.value; };
  rate.onchange = () => { S.settings.rate = +rate.value; persist(); say('가, 나, 다, 라'); };
}

async function saveBackup(msg) {
  const name = `포켓몬한글-기록-${today()}.json`;
  const data = JSON.stringify({ app: 'pokemon-hangul', saved: today(), state: S });
  try {
    if (BUILD === 'artifact') {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!dl) { msg('여기서는 파일 저장을 쓸 수 없어요.'); return; }
      await dl.save({ filename: name, data });
      msg('기록 파일을 저장했어요.');
      return;
    }
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '포켓몬 한글 모험 기록' });
      msg('공유 창에서 "파일에 저장"을 고르면 기록 파일이 남아요.');
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    msg('기록 파일을 저장했어요.');
  } catch (e) {
    msg(e && (e.code === 'declined' || e.name === 'AbortError') ? '저장을 취소했어요.' : '저장하지 못했어요. 잠시 후 다시 해 주세요.');
  }
}

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
})();
