<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 주사위 모험</title>
<meta name="theme-color" content="#bfe9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주사위 모험">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/board-192.png">
<link rel="icon" href="icons/board-192.png">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<style>
@font-face{font-family:"Jua";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/jua.woff2") format("woff2")}
:root{
  --bg1:#bfe9ff; --bg2:#fff6d6; --ink:#2b2b3a; --card:#ffffff; --soft:#f1f6ff; --line:rgba(0,0,0,.10);
  --accent:#ff5a5f; --good:#22c55e; --shadow:0 6px 0 rgba(0,0,0,.14);
  --t-start:#ffd166; --t-grass:#a5e88a; --t-water:#8fd3ff; --t-cave:#d9c8a9; --t-fire:#ffab8a; --t-math:#ffc9ea;
  --t-word:#d8ccff; --t-chance:#fff1a1; --t-center:#ffb8c6; --t-gym:#b9c3ff; --t-safari:#b8f0cf; --tile-ink:#2b2b3a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#1d2742; --bg2:#2c2450; --ink:#f3f4ff; --card:#2f3658; --soft:#262c4a; --line:rgba(255,255,255,.14); }
}
:root[data-theme="dark"]{ --bg1:#1d2742; --bg2:#2c2450; --ink:#f3f4ff; --card:#2f3658; --soft:#262c4a; --line:rgba(255,255,255,.14); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);
  background-image:linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;min-height:100dvh;overflow-x:hidden;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
input[type=text]{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
[hidden]{display:none!important}
.page{max-width:980px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
h1,h2,h3{font-weight:normal;margin:.3em 0}
.note{font-size:16px;opacity:.75;line-height:1.5}

.big-btn{font-size:24px;padding:14px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;box-shadow:var(--shadow);min-height:60px}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.small{font-size:18px;padding:10px 16px;min-height:48px}
.big-btn:disabled{opacity:.45}
.big-btn:active:not(:disabled),.opt:active:not(:disabled),.pick button:active,.icon-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.icon-btn{font-size:26px;width:56px;height:56px;border:none;border-radius:18px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;flex:none}
.icon-btn.holding::after{content:"";position:absolute;left:0;bottom:0;height:6px;background:var(--accent);animation:hold 1s linear forwards}
@keyframes hold{from{width:0}to{width:100%}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}

/* ---------- 처음 화면 ---------- */
.hero{text-align:center;padding:20px 0 10px}
.hero h1{font-size:clamp(34px,7vw,60px);margin:0;text-shadow:0 4px 0 rgba(0,0,0,.08)}
.hero .starters{display:flex;justify-content:center;gap:8px;margin:14px 0}
.hero .starters>*{width:clamp(70px,16vw,130px);aspect-ratio:1}
.menu{display:grid;gap:14px;max-width:460px;margin:18px auto}
.menu .big-btn{font-size:30px;min-height:80px}
.banner{background:#fff3c4;color:#5b4500;border-radius:18px;padding:14px 16px;margin:10px auto;max-width:640px;text-align:center;font-size:18px}
.homebar{display:flex;justify-content:flex-end;gap:10px}

/* ---------- 준비 화면 ---------- */
.setup h2{font-size:26px;margin:18px 0 8px}
.seg{display:inline-flex;background:var(--card);border-radius:18px;padding:4px;box-shadow:var(--shadow);gap:4px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:14px;padding:10px 16px;font-size:20px}
.seg button.on{background:var(--accent);color:#fff}
.pset{background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);margin:12px 0;border-left:12px solid var(--pc)}
.pset .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pset input[type=text]{font-size:22px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--soft);width:160px}
.spick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.spick button{border:4px solid transparent;background:var(--soft);border-radius:18px;padding:6px 4px;font-size:18px}
.spick button .pic{width:min(100%,120px);aspect-ratio:1;margin:0 auto}
.spick button.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,var(--soft))}
.spick button.taken{opacity:.35}
.opts-row{display:flex;gap:14px;flex-wrap:wrap;font-size:18px;align-items:center}
.opts-row label{display:flex;gap:6px;align-items:center}
select{font-size:18px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--soft)}

/* ---------- 게임 화면 ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,330px);gap:14px;align-items:start;max-width:1320px;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left))}
@media (max-aspect-ratio:1/1){ .game{grid-template-columns:1fr} .side{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} }
.boardWrap{width:min(100%,calc(100dvh - 24px));margin:0 auto}
.board{position:relative;aspect-ratio:1;display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);gap:clamp(2px,.5vmin,5px)}
.tile{position:relative;border-radius:clamp(6px,1.4vmin,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--tile-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);text-align:center;line-height:1.05;overflow:hidden;min-width:0}
.tile .e{font-size:clamp(16px,4.3vmin,40px)}
.tile .l{font-size:clamp(9px,1.7vmin,17px);margin-top:2px;white-space:nowrap}
.tile.corner .e{font-size:clamp(20px,5.4vmin,50px)}
.tile.lit{outline:5px solid #fff;outline-offset:-5px;animation:lit .5s 2}
@keyframes lit{50%{filter:brightness(1.25)}}
.center{grid-area:2/2/7/7;background:var(--card);border-radius:clamp(12px,3vmin,30px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(4px,1.4vmin,14px);position:relative;padding:8px;box-shadow:inset 0 0 0 4px var(--line)}
.center .round{font-size:clamp(14px,2.4vmin,22px);opacity:.75}
.center .who{display:flex;align-items:center;gap:10px;font-size:clamp(18px,3.6vmin,34px)}
.center .who .pic{width:clamp(44px,9vmin,90px);aspect-ratio:1;border-radius:50%;border:5px solid var(--pc);background:#fff}
.center .homeb{position:absolute;top:8px;left:8px;width:46px;height:46px;font-size:22px}
.center .msg{font-size:clamp(14px,2.4vmin,22px);min-height:1.3em;text-align:center;padding:0 8px}
.center .roll{font-size:clamp(20px,3.6vmin,34px);min-height:clamp(54px,9vmin,84px);padding:8px 26px}
.dice{display:flex;gap:12px;justify-content:center}
.die{width:clamp(54px,10vmin,96px);aspect-ratio:1;border-radius:20%;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18),inset 0 0 0 3px rgba(0,0,0,.08);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.die i{place-self:center;width:72%;aspect-ratio:1;border-radius:50%}
.die i.on{background:#2b2b3a}
.die.d1 i.on{background:#e11d48}
.die.spin{animation:spin .12s linear infinite}
@keyframes spin{50%{transform:rotate(14deg) scale(1.05)}}
.tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;width:8.4%;aspect-ratio:1;border-radius:50%;border:4px solid var(--pc);background:#fff;transform:translate(-50%,-50%);
  transition:left .25s ease,top .25s ease;box-shadow:0 3px 6px rgba(0,0,0,.35);z-index:2}
.token .pic{width:100%;height:100%}
.token.cur{z-index:3;animation:bob 1s ease-in-out infinite}
.token.hop{animation:hop .3s ease-out}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
@keyframes hop{40%{transform:translate(-50%,-90%) scale(1.1)}}
.token .bub{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#fff;color:#222;border:3px solid var(--pc);border-radius:999px;
  font-size:clamp(16px,3vmin,30px);padding:0 12px;white-space:nowrap}

.side{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);border:4px solid transparent}
.pcard.cur{border-color:var(--pc)}
.pcard .ph{display:flex;align-items:center;gap:8px;font-size:22px}
.pcard .ph .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);flex:none}
.pcard .ph .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .stats{display:flex;gap:12px;font-size:20px;margin:4px 0 8px;flex-wrap:wrap}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:14px;background:var(--soft);position:relative;border:3px dashed var(--line);padding:2px}
.slot.filled{border-style:solid}
.slot.starter{border-color:var(--pc)}
.slot .pic{width:100%;height:100%}
.slot .tag{position:absolute;top:-4px;right:-2px;font-size:16px}
.slot.ready{animation:ready 1.2s infinite}
@keyframes ready{50%{box-shadow:0 0 0 4px #facc15,0 0 16px #facc15}}
.slot .lbl{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:11px;opacity:.7}

/* 그림 */
.pic{display:block;object-fit:contain;-webkit-user-drag:none}
.noimg{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--soft);color:var(--ink);opacity:.7;aspect-ratio:1}
.sil{filter:brightness(0) opacity(.75)}

/* ---------- 창 ---------- */
.ov{position:fixed;inset:0;background:rgba(18,18,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s}
.panel{background:var(--card);border-radius:30px;padding:22px 20px;max-width:700px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.2);animation:popin .25s}
@keyframes fade{from{opacity:0}}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.panel h3{font-size:clamp(24px,5vw,36px)}
.panel p{font-size:20px;margin:.4em 0}
.stage{position:relative;width:min(230px,46vw,32dvh);aspect-ratio:1;margin:6px auto}
.stage>.pic,.stage>.noimg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.stage.pop>.pic,.stage.pop>.noimg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateY(40%) scale(.2);opacity:0}}
.habtag{display:inline-block;background:var(--hab);color:var(--tile-ink);border-radius:999px;padding:4px 16px;font-size:20px}
.stars{font-size:26px;letter-spacing:2px}
.rare-shiny .stage::before,.rare-mega .stage::before,.rare-legend .stage::before{content:"";position:absolute;inset:-12%;border-radius:50%;z-index:0}
.rare-shiny .stage::before{background:radial-gradient(circle,#fff7b0 0,#ffe066 35%,transparent 68%);animation:glow 1.4s ease-in-out infinite}
.rare-mega .stage::before{background:conic-gradient(#ff5a5f,#ffd166,#22c55e,#3b82f6,#a855f7,#ff5a5f);filter:blur(16px);opacity:.75;animation:turn 3s linear infinite}
.rare-legend .stage::before{background:repeating-conic-gradient(#ffd166 0 10deg,transparent 10deg 20deg);opacity:.6;animation:turn 8s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes glow{50%{transform:scale(1.08);opacity:.7}}
@keyframes turn{to{transform:rotate(360deg)}}
.badge{display:inline-block;border-radius:999px;padding:4px 14px;font-size:20px;color:#fff;margin:2px}
.badge.shiny{background:#eab308}.badge.mega{background:linear-gradient(90deg,#ef4444,#a855f7,#3b82f6)}.badge.legend{background:#b45309}
.spark{position:absolute;z-index:2;font-size:28px;animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.4);opacity:.2}}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0 4px}
.opts.num{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{font-size:clamp(28px,5.4vw,44px);padding:14px 8px;border-radius:22px;border:4px solid var(--line);background:var(--soft);box-shadow:var(--shadow);min-height:84px;letter-spacing:1px}
.opt.right{background:#86efac;border-color:var(--good);color:#14532d;animation:yay .5s}
.opt.wrong{background:#fecaca;color:#7f1d1d;opacity:.55;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes yay{50%{transform:scale(1.1)}}
.hint{border:none;background:var(--soft);border-radius:16px;padding:8px 16px;font-size:20px;margin-top:8px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.qtitle{font-size:22px;opacity:.8}
.eq{font-size:clamp(46px,10vw,78px);letter-spacing:2px;margin:6px 0}
.eq .qm{display:inline-block;min-width:1.2em;border-bottom:6px solid var(--accent);color:var(--accent)}
.vis{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0;background:var(--soft);border-radius:18px;padding:10px}
.vis .plus{font-size:40px}
.dots{display:flex;flex-wrap:wrap;gap:10px;max-width:290px;justify-content:center}
.five{display:inline-flex;gap:4px}
.dot{width:24px;height:24px;border-radius:50%;display:inline-block}
.dot.d1{background:#ef4444}.dot.d2{background:#3b82f6}
.dot.gone{background:transparent;border:3px dashed #ef4444;position:relative}
.dot.gone::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#ef4444}
.blk{display:flex;flex-direction:column;align-items:center;gap:4px}
.bk{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap;max-width:260px;justify-content:center}
.bk .ten{width:12px;height:90px;background:repeating-linear-gradient(#f59e0b 0 8px,#b45309 8px 9px);border-radius:3px}
.bk .one{width:12px;height:12px;background:#22c55e;border-radius:2px}
.bn{font-size:22px}
.word{display:flex;justify-content:center;gap:6px;margin:8px 0}
.word .sy{font-size:clamp(44px,9vw,70px);min-width:1.3em;padding:4px 6px;border-radius:16px;background:var(--soft);border:4px solid var(--line)}
.word .sy.blank{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.word .sy.filled{border-color:var(--good);background:#dcfce7;color:#14532d;animation:yay .5s}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.pick button{border:4px solid var(--line);background:var(--soft);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px;box-shadow:var(--shadow)}
.pick button .pic,.pick button .noimg{width:100%;max-width:120px;aspect-ratio:1}
.pick button small{font-size:15px;opacity:.8}
.arrow{font-size:28px}

.card{background:linear-gradient(135deg,#fff7c2,#ffd6ea);color:#2b2b3a;border-radius:26px;padding:24px 16px;margin-bottom:14px;animation:flip .5s}
@keyframes flip{from{transform:rotateY(90deg)}}
.card .ce{font-size:84px}
.card .ct{font-size:clamp(28px,6vw,42px);line-height:1.3;margin-top:6px;word-break:keep-all}
.got{font-size:30px;margin:8px 0}

/* 포켓볼 잡기 */
.ball{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;border:4px solid #222;z-index:3;
  background:linear-gradient(#ef4444 0 44%,#222 44% 56%,#fff 56%)}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:#fff;border:4px solid #222;box-sizing:border-box}
.ball.throw{animation:throw .6s ease-out}
@keyframes throw{from{transform:translateY(260px) rotate(-540deg) scale(.6)}}
.ball.wobble{animation:wob .55s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-22deg)}75%{transform:rotate(22deg)}}
.ball.done::after{background:#facc15}
.suck{animation:suck .45s forwards}
@keyframes suck{to{transform:scale(0);opacity:0;filter:brightness(4)}}
.burst{position:absolute;left:50%;top:50%;font-size:30px;z-index:4;pointer-events:none;animation:burst 1s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}

/* 진화 */
.panel.night{background:#1c1b3a;color:#fff}
.evo .pic{transition:opacity .08s}
.evo .flash{filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff)}

/* 대결 */
.battle{display:flex;align-items:center;justify-content:space-around;gap:8px}
.battle .side-b{display:flex;flex-direction:column;align-items:center}
.battle .stage{width:min(170px,34vw,24dvh)}
.hp{font-size:28px}
.hit{animation:shake .35s 2}
.lunge{animation:lunge .4s}
@keyframes lunge{50%{transform:translateX(40px) scale(1.08)}}

/* 결과 */
.rank{display:grid;gap:12px;margin:14px 0}
.rcard{background:var(--card);border-radius:24px;padding:14px;box-shadow:var(--shadow);border-left:12px solid var(--pc);text-align:left}
.rcard .top{display:flex;align-items:center;gap:10px;font-size:28px}
.rcard .medal{font-size:44px}
.rcard .team{grid-template-columns:repeat(4,minmax(0,90px))}
.rcard .sum{font-size:18px;opacity:.8;margin-top:6px}

/* 도감 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.dex>div{background:var(--card);border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.1);position:relative}
.dex .pic,.dex .noimg{width:100%;aspect-ratio:1}
.dex .nm{font-size:16px}
.dex .no{position:absolute;top:6px;left:10px;font-size:12px;opacity:.5}
.dex .tg{position:absolute;top:4px;right:8px}

/* 어른 메뉴 */
.opt-box{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin:8px 0 18px;font-size:18px}
.opt-box label{display:flex;gap:8px;align-items:center;margin:8px 0}
.opt-box input[type=checkbox]{width:22px;height:22px}
.bar{height:18px;border-radius:999px;background:var(--soft);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:#2b2b3a;color:#fff;padding:12px 22px;border-radius:999px;
  font-size:22px;z-index:80;animation:fade .2s;box-shadow:0 6px 16px rgba(0,0,0,.3);white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ======================================================================
   포켓몬 주사위 모험 — 다섯 살 아이와 함께하는 판 놀이
   · 주사위를 던져 판을 돌며 포켓몬을 만나고, 숫자·글자 퀴즈로 사탕을 모아 진화
   · 포켓몬 그림은 앱에 들어 있지 않음: 어른 메뉴에서 PokeAPI 공개 저장소의 그림을 받아 기기(IndexedDB)에 저장
   ====================================================================== */
const $app=document.getElementById('app');
const $=s=>$app.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

const dec=ch=>{ const c=ch.charCodeAt(0)-0xAC00; return c<0||c>11171?null:[Math.floor(c/588),Math.floor(c%588/28),c%28]; };
const comp=(c,j,t)=>String.fromCharCode(0xAC00+c*588+j*28+t);
// 그림을 보고 이름 고르기: 첫 글자의 자음·모음이 같은 이름을 우선 보기로
function similarNames(ans,n){
  const a=dec(ans[0]), a2=ans[1]&&dec(ans[1]), out=[];
  for(const nm of NAME_POOL){
    if(nm===ans) continue; const b=dec(nm[0]); if(!b) continue;
    let s=0; if(b[0]===a[0]) s+=3; if(b[1]===a[1]) s+=2; if(b[2]===a[2]) s+=1;
    if(nm.length===ans.length) s+=1;
    const b2=nm[1]&&dec(nm[1]); if(a2&&b2&&b2[0]===a2[0]) s+=1;
    out.push([s+Math.random()*1.6,nm]);
  }
  return out.sort((x,y)=>y[0]-x[0]).slice(0,n).map(x=>x[1]);
}
// 빈칸 글자 고르기: 헷갈리기 쉬운 자음(ㅂ/ㅁ/ㅍ, ㄱ/ㅋ/ㄲ …)과 모음(ㅏ/ㅓ, ㅗ/ㅜ …)으로 바꾼 글자
const CHO_G=[[0,1,15],[2,5,6],[3,4,16],[6,7,17],[7,8,17],[9,10,12],[11,18],[12,13,14],[2,3]];
const JUNG_G=[[0,2,4,6],[1,3,5,7],[0,1],[4,5],[8,12,13,17],[18,20],[19,20],[9,14],[11,16],[10,15]];
const near=(G,i)=>{ const s=new Set(); G.forEach(g=>{ if(g.includes(i)) g.forEach(x=>x!==i&&s.add(x)); }); return [...s]; };
function similarSyllables(ch,n){
  const [c,j,t]=dec(ch), byCho=near(CHO_G,c).map(x=>comp(x,j,t)), byJung=near(JUNG_G,j).map(x=>comp(c,x,t));
  const extra=t?[comp(c,j,0)]:[comp(c,j,pick([4,8,16,21]))];
  const out=[]; const add=x=>{ if(x!==ch&&!out.includes(x)) out.push(x); };
  const A=shuffle(byCho), B=shuffle(byJung);
  while(out.length<n&&(A.length||B.length)){ if(A.length) add(A.shift()); if(out.length<n&&B.length) add(B.shift()); }
  extra.forEach(x=>out.length<n&&add(x));
  while(out.length<n) add(comp(rnd(19),j,t));
  return out.slice(0,n);
}

function mathQ(lv){
  const sub=Math.random()<.4; let a,b;
  if(lv<=1){ if(sub){ a=2+rnd(9); b=1+rnd(a-1); } else { a=1+rnd(9); b=1+rnd(10-a); } }
  else if(lv===2){ if(sub){ a=8+rnd(13); b=1+rnd(Math.min(9,a-1)); } else { a=3+rnd(14); b=1+rnd(Math.min(9,20-a)); } }
  else if(lv===3){ if(sub){ a=15+rnd(35); b=1+rnd(9); } else if(Math.random()<.3){ a=(1+rnd(4))*10; b=(1+rnd(4))*10; } else { a=10+rnd(40); b=1+rnd(9); } }
  else { if(sub){ a=30+rnd(70); b=10+rnd(a-15); } else { a=10+rnd(60); b=10+rnd(Math.min(50,90-a)); } }
  return {a,b,op:sub?'-':'+',ans:sub?a-b:a+b};
}
function numChoices(ans,lv,n){
  const set=new Set([ans]);
  const ds=lv>=3?[pick([10,-10]),pick([1,-1]),...shuffle([1,-1,2,-2,10,-10,11,-9])]:shuffle([1,-1,2,-2,3]);
  for(const d of ds){ if(set.size>=n) break; if(ans+d>=0) set.add(ans+d); }
  for(let k=3;set.size<n;k++) set.add(ans+k);
  return shuffle([...set]);
}

const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open('pokeboard',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img',mode), r=fn(t.objectStore('img'));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return {
    put:(k,v)=>tx('readwrite',o=>o.put(v,k)),
    clear:()=>tx('readwrite',o=>o.clear()),
    all:async()=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('img'), out=[], c=t.objectStore('img').openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } };
      t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); },
  };
})();

const ART=(id,shiny)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${shiny?'shiny/':''}${id}.png`;
async function shrink(blob){ // 기기에 저장하기 전에 256px로 줄이기
  const u=URL.createObjectURL(blob);
  try{ const im=new Image(); im.src=u; await im.decode();
    const S=256, c=document.createElement('canvas'); c.width=c.height=S;
    const k=Math.min(S/im.naturalWidth,S/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
    c.getContext('2d').drawImage(im,(S-w)/2,(S-h)/2,w,h);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
  } finally{ URL.revokeObjectURL(u); }
}
function imageJobs(withShiny){
  const jobs=[]; [...NORMAL_IDS,...MEGA_IDS].forEach(id=>{ if(!IMG.has('n'+id)) jobs.push(['n'+id,id,false]); });
  if(withShiny) NORMAL_IDS.forEach(id=>{ if(!IMG.has('s'+id)) jobs.push(['s'+id,id,true]); });
  return jobs;
}
async function downloadImages(withShiny,progress){
  const jobs=imageJobs(withShiny), total=jobs.length; let done=0, fail=0;
  const worker=async()=>{ while(jobs.length){ const [k,id,sh]=jobs.shift();
    try{ const r=await fetch(ART(id,sh)); if(!r.ok) throw new Error(r.status); const b=await shrink(await r.blob()); await idb.put(k,b); IMG.set(k,URL.createObjectURL(b)); }
    catch(e){ fail++; }
    progress(++done,total); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {total,fail};
}

    const t=ac.currentTime+at, o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); }catch(e){} };
  return {
    tap:()=>tone(660,.06,'triangle',.12), step:()=>tone(520,.08,'square',.06), roll:()=>tone(250+rnd(350),.04,'square',.05),
    ok:()=>{ tone(660,.1); tone(880,.12,'sine',.15,.1); tone(1175,.22,'sine',.15,.2); }, no:()=>tone(200,.22,'sawtooth',.07),
    coin:()=>{ tone(988,.08,'square',.05); tone(1319,.22,'square',.05,.08); }, wob:()=>tone(330,.1,'triangle',.12),

async function turnLoop(){
  const g=gen;
  if(G.over) return endScreen();
  const p=cur(); phase='roll'; renderAll();
  tell(`${p.name}의 차례예요. 주사위를 던져요!`);
  await new Promise(res=>{ const b=$('#roll'); b.disabled=false; b.onclick=()=>{ b.disabled=true; res(); };
    if(p.type==='cpu') setTimeout(()=>{ if(g===gen&&!b.disabled) b.click(); },1300); });
  if(g!==gen) return;
  phase='busy'; placeTokens();
  const dice=await rollDice(p), steps=dice.reduce((a,b)=>a+b,0);
  if(dice.length===2) await diceQuiz(p,dice);
  else { say(COUNT[steps-1]+'!'); await sleep(700); }
  await moveSteps(p,steps,true);
  await landOn(p);
  await offerEvolution(p);
  if(g!==gen) return;
  if(G.extra){ G.extra=false; toast('🎲 한 번 더!'); }
  else { G.turn=(G.turn+1)%G.players.length; if(G.turn===0){ G.round++; if(G.round>G.rounds) G.over=true; } }
  save(); turnLoop();
}

async function moveSteps(p,n,count){

    if(count) say(COUNT[s-1],1.15);
    if(p.pos===0&&s<n){ gain(p,1); toast('🏁 출발을 지나서 🍬 +1'); }
    await sleep(count?700:300);

function wild(hab,mode){
  const R=mode==='rare'?{legend:.12,mega:.4,shiny:1}:mode==='safari'?{legend:.06,mega:.15,shiny:.2}
    :opts.rare==='high'?{legend:.03,mega:.08,shiny:.14}:{legend:.015,mega:.045,shiny:.08};
  const r=Math.random();
  if(r<R.legend){ if(Math.random()<.25) return {id:pick(LEGEND_MEGA),shiny:false,kind:'mega'};
    return {id:pick(LEGEND),shiny:Math.random()<R.shiny*.5,kind:'legend'}; }
  if(r<R.legend+R.mega) return {id:pick(HABS[hab].megas),shiny:false,kind:'mega'};
  const L=pick(HABS[hab].lines), x=Math.random(); let i=0;
  if(L.length>1&&x<.22) i=1; if(L.length>2&&x<.04) i=2;
  const sh=Math.random()<R.shiny; return {id:L[i],shiny:sh,kind:sh?'shiny':'normal'};
}
const KIND={normal:['야생 포켓몬이 나타났다!',''],shiny:['✨ 반짝반짝! 색이 다른 포켓몬!','<span class="badge shiny">✨ 황금빛 반짝</span>'],
  mega:['💎 메가진화 포켓몬이 나타났다!','<span class="badge mega">💎 메가진화</span>'],legend:['👑 전설의 포켓몬이 나타났다!','<span class="badge legend">👑 전설</span>']};
async function encounter(p,hab,mode){
  const w=wild(hab,mode), H=HABS[hab], [title,badge]=KIND[w.kind], cpu=p.type==='cpu';
  const full=caught(p).length>=3, rare=w.kind!=='normal';
  const stageHTML=`<div class="stage pop">${art(w.id,w.shiny)}${w.shiny?sparkles():''}</div>`;
  const m=modal(`<div class="rare-${w.kind}">
      ${mode==='safari'?'<div class="habtag" style="--hab:var(--t-safari)">🦒 사파리존</div> ':''}<div class="habtag" style="--hab:${H.c}">${H.e} ${H.ko}</div>
      ${stageHTML}<h3>${title}</h3><div>${badge}</div><div class="stars">${'⭐'.repeat(points(w))}</div>
      ${full?'<p>포켓몬이 3마리 꽉 찼어요. 잡으면 한 마리와 바꿔야 해요.</p>':''}
      <div class="row" style="margin-top:10px"><button class="big-btn" data-v="catch">🔴 잡을래!</button><button class="big-btn alt" data-v="skip">👋 보내 줄래</button></div></div>`);
  if(rare) sfx.sparkle(); else sfx.tap();
  tell(title.replace(/[✨💎👑]/g,''));
  const weakest=caught(p).sort((a,b)=>points(a)-points(b))[0];
  const want=!full||points(w)>points(weakest);
  if(await choose(m.panel,cpu?(want?'catch':'skip'):null,1800)==='skip'){ m.close(); say('잘 가!'); return; }

  let release=null;
  if(full){
    m.set(`<h3>누구랑 바꿀까요?</h3><p>바꾸면 그 포켓몬은 집으로 돌아가요.</p>
      <div class="pick">${caught(p).map(c=>`<button data-v="${c.uid}">${art(c.id,c.shiny)}<span>${esc(nameOf(c.id))}</span><small>${'⭐'.repeat(points(c))}</small></button>`).join('')}</div>
      <button class="big-btn alt" data-v="cancel">그냥 보내 줄래</button>`);
    tell('누구랑 바꿀까요?');
    const v=await choose(m.panel,cpu?weakest.uid:null,1600);
    if(v==='cancel'){ m.close(); return; }
    release=p.team.find(x=>x.uid===v);
  }

  // 이름 맞히기: 첫 자음·모음이 비슷한 보기
  const ans=quizName(w.id), list=shuffle([ans,...similarNames(ans,p.word-1)]);
  m.set(`<div class="rare-${w.kind}"><div class="stage">${art(w.id,w.shiny)}</div>
      <h3>${MEGA[w.id]?'💎 메가진화한 ':''}이 포켓몬의 이름은?</h3>
      <div class="opts">${list.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <button class="hint" id="hint">🔊 이름 들려줘</button></div>`);
  m.q('#hint').onclick=()=>say(ans,.8);
  tell('이 포켓몬의 이름은 뭘까요?');
  const first=await quizLoop(m.panel,ans,cpu);
  await sleep(700);

  // 포켓볼 던지기
  m.set(`<div class="stage">${art(w.id,w.shiny)}<div class="ball throw"></div></div><h3 id="cm">가랏, 몬스터볼!</h3>`);
  const stage=m.q('.stage'), ball=m.q('.ball'), pic=stage.querySelector('.pic,.noimg');
  sfx.tap(); await sleep(600); pic.classList.add('suck'); await sleep(500);
  ball.classList.remove('throw'); ball.classList.add('wobble');
  for(let i=0;i<3;i++){ await sleep(i?550:150); sfx.wob(); } await sleep(450);
  ball.classList.remove('wobble'); ball.classList.add('done'); burst(stage); sfx.fan();
  const mon={id:w.id,shiny:w.shiny,uid:uid()};
  if(release) p.team[p.team.indexOf(release)]=mon; else p.team.push(mon);
  if(!cpu) dexAdd(w.id,w.shiny);
  const nm=nameOf(w.id);
  say(`${nm}, 잡았다!`);
  m.q('#cm').textContent=`${nm}, 잡았다!`;
  if(first) gain(p,1);
  renderSide();
  m.panel.insertAdjacentHTML('beforeend',`<div class="stage" style="width:min(150px,30vw)">${art(w.id,w.shiny)}</div>
    ${first?'<div class="got">한 번에 맞혀서 🍬 사탕 +1</div>':''}${release?`<p>${esc(josa(nameOf(release.id),'은','는'))} 집으로 돌아갔어요. 안녕!</p>`:''}
    <button class="big-btn" data-v="ok">좋아요!</button>`);
  await choose(m.panel,cpu?'ok':null,1600); m.close();
}

function mathPanel(q,lv,head=''){
  return `${head}<div class="eq">${q.a} ${q.op==='+'?'+':'−'} ${q.b} = <span class="qm">?</span></div>
    <div class="vis"${lv>=2?' hidden':''}>${mathVisual(q)}</div>${lv>=2?'<button class="hint" id="hint">💡 도와줘</button>':''}
    <div class="opts num">${numChoices(q.ans,lv,lv>=4?4:3).map(n=>`<button class="opt" data-v="${n}">${n}</button>`).join('')}</div>`;
}
function bindHint(m){ const h=m.q('#hint'); if(h) h.onclick=()=>{ m.q('.vis').hidden=false; h.remove(); }; }
async function mathTile(p){

const evoReady=p=>p.team.filter(m=>(canEvo(m)&&p.candy>=evoCost(m))||(canMega(m)&&p.stones>0));
const costText=(p,m)=>canEvo(m)&&p.candy>=evoCost(m)?`🍬 ${evoCost(m)}개로 진화`:'💎 메가스톤으로 메가진화';
async function offerEvolution(p){
  for(;;){
    const list=evoReady(p); if(!list.length) return;
    const m=modal(`<h3>✨ 진화할 수 있어요!</h3><p>누구를 진화시킬까요? (🍬 ${p.candy}개 · 💎 ${p.stones}개)</p>
      <div class="pick">${list.map(x=>`<button data-v="${x.uid}">${art(x.id,x.shiny)}<span>${esc(nameOf(x.id))}</span><small>${costText(p,x)}</small></button>`).join('')}</div>
      <button class="big-btn alt" data-v="later">나중에 할래</button>`);
    tell('진화할 수 있어요! 누구를 진화시킬까요?');
    const v=await choose(m.panel,p.type==='cpu'?list[0].uid:null,1600); m.close();
    if(v==='later') return;
    await evolve(p,p.team.find(x=>x.uid===v));
  }
}
async function evolve(p,mon){
  const mega=!(canEvo(mon)&&p.candy>=evoCost(mon)), cpu=p.type==='cpu';
  const choices=mega?MEGA_OF[mon.id]:EVO[mon.id];
  let to=choices[0];
  if(choices.length>1){
    const m=modal(`<h3>어떤 모습으로 진화할까요?</h3><div class="pick">${choices.map(id=>`<button data-v="${id}">${art(id,mon.shiny)}<span>${esc(nameOf(id))}</span></button>`).join('')}</div>`);
    tell('어떤 모습으로 진화할까요?');
    to=+await choose(m.panel,cpu?pick(choices):null,1500); m.close();
  }
  if(mega) p.stones--; else p.candy-=evoCost(mon);
  const from=mon.id, m=modal(`<div class="stage evo">${art(from,mon.shiny,'a')}${art(to,mon.shiny,'b')}</div><h3 id="et">어라…? ${esc(nameOf(from))}의 모습이…!</h3>`,'night');
  say(`어라? ${nameOf(from)}의 모습이!`);
  const a=m.q('.a'), b=m.q('.b'), stage=m.q('.stage'); a.classList.add('flash'); b.classList.add('flash'); b.style.opacity=0;
  await sleep(900);
  for(let i=0,d=420;i<12;i++,d=Math.max(70,d*.8)){ a.style.opacity=i%2?1:0; b.style.opacity=i%2?0:1; sfx.wob(); await sleep(d); }
  a.style.opacity=0; b.style.opacity=1; b.classList.remove('flash'); burst(stage,mega?'💎':'✨',12); sfx.fan();
  mon.id=to; if(p.type!=='cpu') dexAdd(to,mon.shiny); renderSide(); placeTokens();
  m.q('#et').textContent=mega?`${nameOf(from)}, 메가진화! ${nameOf(to)}!`:`${ro(nameOf(to))} 진화했다!`;
  say(mega?`${nameOf(from)}, 메가진화!`:`축하해요! ${josa(nameOf(from),'은','는')} ${ro(nameOf(to))} 진화했어요!`);
  m.panel.insertAdjacentHTML('beforeend',`<div class="stars">${'⭐'.repeat(points(mon))}</div><button class="big-btn" data-v="ok">야호!</button>`);
  await choose(m.panel,cpu?'ok':null,1800); m.close();
}
function monInfo(p,u){
  const mon=p.team.find(x=>x.uid===u); if(!mon) return;
  const mine=p===cur()&&phase==='roll'&&p.type!=='cpu', ready=(canEvo(mon)&&p.candy>=evoCost(mon))||(canMega(mon)&&p.stones>0);
  let hintTxt='';
  if(canEvo(mon)) hintTxt=p.candy>=evoCost(mon)?'':`🍬 사탕 ${evoCost(mon)}개가 모이면 진화할 수 있어요 (지금 ${p.candy}개)`;
  else if(canMega(mon)) hintTxt=p.stones?'':'💎 메가스톤을 찾으면 메가진화할 수 있어요!';
  else hintTxt='더 이상 진화하지 않아요';
  const m=modal(`<div class="stage">${art(mon.id,mon.shiny)}</div><h3>${esc(nameOf(mon.id))}${mon.shiny?' ✨':''}</h3>
    <div class="stars">${'⭐'.repeat(points(mon))}</div>${mon.starter?'<p>처음부터 함께한 짝꿍 포켓몬</p>':''}<p>${hintTxt}</p>

  say(nameOf(mon.id));

function holdButton(b,fn){
  let t; const stop=()=>{ clearTimeout(t); b.classList.remove('holding'); };
  b.addEventListener('pointerdown',()=>{ b.classList.add('holding'); t=setTimeout(()=>{ stop(); fn(); },1000); });
  ['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e,stop));
  b.onclick=()=>toast('꾹 누르고 있어 주세요');
}

        <div class="head"><input type="text" maxlength="8" value="${esc(p.name)}" data-k="name">
          <div class="seg"><button data-type="human" class="${p.type==='human'?'on':''}">🙂 사람</button><button data-type="cpu" class="${p.type==='cpu'?'on':''}">🤖 컴퓨터</button></div></div>
        <div class="spick">${STARTERS.map(id=>{ const by=S.players.findIndex(x=>x.starter===id);
          return `<button data-s="${id}" class="${p.starter===id?'on':by>=0?'taken':''}">${art(id,false)}<div>${KO[id-1]}</div></button>`; }).join('')}</div>
        <div class="opts-row">
          <label>🔢 숫자 <select data-k="math">${[1,2,3,4].map(l=>`<option value="${l}" ${p.math===l?'selected':''}>${l}단계: ${MATH_LV[l]}</option>`).join('')}</select></label>
          <label>🔤 글자 보기 <select data-k="word">${[2,3,4].map(l=>`<option value="${l}" ${p.word===l?'selected':''}>${l}개</option>`).join('')}</select></label>
          <label>🎲 주사위 <select data-k="dice"><option value="1" ${p.dice===1?'selected':''}>1개</option><option value="2" ${p.dice===2?'selected':''}>2개 (더하기 연습)</option></select></label>
        </div></div>`).join('')}</div>
      <h2>⏱️ 얼마나 할까요?</h2>
      <div class="seg" id="len">${[[6,'짧게 6판'],[10,'보통 10판'],[15,'길게 15판']].map(([n,t])=>`<button data-r="${n}" class="${S.rounds===n?'on':''}">${t}</button>`).join('')}</div>
      <p class="note">판마다 모두 한 번씩 주사위를 던져요. 정해진 판이 끝나면 포켓몬 ⭐ + 배지로 점수를 세요.<br>
        포켓몬은 짝꿍 말고 3마리까지 잡을 수 있어요. 사탕 🍬을 모으면 진화, 메가스톤 💎이 있으면 메가진화!</p>
      <div class="row" style="margin-top:16px"><button class="big-btn" id="go" style="font-size:30px;min-height:76px">🚀 출발!</button></div></div>`);
    $('#back').onclick=home;
    $('#cnt').onclick=e=>{ const n=+(e.target.closest('[data-n]')||{}).dataset?.n; if(!n) return;
      while(S.players.length<n){ const free=STARTERS.find(s=>!S.players.some(x=>x.starter===s)); S.players.push({name:'친구'+(S.players.length+1),type:'human',starter:free,math:2,word:3,dice:1}); }
      S.players.length=n; sfx.tap(); draw(); };
    $('#len').onclick=e=>{ const b=e.target.closest('[data-r]'); if(!b) return; S.rounds=+b.dataset.r; sfx.tap(); draw(); };
    $app.querySelectorAll('.pset').forEach(box=>{ const p=S.players[+box.dataset.i];
      box.querySelector('input').oninput=e=>{ p.name=e.target.value; };
      box.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{ p.type=b.dataset.type; if(p.type==='cpu'&&/^(나|엄마|아빠)$/.test(p.name)) p.name='컴퓨터'; sfx.tap(); draw(); });
      box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s, other=S.players.find(x=>x!==p&&x.starter===s);
        if(other) other.starter=p.starter; p.starter=s; say(KO[s-1]); draw(); });
      box.querySelectorAll('select').forEach(sel=>sel.onchange=()=>{ p[sel.dataset.k]=+sel.value; });
    });
    $('#go').onclick=()=>{ S.players.forEach((p,i)=>{ p.name=(p.name||'').trim()||'친구'+(i+1); }); store.set(SETUP,S); startGame(S); };
  };
  draw();
}
function startGame(S){
  G={rounds:S.rounds,round:1,turn:0,over:false,extra:false,
    players:S.players.map((c,i)=>({name:c.name,type:c.type,color:COLORS[i],math:c.math,word:c.word,dice:c.dice,pos:0,candy:0,stones:0,badges:0,
      team:[{id:c.starter,shiny:false,starter:true,uid:uid()}]}))};
  save(); gameScreen(); say('모험을 떠나요!'); setTimeout(turnLoop,600);
}

/* ---------- 끝 ---------- */
function endScreen(){
  phase='idle'; store.del(SAVE);
  const ranked=G.players.map(p=>({p,s:score(p)})).sort((a,b)=>b.s-a.s);
  const MED=['🥇','🥈','🥉','🏅'];
  let place=0; ranked.forEach((r,i)=>{ if(i&&r.s<ranked[i-1].s) place=i; r.medal=MED[place]; });
  show(`<div class="page"><div class="hero"><h1>🏆 모험 끝!</h1><p style="font-size:22px">모두 정말 잘했어요!</p></div>
    <div class="rank">${ranked.map(({p,s,medal})=>`<div class="rcard" style="--pc:${p.color}">
      <div class="top"><span class="medal">${medal}</span><span style="flex:1">${esc(p.name)}</span><span>⭐ ${s}</span></div>
      <div class="team" style="margin-top:8px">${p.team.map(m=>`<div class="slot filled">${art(m.id,m.shiny)}${m.shiny?'<span class="tag">✨</span>':''}</div>`).join('')}</div>
      <div class="sum">포켓몬 ⭐ ${p.team.reduce((a,m)=>a+points(m),0)} + 배지 ${p.badges}개 × 2 · 남은 사탕 🍬 ${p.candy}</div></div>`).join('')}</div>
    <div class="row"><button class="big-btn" id="again">🔁 한 번 더!</button><button class="big-btn alt" id="homeE">🏠 처음으로</button></div></div>`);
  sfx.fan(); say(`${subj(ranked[0].p.name)} 1등! 모두 정말 잘했어요!`);
  $('#again').onclick=()=>startGame(store.get(SETUP,DEF_SETUP));
  $('#homeE').onclick=home;
}

/* ---------- 도감 ---------- */
function dex(){
  const d=store.get(DEX,{}), ids=[...NORMAL_IDS,...MEGA_IDS], got=ids.filter(id=>d[id]).length;
  show(`<div class="page"><div class="row" style="justify-content:space-between"><button class="icon-btn" id="back">🏠</button>
      <h1 style="font-size:32px">📖 도감 ${got} / ${ids.length}</h1><span style="width:56px"></span></div>
    <p class="note" style="text-align:center">게임에서 잡거나 진화시킨 포켓몬이 모여요. 그림을 누르면 이름을 들려줘요.</p>
    <div class="dex">${ids.map(id=>{ const e=d[id];
      return `<div data-id="${id}"${e?' data-got="1"':''}><span class="no">${MEGA[id]?'메가':'No.'+id}</span>${e&&e.s?'<span class="tg">✨</span>':''}
        ${e?art(id,!!e.s):art(id,false,'sil')}<div class="nm">${e?esc(nameOf(id)):'???'}</div></div>`; }).join('')}</div></div>`);
  $('#back').onclick=home;
  $app.querySelectorAll('.dex [data-got]').forEach(x=>x.onclick=()=>say(nameOf(+x.dataset.id)));
}

/* ---------- 어른 메뉴 ---------- */
function parent(){
  const total=NORMAL_IDS.length+MEGA_IDS.length, have=()=>[...NORMAL_IDS,...MEGA_IDS].filter(id=>IMG.has('n'+id)).length, haveS=()=>NORMAL_IDS.filter(id=>IMG.has('s'+id)).length;
  show(`<div class="page"><div class="row" style="justify-content:space-between"><button class="icon-btn" id="back">🏠</button><h1 style="font-size:32px">⚙️ 어른 메뉴</h1><span style="width:56px"></span></div>
    <h2>⬇️ 포켓몬 그림 받기</h2>
    <div class="opt-box">
      <p class="note" style="margin-top:0">이 앱에는 포켓몬 그림이 들어 있지 않아요. 버튼을 누르면 이 기기가 PokeAPI 공개 저장소(raw.githubusercontent.com)의 공식 일러스트를 받아
        작게 줄인 뒤 <b>기기 안에만</b> 저장해요. 한 번 받으면 인터넷 없이도 놀 수 있어요. 그림의 저작권은 Nintendo·Creatures·GAME FREAK에 있으니 가정에서만 써 주세요.</p>
      <p id="have">보통 그림 ${have()} / ${total}장 · 반짝(색이 다른) 그림 ${haveS()} / ${NORMAL_IDS.length}장</p>
      <label><input type="checkbox" id="oShiny" ${opts.shiny?'checked':''}> ✨ 반짝 포켓몬 그림도 받기 (없으면 색을 바꿔서 보여 줘요)</label>
      <div class="bar"><i id="bar"></i></div><p class="note" id="dmsg"></p>
      <div class="row" style="justify-content:flex-start"><button class="big-btn" id="dl">⬇️ 그림 받기</button><button class="big-btn small alt" id="clr">🗑️ 받은 그림 지우기</button></div>
    </div>
    <h2>🎛️ 설정</h2>
    <div class="opt-box">
      <label><input type="checkbox" id="oSound" ${opts.sound?'checked':''}> 🔊 소리와 읽어 주기</label>
      <label><input type="checkbox" id="oNarr" ${opts.narrate?'checked':''}> 🗣️ 안내 말 자동으로 읽어 주기 (퀴즈 보기와 찬스 카드는 아이가 직접 읽도록 읽지 않아요)</label>
      <label><input type="checkbox" id="oRare" ${opts.rare==='high'?'checked':''}> 🌟 귀한 포켓몬(반짝·메가·전설)이 더 자주 나오기</label>
    </div>
    <h2>📘 규칙 한눈에</h2>
    <div class="opt-box" style="line-height:1.6">
      🌿💧🪨🌋 서식지 칸: 야생 포켓몬이 나와요. 잡을지 고르고, 잡으려면 <b>이름 맞히기</b>(첫 자음·모음이 비슷한 보기)를 풀어요. 짝꿍 말고 3마리까지, 꽉 차면 바꿔요.<br>
      ✨ 반짝(8%) · 💎 메가(약 5%) · 👑 전설(약 2%) 포켓몬이 가끔 나와요. 🦒 사파리존과 찬스 카드에서는 더 잘 나와요.<br>
      🔢 숫자 퀴즈 · 🔤 글자 퀴즈(이름의 빈칸 글자): 한 번에 맞히면 🍬2, 다시 골라서 맞히면 🍬1.<br>
      🏟️ 체육관: 숫자 문제 2개로 대결, 🏅 배지와 🍬3, 둘 다 한 번에 맞히면 💎 메가스톤.<br>
      🍬 1단계→2단계 진화는 3개, 2단계→3단계는 5개. 💎 메가스톤으로 다 자란 포켓몬(이상해꽃·리자몽·거북왕·피죤투 등)을 메가진화.<br>
      점수: 포켓몬 ⭐(단계 1~3, 전설 5, 메가 6, 반짝 +2) + 배지 × 2.
    </div>
    <h2>🧹 기록</h2>
    <div class="opt-box row" style="justify-content:flex-start"><button class="big-btn small alt" id="rDex">도감 기록 지우기</button><button class="big-btn small alt" id="rSave">진행 중인 게임 지우기</button></div>
  </div>`);
  $('#back').onclick=home;
  const bind=(id,fn)=>{ $(id).onchange=e=>{ fn(e.target.checked); saveOpts(); }; };
  bind('#oShiny',v=>opts.shiny=v); bind('#oSound',v=>opts.sound=v); bind('#oNarr',v=>opts.narrate=v); bind('#oRare',v=>opts.rare=v?'high':'normal');
  const upd=()=>{ $('#have').textContent=`보통 그림 ${have()} / ${total}장 · 반짝(색이 다른) 그림 ${haveS()} / ${NORMAL_IDS.length}장`; };
  $('#dl').onclick=async()=>{
    const jobs=imageJobs(opts.shiny).length; if(!jobs){ $('#dmsg').textContent='이미 다 받았어요!'; return; }
    try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
    $('#dl').disabled=true; $('#clr').disabled=true;
    const r=await downloadImages(opts.shiny,(d,t)=>{ const b=$('#bar'), m=$('#dmsg'); if(b) b.style.width=(d/t*100)+'%'; if(m) m.textContent=`받는 중… ${d} / ${t}`; });
    if(!$('#dmsg')) return;
    $('#dmsg').textContent=r.fail?`${r.total-r.fail}장 받았어요. ${r.fail}장은 받지 못했어요 — 인터넷을 확인하고 한 번 더 눌러 주세요.`:`${r.total}장을 모두 받았어요! 🎉`;
    $('#dl').disabled=false; $('#clr').disabled=false; upd(); if(!r.fail) sfx.fan();
  };
  $('#clr').onclick=async()=>{ if(!confirm('받은 포켓몬 그림을 모두 지울까요?')) return; await idb.clear(); IMG.forEach(u=>URL.revokeObjectURL(u)); IMG.clear(); upd(); toast('그림을 지웠어요'); };
  $('#rDex').onclick=()=>{ if(confirm('도감 기록을 모두 지울까요?')){ store.del(DEX); toast('도감을 지웠어요'); } };
  $('#rSave').onclick=()=>{ if(confirm('진행 중인 게임을 지울까요?')){ store.del(SAVE); toast('지웠어요'); } };
}

/* ---------- 시작 ---------- */
(async function boot(){
  try{ await loadImages(); }catch(e){ console.warn('그림 저장소를 열 수 없어요',e); }
  home();
})();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
