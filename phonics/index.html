<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>글자 친구 파닉스</title>
<meta name="theme-color" content="#ffcf4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글자친구">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/phonics-192.png">
<link rel="icon" href="icons/phonics-192.png">
<style>
@font-face{font-family:"Jua";font-weight:400;font-style:normal;font-display:swap;src:url("../fonts/jua.woff2") format("woff2")}
:root{
  --bg1:#ffcf4d; --bg2:#fff4c9; --ink:#2b2b3a; --card:#ffffff; --soft:#f6f2ff; --accent:#ff6b4a; --ok:#22c55e;
  --shadow:0 6px 0 rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#2a2350; --bg2:#3b3170; --ink:#f4f3ff; --card:#332d5c; --soft:#2a2550; }
}
:root[data-theme="dark"]{ --bg1:#2a2350; --bg2:#3b3170; --ink:#f4f3ff; --card:#332d5c; --soft:#2a2550; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);
  background-image:linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
input,select{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.page{max-width:920px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 40px}

.top{display:flex;align-items:center;gap:10px;padding:0 0 12px}
.icon-btn{font-size:26px;width:54px;height:54px;flex:none;border-radius:18px;border:none;background:var(--card);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.icon-btn:active,.big-btn:active,.mode:active,.card:active{transform:translateY(3px)}
.title{flex:1;font-size:clamp(20px,5vw,28px);text-align:center}
.spacer{width:54px;flex:none}
.stars{flex:none;min-width:54px;height:54px;padding:0 12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:4px;font-size:22px}
.stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3)}}
.hold{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent)}

.logo{font-size:clamp(34px,9vw,58px);text-align:center;margin:4px 0 0;line-height:1.1;font-weight:normal}
.logo span{display:inline-block}
.sub{text-align:center;font-size:clamp(16px,4.2vw,21px);margin:6px 0 14px}
h2{font-weight:normal;font-size:22px;margin:18px 0 10px}
h3{font-weight:normal;font-size:19px;margin:16px 0 8px}

.hero{display:flex;justify-content:center;gap:clamp(4px,2vw,14px);margin:10px 0 6px;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.mode{border:none;border-radius:28px;padding:14px;font-size:clamp(22px,5.6vw,28px);color:#fff;cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.mode small{font-size:16px;opacity:.95}
.mode .em{font-size:44px;line-height:1.15}

.big-btn{border:none;background:#ffd54a;color:#3a2a00;border-radius:20px;padding:12px 20px;font-size:21px;box-shadow:var(--shadow);cursor:pointer;display:inline-block}
.big-btn.alt{background:var(--card);color:var(--ink)}
.big-btn.go{background:var(--ok);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.big-btn.small{font-size:16px;padding:9px 14px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.note{font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;opacity:.85}
.panel{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

/* ---------- 글자 친구 ---------- */
.friend{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;--fw:84px;transition:transform .35s}
.friend svg,.friend .pic{width:var(--fw);height:calc(var(--fw)*1.2);display:block;overflow:visible}
.friend.wide svg{width:calc(var(--fw)*1.4)}
.friend .pic{object-fit:contain;background:#fff;border-radius:18px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.friend .tag{position:absolute;bottom:-4px;right:-4px;background:var(--card);border-radius:12px;padding:0 8px;font-size:calc(var(--fw)*.28);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.friend .pupil{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.friend:nth-child(2n) .pupil{animation-delay:1.7s}.friend:nth-child(3n) .pupil{animation-delay:3.1s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.friend.hop{animation:hop .55s}
@keyframes hop{0%{transform:none}30%{transform:translateY(-30px) scale(1.04,.96)}62%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
.friend.wob{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.friend.next svg,.friend.next .pic{animation:glow 1s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 #fff200)}to{filter:drop-shadow(0 0 12px #fff200) drop-shadow(0 0 4px #ff9f1c)}}
.friend.done{opacity:.95}
.friend.done::after{content:'✓';position:absolute;top:-8px;left:-6px;background:var(--ok);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 8px;justify-items:center}
.board .cell{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px}
.board .friend{--fw:70px}
.board .seen{font-size:13px;color:var(--ok)}

/* 글자 하나 크게 보기 */
.letter-view{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.letter-view .friend{--fw:min(44vw,190px)}
.bigAa{font-size:clamp(40px,11vw,64px);line-height:1}
.hint{font-size:clamp(20px,5.4vw,28px)}
.hint b{color:var(--accent);font-weight:normal}
.wordcard{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:22px;padding:10px 18px;cursor:pointer;font-size:clamp(26px,7vw,40px)}
.wordcard .e{font-size:clamp(46px,12vw,72px)}
.wordcard u{text-decoration:none;color:var(--accent)}
.wordcard small{display:block;font-size:18px;opacity:.75}

/* 단어 합체 */
.stage{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
.blend-row{display:flex;gap:18px;align-items:flex-end;transition:gap .6s cubic-bezier(.5,-0.4,.5,1.4)}
.blend-row .friend{--fw:clamp(70px,20vw,110px)}
.blend-row.merged{gap:0}
.blend-row.squish{animation:squish .5s}
@keyframes squish{50%{transform:scale(1.25,.7)}}
.blend-row.vanish{animation:vanish .35s forwards}
@keyframes vanish{to{transform:scale(.2);opacity:0}}
.prompt{font-size:clamp(19px,5vw,25px);text-align:center;min-height:1.4em}
.result{display:flex;flex-direction:column;align-items:center;gap:4px;animation:popin .55s cubic-bezier(.3,1.6,.6,1)}
.result .e{font-size:clamp(100px,30vw,170px);line-height:1.05;cursor:pointer}
.result .w{font-size:clamp(40px,11vw,64px);letter-spacing:2px}
.result .w span{display:inline-block}
.result .k{font-size:22px;opacity:.8}
@keyframes popin{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.levels button{border:4px solid transparent;background:var(--card);border-radius:18px;padding:6px 14px;font-size:18px;box-shadow:var(--shadow);cursor:pointer}
.levels button.on{border-color:var(--accent);background:#fff3cf;color:#3a2a00}

/* 퀴즈 */
.qpic{font-size:clamp(110px,32vw,170px);line-height:1.05;cursor:pointer;text-align:center}
.choices{display:flex;gap:clamp(10px,4vw,30px);justify-content:center;flex-wrap:wrap}
.choices .friend{--fw:clamp(78px,23vw,120px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:640px}
.card{border:none;background:var(--card);border-radius:24px;box-shadow:var(--shadow);font-size:clamp(56px,17vw,100px);padding:12px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.card small{font-size:20px;min-height:1.3em}
.card.ok{background:#d9fbe3}.card.wob{animation:wob .5s}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.15)}
.dots i.on{background:var(--ok)}
.speak{font-size:30px;width:70px;height:70px;border-radius:50%}

/* 스티커북 */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sticker{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:8px 4px;text-align:center;cursor:pointer;font-size:46px;line-height:1.1}
.sticker small{display:block;font-size:17px}
.sticker.lock{filter:grayscale(1);opacity:.35}

/* 어른 메뉴 */
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:10px;padding:7px 12px;font-size:16px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
select,input[type=url],input[type=text]{font-family:system-ui,sans-serif;font-size:15px;padding:8px 10px;border-radius:12px;border:2px solid #cbd5e1;background:var(--soft);max-width:100%}
.lrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(0,0,0,.08)}
.lrow .friend{--fw:52px}
.lrow .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lrow .tools button{border:none;background:var(--soft);border-radius:12px;padding:7px 10px;font-size:15px;cursor:pointer}
.lrow .tools button.rec{background:#ff4d6d;color:#fff}
.lrow input{flex:1;min-width:150px}
pre{font-family:ui-monospace,monospace;font-size:12px;background:var(--soft);border-radius:12px;padding:10px;overflow:auto;-webkit-user-select:text;user-select:text}

/* 공통 */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:20px;padding:12px 20px;border-radius:18px;z-index:70;max-width:90vw;text-align:center;animation:popin .25s}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.align{background:rgba(20,16,40,.92);justify-content:flex-start;padding-top:max(16px,env(safe-area-inset-top))}
.aw-tip{color:#fff;font-size:17px;text-align:center;max-width:700px}
.aw-box{position:relative;z-index:1;flex:none;touch-action:none}
.align .row,.align .aw-tip{position:relative;z-index:2}
.aw-box img{width:100%;height:100%;display:block;-webkit-user-drag:none}
.aw-frame{position:absolute;outline:2px solid #ff3d7f;cursor:move;touch-action:none}
.aw-frame i{position:absolute;border:2px solid #ff3d7f;background:rgba(255,61,127,.08);pointer-events:none}
.aw-frame b{position:absolute;left:2px;top:0;font-weight:normal;font-size:12px;color:#fff;background:#ff3d7f;border-radius:0 0 6px 0;padding:0 4px}
.aw-h{position:absolute;right:-16px;bottom:-16px;width:32px;height:32px;border-radius:50%;background:#ff3d7f;border:3px solid #fff;cursor:nwse-resize;touch-action:none}
.overlay iframe{width:min(96vw,960px);aspect-ratio:16/9;border:0;border-radius:16px;background:#000}
.cheer{text-align:center;font-size:clamp(30px,8vw,46px)}
.cheer .em{font-size:clamp(90px,26vw,140px);display:block;animation:popin .6s cubic-bezier(.3,1.6,.6,1)}
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
'use strict';
/* ======================================================================
   글자 친구 파닉스 — 미취학 아동용 파닉스(소리-글자) 놀이
   · 앱에 들어 있는 글자 캐릭터는 모두 이 앱만의 그림(SVG)
   · 알파블록스 같은 외부 캐릭터·영상·소리는 앱에 넣지 않음.
     알파블록스 그림은 어른 메뉴에서 기기가 직접 팬 위키 API로 찾아 받아 기기에만 저장
     어른 메뉴에서 가정에서 가진 그림/녹음/영상 링크를 연결하거나
     어른이 정한 주소의 '자료 팩'을 받아 기기(IndexedDB)에만 저장
   ====================================================================== */

/* ---------------- 데이터 ---------------- */
// 소리(그래핌) → TTS 근사 발음, 한글 힌트
const SND={
  a:['ah','애'], b:['buh','브'], c:['kuh','크'], d:['duh','드'], e:['eh','에'], f:['fff','프'], g:['guh','그'],
  h:['huh','흐'], i:['ih','이'], j:['juh','쥐'], k:['kuh','크'], l:['lll','르'], m:['mmm','음'], n:['nnn','은'],
  o:['aw','아'], p:['puh','프'], q:['kwuh','쿠'], r:['rrr','뤄'], s:['sss','스'], t:['tuh','트'], u:['uh','어'],
  v:['vvv','브'], w:['wuh','워'], x:['ks','크스'], y:['yuh','이으'], z:['zzz','즈'],
  sh:['shh','쉬'], ch:['chuh','취'], th:['thh','쓰'], ck:['kuh','크'], ll:['lll','르'], ss:['sss','스'],
};
const VOWELS='aeiou';
const LETTERS='abcdefghijklmnopqrstuvwxyz'.split('');
const PAIRS=['sh','ch','th','ck','ll','ss'];

// 글자마다 대표 단어 (첫소리)
const LW={
  a:['ant','🐜','개미'], b:['bus','🚌','버스'], c:['cat','🐱','고양이'], d:['dog','🐶','강아지'], e:['egg','🥚','달걀'],
  f:['fish','🐟','물고기'], g:['gift','🎁','선물'], h:['hat','👒','모자'], i:['insect','🐞','곤충'], j:['jam','🍯','잼'],
  k:['kite','🪁','연'], l:['lion','🦁','사자'], m:['moon','🌙','달'], n:['nose','👃','코'], o:['octopus','🐙','문어'],
  p:['pig','🐷','돼지'], q:['queen','👸','여왕'], r:['rabbit','🐰','토끼'], s:['sun','☀️','해'], t:['tiger','🐯','호랑이'],
  u:['umbrella','☂️','우산'], v:['van','🚐','승합차'], w:['watermelon','🍉','수박'], x:['fox','🦊','여우'],
  y:['yo-yo','🪀','요요'], z:['zebra','🦓','얼룩말'],
};
// 합체할 수 있는 단어: [단어, 그래핌들(-로 구분), 그림, 뜻]
const W=s=>s.trim().split('\n').map(l=>{ const [w,g,e,k]=l.trim().split(/\s+/); return {w,g:g.split('-'),e,k}; });
const LEVELS=[
  {id:'cvc', name:'세 글자', em:'🐣', list:W(`
    cat c-a-t 🐱 고양이
    dog d-o-g 🐶 강아지
    pig p-i-g 🐷 돼지
    sun s-u-n ☀️ 해
    bus b-u-s 🚌 버스
    hat h-a-t 👒 모자
    bed b-e-d 🛏️ 침대
    cup c-u-p 🥤 컵
    box b-o-x 📦 상자
    bag b-a-g 👜 가방
    hen h-e-n 🐔 암탉
    fox f-o-x 🦊 여우
    bug b-u-g 🐛 벌레
    ant a-n-t 🐜 개미
    van v-a-n 🚐 승합차
    jam j-a-m 🍯 잼
    web w-e-b 🕸️ 거미줄
    map m-a-p 🗺️ 지도
    pen p-e-n 🖊️ 펜
    ten t-e-n 🔟 열
    six s-i-x 6️⃣ 여섯
    bat b-a-t 🦇 박쥐
    rat r-a-t 🐀 쥐
    log l-o-g 🪵 통나무
    pot p-o-t 🍲 냄비
    cap c-a-p 🧢 야구모자
    mug m-u-g ☕ 머그컵
    nut n-u-t 🥜 땅콩
    red r-e-d 🟥 빨간색
    kid k-i-d 🧒 아이`)},
  {id:'pair', name:'짝꿍 소리', em:'🐥', list:W(`
    fish f-i-sh 🐟 물고기
    ship sh-i-p 🚢 배
    duck d-u-ck 🦆 오리
    sock s-o-ck 🧦 양말
    chick ch-i-ck 🐤 병아리
    bath b-a-th 🛁 목욕
    shell sh-e-ll 🐚 조개껍데기
    bell b-e-ll 🔔 종
    lock l-o-ck 🔒 자물쇠
    rock r-o-ck 🪨 돌
    kiss k-i-ss 💋 뽀뽀
    chin ch-i-n 🧔 턱
    moth m-o-th 🦋 나방
    shop sh-o-p 🏪 가게`)},
  {id:'long', name:'네 글자', em:'🐓', list:W(`
    frog f-r-o-g 🐸 개구리
    crab c-r-a-b 🦀 게
    drum d-r-u-m 🥁 북
    flag f-l-a-g 🚩 깃발
    milk m-i-l-k 🥛 우유
    hand h-a-n-d ✋ 손
    tent t-e-n-t ⛺ 텐트
    nest n-e-s-t 🪺 둥지
    swim s-w-i-m 🏊 수영
    stop s-t-o-p 🛑 멈춰
    gift g-i-f-t 🎁 선물
    clock c-l-o-ck 🕰️ 시계
    plum p-l-u-m 🍑 자두
    lamp l-a-m-p 💡 램프`)},
];
// 스티커북에 모일 단어 전체 (중복 제거)
const ALLWORDS=(()=>{ const m=new Map();
  LEVELS.forEach(L=>L.list.forEach(x=>m.set(x.w,x)));
  LETTERS.forEach(l=>{ const [w,e,k]=LW[l]; if(!m.has(w)) m.set(w,{w,g:null,e,k}); });
  return [...m.values()]; })();
const WORD=Object.fromEntries(ALLWORDS.map(x=>[x.w,x]));

const COLORS=['#ff7a59','#ffb703','#3fb6e8','#6ccf5f','#a07bff','#ff7fa8','#26bfb0','#f9844a','#5b8def'];
const colorOf=g=>VOWELS.includes(g)?'#ff5d8f':COLORS[(g.charCodeAt(0)*7+(g.length>1?g.charCodeAt(1):0))%COLORS.length];

/* ---------------- 저장소 ---------------- */
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const SET_KEY='phonics-set', PROG_KEY='phonics-prog';
const S={
  set:Object.assign({sound:true,koVoice:true,koHint:true,voiceEn:'',voiceKo:'',slow:false,videos:{}},store.get(SET_KEY,{})),
  prog:Object.assign({stars:0,words:{},letters:{}},store.get(PROG_KEY,{})),
};
const saveSet=()=>store.set(SET_KEY,S.set), saveProg=()=>store.set(PROG_KEY,S.prog);

const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open('phonics',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('media'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('media',mode), r=fn(t.objectStore('media'));
    t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); }); };
  return {
    put:(k,v)=>tx('readwrite',o=>o.put(v,k)),
    del:k=>tx('readwrite',o=>o.delete(k)),
    clear:()=>tx('readwrite',o=>o.clear()),
    all:async()=>{ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction('media'), out=[], c=t.objectStore('media').openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } };
      t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); },
  };
})();
// 'img:b' / 'snd:sh' → objectURL (메모리에 들고 있어야 iOS에서 탭과 동시에 재생됨)
const MEDIA=new Map();
async function loadMedia(){ try{ for(const [k,b] of await idb.all()) if(b){ if(MEDIA.has(k)) URL.revokeObjectURL(MEDIA.get(k)); MEDIA.set(k,URL.createObjectURL(b)); } }catch(e){} }
async function putMedia(k,blob){ await idb.put(k,blob); if(MEDIA.has(k)) URL.revokeObjectURL(MEDIA.get(k)); MEDIA.set(k,URL.createObjectURL(blob)); }
async function delMedia(k){ try{ await idb.del(k); }catch(e){} if(MEDIA.has(k)){ URL.revokeObjectURL(MEDIA.get(k)); MEDIA.delete(k); } }

/* ---------------- 소리 ---------------- */
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|bells/i;
function voiceList(lang){ try{ return speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(lang)&&!NOVELTY.test(v.name)); }catch(e){ return []; } }
function voiceScore(v){ const n=v.name; return (/premium|고품질/i.test(n)?6:0)+(/enhanced|향상/i.test(n)?4:0)+(/natural|neural|online/i.test(n)?3:0)+(/samantha|google us|ava|allison|yuna|sora/i.test(n)?2:0)+(/en-us/i.test(v.lang)?1:0); }
const rankVoices=lang=>voiceList(lang).sort((a,b)=>voiceScore(b)-voiceScore(a));
let enV=null, koV=null;
function pickVoices(){ const one=(lang,uri)=>{ const vs=rankVoices(lang); return (uri&&vs.find(v=>v.voiceURI===uri))||vs[0]||null; };
  enV=one('en',S.set.voiceEn); koV=one('ko',S.set.voiceKo); }
if('speechSynthesis' in window){ pickVoices(); speechSynthesis.onvoiceschanged=()=>{ pickVoices(); if(cur==='parent') renderVoiceSel(); }; }

let seqId=0, curAudio=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function stopSound(){ seqId++; try{ speechSynthesis.cancel(); }catch(e){} if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; } }
function speakOne(t,lang,rate){ return new Promise(res=>{
  if(!('speechSynthesis' in window)) return res();
  const u=new SpeechSynthesisUtterance(t); u.lang=lang==='ko'?'ko-KR':'en-US'; const v=lang==='ko'?koV:enV; if(v) u.voice=v;
  u.rate=(rate||.9)*(S.set.slow?.82:1); u.pitch=1.08;
  let done=false; const fin=()=>{ if(!done){ done=true; res(); } }; u.onend=fin; u.onerror=fin;
  setTimeout(fin,1800+t.length*220); speechSynthesis.speak(u); }); }
function playUrl(url){ return new Promise(res=>{ const a=new Audio(url); curAudio=a; let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
  a.onended=fin; a.onerror=fin; setTimeout(fin,6000); a.play().catch(fin); }); }
// list 항목: {g:'sh'} 소리 / {t:'cat'} 영어 / {ko:'...'} 한국어 안내 / {wait:ms}
async function play(list){
  if(!S.set.sound) return; stopSound(); const my=seqId;
  for(const it of list){
    if(my!==seqId) return;
    if(it.wait){ await sleep(it.wait); continue; }
    if(it.g){ const u=MEDIA.get('snd:'+it.g); if(u) await playUrl(u); else await speakOne(SND[it.g][0],'en',.75); }
    else if(it.ko){ if(S.set.koVoice) await speakOne(it.ko,'ko',1); }
    else if(it.t) await speakOne(it.t,'en',it.r||.85);
  }
}
// 효과음 (WebAudio)
let AC=null;
function tone(seq){ if(!S.set.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  let t=AC.currentTime; seq.forEach(([f,d,type])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const sfx={ pop:()=>tone([[660,.08],[990,.12]]), yay:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]),
  no:()=>tone([[300,.15,'sine'],[250,.2,'sine']]), magic:()=>tone([[400,.06],[600,.06],[800,.06],[1000,.06],[1200,.06],[1600,.25]]) };

function hop(el,cls='hop'){ if(!el) return; el.classList.remove('hop','wob'); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),600); }
function toast(t,ms=2200){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }
function confetti(n=36){ const cs=['#ff5d8f','#ffd23f','#3fb6e8','#6ccf5f','#a07bff','#ff7a59'];
  for(let i=0;i<n;i++){ const s=document.createElement('i'); s.className='confetti'; s.style.left=Math.random()*100+'vw'; s.style.background=cs[i%cs.length];
    s.style.animationDuration=(1.4+Math.random()*1.4)+'s'; s.style.animationDelay=Math.random()*.3+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),3200); } }
function addStar(n=1){ S.prog.stars+=n; saveProg(); const el=document.querySelector('.stars'); if(el){ el.querySelector('b').textContent=S.prog.stars; hop(el,'bump'); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),600); } }

/* 단어 합체 */
let blendLv=store.get('phonics-lv','cvc'), blendBag=[];
SCREENS.blend=()=>{
  const L=LEVELS.find(x=>x.id===blendLv)||LEVELS[0];
  if(!blendBag.length||blendBag.lv!==L.id){ blendBag=shuffle(L.list); blendBag.lv=L.id; }
  const it=blendBag.pop(); let step=0, merging=false;
  app.innerHTML=`${topBar('단어 합체')}
    <div class="levels">${LEVELS.map(x=>`<button data-lv="${x.id}" class="${x.id===L.id?'on':''}">${x.em} ${x.name}</button>`).join('')}</div>
    <div class="stage" id="stage">
      <div class="prompt" id="pr">반짝이는 친구부터 차례로 눌러요 👆</div>
      <div class="blend-row" id="br">${it.g.map((g,i)=>friend(g,`data-i="${i}"`)).join('')}</div>
      <div class="row" id="act"></div>
    </div>`;
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ blendLv=b.dataset.lv; store.set('phonics-lv',blendLv); blendBag=[]; sfx.pop(); go('blend'); });
  const br=document.getElementById('br'), fs=[...br.children], pr=document.getElementById('pr'), act=document.getElementById('act');
  const mark=()=>fs.forEach((f,i)=>{ f.classList.toggle('next',i===step); f.classList.toggle('done',i<step); });
  mark();
  fs.forEach((f,i)=>f.onclick=()=>{
    if(merging) return;
    hop(f); play([{g:it.g[i]}]);
    if(i!==step){ if(i>step) hop(fs[step],'wob'); return; }
    step++; mark();
    if(step===it.g.length){
      pr.textContent='모두 모였어! 합체해 볼까?';
      act.innerHTML='<button class="big-btn go" id="mg" style="font-size:28px">🪄 합체!</button>';
      document.getElementById('mg').onclick=merge;

    }
  });
  async function merge(){
    if(merging) return; merging=true; act.innerHTML=''; pr.textContent='';
    fs.forEach(f=>f.classList.remove('next','done'));
    // 소리 하나씩 → 점점 빠르게 → 단어
    play([...it.g.flatMap(g=>[{g},{wait:120}])]);

    st.insertBefore(res,act);
    pr.textContent=first?'새 스티커를 모았어요! ⭐⭐':'참 잘했어요! ⭐';
    play([{t:it.w},{wait:300},{t:it.w+'!',r:1},...(S.set.koHint?[{ko:it.k}]:[])]);
    res.querySelector('.e').onclick=()=>{ hop(res.querySelector('.e')); play([{t:it.w}]); };
    act.innerHTML=`<button class="big-btn alt" id="again">🔊 다시</button><button class="big-btn go" id="nx">다음 단어 ▶</button>`;
    document.getElementById('again').onclick=()=>play([...it.g.flatMap(g=>[{g},{wait:80}]),{t:it.w}]);
    document.getElementById('nx').onclick=()=>{ sfx.pop(); go('blend'); };
  }
  setTimeout(()=>{ if(cur==='blend'&&step===0) play([{ko:'반짝이는 친구를 눌러 봐'}]); },300);
};

SCREENS.first=()=>{
  const pool=shuffle(ALLWORDS.filter(x=>x.w[0]!=='x'&&!(x.w==='yo-yo'))).slice(0,ROUND);

  app.innerHTML=quizShell('첫소리 찾기','무슨 소리로 시작할까?');
  const q=document.getElementById('q'), dots=[...document.querySelectorAll('#dots i')], pr=document.getElementById('pr');
  function ask(){
    const it=pool[n], first=it.g?it.g[0]:it.w[0];
    const opts=shuffle([first,...shuffle(LETTERS.filter(l=>l!==first&&l!=='x'&&l!==it.w[0])).slice(0,2)]);
    let tries=0, done=false;

    q.innerHTML=`<div class="qpic" id="pic">${it.e}</div><div class="choices">${opts.map(g=>friend(g)).join('')}</div>`;
    const sayQ=()=>play([{t:it.w},{wait:200},...(n===0?[{ko:'무슨 소리로 시작할까?'}]:[])]);
    document.getElementById('pic').onclick=()=>{ hop(document.getElementById('pic')); play([{t:it.w}]); };

async function toggleRec(g){
  if(recorder){ const same=recorder.g===g; recorder.stop(); if(same) return; await sleep(200); }
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast('이 기기에서는 녹음을 할 수 없어요'); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast('마이크를 쓸 수 있게 허락해 주세요'); return; }
  stopSound();
  const r=new MediaRecorder(stream), chunks=[]; r.g=g; recorder=r;
  r.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  r.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); clearTimeout(r.tm); if(recorder===r) recorder=null;
    if(chunks.length){ await putMedia('snd:'+g,new Blob(chunks,{type:r.mimeType||'audio/mp4'})); refreshRows(); play([{g}]); } else refreshRows(); };
  r.start(); r.tm=setTimeout(()=>{ if(r.state==='recording') r.stop(); },3000);
  refreshRows(); toast('🎙 '+g+' 소리를 짧게 말해 주세요 (3초)',1800);
}
async function shrink(blob){
  const u=URL.createObjectURL(blob);
  try{ const im=new Image(); im.src=u; await im.decode();
    const k=Math.min(1,360/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
  } finally{ URL.revokeObjectURL(u); }
}
/* 알파블록스 그림: 기기가 직접 팬 위키 API에서 찾아 받음 (앱에는 그림이 없음) */
const AB_API='https://alphablocks.fandom.com/api.php';
const abCount=()=>Object.keys(S.set.ab||{}).length;
async function wikiQuery(params){
  const u=new URL(AB_API); Object.entries({format:'json',origin:'*',...params}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json();
}
// 제목 여러 개 → {원래 제목: 대표 그림 주소}
async function pageImages(titles){
  const d=await wikiQuery({action:'query',prop:'pageimages',piprop:'original',titles:titles.join('|'),redirects:1});
  const q=d.query||{}, step=(list,t)=>((list||[]).find(x=>x.from===t)||{}).to||t, img={};
  Object.values(q.pages||{}).forEach(p=>{ if(p.original&&p.original.source) img[p.title]=p.original.source; });
  const out={}; titles.forEach(t=>{ const f=step(q.redirects,step(q.normalized,t)); if(img[f]) out[t]=img[f]; }); return out;
}
// 글자마다 찾아볼 문서 제목 (위키 문서 이름이 바뀌어도 되도록 여러 후보)
const AB_TITLES=[g=>g.toUpperCase(), g=>g.toUpperCase()+' (character)', g=>g.toUpperCase()+' (Alphablocks)', g=>'Letter '+g.toUpperCase()];
const smaller=src=>src.replace(/\/revision\/latest(?=[?/]|$)/,'/revision/latest/scale-to-width-down/400');
async function grabImage(src){
  try{ const r=await fetch(src); if(r.ok) return await shrink(await r.blob()); }catch(e){}
  // fetch가 막히면 crossOrigin 이미지 → 캔버스
  const im=new Image(); im.crossOrigin='anonymous'; im.src=src; await im.decode();
  const k=Math.min(1,360/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
}
async function loadAlphablocks(){
  const msg=document.getElementById('abMsg'), btn=document.getElementById('abGo');
  if(!navigator.onLine){ msg.textContent='인터넷에 연결된 뒤 다시 눌러 주세요.'; return; }
  btn.disabled=true; msg.textContent='알파블록스 위키에서 글자 친구들을 찾는 중…';
  const found={};
  try{
    for(const mk of AB_TITLES){
      const left=LETTERS.filter(g=>!found[g]); if(!left.length) break;
      const res=await pageImages(left.map(mk));
      left.forEach(g=>{ const s=res[mk(g)]; if(s) found[g]=s; });
    }
  }catch(e){ btn.disabled=false; msg.textContent='위키에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; return; }
  const list=Object.entries(found);
  if(!list.length){ btn.disabled=false; msg.textContent='그림을 찾지 못했어요. 위키 구조가 바뀌었을 수 있어요. 아래에서 글자마다 🖼 그림을 직접 넣어 주세요.'; return; }
  S.set.ab=S.set.ab||{}; S.set.imgUrls=S.set.imgUrls||{};
  let ok=0, linkOnly=0;
  for(const [g,src] of list){
    msg.textContent=`그림 받는 중… ${g.toUpperCase()} (${ok+linkOnly+1}/${list.length})`;
    try{ await putMedia('img:'+g,await grabImage(smaller(src))); delete S.set.imgUrls[g]; ok++; }
    catch(e){ S.set.imgUrls[g]=smaller(src); linkOnly++; } // 저장이 막히면 주소로 보여 주고 서비스워커가 사본을 보관
    S.set.ab[g]=src; saveSet();
  }
  const miss=LETTERS.filter(g=>!found[g]).map(g=>g.toUpperCase());
  btn.disabled=false; refreshRows();
  msg.textContent=`${list.length}개 글자 그림을 받았어요.`+(linkOnly?` (${linkOnly}개는 한 번 화면에 나온 뒤부터 인터넷 없이 보여요)`:'')+(miss.length?` 못 찾은 글자: ${miss.join(', ')} — 아래에서 직접 넣을 수 있어요.`:'');
  toast('알파블록스 친구들이 왔어요! 🎉');
}

/* 글자 카드 시트(5열 × 6줄 점선 카드, a~z) → 글자마다 한 장씩, 기기 안에서만 자르기
   격자 단위: 카드 폭 137, 가로 간격 185, 카드 높이 175, 세로 간격 209.2 → 격자 전체 877 × 1221 */
const GRID={cols:5,rows:6,cw:137,px:185,ch:175,py:209.2,W:877,H:1221,inset:8};
function trimWhite(c){
  const x=c.getContext('2d'), {width:w,height:h}=c, d=x.getImageData(0,0,w,h).data;
  let l=w,t=h,r=-1,b=-1;
  for(let y=0;y<h;y++) for(let i=0;i<w;i++){ const o=(y*w+i)*4; if(Math.min(d[o],d[o+1],d[o+2])<225){ if(i<l)l=i; if(i>r)r=i; if(y<t)t=y; if(y>b)b=y; } }
  if(r<0||r-l<8||b-t<8) return null;
  const p=4; l=Math.max(0,l-p); t=Math.max(0,t-p); r=Math.min(w-1,r+p); b=Math.min(h-1,b+p);
  const k=Math.min(1,360/Math.max(r-l+1,b-t+1)), o=document.createElement('canvas');
  o.width=Math.round((r-l+1)*k); o.height=Math.round((b-t+1)*k);
  o.getContext('2d').drawImage(c,l,t,r-l+1,b-t+1,0,0,o.width,o.height); return o;
}
// 점선(짧은 회색 조각이 고르게 반복되는 줄)을 찾아 격자 위치 추정 → {x,y,w} (원본 픽셀)
function detectGrid(im){
  const W0=im.naturalWidth, H0=im.naturalHeight, s=Math.min(1,1200/Math.max(W0,H0));
  const w=Math.max(1,Math.round(W0*s)), h=Math.max(1,Math.round(H0*s));
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(im,0,0,w,h); const d=x.getImageData(0,0,w,h).data;
  // 0: 그 밖, 1: 연회색(점선 조각), 2: 흰 바탕
  const kd=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){ const r=d[i*4],g=d[i*4+1],b=d[i*4+2], m=(r+g+b)/3, sat=Math.max(r,g,b)-Math.min(r,g,b);
    kd[i]=m>=236?2:(m>90&&sat<40?1:0); }
  const dashes=(get,len)=>{ // 짧은 회색 조각(2~24px) 다음에 짧은 흰 틈(2~24px)이 오는 횟수
    let n=0, cur=-1, run=0, inkOk=false;
    const fin=()=>{ const ok=run>=2&&run<=24; if(cur===1) inkOk=ok; else { if(cur===2&&inkOk&&ok) n++; inkOk=false; } };
    for(let i=0;i<len;i++){ const v=get(i); if(v===cur){ run++; continue; } fin(); cur=v; run=1; }
    fin(); return n; };
  const kind=i=>kd[i];
  const colS=Array.from({length:w},(_,X)=>dashes(Y=>kind(Y*w+X),h));
  const rowS=Array.from({length:h},(_,Y)=>dashes(X=>kind(Y*w+X),w));
  const lines=(S)=>{ const mx=Math.max(...S); if(mx<6) return []; const out=[]; let st=-1;
    S.forEach((v,i)=>{ if(v>=mx*.45){ if(st<0) st=i; } else if(st>=0){ out.push((st+i-1)/2); st=-1; } }); if(st>=0) out.push((st+S.length-1)/2); return out; };
  const xs=lines(colS), ys=lines(rowS);
  if(xs.length<2||!ys.length) return null;
  const gw=xs[xs.length-1]-xs[0]; if(gw<w*.25) return null;
  return {x:xs[0]/s, y:ys[0]/s, w:gw/s};
}
function cutCards(im,g){
  const k=g.w/GRID.W, out=[];
  for(let i=0;i<26;i++){
    const col=i%GRID.cols, row=i/GRID.cols|0, I=GRID.inset;
    const sx=g.x+(col*GRID.px+I)*k, sy=g.y+(row*GRID.py+I)*k, sw=(GRID.cw-2*I)*k, sh=(GRID.ch-2*I)*k;
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(sw)); c.height=Math.max(1,Math.round(sh));
    const x=c.getContext('2d',{willReadFrequently:true}); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height); out.push(trimWhite(c));
  }
  return out;
}
// 어른이 칸을 맞추는 화면: 가운데를 끌면 이동, ● 를 끌면 크기
function alignSheet(im,g0){
  return new Promise(done=>{
    const W0=im.naturalWidth, H0=im.naturalHeight;
    const fw=Math.min(W0*.94,H0*.97*GRID.W/GRID.H); // 기본 칸은 그림 안에 다 들어오게
    const g=g0||{x:(W0-fw)/2,y:(H0-fw*GRID.H/GRID.W)/2,w:fw};
    const o=document.createElement('div'); o.className='overlay align';
    o.innerHTML=`<div class="aw-tip">${g0?'점선 카드에 칸이 맞는지 확인해 주세요.':'칸을 점선 카드에 맞춰 주세요.'} 가운데를 끌면 움직이고, 오른쪽 아래 ● 를 끌면 크기가 바뀌어요.</div>
      <div class="aw-box"><img alt="글자 카드 시트"><div class="aw-frame">${Array.from({length:26},(_,i)=>{ const c=i%5,r=i/5|0;
        return `<i style="left:${c*GRID.px/GRID.W*100}%;top:${r*GRID.py/GRID.H*100}%;width:${GRID.cw/GRID.W*100}%;height:${GRID.ch/GRID.H*100}%"><b>${LETTERS[i]}</b></i>`; }).join('')}<span class="aw-h"></span></div></div>
      <div class="row"><button class="big-btn alt" data-x="0">취소</button><button class="big-btn go" data-x="1">✂️ 이대로 자르기</button></div>`;
    document.body.appendChild(o);
    const img=o.querySelector('img'), box=o.querySelector('.aw-box'), fr=o.querySelector('.aw-frame'), hd=o.querySelector('.aw-h');
    img.src=im.src;
    const fit=()=>{ const mw=Math.min(innerWidth-32,900), mh=innerHeight-190, k=Math.min(mw/W0,mh/H0); box.style.width=W0*k+'px'; box.style.height=H0*k+'px'; return k; };
    let k=fit();
    const draw=()=>{ fr.style.left=g.x*k+'px'; fr.style.top=g.y*k+'px'; fr.style.width=g.w*k+'px'; fr.style.height=g.w*GRID.H/GRID.W*k+'px'; };
    draw(); const onR=()=>{ k=fit(); draw(); }; addEventListener('resize',onR);
    let drag=null;
    const start=(mode)=>e=>{ e.preventDefault(); e.stopPropagation(); drag={mode,sx:e.clientX,sy:e.clientY,g:{...g}}; try{ e.target.setPointerCapture(e.pointerId); }catch(_){} };
    fr.onpointerdown=start('move'); hd.onpointerdown=start('size');
    const move=e=>{ if(!drag) return; const dx=(e.clientX-drag.sx)/k, dy=(e.clientY-drag.sy)/k;
      if(drag.mode==='move'){ g.x=drag.g.x+dx; g.y=drag.g.y+dy; } else g.w=Math.max(W0*.1,drag.g.w+dx);
      draw(); };
    fr.onpointermove=move; hd.onpointermove=move;
    fr.onpointerup=hd.onpointerup=fr.onpointercancel=hd.onpointercancel=()=>{ drag=null; };
    o.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ removeEventListener('resize',onR); o.remove(); done(b.dataset.x==='1'?g:null); });
  });
}
async function loadSheet(file){
  const msg=document.getElementById('abMsg'), u=URL.createObjectURL(file);
  try{
    const im=new Image(); im.src=u; await im.decode();
    let g0=null; try{ g0=detectGrid(im); }catch(e){}
    const g=await alignSheet(im,g0); if(!g){ msg.textContent='취소했어요.'; return; }
    msg.textContent='카드 자르는 중…';
    const cards=cutCards(im,g); let ok=0;
    S.set.ab=S.set.ab||{}; S.set.imgUrls=S.set.imgUrls||{};
    for(let i=0;i<26;i++){ const t=cards[i]; if(!t) continue; const g=LETTERS[i];
      const blob=await new Promise(r=>t.toBlob(r,'image/png')); if(!blob) continue;
      await putMedia('img:'+g,blob); delete S.set.imgUrls[g]; S.set.ab[g]='sheet'; ok++; }
    saveSet(); refreshRows();
    msg.textContent=ok?`${ok}/26 글자 카드를 넣었어요. 아래 목록과 글자 소리 화면에서 확인해 보세요. 어긋났으면 다시 넣거나, 글자마다 🖼 그림으로 바꿀 수 있어요.`:'카드를 찾지 못했어요. 칸을 점선 카드에 맞춰 다시 해 주세요.';
    if(ok) toast('알파블록스 친구들이 왔어요! 🎉');
  }catch(e){ msg.textContent='그림을 읽지 못했어요. 사진 앱에서 JPG/PNG로 저장한 그림으로 다시 해 주세요.'; }
  finally{ URL.revokeObjectURL(u); }
}

async function loadPack(){
  const url=document.getElementById('packUrl').value.trim(), msg=document.getElementById('packMsg');
  if(!/^https:\/\//.test(url)){ msg.textContent='https:// 로 시작하는 주소를 넣어 주세요.'; return; }
  store.set('phonics-pack',url); msg.textContent='팩 정보를 받는 중…';
  let pack; try{ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); pack=await r.json(); }
  catch(e){ msg.textContent='팩을 받지 못했어요. 주소와 CORS 허용 여부를 확인해 주세요.'; return; }
  const L=pack&&pack.letters||{}, jobs=[];
  Object.entries(L).forEach(([g,v])=>{ if(!SND[g]||!v) return;
    if(v.image&&g.length===1) jobs.push(['img:'+g,v.image]);
    if(v.sound) jobs.push(['snd:'+g,v.sound]);
    if(v.video&&g.length===1) S.set.videos[g]=String(v.video); });
  saveSet();
  let ok=0, fail=0;
  for(const [k,src] of jobs){
    msg.textContent=`받는 중… ${ok+fail+1} / ${jobs.length}`;
    try{ const r=await fetch(new URL(src,url)); if(!r.ok) throw 0; let b=await r.blob(); if(k.startsWith('img:')) b=await shrink(b); await putMedia(k,b); ok++; }catch(e){ fail++; }
  }
  msg.textContent=`${esc(pack.name||'자료 팩')}: ${ok}개 저장${fail?`, ${fail}개 실패`:''}. 이제 인터넷 없이도 써요.`;
  refreshRows();
}

/* ---------------- 시작 ---------------- */
(async()=>{ await loadMedia(); go('home'); })();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
